<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний — ЦУП</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--surface:#fff;--surface-2:#f3f5f8;--line:#e5e8ee;--line-2:#d6dbe4;--text:#161c26;--text-2:#384254;--text-3:#8a94a6;--accent:#C53B2F;--accent-weak:#fbeceb;--accent-line:#edc9c6;--good:#1a7f54;--sans:'Onest',system-ui,Arial,sans-serif}
:root:not([data-theme="light"]) [data-theme="dark"],:root[data-theme="dark"]{--bg:#0f1319;--surface:#161b23;--surface-2:#1d2430;--line:#28303d;--line-2:#333d4d;--text:#e8edf4;--text-2:#b4becd;--text-3:#7d8899;--accent:#e4553f;--accent-weak:#2a1d1b;--accent-line:#4a2f2a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1319;--surface:#161b23;--surface-2:#1d2430;--line:#28303d;--line-2:#333d4d;--text:#e8edf4;--text-2:#b4becd;--text-3:#7d8899;--accent:#e4553f;--accent-weak:#2a1d1b;--accent-line:#4a2f2a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.top .brand{font-weight:800}.top .brand b{color:var(--accent)}.top .sp{flex:1}
a.back{color:var(--text-3);text-decoration:none;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
a.back:hover{color:var(--text);border-color:var(--text-3)}
/* Верхние глобальные иконки — единый центрированный ряд, ровно и одного размера. */
#pls-toolbar{position:fixed;top:11px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;z-index:99999}
#pls-toolbar > *{position:static!important;left:auto!important;top:auto!important;right:auto!important;bottom:auto!important;width:30px!important;height:30px!important;min-width:0!important;margin:0!important;transform:none!important;box-shadow:none!important}
#pls-toolbar > * svg{width:16px;height:16px}
@media(max-width:640px){#pls-toolbar{display:none!important}}
.wrap{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh{padding:12px;display:flex;gap:8px}
.sh input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:13px;padding:8px 11px;outline:none}
.plus{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
.list{flex:1;overflow:auto;padding:4px 8px 12px}
.doc{padding:10px 11px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.doc:hover{background:var(--surface-2)}.doc.on{background:var(--accent-weak);border-color:var(--accent-line)}
.doc b{font-weight:600;font-size:13.5px;display:block}
.doc span{font-size:11.5px;color:var(--text-3)}
.main{overflow:auto;padding:20px;min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:860px;margin:0 auto 16px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--text-3);font-weight:600;margin-bottom:5px}
.fld input,.fld textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:10px 12px;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--accent-line)}
.fld textarea{min-height:320px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:10px 16px;border-radius:11px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--text-2);border-color:var(--line)}
.btn.danger{background:var(--surface);color:#b3261e;border-color:#e4b8b4}
.hint{font-size:12px;color:var(--text-3);margin-top:6px}
.test{background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;padding:16px;max-width:860px;margin:0 auto}
.test h3{margin:0 0 10px;font-size:14px}
.test .row{display:flex;gap:8px}
.test input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:9px 11px;outline:none}
.hit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--surface-2)}
.hit .src{font-size:11.5px;color:var(--accent);font-weight:700;margin-bottom:4px}
.hit .tx{font-size:13px;white-space:pre-wrap;line-height:1.45}
.empty{color:var(--text-3);text-align:center;padding:40px}
.chipn{font-size:11px;color:var(--good);font-weight:700}
#kbBack{display:none;border:none;background:none;color:var(--accent);font:inherit;font-weight:600;font-size:14px;padding:0 0 12px;cursor:pointer}
/* ─────────────── Мобильная версия (список → редактор поверх) ─────────────── */
@media(max-width:760px){
  #semBadge{display:none}
  .top{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  .top .brand{font-size:15px}
  .wrap{grid-template-columns:1fr}
  .side{border-right:none}
  .sh{padding:10px 12px}
  .sh input{font-size:16px;padding:10px 12px}
  .plus{width:42px;padding:0}
  .doc{padding:13px 12px;border-bottom:1px solid var(--line);border-radius:0}
  .doc b{font-size:15px}
  .doc span{font-size:12.5px}
  /* Редактор — отдельный полноэкранный слой поверх списка. */
  .main{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;padding:0}
  body.kb-editing .main{display:block;overflow:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
  body.kb-editing .side{display:none}
  #kbBack{display:inline-flex;align-items:center}
  .card,.test{max-width:none;margin:0 0 14px;padding:14px}
  .two{grid-template-columns:1fr}
  .fld input,.fld textarea{font-size:16px}
  #eBody{min-height:220px}
  .test .row{flex-direction:column}
  .test .row input{width:100%}
}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/portal.html">← ЦУП</a>
  <div class="brand"><b>База знаний</b> агента</div>
  <span id="semBadge" style="font-size:11.5px;color:var(--text-3);border:1px solid var(--line);border-radius:999px;padding:4px 10px"></span>
  <div class="sp"></div>
</div>
<div class="wrap">
  <aside class="side">
    <div class="sh"><input id="q" placeholder="Найти регламент…"><button class="plus" id="upBtn" title="Загрузить файл (docx, pdf, txt)">⤒</button><button class="plus" id="newBtn">+</button></div>
    <input type="file" id="fileInput" accept=".txt,.md,.docx,.pdf" style="display:none">
    <div class="list" id="list"><div class="empty">Загрузка…</div></div>
  </aside>
  <main class="main">
    <div class="card" id="editor" style="display:none">
      <button id="kbBack" type="button">‹ К списку регламентов</button>
      <div class="two">
        <div class="fld"><label>Название регламента / инструкции</label><input id="eTitle" placeholder="Напр.: Порядок оформления командировки"></div>
        <div class="fld"><label>Категория</label><input id="eCategory" placeholder="HR / Продажи / Сервис / Качество…"></div>
      </div>
      <div class="fld"><label>Источник (необязательно)</label><input id="eSource" placeholder="Напр.: Приказ №12 от 2026, или ссылка"></div>
      <div class="fld"><label>Назначение — для чего и когда агенту использовать документ</label><textarea id="eDesc" style="min-height:70px" placeholder="Напр.: Инструкция по оформлению командировок. Использовать, когда спрашивают про суточные, сроки авансового отчёта, лимиты на проживание."></textarea><div class="hint">Эта подсказка помогает агенту понять, когда брать документ. Попадает в поиск.</div></div>
      <div class="fld" id="fileRow" style="display:none"></div>
      <div class="fld"><label>Текст (процесс, алгоритм, инструкция)</label><textarea id="eBody" placeholder="Вставьте текст регламента, либо загрузите файл (docx, pdf) кнопкой ⤒ слева — текст извлечётся автоматически."></textarea><div class="hint" id="chunkHint"></div></div>
      <div class="btns"><button class="btn" id="saveBtn">Сохранить</button><button class="btn danger" id="delBtn" style="display:none">Удалить</button><span class="sp" style="flex:1"></span><span class="chipn" id="savedMsg"></span></div>
    </div>
    <div class="test">
      <h3>Проверка: что агент найдёт по вопросу</h3>
      <div class="row"><input id="tq" placeholder="Напр.: как оформить командировку"><button class="btn" id="testBtn">Проверить</button></div>
      <div id="hits"></div>
      <div id="semHint" class="hint" style="margin-top:10px"></div>
    </div>
  </main>
</div>
<script>
const api=async(m,p,b)=>{const o={method:m,credentials:'same-origin'};if(b){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(b);}const r=await fetch('/api/kb'+p,o);if(r.status===401){location.href='/login.html';return null;}return r.json().catch(()=>({ok:false}));};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DOCS=[],CUR=null,STAGED_FILE=null;
function renderFileRow(doc){
  const row=document.getElementById('fileRow');
  if(STAGED_FILE){ row.style.display='block'; row.innerHTML='<label>Загружаемый файл</label><div style="background:var(--accent-weak);border:1px solid var(--accent-line);border-radius:10px;padding:10px 12px;font-size:13px">📎 '+esc(STAGED_FILE.name)+' — текст извлечётся при сохранении. <a href="#" id="dropFile" style="color:var(--accent)">убрать</a></div>';
    const df=document.getElementById('dropFile'); if(df) df.onclick=e=>{e.preventDefault();STAGED_FILE=null;renderFileRow(doc);}; return; }
  if(doc&&doc.att_name){ row.style.display='block'; row.innerHTML='<label>Вложенный файл</label><div style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px">📄 '+esc(doc.att_name)+' · <a href="/api/kb/docs/'+doc.id+'/file" target="_blank" rel="noopener" style="color:var(--accent)">скачать оригинал</a></div>'; return; }
  row.style.display='none'; row.innerHTML='';
}
async function load(){const d=await api('GET','/docs');if(!d||!d.ok)return;DOCS=d.items;renderList();}
function renderList(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const items=DOCS.filter(d=>!q||(d.title||'').toLowerCase().includes(q)||(d.category||'').toLowerCase().includes(q));
  document.getElementById('list').innerHTML=items.map(d=>`<div class="doc ${CUR===d.id?'on':''}" onclick="openDoc(${d.id})"><b>${esc(d.title)}</b><span>${esc(d.category||'—')} · ${d.chunks} фрагм.</span></div>`).join('')||'<div class="empty">Регламентов пока нет. Нажмите «+ Новый».</div>';
}
document.getElementById('q').addEventListener('input',renderList);
function showEditor(doc){
  CUR=doc?doc.id:null;
  STAGED_FILE=null;
  document.getElementById('editor').style.display='block';
  document.getElementById('eTitle').value=doc?doc.title||'':'';
  document.getElementById('eCategory').value=doc?doc.category||'':'';
  document.getElementById('eSource').value=doc?doc.source||'':'';
  document.getElementById('eDesc').value=doc?doc.purpose||'':'';
  document.getElementById('eBody').value=doc?doc.body||'':'';
  document.getElementById('delBtn').style.display=doc?'inline-block':'none';
  document.getElementById('savedMsg').textContent='';
  document.getElementById('chunkHint').textContent='';
  renderFileRow(doc);
  document.body.classList.add('kb-editing');
  window.scrollTo(0,0);
  renderList();
}
function backToList(){ document.body.classList.remove('kb-editing'); CUR=null; renderList(); }
document.getElementById('kbBack').onclick=backToList;
async function openDoc(id){const d=await api('GET','/docs/'+id);if(d&&d.ok)showEditor(d.doc);}
document.getElementById('newBtn').onclick=()=>showEditor(null);
document.getElementById('upBtn').onclick=()=>document.getElementById('fileInput').click();
// Выбор файла: НЕ грузим сразу — готовим документ в форме, чтобы заполнить
// назначение (для чего и когда использовать), затем «Сохранить».
document.getElementById('fileInput').onchange=e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  showEditor(null);
  STAGED_FILE=f;
  document.getElementById('eTitle').value=f.name.replace(/\.[^.]+$/,'');
  renderFileRow(null);
  document.getElementById('eBody').placeholder='Текст будет извлечён из файла при сохранении. Можно оставить пустым.';
  document.getElementById('chunkHint').textContent='Заполните «Назначение», затем нажмите «Сохранить» — текст извлечётся из файла.';
  document.getElementById('eDesc').focus();
};
document.getElementById('saveBtn').onclick=async()=>{
  const title=document.getElementById('eTitle').value.trim();
  const category=document.getElementById('eCategory').value.trim();
  const source=document.getElementById('eSource').value.trim();
  const purpose=document.getElementById('eDesc').value.trim();
  const bodyText=document.getElementById('eBody').value;
  const btn=document.getElementById('saveBtn');
  // Если выбран файл — загружаем его (извлечение текста + сохранение оригинала).
  if(STAGED_FILE){
    btn.disabled=true;btn.textContent='Загрузка…';
    const fd=new FormData(); fd.append('file',STAGED_FILE); fd.append('title',title); fd.append('category',category); fd.append('desc',purpose);
    const r=await fetch('/api/kb/upload',{method:'POST',credentials:'same-origin',body:fd});
    btn.disabled=false;btn.textContent='Сохранить';
    const d=await r.json().catch(()=>({ok:false}));
    if(!d||!d.ok){ alert((d&&d.error)||'Не удалось загрузить файл'); return; }
    STAGED_FILE=null;
    await load(); await openDoc(d.id);
    document.getElementById('savedMsg').textContent='Загружено из файла · '+d.chunks+' фрагм.'+(d.stored?' · оригинал сохранён':'');
    document.getElementById('chunkHint').textContent='Агент теперь отвечает по этому документу.';
    return;
  }
  if(!title&&!bodyText.trim()){alert('Укажите название и текст (или загрузите файл)');return;}
  const body={title,category,source,body:bodyText,purpose};
  btn.disabled=true;btn.textContent='Сохранение…';
  const d=CUR?await api('PUT','/docs/'+CUR,body):await api('POST','/docs',body);
  btn.disabled=false;btn.textContent='Сохранить';
  if(!d||!d.ok){alert((d&&d.error)||'Не удалось сохранить');return;}
  if(!CUR)CUR=d.id;
  document.getElementById('savedMsg').textContent='Сохранено · '+d.chunks+' фрагм. проиндексировано';
  document.getElementById('chunkHint').textContent='Агент теперь отвечает по этому регламенту.';
  await load();
};
document.getElementById('delBtn').onclick=async()=>{
  if(!CUR||!confirm('Удалить регламент из базы знаний?'))return;
  const d=await api('DELETE','/docs/'+CUR);if(d&&d.ok){document.getElementById('editor').style.display='none';document.body.classList.remove('kb-editing');CUR=null;await load();}
};
document.getElementById('testBtn').onclick=testSearch;
document.getElementById('tq').addEventListener('keydown',e=>{if(e.key==='Enter')testSearch();});
async function testSearch(){
  const q=document.getElementById('tq').value.trim();if(!q)return;
  const d=await api('GET','/search?q='+encodeURIComponent(q));
  const box=document.getElementById('hits');
  if(!d||!d.ok||!d.results.length){box.innerHTML='<div class="empty">Ничего не найдено — добавьте регламент по этой теме.</div>';return;}
  box.innerHTML=d.results.map(h=>`<div class="hit"><div class="src">${esc(h.doc_title)}${h.category?' · '+esc(h.category):''}</div><div class="tx">${esc((h.chunk||'').slice(0,400))}${(h.chunk||'').length>400?'…':''}</div></div>`).join('');
}
// Верхний ряд иконок — ЕДИНЫЙ порядок во всех модулях ЦУП + выравнивание по центру
// шапки. Порядок: Мессенджер · База знаний · Агент · Поиск · Помощь · Связь · Тема.
// (идентичный блок в messenger.html и cup-mobile.js)
(function(){
  const TBST='border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer';
  const SVG={
    msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.8-4.9A7.5 7.5 0 1 1 20 11.5z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg>',
    kb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/></svg>'
  };
  const HERE=location.pathname||'';
  const ORDER=['pls-tb-msg','pls-tb-kb','pai-fab','pls-sr-btn','pls-help-btn','pls-fb-btn','themeToggle'];
  let isAdmin=false;
  fetch('/auth/me',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{const role=(d&&d.user&&d.user.role)||'';isAdmin=(role==='admin'||role==='superadmin');build();}).catch(()=>{});
  function mk(id,href,title,svg,cur){ let a=document.getElementById(id); if(a) return a; a=document.createElement('a'); a.id=id; a.href=href; a.title=title; a.style.cssText=TBST; if(cur){a.style.color='var(--accent)';a.style.borderColor='var(--accent)';} a.innerHTML=svg; return a; }
  function align(bar){ const h=document.querySelector('.top')||document.querySelector('.topbar')||document.querySelector('header'); if(!h) return; const r=h.getBoundingClientRect(); const bh=bar.offsetHeight||30; bar.style.top=Math.max(4,Math.round(r.top+(r.height-bh)/2))+'px'; }
  function build(){
    let bar=document.getElementById('pls-toolbar');
    if(!bar){bar=document.createElement('div');bar.id='pls-toolbar';document.body.appendChild(bar);}
    const m=mk('pls-tb-msg','/messenger.html','Мессенджер',SVG.msg,/messenger\.html/.test(HERE)); if(m.parentNode!==bar) bar.appendChild(m);
    if(isAdmin){ const k=mk('pls-tb-kb','/knowledge.html','База знаний',SVG.kb,/knowledge\.html/.test(HERE)); if(k.parentNode!==bar) bar.appendChild(k); }
    ['pai-fab','pls-sr-btn','pls-help-btn','pls-fb-btn','themeToggle'].forEach(id=>{const el=document.getElementById(id);if(el&&el.parentNode!==bar)bar.appendChild(el);});
    ORDER.forEach(id=>{ const el=document.getElementById(id); if(el && el.parentNode===bar) bar.appendChild(el); });
    align(bar);
  }
  [150,500,1200,2500,4000].forEach(t=>setTimeout(build,t));
  window.addEventListener('resize',()=>{ const b=document.getElementById('pls-toolbar'); if(b) align(b); });
})();
async function loadStatus(){
  const d=await api('GET','/status'); const badge=document.getElementById('semBadge'), hint=document.getElementById('semHint');
  if(!d||!d.ok){badge.textContent='';return;}
  if(d.semantic){ badge.textContent='Семантика: вкл · '+(d.model||''); badge.style.color='var(--good)'; badge.style.borderColor='var(--good)';
    hint.innerHTML='Семантический поиск включён. Если добавили эмбеддинги после загрузки регламентов — <a href="#" id="reembed" style="color:var(--accent)">пересчитать эмбеддинги</a> по всей базе.';
    const re=document.getElementById('reembed'); if(re) re.onclick=async(ev)=>{ev.preventDefault();re.textContent='Пересчёт…';const r=await api('POST','/reembed');re.textContent=(r&&r.ok)?('готово · '+r.docs+' док.'):'ошибка';};
  } else { badge.textContent='Семантика: выкл (гибридный поиск)'; hint.innerHTML='Сейчас работает поиск по словам и триграммам (понимает и непрямые вопросы через агента). Чтобы включить семантику по смыслу — задайте в окружении EMBED_URL, EMBED_MODEL, EMBED_DIM (бесплатно через локальный Ollama) и перезапустите.'; }
}
try{const th=localStorage.getItem('cup-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
load(); loadStatus();
</script>
</body>
</html>
