<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП — Бонусы инженеров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  color-scheme: dark;
  --bg:#14171d; --panel:#1b1f27; --panel-h:#20242e; --line:#2a2f3a; --line-2:#363c49;
  --text:#eef0f3; --text-dim:#a7afbd; --text-faint:#7a8291;
  --brand:#C53B2F; --brand-h:#d94737; --signal:#35d0c0; --signal-dim:rgba(53,208,192,.35);
  --warn:#e0a940; --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;}
.brand{display:flex;align-items:center;gap:16px;}
.brand a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.brand img{height:22px;width:auto;}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;}
.brand-name b{color:var(--brand);}
.backlink{font-size:12px;color:var(--text-dim);text-decoration:none;border:1px solid var(--line-2);padding:6px 12px;border-radius:7px;}
.backlink:hover{border-color:var(--signal);color:var(--text);}
.user-chip{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-dim);}
.logout-btn{border:1px solid var(--line-2);background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;}
.logout-btn:hover{border-color:var(--brand);color:var(--text);}

main{max-width:1100px;margin:0 auto;padding:28px;}
h1{font-family:var(--font-display);font-size:24px;font-weight:600;margin-bottom:4px;}
.sub{color:var(--text-dim);font-size:13.5px;margin-bottom:22px;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.btn{font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;}
.btn-brand{background:var(--brand);color:#fff;}
.btn-brand:hover{background:var(--brand-h);}
.btn-ghost{background:transparent;border:1px solid var(--line-2);color:var(--text-dim);}
.btn-ghost:hover{border-color:var(--signal);color:var(--text);}
.fselect,.finput{padding:9px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:13.5px;}

.eng-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.eng-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;}
.eng-name{font-weight:600;font-size:14.5px;}
.eng-total{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--signal);}
.eng-lines{display:none;border-top:1px solid var(--line);padding:6px 18px 14px;}
.eng-lines.open{display:block;}
.line-row{display:grid;grid-template-columns:88px 1fr 110px 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.line-row:last-child{border-bottom:none;}
.line-basis{color:var(--text-dim);font-size:11.5px;}
.line-share{font-family:var(--font-mono);color:var(--signal);text-align:right;font-weight:600;}
.line-date{color:var(--text-faint);font-family:var(--font-mono);font-size:11px;white-space:nowrap;}

.skip-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-dim);}
.skip-item:last-child{border-bottom:none;}

.grand-total{display:flex;justify-content:flex-end;gap:14px;align-items:baseline;padding:16px 0 4px;font-family:var(--font-mono);}
.grand-total .label{color:var(--text-dim);font-size:13px;}
.grand-total .value{font-size:22px;font-weight:600;color:var(--signal);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <a href="/"><img src="/assets/logo-icon.png" alt=""><span class="brand-name"><b>ЦУП</b> · ProLabSupport</span></a>
    <a href="/" class="backlink">← Все модули</a>
  </div>
  <div class="user-chip">
    <span id="userName"></span>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>
</div>

<main>
  <h1>Бонусы инженеров</h1>
  <p class="sub">Автоматический расчёт квартальных бонусов по сервисным контрактам и установкам, напрямую из Bitrix.</p>

  <div class="card">
    <div class="row">
      <div style="display:flex;gap:10px;align-items:center">
        <select class="fselect" id="fYear"></select>
        <select class="fselect" id="fQuarter">
          <option value="1">1 квартал</option>
          <option value="2">2 квартал</option>
          <option value="3">3 квартал</option>
          <option value="4">4 квартал</option>
        </select>
      </div>
      <button class="btn btn-brand" onclick="calculate()">Рассчитать</button>
    </div>
  </div>

  <div id="content"></div>
</main>

<script>
let me = null, isPm = false;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(n){ return (n||0).toLocaleString('ru-RU', {maximumFractionDigits:0}); }
function formatDate(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' });
}
async function logout(){ await fetch('/auth/logout',{method:'POST'}); window.location.href='/login.html'; }

async function init(){
  const r = await fetch('/auth/me');
  if (!r.ok) { window.location.href='/login.html'; return; }
  const d = await r.json();
  me = d.user;
  isPm = ['admin','coordinator'].includes(me.role);
  document.getElementById('userName').innerHTML = `<b>${esc(me.displayName)}</b>`;

  const yearSel = document.getElementById('fYear');
  const nowYear = new Date().getFullYear();
  for (let y = nowYear; y >= nowYear - 2; y--) {
    yearSel.innerHTML += `<option value="${y}">${y}</option>`;
  }
  const nowQuarter = Math.floor(new Date().getMonth() / 3) + 1;
  document.getElementById('fQuarter').value = String(nowQuarter > 1 ? nowQuarter - 1 : 4);

  calculate();
}

async function calculate(){
  const year = document.getElementById('fYear').value;
  const quarter = document.getElementById('fQuarter').value;
  const wrap = document.getElementById('content');
  wrap.innerHTML = '<div class="card" style="text-align:center;color:var(--text-dim)">Считаю по данным Bitrix, это может занять минуту…</div>';

  try {
    const r = await fetch(`/api/bonus/calculate?year=${year}&quarter=${quarter}`);
    const d = await r.json();
    if (!r.ok) { wrap.innerHTML = `<div class="card" style="color:var(--brand-h)">${esc(d.error||'Ошибка')}</div>`; return; }
    render(d);
  } catch(e) {
    wrap.innerHTML = '<div class="card" style="color:var(--brand-h)">Ошибка соединения</div>';
  }
}

function render(d){
  const wrap = document.getElementById('content');
  if (!d.engineers.length) {
    wrap.innerHTML = '<div class="card" style="text-align:center;color:var(--text-dim)">За этот период бонусов не найдено</div>';
    return;
  }

  const engHtml = d.engineers.map((e, i) => `
    <div class="eng-card">
      <div class="eng-head" onclick="toggleEng(${i})">
        <span class="eng-name">${esc(e.engineerName)}</span>
        <span class="eng-total">${money(e.totalKzt)} ₸</span>
      </div>
      <div class="eng-lines" id="engLines${i}">
        ${e.lines.map(li => `
          <div class="line-row">
            <div class="line-date">${formatDate(li.workEnd)}</div>
            <div>
              <div>${esc(li.instrument || li.serviceType || '—')}</div>
              <div class="line-basis">${esc(li.basis)}${li.engineers.length>1?' · делится на '+li.engineers.length:''}</div>
            </div>
            <div class="line-basis"><a href="https://crm.prolabsupport.kz/crm/type/1058/details/${li.requestId}/" target="_blank" style="color:var(--signal);text-decoration:none">заявка #${li.requestId} ↗</a></div>
            <div class="line-share">${money(li.shareKzt)} ₸</div>
          </div>`).join('')}
      </div>
    </div>`).join('');

  const skippedHtml = (isPm && d.skipped && d.skipped.length) ? `
    <div class="card">
      <div class="row" style="margin-bottom:10px"><strong style="font-size:13px">Пропущено (${d.skipped.length})</strong></div>
      ${d.skipped.map(s => `<div class="skip-item">Заявка ${s.reportId?'#'+s.reportId:''}: ${esc(s.reason)}</div>`).join('')}
    </div>` : '';

  wrap.innerHTML = `
    <div class="card" style="font-size:12.5px;color:var(--text-dim)">
      Период: ${d.period.start} — ${d.period.end} · отчётов: ${d.totalReports} (заявок: ${d.totalRequests}) · учтено в расчёте: ${d.totalRequests - d.skippedCount}
    </div>
    ${engHtml}
    <div class="grand-total"><span class="label">Итого за квартал</span><span class="value">${money(d.grandTotalKzt)} ₸</span></div>
    ${skippedHtml}
  `;
}

function toggleEng(i){
  document.getElementById('engLines'+i).classList.toggle('open');
}

init();
</script>
</body>
</html>
