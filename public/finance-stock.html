<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП · Склад</title>
<meta name="theme-color" content="#f6f7f9">
<script>(function(){try{var m=localStorage.getItem('pls-theme');document.documentElement.setAttribute('data-theme',m==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="/assets/cup-ui.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Переведено на общую дизайн-систему cup-ui.css: карта токенов страницы → общие токены. */
:root{
  --bg2:var(--surface-2); --card:var(--surface);
  --border:var(--line); --border2:var(--line-2);
  --text-4:var(--text-faint);
  --brand:var(--accent); --brand-l:var(--accent-weak);
  --good-l:color-mix(in srgb, var(--good) 12%, var(--surface));
  --warn-l:color-mix(in srgb, var(--warn) 12%, var(--surface));
  --bad-l:color-mix(in srgb, var(--bad) 12%, var(--surface));
  --radius:var(--r); --font:var(--f-ui);
}
.header::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 35%,transparent))}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
.header{background:var(--card);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;text-decoration:none;color:inherit}.logo img{height:24px}
.hbtn{font-size:12.5px;color:var(--text-3);text-decoration:none;border:1px solid var(--border2);padding:6px 12px;border-radius:8px;background:transparent;cursor:pointer;font-family:var(--font)}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hsub{font-size:13.5px;color:var(--text-3);font-weight:600}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
.asof{font-size:12px;color:var(--text-3)}
.mockbadge{font-size:11px;font-weight:700;color:var(--warn,#e0a940);border:1px solid var(--warn,#e0a940);border-radius:6px;padding:2px 8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:16px 16px 0}
.fl{display:block;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
select,input[type=text]{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;min-width:150px}
select:focus,input:focus{border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:16px;overflow:hidden}
.tools{padding:6px 14px;border-bottom:1px solid var(--border);display:flex;gap:16px;align-items:center;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.tools b{font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:calc(100vh - 210px)}
table{border-collapse:collapse;font-size:12px;white-space:nowrap;min-width:100%}
th,td{padding:4px 10px;border-bottom:1px solid var(--border);text-align:left;line-height:1.35}
th{position:sticky;top:0;background:var(--bg2);z-index:1;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--bg2)}
.nm{white-space:normal;min-width:250px;max-width:380px;color:var(--text)}
tfoot td{position:sticky;bottom:0;background:var(--card);font-weight:700;border-top:2px solid var(--border2)}
.hint{color:var(--text-3);padding:20px;font-size:13px}
/* ── Мультивыбор (как слайсеры Power BI) ─────────────────── */
.ms{position:relative;min-width:180px}
.ms-btn{width:100%;text-align:left;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:8px 26px 8px 10px;font-size:13px;color:var(--text);font-family:var(--font);cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-btn::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:11px}
.ms-btn.on{border-color:var(--accent);color:var(--accent)}
.ms-pop{position:absolute;z-index:60;top:calc(100% + 4px);left:0;width:280px;max-width:84vw;background:var(--card);border:1px solid var(--border2);border-radius:10px;box-shadow:0 12px 32px rgba(20,25,35,.16);padding:8px;display:none}
.ms-pop.open{display:block}
.ms-srch{width:100%;margin-bottom:6px;min-width:0}
.ms-all{display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:11.5px;color:var(--text-3);border-bottom:1px solid var(--border);margin-bottom:4px;cursor:pointer;user-select:none}
.ms-list{max-height:280px;overflow:auto}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:12.5px;border-radius:6px;cursor:pointer;user-select:none}
.ms-opt:hover{background:var(--bg2)}
.ms-opt input,.ms-all input{accent-color:var(--accent);flex-shrink:0}
.ms-opt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-empty{color:var(--text-3);font-size:11.5px;padding:8px 6px}
</style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><img src="/assets/logo-icon.png" alt="">ProLabSupport</a>
  <a href="/" class="hbtn">← Все модули</a>
  <span class="hsub">Склад</span>
  <div class="hr">
    <span class="asof" id="asof"></span>
    <span class="mockbadge" id="mockBadge" style="display:none">демо-данные</span>
    <button class="hbtn" id="refreshBtn" onclick="refresh()">↻ Обновить</button>
    <button class="hbtn" onclick="logout()">Выйти</button>
  </div>
</header>

<div class="filters">
  <div><label class="fl">Склад</label><div id="fStore"></div></div>
  <div><label class="fl">Номенклатура</label><div id="fName"></div></div>
  <div><label class="fl">№ заказа</label><div id="fOrder"></div></div>
  <div><label class="fl">Производитель</label><div id="fMfr"></div></div>
  <div style="flex:1;min-width:200px"><label class="fl">Быстрый поиск (номенклатура / код / партномер)</label><input type="text" id="fSearch" placeholder="начните вводить…" oninput="render()" style="width:100%"></div>
</div>

<div class="card">
  <div class="tools"><span>Позиций: <b id="cntRows">0</b></span><span>Количество: <b id="cntQty">0</b></span><span>Сумма: <b id="cntSum">0</b></span><span style="margin-left:auto;color:var(--text-3)" id="stockNote"></span></div>
  <div class="scroll">
    <table>
      <thead><tr>
        <th class="nm">Номенклатура</th><th>Партномер</th><th>№ заказа</th><th>Номенкл. номер</th>
        <th>Дата изгот.</th><th>Срок годн.</th><th class="num">Кол-во</th><th class="num">Цена</th><th class="num">Сумма</th>
        <th>№ полки</th><th>Штрихкод</th><th>Склад</th><th>Производитель</th><th>Номер ГТД</th>
      </tr></thead>
      <tbody id="body"></tbody>
      <tfoot id="foot"></tfoot>
    </table>
  </div>
</div>

<script>
let DATA={rows:[],totals:{},filters:{}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=n=>Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ');
const dt=s=>s?new Date(s).toLocaleDateString('ru-RU'):'';
/* ── Мультивыбор с поиском и «выбрать все» (слайсер как в Power BI) ──────── */
function createMulti(sel){
  const host=document.querySelector(sel);host.classList.add('ms');
  host.innerHTML='<button type="button" class="ms-btn">Все</button><div class="ms-pop"><input type="text" class="ms-srch" placeholder="Поиск…"><div class="ms-all"><input type="checkbox"><span>Выбрать все</span></div><div class="ms-list"></div></div>';
  const btn=host.querySelector('.ms-btn'),pop=host.querySelector('.ms-pop'),srch=host.querySelector('.ms-srch'),list=host.querySelector('.ms-list'),allRow=host.querySelector('.ms-all'),allcb=allRow.querySelector('input');
  let items=[],selSet=new Set(),cb=null;
  function visible(){const q=(srch.value||'').toLowerCase();return q?items.filter(it=>it.label.toLowerCase().includes(q)):items;}
  function syncAll(){const vis=visible();allcb.checked=vis.length>0&&vis.every(it=>selSet.has(it.value));}
  function renderBtn(){
    let t='Все';
    if(selSet.size===1){const it=items.find(x=>x.value===[...selSet][0]);t=it?it.label:'1 выбрано';}
    else if(selSet.size>1)t=selSet.size+' выбрано';
    btn.textContent=t;btn.title=t;btn.classList.toggle('on',selSet.size>0);
  }
  function renderList(){
    const vis=visible();
    list.innerHTML=vis.length?vis.map(it=>`<label class="ms-opt"><input type="checkbox" value="${esc(it.value)}" ${selSet.has(it.value)?'checked':''}><span title="${esc(it.label)}">${esc(it.label)}</span></label>`).join(''):'<div class="ms-empty">ничего не найдено</div>';
    syncAll();
  }
  function render(){renderList();renderBtn();}
  // отметка пункта НЕ перестраивает список (сохраняем прокрутку), обновляем только кнопку
  list.addEventListener('change',e=>{const el=e.target;if(el.type!=='checkbox')return;if(el.checked)selSet.add(el.value);else selSet.delete(el.value);syncAll();renderBtn();cb&&cb();});
  allcb.addEventListener('change',()=>{const vis=visible();if(allcb.checked)vis.forEach(it=>selSet.add(it.value));else vis.forEach(it=>selSet.delete(it.value));renderList();renderBtn();cb&&cb();});
  allRow.addEventListener('click',e=>{if(e.target!==allcb){allcb.checked=!allcb.checked;allcb.dispatchEvent(new Event('change'));}});
  srch.addEventListener('input',render);srch.addEventListener('click',e=>e.stopPropagation());
  btn.addEventListener('click',e=>{e.stopPropagation();const open=pop.classList.contains('open');document.querySelectorAll('.ms-pop.open').forEach(p=>p.classList.remove('open'));if(!open){pop.classList.add('open');srch.value='';setTimeout(()=>srch.focus(),0);render();}});
  pop.addEventListener('click',e=>e.stopPropagation());
  document.addEventListener('click',()=>pop.classList.remove('open'));
  return {
    setItems(arr){items=(arr||[]).map(x=>typeof x==='string'?{value:x,label:x}:x);render();},
    setSelected(v){selSet=new Set(v||[]);render();},
    getSelected(){return [...selSet];},
    onChange(fn){cb=fn;}
  };
}
const mStore=createMulti('#fStore'),mName=createMulti('#fName'),mOrder=createMulti('#fOrder'),mMfr=createMulti('#fMfr');
[mStore,mName,mOrder,mMfr].forEach(m=>m.onChange(()=>render()));
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/login.html';return{ok:false,d:{}}}let d={};try{d=await r.json()}catch(e){}return{ok:r.ok,d}}
async function boot(){const r=await fetch('/auth/me');if(!r.ok){location.href='/login.html';return;}await load();}
async function load(){
  const {ok,d}=await api('/api/finance/stock');
  if(!ok){document.getElementById('body').innerHTML='<tr><td colspan="14" class="hint">Ошибка загрузки</td></tr>';return;}
  DATA=d;
  var _a=document.getElementById('asof');
  if(d.error){_a.innerHTML='Данные от '+(d.asOf?new Date(d.asOf).toLocaleString('ru-RU'):'—')+' · <span style="color:var(--bad)">⚠ обновить не удалось</span>';_a.title=String(d.error);}
  else{_a.textContent=d.asOf?('По состоянию на '+new Date(d.asOf).toLocaleString('ru-RU')):'';_a.title='';}
  document.getElementById('mockBadge').style.display=d.mock?'inline-block':'none';
  const stores=d.filters.stores||[];
  mStore.setItems(stores.map(s=>({value:s.id,label:s.name+(s.amount?(' · '+fmt(s.amount)):'')})));
  mStore.setSelected(d.defaultStore?[d.defaultStore]:[]);
  mName.setItems([...new Set((d.rows||[]).map(r=>r.name).filter(Boolean))].sort());
  mOrder.setItems(d.filters.orders||[]);
  mMfr.setItems(d.filters.manufacturers||[]);
  document.getElementById('stockNote').textContent=d.account?('счёт '+d.account):'';
  render();
}
function filtered(){
  const s=mStore.getSelected(),nm=mName.getSelected(),o=mOrder.getSelected(),m=mMfr.getSelected();
  const q=(document.getElementById('fSearch').value||'').toLowerCase();
  return (DATA.rows||[]).filter(r=>
    (!s.length||s.includes(r.store_id))&&
    (!nm.length||nm.includes(r.name))&&
    (!o.length||o.includes(r.order_no))&&
    (!m.length||m.includes(r.manufacturer))&&
    (!q||((r.name||'')+' '+(r.item_code||'')+' '+(r.part_no||'')).toLowerCase().includes(q)));
}
function render(){
  const rows=filtered();
  document.getElementById('body').innerHTML=rows.length?rows.map(r=>`<tr>
    <td class="nm">${esc(r.name)}</td><td>${esc(r.part_no||'')}</td><td>${esc(r.order_no||'')}</td><td>${esc(r.item_code||'')}</td>
    <td>${dt(r.made_date)}</td><td>${dt(r.expiry)}</td><td class="num">${fmt(r.qty)}</td><td class="num">${fmt(r.price)}</td><td class="num">${fmt(r.amount)}</td>
    <td>${esc(r.shelf||'')}</td><td>${esc(r.barcode||'')}</td><td>${esc(r.store||'')}</td><td>${esc(r.manufacturer||'')}</td><td>${esc(r.gtd||'')}</td>
  </tr>`).join(''):'<tr><td colspan="14" class="hint">Нет данных по фильтру.</td></tr>';
  const q=rows.reduce((a,r)=>a+Number(r.qty||0),0),sum=rows.reduce((a,r)=>a+Number(r.amount||0),0);
  document.getElementById('cntRows').textContent=fmt(rows.length);
  document.getElementById('cntQty').textContent=fmt(q);
  document.getElementById('cntSum').textContent=fmt(sum);
  document.getElementById('foot').innerHTML=`<tr><td>Итого</td><td colspan="5"></td><td class="num">${fmt(q)}</td><td></td><td class="num">${fmt(sum)}</td><td colspan="5"></td></tr>`;
}
async function refresh(){
  const b=document.getElementById('refreshBtn');b.disabled=true;b.textContent='Обновляю…';b.style.color='';b.title='';
  let r;try{r=await api('/api/finance/stock/refresh',{method:'POST'});}catch(e){r={ok:false,d:{error:String(e&&e.message||e)}};}
  await load();b.disabled=false;
  let err=null;
  if(!r||r.ok===false)err=(r&&r.d&&r.d.error)||'сервер недоступен';
  else if(r.d&&r.d.error)err=r.d.error;
  else if(r.d&&r.d.ok===false)err='ошибка синхронизации';
  if(err){b.textContent='⚠ Не удалось';b.style.color='var(--bad)';b.title=String(err);}
  else if(r.d&&r.d.mock){b.textContent='↻ Обновить';b.title='демо-данные: 1С не подключена';}
  else{b.textContent='✓ Обновлено';b.style.color='var(--good)';}
  setTimeout(()=>{if(b.textContent!=='Обновляю…'){b.textContent='↻ Обновить';b.style.color='';b.title='';}},4000);
}
async function logout(){await fetch('/auth/logout',{method:'POST'});location.href='/login.html';}
boot();
</script>
<script src="/assets/cup-theme.js" defer></script>
</body>
</html>
