<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП · Дебет</title>
<meta name="theme-color" content="#f6f7f9">
<script>(function(){try{var m=localStorage.getItem('pls-theme');document.documentElement.setAttribute('data-theme',m==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="/assets/cup-ui.css">
<script src="/assets/pls-flags.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Переведено на общую дизайн-систему cup-ui.css: карта токенов страницы → общие токены. */
:root{
  --bg2:var(--surface-2); --card:var(--surface);
  --border:var(--line); --border2:var(--line-2);
  --text-4:var(--text-faint);
  --brand:var(--accent); --brand-l:var(--accent-weak);
  --good-l:color-mix(in srgb, var(--good) 12%, var(--surface));
  --warn-l:color-mix(in srgb, var(--warn) 12%, var(--surface));
  --bad-l:color-mix(in srgb, var(--bad) 12%, var(--surface));
  --radius:var(--r); --font:var(--f-ui);
}
.header::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 35%,transparent))}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
.header{background:var(--card);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;text-decoration:none;color:inherit}.logo img{height:24px}
.hbtn{font-size:12.5px;color:var(--text-3);text-decoration:none;border:1px solid var(--border2);padding:6px 12px;border-radius:8px;background:transparent;cursor:pointer;font-family:var(--font)}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hsub{font-size:13.5px;color:var(--text-3);font-weight:600}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
.asof{font-size:12px;color:var(--text-3)}
.mockbadge{font-size:11px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 8px}
.wrap{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:16px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-h{padding:11px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:16px 16px 0}
.fl{display:block;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
select,input[type=text]{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;min-width:160px}
select:focus,input:focus{border-color:var(--brand)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td{padding:4px 10px;border-bottom:1px solid var(--border);line-height:1.35}
.grp{background:var(--bg2);font-weight:700}
.grp td{padding:6px 10px}
.sub td:first-child{padding-left:22px;color:var(--text-2)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dept{color:var(--text-3);white-space:nowrap}
.days{display:inline-block;min-width:34px;text-align:center;border-radius:5px;padding:1px 6px;font-size:11.5px;font-weight:700}
.days.over{background:var(--bad-l);color:var(--bad)}
.days.ok{color:var(--text-4)}
.sumrow{display:flex;justify-content:space-between;padding:7px 14px;font-size:13px;border-bottom:1px solid var(--border)}
.sumrow b{font-variant-numeric:tabular-nums}
.deptrow{padding:8px 14px;border-bottom:1px solid var(--border);font-size:12.5px}
.deptrow .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.bar{height:7px;border-radius:4px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.over{background:var(--bad)}
.hint{color:var(--text-3);font-size:12.5px;padding:14px 18px}
.tools{padding:6px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-3)}
/* ── Полоса обзора ─────────────────────────────────────── */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s-other:#9aa3b3;--grid:#e1e0d9}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s-other:#5a6473;--grid:#2c2c2a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s-other:#5a6473;--grid:#2c2c2a}}
.ovw{padding:16px 16px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}
.kpi .lab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:8px}
.kpi .val{font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:12.5px;font-weight:600;color:var(--text-3);margin-left:2px}
.kdelta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;margin-top:6px}
.kdelta.good{color:var(--good)}.kdelta.bad{color:var(--bad)}.kdelta.flat{color:var(--text-3)}
.kdelta .vs{color:var(--text-4);font-weight:500;margin-left:3px}
.ovw2{display:grid;grid-template-columns:1.9fr 1fr;gap:12px;margin-top:12px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.ovw2{grid-template-columns:1fr}}
.ovwc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.ovwc h3{font-size:13px;font-weight:700;margin:0 0 2px}
.ovwc .ch{color:var(--text-3);font-size:11.5px;margin-bottom:8px}
.leglist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.leglist .it{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.leglist .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.leglist .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leglist .pc{color:var(--text-3);font-size:11px;width:34px;text-align:right}
.leglist .v{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.ovwempty{color:var(--text-3);font-size:12.5px;text-align:center;padding:34px 10px}
#ovwTip{position:fixed;pointer-events:none;z-index:200;background:var(--text);color:var(--card);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:7px;opacity:0;transition:opacity .08s;white-space:nowrap}
svg.ovsvg{display:block;width:100%}
/* плитка: цветная мини-шкала контекста */
.kmeter{display:flex;align-items:center;gap:8px;margin-top:9px}
.kbar{flex:1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.kbar i{display:block;height:100%;border-radius:4px}
.klab{font-size:11px;color:var(--text-3);white-space:nowrap;font-weight:600}
.kchip{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}
.kpi.clk{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.kpi.clk:hover{border-color:var(--text-3)}
.kpi.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
/* структура по срокам (aging) */
.agbar{display:flex;height:28px;border-radius:8px;overflow:hidden;gap:2px;margin:10px 0 14px}
.agbar>i{height:100%;cursor:default;transition:opacity .1s}
.agbar>i:hover{opacity:.82}
.agleg{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px}
.agit{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.agit .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.agit .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agit .pc{color:var(--text-3);font-size:11px;width:34px;text-align:right}
.agit .v{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.aghint{color:var(--text-3);font-size:11px;margin-top:12px}
.deptrow.clk{cursor:pointer}.deptrow.clk:hover{background:var(--surface-2)}
.dseg{transition:opacity .1s}
</style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><img src="/assets/logo-icon.png" alt="">ProLabSupport</a>
  <a href="/" class="hbtn">← Все модули</a>
  <span class="hsub">Дебет</span>
  <div class="hr">
    <span class="asof" id="asof"></span>
    <span class="mockbadge" id="mockBadge" style="display:none">демо-данные</span>
    <button class="hbtn" id="refreshBtn" onclick="refresh()">↻ Обновить</button>
    <button class="hbtn" onclick="logout()">Выйти</button>
  </div>
</header>

<!-- Полоса обзора (сводка по всему модулю, не зависит от фильтров) -->
<div class="ovw">
  <div class="kpis" id="kpis"></div>
  <div class="ovw2">
    <div class="ovwc">
      <h3>Динамика дебиторки</h3>
      <div class="ch">помесячно, млн ₸ · линия — общий долг, заливка — просроченное</div>
      <div id="heroChart"></div>
    </div>
    <div class="ovwc">
      <h3>Долг по отделам</h3>
      <div class="ch">доля в общем остатке</div>
      <div id="donutChart" style="display:flex;justify-content:center;padding:4px 0 2px"></div>
      <div class="leglist" id="donutLeg"></div>
    </div>
  </div>
</div>

<div class="filters">
  <div><label class="fl">Отдел</label><select id="fDept" onchange="render()"><option value="">Все</option></select></div>
  <div><label class="fl">Контрагент</label><select id="fContractor" onchange="render()"><option value="">Все</option></select></div>
  <div style="flex:1;min-width:200px"><label class="fl">Поиск (договор / контрагент)</label><input type="text" id="fSearch" placeholder="Поиск…" oninput="render()" style="width:100%"></div>
</div>

<div class="wrap">
  <div class="card">
    <div class="card-h">Дебиторская задолженность</div>
    <div class="tools"><span>Договоров: <b id="cntRows" style="color:var(--text-2)">0</b></span><span style="margin-left:auto">Долг по фильтру: <b id="cntDebt" style="color:var(--text-2)">0</b></span></div>
    <div style="overflow:auto;max-height:calc(100vh - 230px)"><table class="tbl"><tbody id="debtBody"></tbody></table></div>
  </div>
  <div>
    <div class="card">
      <div class="card-h">Топ просрочки</div>
      <div id="topBox"></div>
    </div>
  </div>
</div>

<script>
let DATA={rows:[],depts:[],totals:{},filters:{}};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=n=>Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ');
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/login.html';return{ok:false,d:{}}}let d={};try{d=await r.json()}catch(e){}return{ok:r.ok,d}}

async function boot(){
  const r=await fetch('/auth/me'); if(!r.ok){location.href='/login.html';return;}
  await load();
}
async function load(){
  try{await PLSFlags.loadCountryMap();}catch(e){}
  const {ok,d}=await api('/api/finance/debt');
  if(!ok){document.getElementById('debtBody').innerHTML='<tr><td class="hint">Ошибка загрузки</td></tr>';return;}
  DATA=d;
  var _a=document.getElementById('asof');
  if(d.error){_a.innerHTML='Данные от '+(d.asOf?new Date(d.asOf).toLocaleString('ru-RU'):'—')+' · <span style="color:var(--bad)">⚠ обновить не удалось</span>';_a.title=String(d.error);}
  else{_a.textContent=d.asOf?('По состоянию на '+new Date(d.asOf).toLocaleString('ru-RU')):'';_a.title='';}
  document.getElementById('mockBadge').style.display=d.mock?'inline-block':'none';
  if(d.overview)renderOverview(d.overview);
  const fd=document.getElementById('fDept');fd.innerHTML='<option value="">Все</option>'+(d.filters.departments||[]).map(x=>`<option>${esc(x)}</option>`).join('');
  const fc=document.getElementById('fContractor');fc.innerHTML='<option value="">Все</option>'+(d.filters.contractors||[]).map(x=>`<option>${esc(x)}</option>`).join('');
  render();
}
let ONLY_OVERDUE=false;
function filtered(){
  const dep=document.getElementById('fDept').value;
  const con=document.getElementById('fContractor').value;
  const q=(document.getElementById('fSearch').value||'').toLowerCase();
  return (DATA.rows||[]).filter(r=>(!dep||r.department===dep)&&(!con||r.contractor===con)&&(!ONLY_OVERDUE||r.overdue_days>0)&&(!q||((r.contractor||'')+' '+(r.contract||'')).toLowerCase().includes(q)));
}
function scrollToTable(){try{document.querySelector('.wrap').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}}
function filterByDept(name){const sel=document.getElementById('fDept');if(name&&[...sel.options].some(o=>o.value===name))sel.value=name;else sel.value='';render();scrollToTable();}
function filterByContractor(nm){const sel=document.getElementById('fContractor');if(nm&&[...sel.options].some(o=>o.value===nm))sel.value=nm;else sel.value='';render();scrollToTable();}
function toggleOverdue(){ONLY_OVERDUE=!ONLY_OVERDUE;document.querySelectorAll('.kpi[data-k="overdue"]').forEach(function(t){t.classList.toggle('active',ONLY_OVERDUE);});render();scrollToTable();}
function render(){
  const rows=filtered();
  // группировка по контрагенту
  const groups={};for(const r of rows){(groups[r.contractor]=groups[r.contractor]||[]).push(r);}
  const body=document.getElementById('debtBody');
  const names=Object.keys(groups).sort((a,b)=>groups[b].reduce((s,r)=>s+r.debt,0)-groups[a].reduce((s,r)=>s+r.debt,0));
  body.innerHTML=names.length?names.map(nm=>{
    const g=groups[nm];const tot=g.reduce((s,r)=>s+r.debt,0);
    const head=`<tr class="grp"><td>${flagByCompany(nm)}${esc(nm)}</td><td class="num">${fmt(tot)}</td><td></td><td class="dept">${esc(g[0].department||'')}</td></tr>`;
    const subs=g.map(r=>{
      const deal=r.bitrix_deal_id?` <a href="https://crm.prolabsupport.kz/crm/deal/details/${esc(r.bitrix_deal_id)}/" target="_blank" style="color:var(--brand);text-decoration:none;font-size:11.5px" title="Сделка Битрикса">🔗 #${esc(r.bitrix_deal_id)}</a>`:' <span style="color:var(--warn);font-size:11px" title="Нет ID сделки Битрикса в 1С">⚠ нет связи</span>';
      return `<tr class="sub"><td>${esc(r.contract)}${deal}</td><td class="num">${fmt(r.debt)}</td><td class="num"><span class="days ${r.overdue_days>0?'over':'ok'}">${r.overdue_days>0?'+':''}${r.overdue_days}</span></td><td class="dept">${esc(r.department||'')}</td></tr>`;
    }).join('');
    return head+subs;
  }).join(''):'<tr><td class="hint">Нет данных по фильтру.</td></tr>';
  document.getElementById('cntRows').textContent=rows.length;
  document.getElementById('cntDebt').textContent=fmt(rows.reduce((s,r)=>s+r.debt,0));
  // сводка по отделам (по фильтру)
  const byDept={};for(const r of rows){const d=r.department||'—';byDept[d]=byDept[d]||{total:0,over:0};byDept[d].total+=r.debt;if(r.overdue_days>0)byDept[d].over+=r.debt;}
  const depts=Object.entries(byDept).map(([department,v])=>({department,...v})).sort((a,b)=>b.total-a.total);
  const maxT=Math.max(1,...depts.map(d=>d.total));
  const _deptBox=document.getElementById('deptBox');
  if(_deptBox)_deptBox.innerHTML=depts.length?depts.map(d=>`<div class="deptrow"><div class="top"><span>${esc(d.department)}</span><span class="num"><b>${fmt(d.total)}</b>${d.over?` · <span style="color:var(--bad)">просроч. ${fmt(d.over)}</span>`:''}</span></div><div class="bar"><i style="width:${(d.total/maxT*100).toFixed(1)}%"></i></div>${d.over?`<div class="bar" style="margin-top:3px"><i class="over" style="width:${(d.over/maxT*100).toFixed(1)}%"></i></div>`:''}</div>`).join('')
    +`<div class="sumrow" style="font-weight:700"><span>Итого</span><span><b>${fmt(rows.reduce((s,r)=>s+r.debt,0))}</b></span></div>`:'<div class="hint">—</div>';
  // топ просрочки
  const top=rows.filter(r=>r.overdue_days>0).sort((a,b)=>b.debt-a.debt).slice(0,8);
  const _tb=document.getElementById('topBox');
  _tb.innerHTML=top.length?top.map(r=>`<div class="deptrow clk" data-con="${esc(r.contractor)}" title="Показать контрагента в таблице"><div class="top"><span>${esc(r.contractor)}</span><span class="num" style="color:var(--bad)"><b>${fmt(r.debt)}</b></span></div><div class="hint" style="padding:0;font-size:11.5px">${esc(r.contract)} · просрочка ${r.overdue_days} дн.</div></div>`).join(''):'<div class="hint">Просроченных нет.</div>';
  _tb.querySelectorAll('.deptrow.clk').forEach(function(el){el.addEventListener('click',function(){filterByContractor(el.getAttribute('data-con'));});});
}
async function refresh(){
  const b=document.getElementById('refreshBtn');b.disabled=true;b.textContent='Обновляю…';b.style.color='';b.title='';
  let r;try{r=await api('/api/finance/debt/refresh',{method:'POST'});}catch(e){r={ok:false,d:{error:String(e&&e.message||e)}};}
  await load();b.disabled=false;
  let err=null;
  if(!r||r.ok===false)err=(r&&r.d&&r.d.error)||'сервер недоступен';
  else if(r.d&&r.d.error)err=r.d.error;
  else if(r.d&&r.d.ok===false)err='ошибка синхронизации';
  if(err){b.textContent='⚠ Не удалось';b.style.color='var(--bad)';b.title=String(err);}
  else if(r.d&&r.d.mock){b.textContent='↻ Обновить';b.title='демо-данные: 1С не подключена';}
  else{b.textContent='✓ Обновлено';b.style.color='var(--good)';}
  setTimeout(()=>{if(b.textContent!=='Обновляю…'){b.textContent='↻ Обновить';b.style.color='';b.title='';}},4000);
}
async function logout(){await fetch('/auth/logout',{method:'POST'});location.href='/login.html';}

/* ── Полоса обзора: KPI + дельты + спарклайны + герой-график + пончик ───── */
var ovTip=document.getElementById('ovwTip');
function ovShow(e,h){ovTip.innerHTML=h;ovTip.style.opacity='1';ovMove(e);}
function ovMove(e){ovTip.style.left=(e.clientX+12)+'px';ovTip.style.top=(e.clientY-10)+'px';}
function ovHide(){ovTip.style.opacity='0';}
function mln(v){return fmt(Math.round(Number(v||0)/1e6));}
function sparkSVG(arr){
  var pts=[];for(var i=0;i<arr.length;i++)if(arr[i]!=null)pts.push([i,arr[i]]);
  if(pts.length<2)return '';
  var w=72,h=28,pad=3,xs=(arr.length-1)||1,vs=pts.map(function(p){return p[1];});
  var mn=Math.min.apply(0,vs),mx=Math.max.apply(0,vs);
  var d=pts.map(function(p,i){var x=pad+p[0]*(w-2*pad)/xs;var y=h-pad-(p[1]-mn)/((mx-mn)||1)*(h-2*pad);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');
  var last=pts[pts.length-1],lx=pad+last[0]*(w-2*pad)/xs,ly=h-pad-(last[1]-mn)/((mx-mn)||1)*(h-2*pad);
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2.4" fill="var(--accent)"/></svg>';
}
function resetFilters(){document.getElementById('fDept').value='';document.getElementById('fContractor').value='';document.getElementById('fSearch').value='';ONLY_OVERDUE=false;document.querySelectorAll('.kpi[data-k="overdue"]').forEach(function(t){t.classList.remove('active');});render();scrollToTable();}
function kpiTile(o){
  var k=o.k,dh='';
  if(k&&k.delta!=null&&k.delta!==0){var good=k.delta<0;
    dh='<div class="kdelta '+(good?'good':'bad')+'">'+(k.delta>0?'▲':'▼')+' '+o.fmtDelta(k)+'<span class="vs">к пред. мес.</span></div>';}
  else if(k&&k.delta===0){dh='<div class="kdelta flat">■ без изм.<span class="vs">к пред. мес.</span></div>';}
  return '<div class="kpi'+(o.attrs?' clk':'')+'"'+(o.attrs||'')+'><div class="lab">'+o.lab+'</div>'+
    '<div class="row"><div class="val">'+o.val+'</div>'+sparkSVG(o.series)+'</div>'+dh+(o.ctx||'')+'</div>';
}
function kmeter(frac,label,color){return '<div class="kmeter"><div class="kbar"><i style="width:'+(Math.max(0,Math.min(1,frac||0))*100).toFixed(0)+'%;background:'+color+'"></i></div><span class="klab">'+label+'</span></div>';}
function kchip(label,color,sub){return '<div class="kmeter"><span class="kchip" style="color:'+color+';background:color-mix(in srgb,'+color+' 14%,var(--surface))">'+label+'</span>'+(sub?'<span class="klab">'+sub+'</span>':'')+'</div>';}
function renderOverview(ov){
  var k=ov.kpis,s=ov.series,c=ov.context||{};
  var moneyDelta=function(x){return x.pct!=null?Math.abs(x.pct)+'%':Math.abs(mln(x.delta))+' млн';};
  var share=Math.max(0,Math.min(1,c.overdueShare||0)),sharePct=Math.round(share*100);
  var conShare=k.contractors.value?((c.conOverdue||0)/k.contractors.value):0;
  document.getElementById('kpis').innerHTML=[
    kpiTile({lab:'Общий долг',val:mln(k.debt.value)+' <small>млн ₸</small>',k:k.debt,series:s.debt,fmtDelta:moneyDelta,
      ctx:kmeter(share,'просрочено '+sharePct+'%',share>0.3?'var(--bad)':'var(--warn)'),attrs:' title="Сбросить фильтры" onclick="resetFilters()"'}),
    kpiTile({lab:'Просрочено',val:'<span style="color:var(--bad)">'+mln(k.overdue.value)+'</span> <small>млн ₸</small>',k:k.overdue,series:s.overdue,fmtDelta:moneyDelta,
      ctx:kmeter(share,sharePct+'% от долга','var(--bad)'),attrs:' data-k="overdue" title="Показать только просроченные" onclick="toggleOverdue()"'}),
    kpiTile({lab:'Контрагентов с долгом',val:String(k.contractors.value),k:k.contractors,series:s.contractors,fmtDelta:function(x){return Math.abs(x.delta);},
      ctx:kmeter(conShare,'просрочили '+(c.conOverdue||0),'var(--bad)'),attrs:' title="К таблице" onclick="scrollToTable()"'}),
    kpiTile({lab:'Средняя просрочка',val:String(k.avgOverdue.value)+' <small>дн</small>',k:k.avgOverdue,series:s.avgOverdue,fmtDelta:function(x){return Math.abs(x.delta)+' дн';},
      ctx:kchip('макс '+(c.maxOverdue||0)+' дн','var(--bad)','договоров: '+(c.contracts||0))})
  ].join('');
  if(ONLY_OVERDUE)document.querySelectorAll('.kpi[data-k="overdue"]').forEach(function(t){t.classList.add('active');});
  renderHero(ov);
  renderDonut(ov.depts);
}
function renderAging(aging){
  var el=document.getElementById('heroChart');
  if(!aging||!aging.length){el.innerHTML='<div class="ovwempty">Нет данных.</div>';return;}
  var cols=['var(--good)','var(--warn)','#e0733a','var(--bad)','#8a2a1f'];
  var tot=aging.reduce(function(s,a){return s+a.value;},0)||1;
  var bar=aging.map(function(a,i){return a.value>0?'<i class="ag-seg" data-nm="'+esc(a.label)+'" data-v="'+a.value+'" data-pc="'+Math.round(a.value/tot*100)+'" style="width:'+(a.value/tot*100).toFixed(2)+'%;background:'+cols[i]+'"></i>':'';}).join('');
  var leg=aging.map(function(a,i){return '<div class="agit"><span class="sw" style="background:'+cols[i]+'"></span><span class="nm">'+esc(a.label)+'</span><span class="pc">'+Math.round(a.value/tot*100)+'%</span><span class="v">'+mln(a.value)+'</span></div>';}).join('');
  el.innerHTML='<div class="agbar">'+bar+'</div><div class="agleg">'+leg+'</div><div class="aghint">Помесячная динамика появится после нескольких обновлений — пока структура долга по срокам.</div>';
  el.querySelectorAll('.ag-seg').forEach(function(sg){
    sg.addEventListener('mouseenter',function(e){ovShow(e,sg.dataset.nm+' · <b>'+mln(sg.dataset.v)+'</b> млн · '+sg.dataset.pc+'%');});
    sg.addEventListener('mousemove',ovMove);sg.addEventListener('mouseleave',ovHide);
  });
}
function renderHero(ov){
  var el=document.getElementById('heroChart'),debt=ov.series.debt,over=ov.series.overdue,labels=ov.series.labels;
  var idx=[];for(var i=0;i<debt.length;i++)if(debt[i]!=null)idx.push(i);
  if(!ov.synthetic&&idx.length<2){renderAging(ov.aging);return;}
  var W=680,H=230,L=48,R=14,T=12,B=26,pw=W-L-R,ph=H-T-B,n=debt.length;
  var mx=Math.max.apply(0,idx.map(function(i){return debt[i];}))*1.1||1;
  var X=function(i){return L+i*pw/((n-1)||1);},Y=function(v){return T+ph-(v-0)/(mx-0)*ph;};
  var lineOf=function(a){return idx.map(function(i,j){return (j?'L':'M')+X(i).toFixed(1)+' '+Y(a[i]||0).toFixed(1);}).join(' ');};
  var areaOf=function(a){if(!idx.length)return '';return 'M'+X(idx[0]).toFixed(1)+' '+Y(0).toFixed(1)+' '+idx.map(function(i){return 'L'+X(i).toFixed(1)+' '+Y(a[i]||0).toFixed(1);}).join(' ')+' L'+X(idx[idx.length-1]).toFixed(1)+' '+Y(0).toFixed(1)+' Z';};
  var grid='',TK=5;for(var t=0;t<TK;t++){var gv=mx*t/(TK-1),y=Y(gv);grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/><text x="'+(L-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--text-4)" style="font-variant-numeric:tabular-nums">'+fmt(Math.round(gv/1e6))+'</text>';}
  var xlab=labels.map(function(m,i){return '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--text-4)">'+m+'</text>';}).join('');
  var dots=idx.map(function(i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(debt[i]).toFixed(1)+'" r="9" fill="transparent" class="hv" data-i="'+i+'"/>';}).join('');
  el.innerHTML='<svg class="ovsvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+grid+xlab+
    '<path d="'+areaOf(over)+'" fill="var(--accent)" opacity="0.12"/>'+
    '<path d="'+lineOf(over)+'" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0.5" stroke-dasharray="4 3"/>'+
    '<path d="'+lineOf(debt)+'" fill="none" stroke="var(--accent)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<line id="ovCross" x1="0" y1="'+T+'" x2="0" y2="'+(T+ph)+'" stroke="var(--border2)" stroke-width="1" opacity="0"/>'+dots+'</svg>';
  var cross=el.querySelector('#ovCross');
  el.querySelectorAll('.hv').forEach(function(c){
    c.addEventListener('mouseenter',function(e){var i=+c.getAttribute('data-i');cross.setAttribute('x1',c.getAttribute('cx'));cross.setAttribute('x2',c.getAttribute('cx'));cross.setAttribute('opacity','1');ovShow(e,labels[i]+' · долг <b>'+mln(debt[i])+'</b> млн'+(over[i]!=null?' · просроч. <b>'+mln(over[i])+'</b> млн':''));});
    c.addEventListener('mousemove',ovMove);
    c.addEventListener('mouseleave',function(){cross.setAttribute('opacity','0');ovHide();});
  });
}
function renderDonut(depts){
  var el=document.getElementById('donutChart'),leg=document.getElementById('donutLeg');
  if(!depts||!depts.length){el.innerHTML='';leg.innerHTML='<div class="ovwempty">—</div>';return;}
  var cols=['var(--s1)','var(--s2)','var(--s3)','var(--s-other)'];
  var tot=depts.reduce(function(s,d){return s+d.value;},0)||1,R=56,C=70,sw=17,circ=2*Math.PI*R,off=0;
  var ring=depts.map(function(d,i){var len=d.value/tot*circ,o=-off;off+=len;
    return '<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="'+cols[i%4]+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'" stroke-dashoffset="'+o.toFixed(2)+'" transform="rotate(-90 '+C+' '+C+')" class="dseg" data-nm="'+esc(d.name)+'" data-v="'+d.value+'" data-pc="'+d.pct+'" style="cursor:pointer"/>';
  }).join('');
  el.innerHTML='<svg width="140" height="140" viewBox="0 0 140 140">'+ring+
    '<text x="'+C+'" y="'+(C-2)+'" text-anchor="middle" font-size="18" font-weight="600" fill="var(--text)" style="font-variant-numeric:tabular-nums">'+mln(tot)+'</text>'+
    '<text x="'+C+'" y="'+(C+14)+'" text-anchor="middle" font-size="9.5" fill="var(--text-3)">млн ₸</text></svg>';
  leg.innerHTML=depts.map(function(d,i){return '<div class="it" data-nm="'+esc(d.name)+'" style="cursor:pointer"><span class="sw" style="background:'+cols[i%4]+'"></span><span class="nm">'+esc(d.name)+'</span><span class="pc">'+d.pct+'%</span><span class="v">'+mln(d.value)+'</span></div>';}).join('');
  var pick=function(nm){filterByDept(nm==='Прочие отделы'?'':nm);};
  el.querySelectorAll('.dseg').forEach(function(sg){
    sg.addEventListener('mouseenter',function(e){sg.style.opacity='.82';ovShow(e,sg.dataset.nm+' · <b>'+mln(sg.dataset.v)+'</b> млн · '+sg.dataset.pc+'% · клик — фильтр');});
    sg.addEventListener('mousemove',ovMove);
    sg.addEventListener('mouseleave',function(){sg.style.opacity='1';ovHide();});
    sg.addEventListener('click',function(){pick(sg.dataset.nm);});
  });
  leg.querySelectorAll('.it').forEach(function(it){it.addEventListener('click',function(){pick(it.getAttribute('data-nm'));});});
}
boot();
</script>
<div id="ovwTip"></div>
<script src="/assets/cup-theme.js" defer></script>
</body>
