<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП — Закуп доп оборудования</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0e14;--panel:#141924;--panel-h:#1a2130;--card:#141924;--white:#141924;
  --line:#232c3d;--line-2:#2f3a4f;--border:#232c3d;--border2:#2f3a4f;
  --text:#eef2f8;--text-2:#c7d0df;--text-3:#8794ab;--text-4:#5b6884;--text-dim:#8794ab;
  --brand:#C53B2F;--brand-h:#e0553f;--signal:#35d0c0;--good:#3ddc84;--warn:#ffb020;--bad:#ff5b6e;
  --fd:'Space Grotesk',sans-serif;--fb:'Inter',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;--radius:14px;
}
html,body{height:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:16px 26px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:11px}.brand img{height:22px}
.bn{font-family:var(--fd);font-weight:600;font-size:15px}.bn b{color:var(--brand)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);text-decoration:none;font-size:12.5px;border:1px solid var(--border);padding:7px 12px;border-radius:9px;white-space:nowrap}
.back:hover{color:var(--text);border-color:var(--border2)}
.sp{margin-left:auto}
.who{font-size:13px;color:var(--text-3)}.who b{color:var(--text)}
.btn{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{background:var(--panel-h);border-color:var(--border2)}
.btn-p{background:linear-gradient(135deg,var(--brand),var(--brand-h));border-color:transparent;color:#fff}
.btn-p:disabled{opacity:.55;cursor:default}
.wrap{max-width:1240px;margin:0 auto;padding:18px 22px 70px}
.h1{font-family:var(--fd);font-size:26px;font-weight:700}
.sub{color:var(--text-3);font-size:14px;margin:3px 0 18px}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.card h3{font-family:var(--fd);font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px}
label.fl{display:block;font-size:12px;color:var(--text-3);margin:12px 0 5px;font-weight:600}
label.fl .req{color:var(--bad)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:9px;color:var(--text);font:inherit;font-size:13.5px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--signal)}
textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ro{background:var(--panel-h);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--text-2)}
.hint{color:var(--text-4);font-size:11.5px;margin-top:5px}
.dealbox{position:relative}
.dealres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border2);border-radius:10px;max-height:280px;overflow:auto;z-index:20;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.dealres div{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.dealres div:hover{background:var(--panel-h)}
.dealres .did{font-family:var(--fm);color:var(--signal);font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(53,208,192,.12);border:1px solid var(--signal);color:var(--signal);border-radius:20px;padding:5px 12px;font-size:12.5px;margin-top:6px}
.chip .x{cursor:pointer;font-weight:700}
.picker{border:1px solid var(--border2);border-radius:9px;background:var(--bg);max-height:150px;overflow:auto;padding:4px}
.picker label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--text-2)}
.picker label:hover{background:var(--panel-h)}
.picker input{width:auto}
.pk-search{margin-bottom:4px}
.msg{margin-top:12px;font-size:13px;padding:9px 12px;border-radius:9px;display:none}
.msg.ok{display:block;background:rgba(61,220,132,.12);border:1px solid var(--good);color:var(--good)}
.msg.err{display:block;background:rgba(255,91,110,.12);border:1px solid var(--bad);color:var(--bad)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;background:var(--panel-h);color:var(--text-3);font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border2)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover td{background:var(--panel-h)}
.stg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,255,255,.05);border:1px solid var(--border2);color:var(--text-2)}
.lnk{color:var(--signal);text-decoration:none}.lnk:hover{text-decoration:underline}
.empty{color:var(--text-4);text-align:center;padding:34px;font-size:14px}
.dtog{cursor:pointer;color:var(--text-3);font-size:12px;user-select:none}
.dtog:hover{color:var(--text)}
.detail td{background:var(--bg);padding:0 12px 4px}
.detbody{padding:8px 2px 12px}
.detwrap{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}
@media(max-width:760px){.detwrap{grid-template-columns:1fr}}
.deth{font-family:var(--fd);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin-bottom:8px}
.slot{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.slabel{color:var(--text-2);min-width:180px}
.upl{cursor:pointer;font-size:12px;color:var(--signal);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;white-space:nowrap}
.upl:hover{background:var(--panel-h)}
.selrow td{background:var(--panel-h)!important}
.rtitle{font-family:var(--fd);font-weight:700;font-size:17px;color:var(--text)}
.btn-del{color:var(--bad);border-color:rgba(255,91,110,.4)}
.btn-del:hover{background:rgba(255,91,110,.1);border-color:var(--bad)}
.stepper{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
.stepper .st{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.stepper .st .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:12px;font-weight:600;background:var(--panel-h);border:1px solid var(--border2);color:var(--text-3);z-index:1}
.stepper .st .stlbl{font-size:9.5px;line-height:1.15;color:var(--text-4);text-align:center}
.stepper .st::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
.stepper .st:first-child::before{display:none}
.stepper .st.done .dot{background:linear-gradient(135deg,var(--signal),var(--good));border-color:transparent;color:#04121a}
.stepper .st.done::before{background:var(--good)}
.stepper .st.cur::before{background:var(--good)}
.stepper .st.cur .dot{background:linear-gradient(135deg,var(--brand),var(--brand-h));border-color:transparent;color:#fff;box-shadow:0 0 0 4px rgba(197,59,47,.18)}
.stepper .st.cur .stlbl{color:var(--text);font-weight:600}
.seg2{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg2 button{background:none;border:0;color:var(--text-3);font:inherit;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s}
.seg2 button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--panel-h);border:1px solid var(--border2);color:var(--text-2);white-space:nowrap}
.pill-ok{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.45);color:var(--good)}
.pill-no{background:rgba(255,91,110,.14);border-color:rgba(255,91,110,.45);color:var(--bad)}
.pill-work{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.45);color:var(--warn)}
.pcard{display:flex;align-items:center;gap:12px;background:var(--panel-h);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:9px}
.pcard-t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:13.5px;flex:none;color:#fff}
.av-brand{background:linear-gradient(135deg,var(--brand),var(--brand-h))}
.av-teal{background:linear-gradient(135deg,var(--signal),var(--good));color:#04121a}
.proccard{background:var(--panel-h);border:1px solid var(--border2);border-radius:14px;padding:14px 16px;margin-top:6px}
.pc-row{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.pc-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-sep{height:1px;background:var(--border);margin:14px 0 6px}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--signal);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="/assets/logo-icon.png" alt="" onerror="this.style.display='none'"><span class="bn"><b>ЦУП</b> · ProLabSupport</span></div>
  <a class="back" href="/portal.html">← Все модули</a>
  <span class="sp"></span>
  <span class="who" id="who">—</span>
  <button class="btn" onclick="logout()">Выйти</button>
</div>
<div class="wrap">
  <div class="h1">Закуп доп оборудования</div>
  <div class="sub">Заявки менеджера склада синхронизируются со смарт-процессом «Закупки» в Bitrix.</div>
  <div id="root"><div class="spin"></div></div>
</div>
<script>
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const F=n=>Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,' ');
let META=null, ME=null, DEAL=null, LIST=[];
const SEL={proizvoditel:new Set(),pribor:new Set()};

async function boot(){
  try{
    const me=await fetch('/auth/me'); if(!me.ok){location.href='/login.html';return;}
    ME=(await me.json()).user; document.getElementById('who').innerHTML='<b>'+esc(ME.displayName)+'</b>';
    const [m,l]=await Promise.all([fetch('/api/procurement/meta'),fetch('/api/procurement/list')]);
    if(!m.ok){document.getElementById('root').innerHTML='<div class="empty">Не удалось загрузить справочники из Битрикса.</div>';return;}
    META=await m.json(); LIST=(await l.json()).items||[];
    render();
  }catch(e){document.getElementById('root').innerHTML='<div class="empty">Ошибка: '+esc(e.message)+'</div>';}
}

const opt=(arr,ph)=>`<option value="">${ph||'—'}</option>`+(arr||[]).map(o=>`<option value="${esc(o.id)}">${esc(o.label)}</option>`).join('');
const stageName=id=>{const f=(META.flow||[]).find(x=>x.bitrix===id);if(f)return f.label;const s=(META.stages||[]).find(s=>s.id===id);return s?s.name:(id||'—');};

let MODE='create', EDIT=null, RVIEW='mine', DEALVIEW=null, dvTimer=null;
const initials=name=>{const p=String(name||'').trim().split(/\s+/).filter(Boolean);return((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();};
const empName=id=>{const e=(META.employees||[]).find(x=>String(x.id)===String(id));return e?e.name:'';};
function render(){
  const left=(MODE==='edit'&&EDIT!=null)?editCardHtml():createCardHtml();
  const right=`<div class="card" style="padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;gap:10px;padding:16px 20px 0">
      <div class="seg2"><button class="${RVIEW==='mine'?'on':''}" onclick="setRView('mine')">Мои заявки</button><button class="${RVIEW==='deal'?'on':''}" onclick="setRView('deal')">По сделке</button></div>
      <span style="margin-left:auto;color:var(--text-4);font-size:12px">${RVIEW==='mine'?LIST.length+' шт':''}</span>
    </div>
    <div style="overflow:auto;max-height:78vh;padding:14px 20px 20px" id="rightBody">${RVIEW==='mine'?listInner():dealViewHtml()}</div>
  </div>`;
  document.getElementById('root').innerHTML=`<div class="grid">${left}${right}</div>`;
  if(MODE==='edit'&&EDIT!=null) loadDetail(EDIT);
  if(RVIEW==='deal'&&DEALVIEW) loadByDeal(DEALVIEW.id);
}
function setRView(v){ RVIEW=v; render(); }
function createCardHtml(){
  const srcOpts=(META.sources||[]).map(s=>`<option value="${esc(s.id)}" ${s.id===META.internalSourceId?'selected':''}>${esc(s.name)}</option>`).join('');
  const defBid=META.defaultAssignee||((META.me&&META.me.bitrixUserId)||'');
  const empOpts=(META.employees||[]).map(e=>`<option value="${esc(e.id)}" ${String(e.id)===String(defBid)?'selected':''}>${esc(e.name)}</option>`).join('');
  const vidWarn=(!META.options.vidZakupki||!META.options.vidZakupki.length)
    ? `<div class="hint" style="color:var(--warn)">⚠ Справочник «Вид закупки» не загрузился из Битрикса (нужно право доступа к спискам). Скажи мне — подключим другим способом.</div>` : '';
  return `<div class="card">
      <h3>Новая заявка</h3>
      <label class="fl">Сделка (привязка)</label>
      <div class="dealbox">
        <input id="dealq" placeholder="Номер или название сделки…" oninput="onDealInput(this.value)" autocomplete="off">
        <div class="dealres" id="dealres" style="display:none"></div>
      </div>
      <div id="dealchip"></div>
      <div class="hint">Можно оставить пустым (закуп на склад без сделки).</div>
      <label class="fl">Название заявки</label>
      <input id="title" placeholder="Напр.: Доп оборудование — …">
      <div class="row2">
        <div><label class="fl">Источник</label><select id="source">${srcOpts}</select></div>
        <div><label class="fl">Ответственный</label><select id="assigned">${empOpts}</select></div>
      </div>
      <label class="fl">Вид закупки <span class="req">*</span></label>
      <select id="vidZakupki">${opt(META.options.vidZakupki,'— выберите —')}</select>
      ${vidWarn}
      <div class="msg" id="msg"></div>
      <button class="btn btn-p" id="createBtn" style="margin-top:14px;width:100%;justify-content:center" onclick="submitReq()">Создать заявку</button>
    </div>`;
}
function editCardHtml(){
  const r=LIST.find(x=>x.id===EDIT); if(!r) return createCardHtml();
  const flow=META.flow||[];
  const pl=r.payload||{};
  const stepper=`<div class="stepper">`+flow.map((s,i)=>`<div class="st ${i<r.stepIndex?'done':''} ${i===r.stepIndex?'cur':''}" title="${esc(s.label)}"><span class="dot">${i+1}</span><span class="stlbl">${esc(s.label)}</span></div>`).join('')+`</div>`;
  const stepSel=`<select onchange="moveStep(${r.id},this.value)">`+flow.map((s,i)=>`<option value="${esc(s.key)}" ${s.key===r.stepKey?'selected':''}>${i+1}. ${esc(s.label)}</option>`).join('')+`</select>`;
  const srcOptsE=(META.sources||[]).map(s=>`<option value="${esc(s.id)}" ${String(s.id)===String(pl.source||META.internalSourceId)?'selected':''}>${esc(s.name)}</option>`).join('');
  const empOptsE=(META.employees||[]).map(e=>`<option value="${esc(e.id)}" ${String(e.id)===String(pl.assigned||META.defaultAssignee||'')?'selected':''}>${esc(e.name)}</option>`).join('');
  const vidOptsE=(META.options.vidZakupki||[]).map(o=>`<option value="${esc(o.id)}" ${String(o.id)===String(pl.vidZakupki||'')?'selected':''}>${esc(o.label)}</option>`).join('');
  return `<div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <button class="btn" onclick="backToCreate()">← Новая заявка</button>
        <span style="margin-left:auto"></span>
        <button class="btn" onclick="toggleEditFields(${r.id})">✎ Изменить</button>
        <button class="btn btn-del" onclick="deleteReq(${r.id})">🗑 Удалить</button>
      </div>
      <div class="rtitle">${esc(r.title||('Заявка #'+r.bitrixItemId))}</div>
      <div class="hint">#${r.bitrixItemId||'—'}${r.dealId?` · сделка <a class="lnk" href="${esc(r.dealUrl)}" target="_blank">#${r.dealId}</a>`:''}${r.itemUrl?` · <a class="lnk" href="${esc(r.itemUrl)}" target="_blank">в Битриксе ↗</a>`:''}</div>
      ${r.sourceItemId?`<div class="deth" style="margin-top:14px">Файлы допов (из подбора)</div><div id="dopyBox"><div class="hint">загрузка…</div></div>`:''}

      <div id="editFields-${r.id}" style="display:none;margin-top:12px;padding:14px;border:1px solid var(--border2);border-radius:12px;background:var(--bg)">
        <label class="fl">Название</label><input id="e-title" value="${esc(r.title||'')}">
        <div class="row2">
          <div><label class="fl">Источник</label><select id="e-source">${srcOptsE}</select></div>
          <div><label class="fl">Ответственный</label><select id="e-assigned">${empOptsE}</select></div>
        </div>
        <label class="fl">Вид закупки</label><select id="e-vid">${vidOptsE}</select>
        <button class="btn btn-p" style="margin-top:10px" onclick="saveEdit(${r.id})">Сохранить изменения</button>
      </div>

      ${stepper}
      <label class="fl">Сменить шаг</label>${stepSel}
      <div id="docsSummary" style="margin-top:14px"></div>
      <div class="deth" style="margin-top:16px" id="actionHdr">Дальнейшее действие</div>
      <div id="stepAction"><div class="spin" style="margin:14px auto"></div></div>
    </div>`;
}
function listInner(){
  if(!LIST.length) return '<div class="empty">Пока нет заявок. Создай первую слева.</div>';
  return `<table><thead><tr><th>Заявка</th><th>Сделка</th><th>Шаг</th><th>Создана</th><th></th></tr></thead><tbody>${LIST.map(rowHtml).join('')}</tbody></table>`;
}
function renderList(){
  const b=document.getElementById('listBody'); if(b)b.innerHTML=listInner();
  const h=document.getElementById('listHdr'); if(h)h.textContent='Мои заявки ('+LIST.length+')';
}
function selectReq(id){ MODE='edit'; EDIT=id; RVIEW='mine'; render(); }
function backToCreate(){ MODE='create'; EDIT=null; DEAL=null; render(); }

// ── Представление «По сделке» ───────────────────────────────────────────────
function dealViewHtml(){
  return `<div class="dealbox"><input id="dvq" placeholder="Сделка: номер или название…" oninput="onDVInput(this.value)" autocomplete="off"><div class="dealres" id="dvres" style="display:none"></div></div>
    <div id="dvChip" style="margin-top:6px">${DEALVIEW?`<span class="chip">#${DEALVIEW.id} · ${esc(DEALVIEW.title)} <span class="x" onclick="clearDV()">✕</span></span>`:''}</div>
    <div id="dvResults" style="margin-top:14px">${DEALVIEW?'<div class="spin" style="margin:20px auto"></div>':'<div class="hint">Выбери сделку — покажу все её закупки и статусы.</div>'}</div>`;
}
function onDVInput(v){
  clearTimeout(dvTimer); const box=document.getElementById('dvres');
  if(!v||v.trim().length<2){box.style.display='none';return;}
  dvTimer=setTimeout(async()=>{
    try{ const d=await (await fetch('/api/procurement/deals?q='+encodeURIComponent(v.trim()))).json(); const items=d.items||[];
      box.innerHTML=items.length?items.map(it=>`<div onclick='pickDV(${JSON.stringify({id:it.id,title:it.title}).replace(/'/g,"&#39;")})'><span class="did">#${it.id}</span> ${esc(it.title)}</div>`).join(''):'<div class="hint" style="padding:9px 12px">Ничего не найдено</div>';
      box.style.display='block';
    }catch(e){box.style.display='none';}
  },300);
}
function pickDV(it){ DEALVIEW=it; render(); }
function clearDV(){ DEALVIEW=null; render(); }
async function loadByDeal(id){
  const box=document.getElementById('dvResults'); if(!box)return;
  try{ const data=await (await fetch('/api/procurement/by-deal?dealId='+id)).json(); renderByDeal(data); }
  catch(e){ box.innerHTML='<div class="hint">Ошибка: '+esc(e.message)+'</div>'; }
}
function renderByDeal(data){
  const box=document.getElementById('dvResults'); if(!box)return;
  const items=data.items||[];
  if(!items.length){ box.innerHTML='<div class="empty">По этой сделке закупок не найдено.</div>'; return; }
  const total=items.reduce((s,i)=>s+(i.sum||0),0);
  const pillCls={ok:'pill-ok',fail:'pill-no',work:'pill-work'};
  box.innerHTML=`<div class="hint" style="margin-bottom:10px">Закупок: <b style="color:var(--text)">${items.length}</b> · сумма ${F(total)} ₸${data.dealUrl?` · <a class="lnk" href="${esc(data.dealUrl)}" target="_blank">сделка ↗</a>`:''}</div>`
    +items.map(it=>`<div class="pcard">
      <div style="flex:1;min-width:0"><div class="pcard-t">${esc(it.title)}</div><div class="hint">#${it.id} · ${it.isOurs?'<span style="color:var(--signal)">доп (дашборд)</span>':'импорт'}</div></div>
      <div style="text-align:right;white-space:nowrap"><span class="pill ${pillCls[it.sem]||''}">${esc(it.stageName)}</span><div class="hint" style="margin-top:5px">${F(it.sum)} ${esc(it.currency)}</div></div>
      <div style="display:flex;flex-direction:column;gap:5px;margin-left:6px;white-space:nowrap">
        ${it.url?`<a class="lnk" href="${esc(it.url)}" target="_blank">Б24 ↗</a>`:''}
        ${it.isOurs&&it.localId?`<span class="lnk" style="cursor:pointer" onclick="openLocal(${it.localId})">Открыть</span>`:''}
      </div>
    </div>`).join('');
}
function openLocal(localId){ selectReq(localId); }
document.addEventListener('click',e=>{ if(!e.target.closest('#dvq')&&!e.target.closest('#dvres')){const b=document.getElementById('dvres'); if(b)b.style.display='none';} });

function pickerHtml(key,items,withSearch){
  return `<div class="picker" id="pk-${key}">
    ${withSearch?`<input class="pk-search" placeholder="Поиск…" oninput="filterPicker('${key}',this.value)">`:''}
    <div id="pkbody-${key}">${(items||[]).map(o=>pkRow(key,o)).join('')||'<div class="hint" style="padding:6px">нет значений</div>'}</div>
  </div>`;
}
const pkRow=(key,o)=>`<label data-lab="${esc((o.label||'').toLowerCase())}"><input type="checkbox" value="${esc(o.id)}" ${SEL[key].has(String(o.id))?'checked':''} onchange="toggleSel('${key}','${esc(o.id)}',this.checked)">${esc(o.label)}</label>`;
function toggleSel(key,id,on){ if(on)SEL[key].add(String(id)); else SEL[key].delete(String(id)); }
function filterPicker(key,q){ q=(q||'').toLowerCase(); document.querySelectorAll(`#pkbody-${key} label`).forEach(l=>{l.style.display=l.dataset.lab.includes(q)?'':'none';}); }

function rowHtml(r){
  const badge=`<span class="stg">${r.stepIndex>=0?(r.stepIndex+1)+'. ':''}${esc(stageName(r.stageId))}</span>`;
  return `<tr class="${EDIT===r.id?'selrow':''}" style="cursor:pointer" onclick="selectReq(${r.id})">
    <td><b>${esc(r.title||'—')}</b><div class="hint">#${r.bitrixItemId||'—'}</div></td>
    <td>${r.dealId?`<a class="lnk" href="${esc(r.dealUrl)}" target="_blank" onclick="event.stopPropagation()">#${r.dealId}</a>`:'—'}</td>
    <td>${badge}</td>
    <td class="hint">${r.createdAt?new Date(r.createdAt).toLocaleDateString('ru-RU'):'—'}</td>
    <td>${r.itemUrl?`<a class="lnk" href="${esc(r.itemUrl)}" target="_blank" onclick="event.stopPropagation()">↗</a>`:''}</td>
  </tr>`;
}
async function reloadList(){ const l=await fetch('/api/procurement/list'); LIST=(await l.json()).items||[]; if(MODE==='edit') render(); else renderList(); }
async function moveStep(id,stageKey){
  try{
    const r=await fetch('/api/procurement/'+id+'/stage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stageKey})});
    const d=await r.json();
    if(!r.ok){alert(d.error||'Ошибка смены стадии');}
    await reloadList();
  }catch(e){alert('Ошибка: '+e.message); await reloadList();}
}
// Документы + согласование грузятся в левую карточку (docSlots / apBox)
async function loadDetail(id){
  try{ const d=await (await fetch('/api/procurement/'+id+'/detail')).json(); renderDetail(id,d); }
  catch(e){ const ds=document.getElementById('docSlots'); if(ds)ds.innerHTML='<div class="hint">Ошибка: '+esc(e.message)+'</div>'; }
}
const DOC_LABELS={invoice:'Счет на оплату',pay:'Подтверждение оплаты',contract:'Накладная'};
function uploadSlotHtml(id,d,key,withReqHint){
  const s=(META.uploadSlots||[]).find(x=>x.key===key); if(!s) return '';
  const info=d.docs&&d.docs[key];
  return `<div class="slot"><div class="slabel">${esc(s.label)}</div>
    <div style="flex:1">${info?`<a class="lnk" href="${esc(info.url||'#')}" target="_blank">${esc(info.name||'файл')}</a>`:'<span class="hint">не загружено</span>'}</div>
    <label class="upl">${info?'Заменить':'Загрузить'}<input type="file" style="display:none" onchange="doUpload(${id},'${s.code}',this)"></label></div>`;
}
function approvalHtml(id,d){
  const ap=d.approval||{};
  const apOpts=(META.approve.options||[]).map(o=>`<option value="${o.id}" ${String(ap.status)===String(o.id)?'selected':''}>${esc(o.label)}</option>`).join('');
  const defBid=META.defaultAssignee||((META.me&&META.me.bitrixUserId)||'');
  const curAppr=ap.approver||defBid;
  const apprSel=(META.employees||[]).map(e=>`<option value="${e.id}" ${String(e.id)===String(curAppr)?'selected':''}>${esc(e.name)}</option>`).join('');
  const nm=empName(curAppr)||'Не выбран';
  const pill=ap.approved?'<span class="pill pill-ok">✓ Согласовано</span>':(ap.status&&String(ap.status)!==String(META.approve.yes)?'<span class="pill pill-no">Отклонено</span>':'<span class="pill pill-work">Ожидает</span>');
  return `<div class="proccard">
    <div class="pc-row"><div class="avatar av-brand">${initials(nm)}</div><div style="flex:1;min-width:0"><div class="pc-name">${esc(nm)}</div><div class="hint">Руководитель · согласование</div></div>${pill}</div>
    <label class="fl">Утверждающий</label><select id="apby-${id}">${apprSel}</select>
    <button class="btn" style="margin-top:8px;width:100%;justify-content:center" onclick="sendApproval(${id})">📨 Отправить на согласование</button>
    <div class="pc-sep"></div>
    <label class="fl">Решение</label><select id="apst-${id}">${apOpts}</select>
    <label class="fl">Комментарий</label><textarea id="apcm-${id}" placeholder="необязательно">${esc(ap.comment||'')}</textarea>
    <button class="btn btn-p" style="margin-top:8px;width:100%;justify-content:center" onclick="saveApproval(${id})">Сохранить решение</button>
  </div>`;
}
function accountantHtml(id){
  const r=LIST.find(x=>x.id===id)||{};
  const acc=r.accountantBid||META.chiefAccountant||'';
  const acctSel=(META.employees||[]).map(e=>`<option value="${esc(e.id)}" ${String(e.id)===String(acc)?'selected':''}>${esc(e.name)}</option>`).join('');
  const nm=empName(acc)||'Наталья Зенченко';
  return `<div class="proccard" style="margin-top:12px">
    <div class="pc-row"><div class="avatar av-teal">${initials(nm)}</div><div style="flex:1;min-width:0"><div class="pc-name">${esc(nm)}</div><div class="hint">Бухгалтер · оплата</div></div></div>
    <label class="fl">Сменить бухгалтера</label><select id="acctSel">${acctSel}</select>
    <div class="hint">По умолчанию — Наталья Зенченко. Смени, если в отпуске.</div>
    <button class="btn" style="margin-top:8px;width:100%;justify-content:center" onclick="saveAccountant(${id})">Назначить бухгалтера</button>
  </div>`;
}
// Показываем на текущем шаге только то, что нужно для перехода на СЛЕДУЮЩИЙ шаг.
function renderDetail(id,d){
  const r=LIST.find(x=>x.id===id)||{};
  const flow=META.flow||[];
  const ci=(r.stepIndex!=null)?r.stepIndex:-1;
  // Компактный список уже приложенных документов (история)
  const summ=['invoice','pay','contract'].map(k=>{
    const info=d.docs&&d.docs[k]; if(!info) return '';
    const s=(META.uploadSlots||[]).find(x=>x.key===k);
    return `<div class="slot"><div class="slabel">${esc(DOC_LABELS[k])}</div><div style="flex:1"><a class="lnk" href="${esc(info.url||'#')}" target="_blank">${esc(info.name||'файл')}</a></div><label class="upl">Заменить<input type="file" style="display:none" onchange="doUpload(${id},'${s.code}',this)"></label></div>`;
  }).join('');
  const ds=document.getElementById('docsSummary'); if(ds)ds.innerHTML=summ?`<div class="deth">Приложенные документы</div>${summ}`:'';
  const db=document.getElementById('dopyBox');
  if(db){ if(d.dopy){ const fl=(d.dopy.files||[]).map(f=>`<div class="slot"><div class="slabel">Файл</div><div style="flex:1"><a class="lnk" href="${esc(f.url||'#')}" target="_blank">${esc(f.name||'файл')}</a></div></div>`).join(''); db.innerHTML=(fl||'<div class="hint">файлы не найдены</div>')+(d.dopy.serviceUrl?`<div style="margin-top:6px"><a class="lnk" href="${esc(d.dopy.serviceUrl)}" target="_blank">Открыть подбор ↗</a></div>`:''); } else db.innerHTML='<div class="hint">нет данных</div>'; }
  // Активное действие = требование для перехода на следующий шаг
  const nextKey=(ci>=0&&ci+1<flow.length)?flow[ci+1].key:null;
  const nextLabel=(ci>=0&&ci+1<flow.length)?flow[ci+1].label:'';
  let hdr='Дальнейшее действие', html='';
  if(nextKey==='invoice'){ hdr='Счёт на оплату'; html=uploadSlotHtml(id,d,'invoice')+`<div class="hint" style="margin-top:6px">Приложите счёт, чтобы перейти на «${esc(nextLabel)}».</div>`; }
  else if(nextKey==='approve'){ hdr='Согласование закупки'; html=approvalHtml(id,d)+accountantHtml(id); }
  else if(nextKey==='payment'){ hdr='Оплата закупки'; html=uploadSlotHtml(id,d,'pay')+`<div class="hint" style="margin-top:6px">Приложите подтверждение оплаты, чтобы перейти на «${esc(nextLabel)}».</div>`+accountantHtml(id); }
  else if(nextKey==='contract'){ hdr='Договор'; html='<div class="hint">Особых условий нет — можно перейти на «Согласование закупки».</div>'; }
  else if(nextKey==='waiting'){ hdr='Ожидание товара'; html='<div class="hint">Оплата проведена — двигай на «Ожидание товара».</div>'; }
  else if(nextKey==='received'){ hdr='Товар принят'; html=uploadSlotHtml(id,d,'contract')+`<div class="hint" style="margin-top:6px">Приложите накладную, чтобы отметить «${esc(nextLabel)}».</div>`; }
  else { hdr='Готово'; html='<div class="hint" style="color:var(--good)">Процесс завершён.</div>'; }
  const hEl=document.getElementById('actionHdr'); if(hEl)hEl.textContent=hdr;
  const aEl=document.getElementById('stepAction'); if(aEl)aEl.innerHTML=html;
}
function fileToB64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file);});}
async function doUpload(id,code,input){
  const file=input.files&&input.files[0]; if(!file)return;
  if(file.size>24*1024*1024){alert('Файл больше 24 МБ — слишком большой.');return;}
  input.disabled=true;
  try{
    const base64=await fileToB64(file);
    const r=await fetch('/api/procurement/'+id+'/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fieldCode:code,filename:file.name,base64})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка загрузки'); loadDetail(id); return;}
    // авто-переход на следующий шаг, если этот документ его разблокирует
    const r0=LIST.find(x=>x.id===id)||{}; const flow=META.flow||[]; const ci=(r0.stepIndex!=null)?r0.stepIndex:-1;
    const nextKey=(ci>=0&&ci+1<flow.length)?flow[ci+1].key:null;
    const need={invoice:'invoice',payment:'pay',received:'contract'}[nextKey];
    const slotKey=((META.uploadSlots||[]).find(s=>s.code===code)||{}).key;
    if(need&&need===slotKey){ await moveStep(id,nextKey); } else { loadDetail(id); }
  }catch(e){alert('Ошибка: '+e.message);}
  finally{input.disabled=false;}
}
async function sendApproval(id){
  const el=document.getElementById('apby-'+id); const approverId=el?el.value:'';
  if(!approverId){alert('Выберите утверждающего');return;}
  try{
    const r=await fetch('/api/procurement/'+id+'/request-approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approverId})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;}
    alert('Отправлено на согласование.');
  }catch(e){alert('Ошибка: '+e.message);}
}
async function saveApproval(id){
  const status=document.getElementById('apst-'+id).value;
  const approverId=document.getElementById('apby-'+id).value;
  const cm=document.getElementById('apcm-'+id); const comment=cm?cm.value:'';
  try{
    const r=await fetch('/api/procurement/'+id+'/approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,approverId,comment})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;}
    // авто-переход на «Согласование закупки», если согласовано
    const r0=LIST.find(x=>x.id===id)||{}; const flow=META.flow||[]; const ci=(r0.stepIndex!=null)?r0.stepIndex:-1;
    const nextKey=(ci>=0&&ci+1<flow.length)?flow[ci+1].key:null;
    if(String(status)===String(META.approve.yes)&&nextKey==='approve'){ await moveStep(id,'approve'); } else { await reloadList(); }
  }catch(e){alert('Ошибка: '+e.message);}
}
async function saveAccountant(id){
  const bid=document.getElementById('acctSel').value;
  if(!bid){alert('Выберите бухгалтера');return;}
  try{
    const r=await fetch('/api/procurement/'+id+'/accountant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accountantBid:bid})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;}
    alert('Бухгалтер назначен и уведомлён.');
  }catch(e){alert('Ошибка: '+e.message);}
}
async function deleteReq(id){
  if(!confirm('Удалить заявку и связанный элемент в «Закупках» Битрикса? Это необратимо.'))return;
  try{
    const r=await fetch('/api/procurement/'+id,{method:'DELETE'});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка удаления');return;}
    backToCreate(); await reloadList();
  }catch(e){alert('Ошибка: '+e.message);}
}
function toggleEditFields(id){
  const box=document.getElementById('editFields-'+id); if(!box)return;
  box.style.display=box.style.display==='none'?'block':'none';
}
async function saveEdit(id){
  const val=i=>{const el=document.getElementById(i);return el?el.value.trim():'';};
  const payload={ title:val('e-title'), source:val('e-source'), assigned:val('e-assigned'), vidZakupki:val('e-vid') };
  try{
    const r=await fetch('/api/procurement/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка сохранения');return;}
    await reloadList();
  }catch(e){alert('Ошибка: '+e.message);}
}

// ── Поиск сделки ────────────────────────────────────────────────────────────
let dealTimer=null;
function onDealInput(v){
  clearTimeout(dealTimer);
  const box=document.getElementById('dealres');
  if(!v||v.trim().length<2){box.style.display='none';return;}
  dealTimer=setTimeout(async()=>{
    try{
      const r=await fetch('/api/procurement/deals?q='+encodeURIComponent(v.trim()));
      const d=await r.json(); const items=d.items||[];
      box.innerHTML=items.length?items.map(it=>`<div onclick='pickDeal(${JSON.stringify(it).replace(/'/g,"&#39;")})'><span class="did">#${it.id}</span> ${esc(it.title)}</div>`).join(''):'<div class="hint" style="padding:9px 12px">Ничего не найдено</div>';
      box.style.display='block';
    }catch(e){box.style.display='none';}
  },300);
}
function pickDeal(it){
  DEAL=it; document.getElementById('dealres').style.display='none'; document.getElementById('dealq').value='';
  document.getElementById('dealchip').innerHTML=`<span class="chip">#${it.id} · ${esc(it.title)} <span class="x" onclick="clearDeal()">✕</span></span>`;
  const t=document.getElementById('title'); if(!t.value)t.value='Доп оборудование — '+it.title;
  if(it.currency){const c=document.getElementById('currency'); if(c)c.value=it.currency;}
}
function clearDeal(){ DEAL=null; document.getElementById('dealchip').innerHTML=''; }
document.addEventListener('click',e=>{ if(!e.target.closest('.dealbox')){const b=document.getElementById('dealres'); if(b)b.style.display='none';} });

// ── Создание ────────────────────────────────────────────────────────────────
async function submitReq(){
  const msg=document.getElementById('msg'); msg.className='msg';
  const vid=document.getElementById('vidZakupki').value;
  if(META.required.vidZakupki && !vid){ msg.className='msg err'; msg.textContent='Заполните обязательное поле «Вид закупки».'; return; }
  const val=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const payload={
    dealId:DEAL?DEAL.id:null,
    title:val('title'), source:val('source'), assigned:val('assigned'),
    vidZakupki:vid,
  };
  const btn=document.getElementById('createBtn'); btn.disabled=true; btn.textContent='Создаю…';
  try{
    const r=await fetch('/api/procurement/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();
    if(r.ok){
      msg.className='msg ok'; msg.innerHTML='Заявка создана в «Закупках» — <a class="lnk" href="'+esc(d.itemUrl)+'" target="_blank">#'+d.bitrixItemId+' ↗</a>';
      const l=await fetch('/api/procurement/list'); LIST=(await l.json()).items||[];
      // сбросить выбор и перерисовать список, сохранив сообщение
      SEL.proizvoditel.clear(); SEL.pribor.clear(); DEAL=null;
      const saved=msg.outerHTML; render(); document.getElementById('msg').outerHTML=saved;
    }else{ msg.className='msg err'; msg.textContent=d.error||'Ошибка создания'; }
  }catch(e){ msg.className='msg err'; msg.textContent='Ошибка: '+e.message; }
  finally{ btn.disabled=false; btn.textContent='Создать заявку'; }
}

async function logout(){await fetch('/auth/logout',{method:'POST'});location.href='/login.html';}
boot();
