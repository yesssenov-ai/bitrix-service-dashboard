<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП — Закупки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0e14;--panel:#141924;--panel-h:#1a2130;--card:#141924;--white:#141924;
  --line:#232c3d;--line-2:#2f3a4f;--border:#232c3d;--border2:#2f3a4f;
  --text:#eef2f8;--text-2:#c7d0df;--text-3:#8794ab;--text-4:#5b6884;--text-dim:#8794ab;
  --brand:#C53B2F;--brand-h:#e0553f;--signal:#35d0c0;--good:#3ddc84;--warn:#ffb020;--bad:#ff5b6e;
  --fd:'Space Grotesk',sans-serif;--fb:'Inter',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;--radius:14px;
}
html,body{height:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:16px 26px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:11px}.brand img{height:22px}
.bn{font-family:var(--fd);font-weight:600;font-size:15px}.bn b{color:var(--brand)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);text-decoration:none;font-size:12.5px;border:1px solid var(--border);padding:7px 12px;border-radius:9px;white-space:nowrap}
.back:hover{color:var(--text);border-color:var(--border2)}
.sp{margin-left:auto}
.who{font-size:13px;color:var(--text-3)}.who b{color:var(--text)}
.btn{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{background:var(--panel-h);border-color:var(--border2)}
.btn-p{background:linear-gradient(135deg,var(--brand),var(--brand-h));border-color:transparent;color:#fff}
.btn-p:disabled{opacity:.55;cursor:default}
/* Мгновенная обратная связь по клику: пока идёт запрос — кнопка «занята» (спиннер),
   повторные клики блокируются (см. глобальный перехватчик в скрипте). */
.btn.is-busy{pointer-events:none;opacity:.7;cursor:progress}
.btn.is-busy::after{content:"";width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:btnspin .6s linear infinite;display:inline-block;flex:0 0 auto}
@keyframes btnspin{to{transform:rotate(360deg)}}
.wrap{max-width:1240px;margin:0 auto;padding:18px 22px 70px}
.h1{font-family:var(--fd);font-size:26px;font-weight:700}
.sub{color:var(--text-3);font-size:14px;margin:3px 0 18px}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
.grid.grid-1{grid-template-columns:minmax(0,1fr)}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.card h3{font-family:var(--fd);font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px}
label.fl{display:block;font-size:12px;color:var(--text-3);margin:12px 0 5px;font-weight:600}
label.fl .req{color:var(--bad)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:9px;color:var(--text);font:inherit;font-size:13.5px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--signal)}
textarea{resize:vertical;min-height:64px}
/* Тёмная тема для нативных дат: делает иконку календаря видимой на тёмном фоне */
input[type="date"]{color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.85);opacity:.85;cursor:pointer}
input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ro{background:var(--panel-h);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--text-2)}
.hint{color:var(--text-4);font-size:11.5px;margin-top:5px}
.dealbox{position:relative}
.dealres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border2);border-radius:10px;max-height:280px;overflow:auto;z-index:20;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.dealres div{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.dealres div:hover{background:var(--panel-h)}
.dealres .did{font-family:var(--fm);color:var(--signal);font-size:11.5px}
/* «По сделке»: результаты в потоке (не absolute), иначе overflow #rightBody их обрезает */
#dvres{position:static;left:auto;right:auto;top:auto;margin-top:6px;max-height:none;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(53,208,192,.12);border:1px solid var(--signal);color:var(--signal);border-radius:20px;padding:5px 12px;font-size:12.5px;margin-top:6px}
.chip .x{cursor:pointer;font-weight:700}
.picker{border:1px solid var(--border2);border-radius:9px;background:var(--bg);max-height:150px;overflow:auto;padding:4px}
.picker label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--text-2)}
.picker label:hover{background:var(--panel-h)}
.picker input{width:auto}
.pk-search{margin-bottom:4px}
.msg{margin-top:12px;font-size:13px;padding:9px 12px;border-radius:9px;display:none}
.msg.ok{display:block;background:rgba(61,220,132,.12);border:1px solid var(--good);color:var(--good)}
.msg.err{display:block;background:rgba(255,91,110,.12);border:1px solid var(--bad);color:var(--bad)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;background:var(--panel-h);color:var(--text-3);font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border2)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover td{background:var(--panel-h)}
.stg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,255,255,.05);border:1px solid var(--border2);color:var(--text-2)}
.lnk{color:var(--signal);text-decoration:none}.lnk:hover{text-decoration:underline}
.empty{color:var(--text-4);text-align:center;padding:34px;font-size:14px}
.dtog{cursor:pointer;color:var(--text-3);font-size:12px;user-select:none}
.dtog:hover{color:var(--text)}
.detail td{background:var(--bg);padding:0 12px 4px}
.detbody{padding:8px 2px 12px}
.detwrap{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}
@media(max-width:760px){.detwrap{grid-template-columns:1fr}}
.deth{font-family:var(--fd);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin-bottom:8px}
.slot{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.slabel{color:var(--text-2);width:150px;flex:none}
.sval{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sval a{white-space:nowrap}
.upl{cursor:pointer;font-size:12px;color:var(--signal);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;white-space:nowrap;flex:none}
.upl:hover{background:var(--panel-h)}
.selrow td{background:var(--panel-h)!important}
.rtitle{font-family:var(--fd);font-weight:700;font-size:17px;color:var(--text);overflow-wrap:anywhere;word-break:break-word}
/* Статус-доска (журнал) */
.spill{display:inline-block;padding:3px 9px;border:1px solid var(--border2);border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.ownrow{padding:3px 0}.ownrow+.ownrow{border-top:1px solid var(--border);margin-top:4px;padding-top:6px}
.nb{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid var(--border2);margin-right:3px}
.nb-ok{color:var(--good);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.1)}
.nb-no{color:var(--bad);border-color:rgba(255,91,110,.45);background:rgba(255,91,110,.1)}
.nb-none{color:var(--text-3)}
table.board td{vertical-align:top}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px}
table.mini th{text-align:left;color:var(--text-3);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--border)}
table.mini td{padding:4px 8px;border-bottom:1px solid var(--border)}
.btn-del{color:var(--bad);border-color:rgba(255,91,110,.4)}
.btn-del:hover{background:rgba(255,91,110,.1);border-color:var(--bad)}
.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:14px 0 6px}
.stepper .st{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;cursor:pointer}
.stepper .st .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:12px;font-weight:600;background:var(--panel-h);border:1px solid var(--border2);color:var(--text-3);z-index:1;transition:.15s}
.stepper .st:hover .dot{border-color:var(--signal);transform:translateY(-1px)}
.stepper .st .stlbl{font-size:9.5px;line-height:1.15;color:var(--text-4);text-align:center}
.stepper .st .stdate{font-size:8px;line-height:1.1;color:var(--text-4);font-family:var(--fm);margin-top:1px;text-align:center}
.stepper .st.done .stdate,.stepper .st.cur .stdate{color:var(--text-3)}
.stepper .st::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
.stepper .st:first-child::before{display:none}
.stepper .st.done .dot{background:linear-gradient(135deg,var(--signal),var(--good));border-color:transparent;color:#04121a}
.stepper .st.done::before{background:var(--good)}
.stepper .st.cur::before{background:var(--good)}
.stepper .st.cur .dot{background:linear-gradient(135deg,var(--brand),var(--brand-h));border-color:transparent;color:#fff;box-shadow:0 0 0 4px rgba(197,59,47,.18)}
.stepper .st.cur .stlbl{color:var(--text);font-weight:600}
.seg2{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg2 button{background:none;border:0;color:var(--text-3);font:inherit;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;transition:.15s}
.seg2 button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--panel-h);border:1px solid var(--border2);color:var(--text-2);white-space:nowrap}
.pill-ok{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.45);color:var(--good)}
.pill-no{background:rgba(255,91,110,.14);border-color:rgba(255,91,110,.45);color:var(--bad)}
.pill-work{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.45);color:var(--warn)}
.pcard{display:flex;align-items:center;gap:12px;background:var(--panel-h);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:9px}
.pcard-t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:13.5px;flex:none;color:#fff}
.av-brand{background:linear-gradient(135deg,var(--brand),var(--brand-h))}
.av-teal{background:linear-gradient(135deg,var(--signal),var(--good));color:#04121a}
.proccard{background:var(--panel-h);border:1px solid var(--border2);border-radius:14px;padding:14px 16px;margin-top:6px}
.pc-row{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.pc-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-sep{height:1px;background:var(--border);margin:14px 0 6px}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--signal);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* Множественные файлы, накладные, откаты */
.docblk{margin-top:12px}
.docblk .dh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.docblk .dh .cnt{font-family:var(--fm);font-size:11px;color:var(--text-4)}
.docblk .dh .opt{font-size:10.5px;color:var(--text-4);font-weight:500}
.fitem{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--bg);border:1px solid var(--border);border-radius:9px;margin-bottom:6px;font-size:12.5px}
.fitem .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .fx{cursor:pointer;color:var(--text-4);font-weight:700;flex:none}
.fitem .fx:hover{color:var(--bad)}
.fitem .fmeta{color:var(--text-4);font-size:11px;white-space:nowrap}
.addf{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--signal);border:1px dashed var(--border2);border-radius:8px;padding:6px 11px;margin-top:3px}
.addf:hover{background:var(--panel-h);border-color:var(--signal)}
.wbform{border:1px solid var(--border2);border-radius:11px;background:var(--bg);padding:11px 12px;margin-top:8px}
.wbform .wbrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wbform label.fl{margin-top:8px}
.fullybar{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;margin-top:12px;border:1px solid var(--border2);background:var(--panel-h)}
.fullybar.on{border-color:rgba(61,220,132,.5);background:rgba(61,220,132,.08)}
.fullybar input{width:18px;height:18px;flex:none;cursor:pointer}
.fullybar .ft{font-weight:600;font-size:13.5px}
.fullybar .fs{font-size:11.5px;color:var(--text-4)}
.rbhist{margin-top:14px;border:1px solid rgba(255,176,32,.35);background:rgba(255,176,32,.06);border-radius:11px;padding:11px 13px}
.rbhist .rh{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--warn);font-weight:700;margin-bottom:8px}
.rbhist .ri{font-size:12px;padding:6px 0;border-top:1px dashed rgba(255,176,32,.25)}
.rbhist .ri:first-of-type{border-top:none}
.rbhist .ri .rt{color:var(--text-2)}
.rbhist .ri .rm{color:var(--text-4);font-size:11px;margin-top:2px}
.stepper .st.partial .dot{background:linear-gradient(135deg,var(--brand),var(--brand-h));border-color:transparent;color:#fff}
.stepper .st.partial::before{background:var(--brand)}
/* Прогресс готовности закупок по сделке */
.dvprog{background:var(--panel-h);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.dvprog .pt{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.dvprog .pt .pl{font-size:13px;color:var(--text-2)}
.dvprog .pt .pl b{color:var(--text)}
.dvprog .pt .pc{font-family:var(--fm);font-weight:700;font-size:15px}
.pbar{height:9px;border-radius:20px;background:var(--bg);border:1px solid var(--border);overflow:hidden}
.pbar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--signal),var(--good));transition:width .4s ease}
/* Отгрузка клиенту (ТТН) + доотправка */
.shipcard{border:1px solid var(--border2);background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.shipcard.closed{border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.06)}
.shipcard .sh-t{font-family:var(--fd);font-weight:700;font-size:14px;margin-bottom:4px}
.shipcard.closed .sh-t{color:var(--good)}
.reshsep{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--warn);font-family:var(--fd);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.reshsep::before,.reshsep::after{content:'';flex:1;height:1px;background:rgba(255,176,32,.4)}
.ttnrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:rgba(255,176,32,.06);border:1px dashed rgba(255,176,32,.4);border-radius:9px;padding:7px 10px;margin-top:8px;font-size:12.5px}
/* ── Мобильная адаптация (менеджер склада работает с телефона) ─────────────── */
@media(max-width:640px){
  .top{padding:11px 13px;gap:8px}
  .brand img{height:20px}.bn{font-size:14px}
  .wrap{padding:13px 12px 64px}
  .h1{font-size:21px}.sub{font-size:13px;margin-bottom:14px}
  .card{padding:14px 13px}
  .grid{gap:13px}
  /* Змейка: чуть плотнее, чтобы 7 шагов помещались */
  .stepper .st .dot{width:24px;height:24px;font-size:11px}
  .stepper .st .stlbl{font-size:8.5px}
  .stepper .st .stdate{display:none}         /* даты видно в «Приложенных документах» */
  .stepper .st::before{top:12px}
  /* Правая панель — не вложенный скролл, а обычная прокрутка страницы */
  #rightBody{max-height:none!important;overflow:visible!important;padding:12px 13px 16px!important}
  /* Двухколоночные поля складываем в столбик */
  .row2{grid-template-columns:1fr}
  /* Кнопки в шапке карточки заявки переносим */
  .rtitle{font-size:16px}
  input,select,textarea{font-size:16px;padding:11px 12px}   /* 16px — iOS не зумит при фокусе */
  .btn,.btn-p{padding:11px 14px;font-size:14px}
  .slabel{width:100%;flex:1 1 100%}
  .slot{flex-wrap:wrap}
  .upl,.addf{padding:9px 12px;font-size:13px}
  /* Таблицы списков — горизонтальный скролл вместо обрезки */
  table{font-size:12.5px}
  thead th,tbody td{padding:8px 9px}
  .wbform .wbrow{grid-template-columns:1fr}   /* Склад/Дата в столбик */
  .fullybar input{width:22px;height:22px}
}
@media(max-width:900px){#rightBody{max-height:none!important;overflow:visible!important}}
/* Списки заявок — горизонтальная прокрутка на узких экранах, без обрезки */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="/assets/logo-icon.png" alt="" onerror="this.style.display='none'"><span class="bn"><b>ЦУП</b> · ProLabSupport</span></div>
  <a class="back" href="/portal.html">← Все модули</a>
  <span class="sp"></span>
  <span class="who" id="who">—</span>
  <button class="btn" onclick="logout()">Выйти</button>
</div>
<div class="wrap">
  <div class="h1">Закупки</div>
  <div class="sub">Заявки менеджера склада синхронизируются со смарт-процессом «Закупки» в Bitrix.</div>
  <div id="root"><div class="spin"></div></div>
</div>
<script>
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const F=n=>Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,' ');
const fmtDate=iso=>{try{const d=new Date(iso);if(isNaN(d))return'';return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});}catch(e){return'';}};
const fmtDateTime=iso=>{try{const d=new Date(iso);if(isNaN(d))return'';return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}};
let META=null, ME=null, DEAL=null, LIST=[], COMPANY=null;
const SEL={proizvoditel:new Set(),pribor:new Set()};

/* ─────────────────────────────────────────────────────────────────────────
   Защита от двойного нажатия (во всём модуле).
   Раньше при клике на «Согласовать», «Далее», «Отправить» и т.п. не было
   видимой реакции: запрос уходил, но отрабатывал через секунду, и пользователь
   жал повторно — приходило по несколько согласований. Теперь:
     • при клике кнопка сразу переходит в состояние «занята» (спиннер, .is-busy);
     • повторные клики по ней блокируются, пока идёт запрос;
     • спиннер снимается, как только ответ получен (или карточка перерисовалась).
   Реализовано глобально, поэтому покрывает все кнопки .btn модуля без правок
   в каждом обработчике. ───────────────────────────────────────────────── */
function __setBtnBusy(btn,on){
  if(!btn) return;
  if(on){ btn.classList.add('is-busy'); btn.__busy=true; }
  else { btn.classList.remove('is-busy'); btn.__busy=false; if(btn.__safety){clearTimeout(btn.__safety);btn.__safety=null;} }
}
let __pendingBtn=null;
document.addEventListener('click',function(ev){
  const btn=ev.target && ev.target.closest ? ev.target.closest('.btn, button') : null;
  if(!btn || btn.disabled || btn.dataset.noGuard!=null) return;
  if(btn.__busy){                    // дубль-клик, пока идёт запрос — глушим
    ev.preventDefault(); ev.stopImmediatePropagation(); return;
  }
  __setBtnBusy(btn,true);
  __pendingBtn=btn;
  // Страховка: если запрос завис — снять «занятость» через 15 с.
  btn.__safety=setTimeout(()=>__setBtnBusy(btn,false),15000);
  // Если обработчик не сделал ни одного fetch (чисто UI-кнопка, отмена в prompt
  // и т.п.) — снимаем спиннер на следующем тике, чтобы не залипало.
  setTimeout(()=>{ if(__pendingBtn===btn){ __pendingBtn=null; __setBtnBusy(btn,false); } },400);
},true);
// Оборачиваем fetch: кнопку-инициатора освобождаем ровно тогда, когда её запрос
// завершился (успех или ошибка). Так спиннер живёт столько, сколько идёт запрос.
(function(){
  const orig=window.fetch.bind(window);
  window.fetch=function(){
    const owner=__pendingBtn; __pendingBtn=null;
    const p=orig.apply(null,arguments);
    if(owner){ const done=()=>__setBtnBusy(owner,false); p.then(done,done); }
    return p;
  };
})();

  // Прогресс готовности: завершёнными считаем закупки на успешной стадии (sem='ok').

async function closeShipment(did){
  const inp=document.getElementById('shipttn-'+did); const files=inp?Array.from(inp.files||[]):[];
  if(!files.length){alert('Приложите ТТН — без неё нельзя зафиксировать отгрузку.');return;}
  try{
    const ttn=[];
    for(const f of files){ if(f.size>25*1024*1024){alert('Файл '+f.name+' больше 25 МБ.');return;} ttn.push({filename:f.name,mime:f.type||'',base64:await fileToB64(f)}); }
    const r=await fetch('/api/procurement/deal/'+did+'/ship-close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ttn})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;}
    loadByDeal(did);
  }catch(e){alert('Ошибка: '+e.message);}
}
async function addShipTtn(did,itemId,input){
  const f=input.files&&input.files[0]; if(!f)return; input.disabled=true;
  try{
    if(f.size>25*1024*1024){alert('Файл больше 25 МБ.');return;}
    const base64=await fileToB64(f);
    const r=await fetch('/api/procurement/deal/'+did+'/ship-file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemId,filename:f.name,mime:f.type||'',base64})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;}
    loadByDeal(did);
  }catch(e){alert('Ошибка: '+e.message);} finally{input.disabled=false;}
}

async function moveStep(id,stageKey,reason){
  const r0=LIST.find(x=>x.id===id)||{}; const flow=META.flow||[];
  const curIdx=(r0.stepIndex!=null)?r0.stepIndex:-1;
  const targetIdx=flow.findIndex(s=>s.key===stageKey);
  // Откат назад (по цифре в таймлайне или из списка) — обязательно спросить причину.
  if(curIdx>=0 && targetIdx>=0 && targetIdx<curIdx && !reason){
    const why=prompt('Откат назад на «'+((flow[targetIdx]||{}).label||stageKey)+'».\nУкажите причину отката (обязательно):','');
    if(why===null) return;                       // нажали «Отмена» — не откатываем
    if(!String(why).trim()){ alert('Причина отката обязательна — откат не выполнен.'); return; }
    reason=String(why).trim();
  }
  // Админ может ПРОПУСКАТЬ этапы (перескок вперёд минуя проверки) — подтверждаем.
  if(ME&&ME.role==='admin' && curIdx>=0 && targetIdx>curIdx+1){
    if(!confirm('Пропустить промежуточные этапы и перейти сразу на «'+((flow[targetIdx]||{}).label||stageKey)+'»?\nПроверки документов будут пропущены (режим администратора).')) return;
  }
  try{
    const body={stageKey}; if(reason)body.reason=reason;
    const r=await fetch('/api/procurement/'+id+'/stage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){
      if(d.needReason){ // бэкенд-страховка: причина не дошла
        const why=prompt('Укажите причину отката (обязательно):','');
        if(why&&String(why).trim()){ return moveStep(id,stageKey,String(why).trim()); }
        return;
      }
      alert(d.error||'Ошибка смены стадии');
    }
    await reloadList();
  }catch(e){alert('Ошибка: '+e.message); await reloadList();}
}

  const poaBlock=d.poaRequired?filesSlotHtml(id,d,'poa',true):'';

}
function approvalHtml(id,d){
  const ap=d.approval||{};
  const YES=String(META.approve.yes), NO=String(META.approve.no||'1828');
  const apprs=ap.approvers||[];
  const myBid=(META.me&&META.me.bitrixUserId)||null;
  const mine = myBid ? apprs.find(a=>String(a.bid)===String(myBid)) : null;
  const amApprover = !!(mine && !mine.decided) && ap.requested && !ap.approved;
  const rejected = ap.status && String(ap.status)===NO && ap.decided;
  const approved = !!ap.approved;
  const pendingN = apprs.filter(a=>!a.decided).length;
  // Статус согласования
  let pill;
  if(approved) pill='<span class="pill pill-ok">✓ Согласовано</span>';
  else if(rejected) pill='<span class="pill pill-no">✕ Отклонено</span>';
  else if(ap.requested) pill=`<span class="pill pill-work">На согласовании${apprs.length>1?` · ${apprs.length-pendingN}/${apprs.length}`:''}</span>`;
  else pill='<span class="pill">Черновик</span>';

  // Список согласующих с их решениями (после отправки)
  const statusRow=a=>{
    const s=a.decided?(a.approved?'<span style="color:var(--good)">✓ согласовал</span>':'<span style="color:var(--bad)">✕ отклонил</span>'):'<span class="hint">ожидает</span>';
    return `<div class="pc-row" style="gap:8px;padding:5px 0"><div class="avatar av-brand" style="width:26px;height:26px;font-size:11px">${initials(a.name)}</div><div style="flex:1;min-width:0"><div class="pc-name" style="font-size:13px">${esc(a.name)}</div>${a.comment?`<div class="hint">💬 ${esc(a.comment)}</div>`:''}</div><div style="white-space:nowrap;font-size:12px;text-align:right">${s}${a.at?`<br><span class="hint">${fmtDateTime(a.at)}</span>`:''}</div></div>`;
  };
  const apprList = (ap.requested||approved||rejected)&&apprs.length ? `<div style="margin:4px 0 10px;border-top:1px solid var(--border2)">${apprs.map(statusRow).join('')}</div>` : '';

  // Блок инициатора: один или несколько согласующих (можно добавить ещё строки)
  const firstSel = (apprs[0]&&apprs[0].bid) || ap.approver || META.defaultApprover || '';
  const initiatorBlock=`
    <label class="fl">Согласующий(ие)</label>
    <div id="apprRows-${id}">${approverRowHtml(firstSel)}</div>
    <button class="btn" style="width:100%;justify-content:center;margin-bottom:6px" onclick="addApprover(${id})">＋ Ещё согласующий</button>
    <label class="fl">Комментарий согласующим</label>
    <textarea id="apnote-${id}" placeholder="необязательно — например, обоснование закупки" style="margin-bottom:8px">${esc(d.approval&&d.approval.requestNote||'')}</textarea>
    <div class="hint" style="margin-bottom:8px">Можно указать нескольких — закупка перейдёт к оплате только когда согласуют <b>все</b> указанные.</div>
    <button class="btn btn-p" style="width:100%;justify-content:center" onclick="sendApproval(${id})">📨 ${ap.requested?'Отправить повторно':'Отправить на согласование'}</button>`;
  // Блок согласующего: решение + комментарий (кнопки согласовать/отклонить)
  const approverBlock=`
    <div class="hint" style="margin-bottom:8px">Требуется ваше решение по этой закупке.${apprs.length>1?` Согласующих: ${apprs.length} — нужно решение <b>всех</b>.`:''}${d.approval&&d.approval.requestNote?`<br>💬 Инициатор: ${esc(d.approval.requestNote)}`:''}</div>
    <label class="fl">Комментарий</label><textarea id="apcm-${id}" placeholder="необязательно">${esc(mine&&mine.comment||'')}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" style="flex:1;justify-content:center;border-color:var(--good);color:var(--good)" onclick="decide(${id},'${YES}')">✓ Согласовать</button>
      <button class="btn" style="flex:1;justify-content:center;border-color:var(--bad);color:var(--bad)" onclick="decide(${id},'${NO}')">✕ Отклонить</button>
    </div>`;
  const waitingNote=`<div class="hint" style="margin-top:8px">Отправлено — ждём решения${pendingN>1?` (${pendingN})`:''}.</div>`;

  let body=apprList;
  if(approved) body+='';                                     // список уже показывает кто/когда
  else if(rejected) body+=initiatorBlock;                    // отклонено — можно переотправить
  else if(ap.requested && amApprover) body+=approverBlock;   // я согласующий и ещё не решил
  else if(ap.requested) body+=waitingNote;                   // отправлено — ждём (или я уже решил)
  else body=initiatorBlock;                                  // ещё не отправлено

  const hdrName = apprs.length ? (apprs.length===1 ? apprs[0].name : `${apprs.length} согласующих`) : 'Согласование';
  return `<div class="proccard">
    <div class="pc-row"><div class="avatar av-brand">${initials(apprs.length===1?apprs[0].name:'✓')}</div><div style="flex:1;min-width:0"><div class="pc-name">${esc(hdrName)}</div><div class="hint">Согласование закупки</div></div>${pill}</div>

// Показываем на текущем шаге только то, что нужно для перехода на СЛЕДУЮЩИЙ шаг.
function renderDetail(id,d){
  const r=LIST.find(x=>x.id===id)||{};
  const flow=META.flow||[];
  const ci=(r.stepIndex!=null)?r.stepIndex:-1;
  // Даты входа в каждый шаг (из истории стадий); для «Новой заявки» — дата создания.

  const ds=document.getElementById('docsSummary'); if(ds)ds.innerHTML=(summ?`<div class="deth">Приложенные документы</div>${summ}`:'')+rbBlock;
  const db=document.getElementById('dopyBox');
  if(db){ if(d.dopy){ const fl=(d.dopy.files||[]).map(f=>`<div class="slot"><div class="slabel">Файл</div><div class="sval" title="${esc(f.name||'')}"><a class="lnk" href="${esc(f.url||'#')}" target="_blank">${esc(f.name||'файл')}</a></div></div>`).join(''); db.innerHTML=(fl||'<div class="hint">файлы не найдены</div>')+(d.dopy.serviceUrl?`<div style="margin-top:6px"><a class="lnk" href="${esc(d.dopy.serviceUrl)}" target="_blank">Открыть подбор ↗</a></div>`:''); } else db.innerHTML='<div class="hint">нет данных</div>'; }

  const curKey=(ci>=0&&ci<flow.length)?flow[ci].key:null;
  let hdr='Дальнейшее действие', html='';
  if(curKey==='new'){ hdr='Заявка создана'; html='<div class="hint">Запроси счёт и двигай на «Запрос счёта на оплату».</div>'; }
  else if(curKey==='invoice'){
    hdr='Запрос счёта на оплату';
    const rr=LIST.find(x=>x.id===id)||{};
    const curSum=(rr.opportunity!=null?rr.opportunity:'');
    const curCur=(rr.currency||'KZT');
    const curOptsInv=(META.currencies||[{id:'KZT'}]).map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(curCur)?'selected':''}>${esc(c.id)}</option>`).join('');
    const amountBlock=`<div style="margin-bottom:12px;padding:12px;border:1px solid var(--border2);border-radius:12px;background:var(--bg)">
      <label class="fl">Сумма закупки <span class="req">*</span></label>
      <div class="row2">
        <input id="inv-amt-${id}" type="number" min="0" step="any" inputmode="decimal" placeholder="0" value="${esc(curSum)}">
        <select id="inv-cur-${id}">${curOptsInv}</select>
      </div>
      <span class="msg" id="inv-amt-msg-${id}"></span>
      <div class="hint" style="margin-top:6px">Впиши сумму по счёту — она сохранится сама, когда приложишь счёт (Invoice), и заявка уйдёт на «Договор».</div>
    </div>`;
    const poaAccs=META.poaAccountants||[];
    const poaBlock=`<div style="margin-bottom:12px;padding:12px;border:1px solid var(--border2);border-radius:12px;background:var(--bg)">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600">
        <input type="checkbox" id="poa-chk-${id}" ${d.poaRequired?'checked':''} onchange="onPoaToggle(${id})"> Требуется доверенность
      </label>
      <div id="poa-acc-${id}" style="margin-top:8px;${d.poaRequired?'':'display:none'}">
        <label class="fl">Бухгалтер (готовит доверенность)</label>
        <select id="poa-acc-sel-${id}">${poaAccs.map(a=>`<option value="${a.bid}" ${String(a.bid)===String(d.poaAccountantBid||'')?'selected':''}>${esc(a.name)}</option>`).join('')||'<option value="">— не найдены —</option>'}</select>
      </div>
      <button class="btn" style="margin-top:8px;width:100%;justify-content:center" onclick="savePoa(${id})">💾 Сохранить</button>
      <span class="msg" id="poa-msg-${id}"></span>
      <div class="hint" style="margin-top:6px">Если доверенность нужна — отметь и выбери бухгалтера. На этапе оплаты закупка уйдёт и главбуху, и выбранному бухгалтеру; дальше — только после обоих документов (платёжка + доверенность).</div>

    hdr='Оплата закупки';
    const hasPay=((d.files&&d.files.pay)||[]).length>0;

  else { hdr='Готово'; html='<div class="hint" style="color:var(--good)">Процесс завершён.</div>'; }
  // engineer/sales: согласование (если на «Согласовании») + документы (просмотр,
  // скачивание и загрузка файлов). Стадии он не двигает, но файлы фиксируются.
  if(!canEditProc()){
    const role=ME&&ME.role;
    const meBid=String((META.me&&META.me.bitrixUserId)||'');
    let body='';
    if(curKey==='approve'){ body+=approvalHtml(id,d)+'<div style="margin-top:16px"></div>'; hdr='Согласование закупки'; }
    else hdr='Документы закупки';
    if(role==='accountant'){
      // Бухгалтер грузит ТОЛЬКО то, что относится к нему: подтверждение оплаты

        body+=payCommentBlock(id);

        const hasPoa=((d.files&&d.files.poa)||[]).length>0;

        }
      }
    } else {
      // engineer/sales: полный набор документов (просмотр + загрузка).
      body+='<div class="deth">Документы (просмотр и загрузка)</div>';
      ['invoice','pay','poa','contract','warranty'].forEach(sl=>{ body+=`<div class="fl" style="margin-top:10px">${DOC_LABELS[sl]}</div>`+filesSlotHtml(id,d,sl); });
    }
    html=body;
  }
  const hEl=document.getElementById('actionHdr'); if(hEl)hEl.textContent=hdr;
  const aEl=document.getElementById('stepAction'); if(aEl)aEl.innerHTML=html;
}
function fileToB64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file);});}
// Добавить файл в слот (множественно). meta — {warehouse,acceptDate,comment} для накладной.
async function postFile(id,slot,file,meta){
  if(file.size>25*1024*1024){alert('Файл больше 25 МБ — слишком большой.');return null;}
  const base64=await fileToB64(file);
  const body=Object.assign({slot,filename:file.name,base64,mime:file.type||''},meta||{});
  const r=await fetch('/api/procurement/'+id+'/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка загрузки'); return null;}
  return d;
}
// Простые слоты (счёт/оплата/доверенность/гарантийный). Авто-переход: первый счёт
// → «Договор», первое подтверждение оплаты → «Ожидание товара». Остальное — без перехода.
async function addSimpleFile(id,slot,input){
  const files=input.files?Array.from(input.files):[]; if(!files.length)return;
  // Счёт нельзя приложить без суммы закупки — просим указать её (только у тех, кто
  // ведёт процесс; engineer/sales просто прикладывает файл без смены стадии).
  if(slot==='invoice' && canEditProc()){
    const rr=LIST.find(x=>x.id===id)||{};
    const amtEl=document.getElementById('inv-amt-'+id);
    const typed=amtEl?Number(amtEl.value):NaN;
    // Сумму сохраняем автоматически при приложении счёта (переход на след. этап).
    if(typed>0){ if(!(await saveAmount(id,true))){ input.value=''; return; } }
    else if(!(rr.opportunity>0)){ alert('Сначала укажите сумму закупки.'); if(amtEl) amtEl.focus(); input.value=''; return; }
  }
  input.disabled=true;
  try{
    const payload=[];
    for(const f of files){ if(f.size>25*1024*1024){alert('Файл «'+f.name+'» больше 25 МБ — пропущен.');continue;} payload.push({filename:f.name,mime:f.type||'',base64:await fileToB64(f)}); }
    if(!payload.length){loadDetail(id);return;}
    const r=await fetch('/api/procurement/'+id+'/files-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot,files:payload})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка загрузки'); loadDetail(id); return;}
    const r0=LIST.find(x=>x.id===id)||{}; const flow=META.flow||[]; const ci=(r0.stepIndex!=null)?r0.stepIndex:-1;
    const curKey=(ci>=0&&ci<flow.length)?flow[ci].key:null;
    // Автопереходы стадий — только у тех, кто ведёт процесс. engineer/sales просто
    // прикладывает файл (он фиксируется), стадию не двигает.
    if(!canEditProc()){ loadDetail(id); }
    else if(d.first&&curKey==='invoice'&&slot==='invoice'){ await moveStep(id,'contract'); }
    else if(curKey==='payment'&&(slot==='pay'||slot==='poa')){
      const det=await (await fetch('/api/procurement/'+id+'/detail')).json();
      const f=det.files||{}; const hasPay=(f.pay||[]).length>0, hasPoa=(f.poa||[]).length>0;
      if(det.poaRequired){ if(hasPay&&hasPoa) await moveStep(id,'waiting'); else loadDetail(id); }
      else { if(hasPay) await moveStep(id,'waiting'); else loadDetail(id); }
    }
    else { loadDetail(id); }
  }catch(e){alert('Ошибка: '+e.message); loadDetail(id);}
  finally{input.disabled=false;}
}
// Накладная с полями Склад / Дата / Наименование.
async function addWaybill(id){
  const fi=document.getElementById('wb-file-'+id); const file=fi&&fi.files&&fi.files[0];
  if(!file){alert('Выберите файл накладной');return;}
  const meta={ warehouse:(document.getElementById('wb-wh-'+id)||{}).value||'', acceptDate:(document.getElementById('wb-dt-'+id)||{}).value||'', comment:(document.getElementById('wb-cm-'+id)||{}).value||'' };
  try{ const d=await postFile(id,'contract',file,meta); if(d) loadDetail(id); }
  catch(e){alert('Ошибка: '+e.message);}
}
// «Доверенность не требуется» → сразу переходим на «Ожидание товара».
async function skipPoa(id){ await moveStep(id,'waiting'); }
async function delFile(id,fileId){
  if(!confirm('Удалить этот файл?'))return;
  try{ const r=await fetch('/api/procurement/'+id+'/files/'+fileId,{method:'DELETE'}); const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;} loadDetail(id); }
  catch(e){alert('Ошибка: '+e.message);}
}
// «Полностью принят»: если ещё не на «Товар принят» — сначала переводим туда
// (нужны накладная + гарантийный), затем ставим отметку и красим шаг зелёным.
async function toggleFully(id,checked){
  try{
    if(checked){
      const r0=LIST.find(x=>x.id===id)||{};
      if(r0.stepKey!=='received'){
        await moveStep(id,'received');   // gate: накладная+гарантийный (иначе покажет причину)
        const cur=LIST.find(x=>x.id===id);
        if(!cur||cur.stepKey!=='received'){ loadDetail(id); return; } // не перешли — не ставим отметку
      }
    }
    const r=await fetch('/api/procurement/'+id+'/fully-received',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:checked})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;}
    await reloadList(); // обновит цвет змейки; затем detail подтянется
  }catch(e){alert('Ошибка: '+e.message);}
}
// Одна строка выбора согласующего (для формы «отправить на согласование»).
function approverRowHtml(sel){
  const opts=(META.employees||[]).map(e=>`<option value="${e.id}" ${String(e.id)===String(sel||'')?'selected':''}>${esc(e.name)}</option>`).join('');
  return `<div class="apprRow" style="display:flex;gap:6px;margin-bottom:6px"><select class="apprSel" style="flex:1">${opts}</select><button class="btn" title="Убрать" onclick="rmApprover(this)" style="padding:6px 11px">×</button></div>`;
}
function addApprover(id){
  const box=document.getElementById('apprRows-'+id); if(!box)return;
  box.insertAdjacentHTML('beforeend',approverRowHtml(''));
}
function rmApprover(btn){
  const row=btn.closest('.apprRow'); const box=row&&row.parentNode;
  if(box&&box.querySelectorAll('.apprRow').length>1) row.remove();
}
async function sendApproval(id){
  const box=document.getElementById('apprRows-'+id);
  const sels=box?[...box.querySelectorAll('.apprSel')]:[];
  const ids=[...new Set(sels.map(s=>s.value).filter(Boolean))];
  if(!ids.length){alert('Выберите хотя бы одного согласующего');return;}
  if(ids.length>1 && !confirm('Отправить на согласование '+ids.length+' согласующим?\nЗакупка перейдёт к оплате только когда согласуют ВСЕ указанные.'))return;
  const noteEl=document.getElementById('apnote-'+id); const note=noteEl?noteEl.value.trim():'';
  try{
    const r=await fetch('/api/procurement/'+id+'/request-approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approverIds:ids,note})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;}
    await reloadList(); // покажет статус «На согласовании»
  }catch(e){alert('Ошибка: '+e.message);}
}
// Решение согласующего: согласовать/отклонить. При согласовании — авто-переход
// на «Оплата закупки» (тогда подсветка змейки встаёт на этот шаг, а не отстаёт).
async function decide(id,status){
  const cm=document.getElementById('apcm-'+id); const comment=cm?cm.value:'';
  try{
    const r=await fetch('/api/procurement/'+id+'/approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,approverId:(META.me&&META.me.bitrixUserId)||null,comment})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;}
    // На «Оплату» закупку двигает СЕРВЕР сам, когда согласовали все — здесь просто
    // обновляем список/карточку (работает и для engineer/sales без прав на стадии).
    if(d.pending) alert('Ваше решение учтено. Ждём остальных согласующих ('+(d.remaining||0)+').');
    await reloadList();
  }catch(e){alert('Ошибка: '+e.message);}
}
// Доверенность (2 этап): показать/скрыть выбор бухгалтера + сохранить настройку.
function onPoaToggle(id){
  const chk=document.getElementById('poa-chk-'+id), box=document.getElementById('poa-acc-'+id);
  if(box) box.style.display=(chk&&chk.checked)?'block':'none';
}
// Комментарий бухгалтера на этапе оплаты (виден в списке заявок и в поиске).
function payCommentBlock(id){
  const pl=(LIST.find(x=>x.id===id)||{}).payload||{};
  const val=pl.payComment||'';
  return `<div style="margin-top:14px;padding:12px;border:1px solid var(--border2);border-radius:12px;background:var(--bg)">
      <label class="fl">Комментарий (бухгалтер)</label>
      <textarea id="paycm-${id}" placeholder="напр.: оплачено с р/с 01.09, платёжка №123 — по этому тексту можно искать в списке">${esc(val)}</textarea>
      <div class="msg" id="paycm-msg-${id}"></div>
      <button class="btn btn-p" style="margin-top:8px" onclick="savePayComment(${id})">Сохранить комментарий</button>
    </div>`;
}
async function savePayComment(id){
  const el=document.getElementById('paycm-'+id), msg=document.getElementById('paycm-msg-'+id);
  const comment=el?el.value:'';
  try{
    const r=await fetch('/api/procurement/'+id+'/pay-comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment})});
    const d=await r.json(); if(!r.ok){ if(msg){msg.className='msg err';msg.textContent=d.error||'Ошибка';} return; }
    const rr=LIST.find(x=>x.id===id); if(rr){ rr.payload=rr.payload||{}; rr.payload.payComment=d.payComment; }
    if(msg){msg.className='msg ok';msg.textContent='Комментарий сохранён';}
  }catch(e){ if(msg){msg.className='msg err';msg.textContent='Ошибка сети';} }
}
async function savePoa(id){
  const chk=document.getElementById('poa-chk-'+id), sel=document.getElementById('poa-acc-sel-'+id);
  const msg=document.getElementById('poa-msg-'+id);
  const required=!!(chk&&chk.checked);
  const accountantBid=(required&&sel)?sel.value:null;
  if(required&&!accountantBid){ if(msg){msg.className='msg err';msg.textContent='Выберите бухгалтера';} return; }
  try{
    const r=await fetch('/api/procurement/'+id+'/poa-setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({required,accountantBid})});
    const d=await r.json(); if(!r.ok){ if(msg){msg.className='msg err';msg.textContent=d.error||'Ошибка';} return; }
    if(msg){msg.className='msg ok';msg.textContent=required?'Доверенность включена':'Доверенность не требуется';}
  }catch(e){ if(msg){msg.className='msg err';msg.textContent='Ошибка сети';} }
}
// Сохранить сумму закупки (2 этап). silent=true — без alert (вызов из addSimpleFile).
async function saveAmount(id, silent){
  const amtEl=document.getElementById('inv-amt-'+id), curEl=document.getElementById('inv-cur-'+id);
  const msg=document.getElementById('inv-amt-msg-'+id);
  const opp=amtEl?Number(amtEl.value):NaN;
  if(!(opp>0)){ if(msg){msg.className='msg err';msg.textContent='Укажите сумму > 0';} if(!silent)alert('Укажите сумму закупки больше 0.'); return false; }
  try{
    const r=await fetch('/api/procurement/'+id+'/amount',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({opportunity:opp,currency:(curEl&&curEl.value)||'KZT'})});
    const d=await r.json(); if(!r.ok){ if(msg){msg.className='msg err';msg.textContent=d.error||'Ошибка';} if(!silent)alert(d.error||'Ошибка'); return false; }
    const rr=LIST.find(x=>x.id===id); if(rr){ rr.opportunity=opp; rr.currency=(curEl&&curEl.value)||'KZT'; }
    if(msg){msg.className='msg ok';msg.textContent='Сумма сохранена';}
    return true;
  }catch(e){ if(!silent)alert('Ошибка: '+e.message); return false; }
}
async function saveAccountant(id){
  const bid=document.getElementById('acctSel').value;
  if(!bid){alert('Выберите бухгалтера');return;}
  try{
    const r=await fetch('/api/procurement/'+id+'/accountant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accountantBid:bid})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка');return;}
    alert('Бухгалтер назначен и уведомлён.');
  }catch(e){alert('Ошибка: '+e.message);}
}
async function deleteReq(id){
  const reason=prompt('Удаление закупки необратимо (удалит и элемент в «Закупках» Битрикса).\n\nУкажите причину удаления:');
  if(reason===null)return;                       // отмена
  if(!String(reason).trim()){ alert('Нужно указать причину удаления.'); return; }
  try{
    const r=await fetch('/api/procurement/'+id,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:String(reason).trim()})});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка удаления');return;}
    backToCreate(); await reloadList();
  }catch(e){alert('Ошибка: '+e.message);}
}
function toggleEditFields(id){
  const box=document.getElementById('editFields-'+id); if(!box)return;
  box.style.display=box.style.display==='none'?'block':'none';
}
async function saveEdit(id){
  const val=i=>{const el=document.getElementById(i);return el?el.value.trim():'';};
  const payload={ title:val('e-title'), source:val('e-source'), assigned:val('e-assigned'), vidZakupki:val('e-vid') };
  const oppV=val('e-opp'); if(oppV!=='') payload.opportunity=Number(oppV);
  const curV=val('e-cur'); if(curV) payload.currency=curV;
  try{
    const r=await fetch('/api/procurement/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json(); if(!r.ok){alert(d.error||'Ошибка сохранения');return;}
    await reloadList();
  }catch(e){alert('Ошибка: '+e.message);}
}

// ── Поиск сделки ────────────────────────────────────────────────────────────
let dealTimer=null;
function onDealInput(v){
  clearTimeout(dealTimer);
  const box=document.getElementById('dealres');
  if(!v||v.trim().length<2){box.style.display='none';return;}
  dealTimer=setTimeout(async()=>{
    try{
      const r=await fetch('/api/procurement/deals?q='+encodeURIComponent(v.trim()));
      const d=await r.json(); const items=d.items||[];
      box.innerHTML=items.length?items.map(it=>`<div onclick='pickDeal(${JSON.stringify(it).replace(/'/g,"&#39;")})'><span class="did">#${it.id}</span> ${esc(it.title)}</div>`).join(''):'<div class="hint" style="padding:9px 12px">Ничего не найдено</div>';
      box.style.display='block';
    }catch(e){box.style.display='none';}
  },300);
}
function pickDeal(it){
  DEAL=it; document.getElementById('dealres').style.display='none'; document.getElementById('dealq').value='';
  document.getElementById('dealchip').innerHTML=`<span class="chip">#${it.id} · ${esc(it.title)} <span class="x" onclick="clearDeal()">✕</span></span>`;
  const t=document.getElementById('title'); if(!t.value)t.value='Доп оборудование — '+it.title;
  if(it.currency){const c=document.getElementById('currency'); if(c)c.value=it.currency;}
}
function clearDeal(){ DEAL=null; document.getElementById('dealchip').innerHTML=''; }
document.addEventListener('click',e=>{ if(!e.target.closest('.dealbox')){['dealres','compres'].forEach(id=>{const b=document.getElementById(id); if(b)b.style.display='none';});} });

// ── Компания + БИН ──────────────────────────────────────────────────────────
let compTimer=null, binTimer=null;
function onCompanyInput(v){
  clearTimeout(compTimer); const box=document.getElementById('compres');
  if(!v||v.trim().length<2){box.style.display='none';return;}
  compTimer=setTimeout(async()=>{
    try{ const d=await (await fetch('/api/procurement/companies?q='+encodeURIComponent(v.trim()))).json(); const items=d.items||[];
      box.innerHTML=items.length?items.map(it=>`<div onclick='pickCompany(${JSON.stringify(it).replace(/'/g,"&#39;")})'><span class="did">#${it.id}</span> ${esc(it.title)}${it.bin?` · ${esc(it.bin)}`:''}</div>`).join(''):'<div class="hint" style="padding:9px 12px">Ничего не найдено</div>';
      box.style.display='block';
    }catch(e){box.style.display='none';}
  },300);
}
function pickCompany(it){
  COMPANY={id:it.id||null,title:it.title,bin:it.bin||null};
  const box=document.getElementById('compres'); if(box)box.style.display='none';
  const q=document.getElementById('compq'); if(q)q.value='';
  document.getElementById('compchip').innerHTML=`<span class="chip">${it.id?('#'+it.id+' · '):''}${esc(it.title)} <span class="x" onclick="clearCompany()">✕</span></span>`;
  if(it.bin){ const b=document.getElementById('bin'); if(b&&!b.value)b.value=it.bin; }
}
function clearCompany(){ COMPANY=null; document.getElementById('compchip').innerHTML=''; }
function onBinInput(v){
  const digits=String(v||'').replace(/\D/g,''); const st=document.getElementById('binStatus');
  clearTimeout(binTimer);
  if(digits.length!==12){ if(st){st.textContent=digits.length?('Введите 12 цифр ('+digits.length+'/12)'):''; st.style.color='var(--text-4)';} return; }
  if(st){ st.textContent='Ищем в ГБД ЮЛ…'; st.style.color='var(--text-4)'; }
  binTimer=setTimeout(async()=>{
    try{ const d=await (await fetch('/api/procurement/bin?bin='+digits)).json();
      if(d&&d.found&&d.name){
        if(d.bitrixCompanyId){ pickCompany({id:d.bitrixCompanyId,title:d.name,bin:digits}); if(st){st.innerHTML='✓ '+esc(d.name)+' · есть в CRM'; st.style.color='var(--good)';} }
        else { COMPANY={id:null,title:d.name,bin:digits}; document.getElementById('compchip').innerHTML=`<span class="chip">${esc(d.name)} <span class="x" onclick="clearCompany()">✕</span></span>`; if(st){st.innerHTML='✓ '+esc(d.name)+' · сохраним БИН и название'; st.style.color='var(--good)';} }
      } else { if(st){ st.innerHTML='Компания по этому БИН не найдена'+(d&&d.debug?` <span style="color:var(--text-4)">(${esc(d.debug)})</span>`:''); st.style.color='var(--warn)'; } }
    }catch(e){ if(st){ st.textContent='Ошибка поиска по БИН'; st.style.color='var(--bad)'; } }
  },400);
}

// ── Создание ────────────────────────────────────────────────────────────────
async function submitReq(){
  const msg=document.getElementById('msg'); msg.className='msg';
  const vid=document.getElementById('vidZakupki').value;
  if(META.required.vidZakupki && !vid){ msg.className='msg err'; msg.textContent='Заполните обязательное поле «Вид закупки».'; return; }
  const val=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  // Сумма закупки больше не спрашивается на 1 этапе — её укажут при запросе счёта.
  const payload={
    dealId:DEAL?DEAL.id:null,
    companyId:(COMPANY&&COMPANY.id)||null, companyName:(COMPANY&&COMPANY.title)||'', bin:(val('bin').replace(/\D/g,''))||'',
    title:val('title'), source:val('source'), assigned:val('assigned'),
    vidZakupki:vid,
  };
  const btn=document.getElementById('createBtn'); btn.disabled=true; btn.textContent='Создаю…';
  try{
    const r=await fetch('/api/procurement/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();
    if(r.ok){
      // Приложить «Файл закупки» (множественно) к только что созданной заявке.
      const fi=document.getElementById('createFiles');
      if(fi&&fi.files&&fi.files.length&&d.localId){
        btn.textContent='Загружаю файлы…';
        const files=[];
        for(const f of fi.files){ if(f.size>25*1024*1024){alert('Файл «'+f.name+'» больше 25 МБ — пропущен.');continue;} files.push({filename:f.name,mime:f.type||'',base64:await fileToB64(f)}); }
        if(files.length){ try{ await fetch('/api/procurement/'+d.localId+'/files-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot:'purchase',files})}); }catch(_){} }
      }
      msg.className='msg ok'; msg.innerHTML='Заявка создана в «Закупках» — <a class="lnk" href="'+esc(d.itemUrl)+'" target="_blank">#'+d.bitrixItemId+' ↗</a>';
      const l=await fetch('/api/procurement/list'); LIST=(await l.json()).items||[];
      // сбросить выбор и перерисовать список, сохранив сообщение
      SEL.proizvoditel.clear(); SEL.pribor.clear(); DEAL=null; COMPANY=null;
      const saved=msg.outerHTML; render(); document.getElementById('msg').outerHTML=saved;
    }else{ msg.className='msg err'; msg.textContent=d.error||'Ошибка создания'; }
  }catch(e){ msg.className='msg err'; msg.textContent='Ошибка: '+e.message; }
  finally{ btn.disabled=false; btn.textContent='Создать заявку'; }
}
