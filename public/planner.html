async function saveEv(){
  const resource=document.getElementById('fRes')?.value; if(!resource) return;
  const title=document.getElementById('fTitle')?.value||'';
  let start=document.getElementById('fS')?.value; if(!start) return;
  let end=document.getElementById('fE')?.value||start;
  // Enforce working hours 09:00-18:00
  function clampWorkHours(dtStr) {
    const d=new Date(dtStr); if(isNaN(d)) return dtStr;
    if(d.getHours()<9){d.setHours(9,0,0,0);}
    if(d.getHours()>=18){d.setHours(18,0,0,0);}
    return fmtDTL(d);
  }
  start=clampWorkHours(start); end=clampWorkHours(end);
  const allDay=document.getElementById('fAD')?.checked||false;
  const confirmed=document.getElementById('fConfirm')?.checked||false;
  const note=document.getElementById('fNote')?.value||'';
  const fields={};
  const svcInstrVisible = document.getElementById('svcInstrBlock')?.style.display !== 'none';
  dataFields.forEach(df=>{
    if((df.id==='df3'||df.id==='df4') && !svcInstrVisible) return; // not applicable for this employee's department
    const el=document.getElementById('f_'+df.id); if(el) fields[df.id]=df.type==='check'?el.checked:el.value;
  });
  // Модуль Отпуска: собираем тип отпуска, согласующего и кол-во дней в fields.
  if(curType==='leave'){
    const lt=document.getElementById('fLeaveType'); if(lt&&lt.value) fields.leaveType=lt.value;
    const ls=document.getElementById('fLeaveSup'); if(ls&&ls.value) fields.supervisorBid=ls.value;
    const dd=document.getElementById('fLeaveDays'); if(dd&&dd.value) fields.leaveDays=dd.value;
  }
  // Модуль Встречи: локация и комментарий встречи.
  if(curType==='meeting'){
    const ml=document.getElementById('fMeetLoc'); if(ml&&ml.value) fields.meetLoc=ml.value;
    const mc=document.getElementById('fMeetComment'); if(mc&&mc.value) fields.meetComment=mc.value;
  }
  const clients=[]; let i=0;
  while(document.getElementById('cl_n_'+i)){
    clients.push({name:document.getElementById('cl_n_'+i).value,type:document.getElementById('cl_t_'+i)?.value||''}); i++;
  }
  // Co-assignees: other engineers to receive the exact same job
  const extraRes=[...new Set(
    Array.from(document.querySelectorAll('#coAssignList .co-assign-sel'))
      .map(s=>s.value).filter(v=>v && v!==resource)
  )];
  const payload={resource,title,type:curType,start,end,allDay,confirmed,note,fields,clients,coAssignees:extraRes};

  try{
    let updated;
    if(editId){
      updated = await apiUpdateEvent(editId, payload);
    } else {
      updated = await apiCreateEvent(payload);
    }
    // Merge the server's authoritative copy of this group into local state
    const groupId = updated[0]?.groupId;
    events = events.filter(e=>e.groupId!==groupId && (!editId || e.id!==editId));
    events.push(...updated);
  } catch(e){
    alert('Не удалось сохранить событие. Попробуйте ещё раз.');
    return;
  }
  closePanel(); buildStickyRows(); renderEvents();
}
async function deleteEv(){
  if(!editId) return;
  const ev = events.find(e=>e.id===editId);
  if(!canDeleteEv(ev)) return; // поэлементный гейт (бэкенд тоже проверяет)
  if (ev?.bitrixItemId) {
    const ok = confirm('Это событие связано с заявкой в Bitrix. Пока там стоит инженер и даты — оно появится здесь снова само (в течение 10 минут или раньше). Чтобы убрать насовсем, измените заявку в Bitrix. Всё равно удалить сейчас?');
    if (!ok) return;
  }
  try{ await apiDeleteEvent(editId); }
  catch(e){ alert('Не удалось удалить событие.'); return; }
  events=events.filter(e=>e.id!==editId);
  closePanel(); buildStickyRows(); renderEvents();
}

  putConfig('depts', adminDepts);
  putConfig('palette', paletteColors);
  // Rebuild ALL_RES from adminDepts
  ALL_RES.length = 0;
  const _s = new Set();
  for (const dept of adminDepts) {
    for (const m of dept.members) {
      if (!_s.has(m.name)) { _s.add(m.name); ALL_RES.push({name:m.name, dept:dept.name}); }
    }
  }
  applyFilters();
  // Update ET colors from palette
  for (const [k,v] of Object.entries(paletteColors)) {
    if (ET[k]) { ET[k].bg = v.color; ET[k].bd = v.color; }

// ── DnD handlers ───────────────────────────────────────────────
function onStaffDragStart(e, staffId, deptId) {
  dndStaffId = staffId; dndFromDeptId = deptId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', staffId);
  requestAnimationFrame(() => {
    const el = document.getElementById('sr-'+staffId);
    if (el) el.classList.add('dragging-staff');
  });
}
function onStaffDragEnd() {
  dndStaffId = null; dndFromDeptId = null;
  document.querySelectorAll('.dragging-staff,.drag-over,.drag-over-dept')
    .forEach(el => el.classList.remove('dragging-staff','drag-over','drag-over-dept'));
}
function onDeptDragOver(e, deptId) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.drag-over-dept').forEach(c => c.classList.remove('drag-over-dept'));
  const card = document.getElementById('dc-'+deptId);
  const draggingSomethingElse = dndDeptId ? deptId !== dndDeptId : deptId !== dndFromDeptId;
  if (card && draggingSomethingElse) card.classList.add('drag-over-dept');
}
function onDeptDragLeave(e, deptId) {
  const card = document.getElementById('dc-'+deptId);
  if (card && e.relatedTarget && !card.contains(e.relatedTarget)) {
    card.classList.remove('drag-over-dept');
  }
}
function onDeptDrop(e, toDeptId) {
  e.preventDefault(); e.stopPropagation();
  document.querySelectorAll('.drag-over-dept').forEach(c => c.classList.remove('drag-over-dept'));
  if (dndDeptId) {
    if (toDeptId !== dndDeptId) reorderDept(dndDeptId, toDeptId);
    dndDeptId = null;
    return;
  }
  if (!dndStaffId) return;
  if (toDeptId !== dndFromDeptId) moveStaffToDept(dndStaffId, dndFromDeptId, toDeptId);
  else { dndStaffId=null; dndFromDeptId=null; }
}
function onStaffDrop(e, targetId, deptId) {
  e.preventDefault(); e.stopPropagation();
  if (!dndStaffId) return;
  if (dndFromDeptId === deptId) {
    if (dndStaffId !== targetId) reorderStaff(deptId, dndStaffId, targetId);
  } else {
    moveStaffToDept(dndStaffId, dndFromDeptId, deptId, targetId);
  }
}

function moveStaffToDept(staffId, fromId, toId, beforeId=null) {
  const fromDept = adminDepts.find(d=>d.id===fromId);
  const toDept   = adminDepts.find(d=>d.id===toId);
  if (!fromDept||!toDept) return;
  const m = fromDept.members.find(x=>x.id===staffId); if(!m) return;
  fromDept.members = fromDept.members.filter(x=>x.id!==staffId);
  if (beforeId) {
    const idx = toDept.members.findIndex(x=>x.id===beforeId);
    toDept.members.splice(idx>=0?idx:toDept.members.length, 0, m);
  } else {
    toDept.members.push(m);
  }
  saveAdminState();
  renderDeptsTab(document.getElementById('admBody'));
}

function reorderStaff(deptId, staffId, beforeId) {
  const dept = adminDepts.find(d=>d.id===deptId); if(!dept) return;
  const m = dept.members.find(x=>x.id===staffId); if(!m) return;
  dept.members = dept.members.filter(x=>x.id!==staffId);
  const idx = dept.members.findIndex(x=>x.id===beforeId);
  dept.members.splice(idx>=0?idx:dept.members.length, 0, m);
  saveAdminState();
  renderDeptsTab(document.getElementById('admBody'));
}

  for(const dept of adminDepts) {

  saveAdminState();
}
function updPerm(staffId, perm, val) {
  for(const dept of adminDepts) {
    const m=dept.members.find(x=>x.id===staffId);
    if(m){m.perms[perm]=val;
      if(perm==='edit'&&val) m.perms.view=true;
      if(perm==='admin'&&val){m.perms.view=true;m.perms.edit=true;}
      break;}
  }
  saveAdminState();
}

function repPreset(p){
  const now=new Date();
  if (p==='thisMonth') { repFrom=todayISO(new Date(now.getFullYear(),now.getMonth(),1)); repTo=todayISO(new Date(now.getFullYear(),now.getMonth()+1,0)); }

  document.getElementById('repToInp').value=repTo;

// Build the {headers, rows} data for the currently selected report options
function repComputeData(){
  const from = new Date(repFrom+'T00:00:00');
  const to   = new Date(repTo+'T23:59:59');
  const dayMs = 86400000;
  const selRes = ALL_RES.filter(r=>repSelected.has(r.name));

  if (repType==='summary') {
    const headers = ['Сотрудник','Отдел','Командировка, дн.','Командировка подтв., дн.','Отпуск, дн.','Обучение, дн.','Итого дней','Загрузка, %'];
    const totalPeriodDays = Math.max(1, Math.round((to-from)/dayMs)+1);
    const rows = selRes.map(r=>{
      let trip=0, tripC=0, leave=0, train=0;
      events.forEach(ev=>{
        if (ev.resource!==r.name) return;
        const s=parseDT(ev.start), e=parseDT(ev.end);
        if (e<from || s>to) return;
        const days = Math.max(0, Math.round((Math.min(+e,+to)-Math.max(+s,+from))/dayMs))+1;
        if (ev.type==='trip') { if (ev.confirmed) tripC+=days; else trip+=days; }
        else if (ev.type==='leave'||ev.type==='dayoff') leave+=days;
        else if (ev.type==='train') train+=days;
        // Встречи (meeting) — рабочие события, в загрузку выездов/отсутствий не считаем.
      });
      const total = trip+tripC+leave+train;
      const load = Math.min(100, Math.round(total/totalPeriodDays*100));
      return [r.name, r.dept, trip, tripC, leave, train, total, load];
    });
    return {
      headers, rows,
      title:`Сводка по сотрудникам · ${fmtDate(from)} — ${fmtDate(to)}`,
      filenameBase:`svodka_${repFrom}_${repTo}`
    };
  }

  // Detailed event list
  const colDefs = [
    ['type','Тип'], ['confirmed','Подтв.'], ['dateStart','Начало'], ['dateEnd','Окончание'],
    ['days','Дней'], ['area','Область/Страна'], ['city','Город'], ['svc','Вид работ'],
    ['instrument','Оборудование'], ['clients','Клиенты'], ['note','Примечание'],
  ].filter(([id])=>repFields[id]);
  const headers = ['Сотрудник','Отдел', ...colDefs.map(c=>c[1])];
  const rows = [];
  selRes.forEach(r=>{
    events.filter(ev=>ev.resource===r.name).forEach(ev=>{
      const s=parseDT(ev.start), e=parseDT(ev.end);
      if (e<from || s>to) return;
      const days = Math.max(0, Math.round((Math.min(+e,+to)-Math.max(+s,+from))/dayMs))+1;
      const f = ev.fields||{};
      const cellFor = id => {
        if (id==='type') return ET[ev.type==='trip'&&ev.confirmed?'trip_confirm':ev.type]?.label || ev.type;
        if (id==='confirmed') return ev.type==='trip' ? (ev.confirmed?'Да':'Нет') : '';
        if (id==='dateStart') return fmtDate(s);
        if (id==='dateEnd') return fmtDate(e);
        if (id==='days') return days;
        if (id==='area') return f.df1||'';
        if (id==='city') return f.df2||'';
        if (id==='svc') return f.df3||'';
        if (id==='instrument') return f.df4||'';
        if (id==='clients') return (ev.clients||[]).map(c=>c.name).filter(Boolean).join(', ');
        if (id==='note') return ev.note||'';
        return '';
      };
      rows.push([r.name, r.dept, ...colDefs.map(c=>cellFor(c[0]))]);
    });
  });
  return {
    headers, rows,
    title:`Детальный отчёт по событиям · ${fmtDate(from)} — ${fmtDate(to)}`,
    filenameBase:`detal_${repFrom}_${repTo}`
  };
}

function repExportExcel(){
  if (!repFrom || !repTo) return;
  const {headers, rows, filenameBase} = repComputeData();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = headers.map((h,i)=>({wch: Math.max(10, h.length+2, ...rows.map(r=>String(r[i]??'').length))}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, repType==='summary'?'Сводка':'Детально');
  XLSX.writeFile(wb, filenameBase+'.xlsx');
}

async function loadPdfFonts(){
  if (_ptSansRegB64) return;
  const toB64 = buf => { let s=''; const by=new Uint8Array(buf); for (let i=0;i<by.length;i++) s+=String.fromCharCode(by[i]); return btoa(s); };
  const [rb, bb] = await Promise.all([
    fetch('/assets/fonts/PTSans-Regular.ttf').then(r=>r.arrayBuffer()),
    fetch('/assets/fonts/PTSans-Bold.ttf').then(r=>r.arrayBuffer()),
  ]);
  _ptSansRegB64 = toB64(rb);
  _ptSansBoldB64 = toB64(bb);
}
function registerPdfFonts(doc){
  doc.addFileToVFS('PTSans-Regular.ttf', _ptSansRegB64);
  doc.addFont('PTSans-Regular.ttf', 'PTSans', 'normal');
  doc.addFileToVFS('PTSans-Bold.ttf', _ptSansBoldB64);
  doc.addFont('PTSans-Bold.ttf', 'PTSans', 'bold');
}
async function repExportPDF(e){
  if (!repFrom || !repTo) return;
  const btn = e?.target;
  if (btn) { btn.disabled=true; btn.textContent='Готовим PDF…'; }
  try {
    await loadPdfFonts();
    const {headers, rows, title, filenameBase} = repComputeData();
    const { jsPDF } = window.jspdf;
    const landscape = headers.length > 6;
    const doc = new jsPDF({ orientation: landscape?'landscape':'portrait', unit:'pt', format:'a4' });
    registerPdfFonts(doc);
    doc.setFont('PTSans','bold'); doc.setFontSize(13);
    doc.text(title, 32, 32);
    doc.autoTable({
      head:[headers], body: rows, startY: 46,
      styles:{font:'PTSans', fontSize:8, cellPadding:4},
      headStyles:{font:'PTSans', fontStyle:'bold', fillColor:[197,59,47], textColor:255},
      alternateRowStyles:{fillColor:[248,247,246]},
      margin:{left:32,right:32},
    });
    doc.save(filenameBase+'.pdf');
  } finally {
    if (btn) { btn.disabled=false; btn.textContent='📄 Скачать PDF'; }
  }
}

<!-- ═══ Премиум-статистика по заявкам (зеркало 1058) ═══════════════════════ -->
<style>
#statOverlay{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s-other:#9aa3b3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #statOverlay{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s-other:#5a6473}}
:root[data-theme="dark"] #statOverlay{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s-other:#5a6473}
</style>
<div class="st-ov" id="statOverlay">
  <div class="st-top">
    <span class="ttl">Статистика</span>
    <span class="sub" id="statSub">Планировщик · заявки на сервис</span>
    <span class="sp"></span>
    <button class="st-prbtn" onclick="statExport()">📥 Excel</button>
    <button class="st-x" onclick="statClose()" title="Закрыть">✕</button>
  </div>
  <div class="st-scroll">
    <div class="st-canvas">
      <div class="st-filters" id="statFilters"></div>
      <div class="st-kpis" id="statKpis"></div>
      <div class="st-row">
        <div class="st-pan">
          <div class="ph">Структура по типам работ</div>
          <div class="st-donut-wrap"><div id="statDonut"></div><div class="st-legend" id="statLegend"></div></div>
        </div>
        <div class="st-pan">
          <div class="ph">Динамика работ по месяцам</div>
          <div class="st-bars" id="statBars"></div>
        </div>
      </div>
      <div class="st-tblwrap">
        <div class="st-tblhead"><span class="tt">Работы</span><span class="cnt" id="statCount">—</span></div>
        <div style="overflow-x:auto"><table class="st-tbl" id="statTbl"></table></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const S = { from:'', to:'', engineerId:'', typeId:'', trip:'any', completed:'any',
              preset:'year', types:[], engineers:[], rows:[], summary:{}, loaded:false };
  const PAL = ['var(--s1)','var(--s2)','var(--s3)','var(--s-other)'];
  const esc = s => String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const nf = n => (n==null?'':Number(n).toLocaleString('ru-RU'));
  const MON = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

  function presetRange(p){
    const now=new Date(), y=now.getFullYear(), m=now.getMonth();
    if(p==='month') return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
    if(p==='quarter'){ const qs=Math.floor(m/3)*3; return [iso(new Date(y,qs,1)), iso(new Date(y,qs+3,0))]; }
    if(p==='year') return [iso(new Date(y,0,1)), iso(new Date(y,11,31))];
    return ['','']; // all
  }

  window.statOpen = async function(){
    if(!S.from && !S.to){ const [f,t]=presetRange('year'); S.from=f; S.to=t; }
    document.getElementById('statOverlay').classList.add('open');
    document.body.style.overflow='hidden';
    renderFilters();
    if(!S.loaded){ await loadDicts(); S.loaded=true; renderFilters(); }
    statLoad();
  };
  window.statClose = function(){ document.getElementById('statOverlay').classList.remove('open'); document.body.style.overflow=''; };

  async function loadDicts(){
    try{ const r=await fetch('/api/planner/stats/service-types',{credentials:'include'}).then(r=>r.json()); S.types=(r&&r.types)||[]; }catch(e){ S.types=[]; }
    // Сотрудники — из первой (нескопированной) выборки по текущему периоду
    try{
      const r=await fetch('/api/planner/stats'+qs(true),{credentials:'include'}).then(r=>r.json());
      const seen=new Map(); (r.rows||[]).forEach(x=>{ if(x.engineer_id&&!seen.has(x.engineer_id)) seen.set(x.engineer_id,x.engineer_name||('#'+x.engineer_id)); });
      S.engineers=[...seen.entries()].map(([id,name])=>({id,name})).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    }catch(e){ S.engineers=[]; }
  }

  function qs(onlyPeriod){
    const p=[];
    if(S.from) p.push('from='+S.from);
    if(S.to) p.push('to='+S.to);
    if(!onlyPeriod){
      if(S.engineerId) p.push('engineers='+S.engineerId);
      if(S.typeId) p.push('types='+S.typeId);
      if(S.trip!=='any') p.push('trip='+S.trip);
      if(S.completed!=='any') p.push('completed='+S.completed);
    }
    return p.length?('?'+p.join('&')):'';
  }

  function renderFilters(){
    const engOpts = ['<option value="">Все сотрудники</option>'].concat(S.engineers.map(e=>`<option value="${e.id}" ${String(S.engineerId)===String(e.id)?'selected':''}>${esc(e.name)}</option>`)).join('');
    const typeOpts = ['<option value="">Все типы работ</option>'].concat(S.types.map(t=>`<option value="${t.id}" ${String(S.typeId)===String(t.id)?'selected':''}>${esc(t.label)}</option>`)).join('');
    const seg=(key,val,opts)=>`<div class="st-seg">${opts.map(o=>`<button class="${S[key]===o[0]?'on':''}" onclick="statSeg('${key}','${o[0]}')">${o[1]}</button>`).join('')}</div>`;
    const pr=(p,l)=>`<button class="st-prbtn ${S.preset===p?'on':''}" onclick="statPreset('${p}')" style="${S.preset===p?'border-color:var(--accent);color:var(--accent)':''}">${l}</button>`;
    document.getElementById('statFilters').innerHTML = `
      <div class="st-fg">${pr('month','Месяц')}${pr('quarter','Квартал')}${pr('year','Год')}${pr('all','Всё время')}</div>
      <div class="st-fg"><input type="date" class="st-date" value="${S.from}" onchange="statDate('from',this.value)"><span style="color:var(--text-3)">—</span><input type="date" class="st-date" value="${S.to}" onchange="statDate('to',this.value)"></div>
      <div class="st-fg"><select class="st-sel" onchange="statPick('engineerId',this.value)">${engOpts}</select></div>
      <div class="st-fg"><select class="st-sel" onchange="statPick('typeId',this.value)">${typeOpts}</select></div>
      <div class="st-fg"><span class="st-lbl">Командировка</span>${seg('trip','',[['any','Все'],['yes','С'],['no','Без']])}</div>
      <div class="st-fg"><span class="st-lbl">Статус</span>${seg('completed','',[['any','Все'],['yes','Завершён.'],['no','В работе']])}</div>`;
  }
  window.statSeg=(k,v)=>{ S[k]=v; renderFilters(); statLoad(); };
  window.statPick=(k,v)=>{ S[k]=v; statLoad(); };
  window.statDate=(k,v)=>{ S[k]=v; S.preset=''; renderFilters(); statLoad(); };
  window.statPreset=(p)=>{ S.preset=p; const [f,t]=presetRange(p); S.from=f; S.to=t; renderFilters(); statLoad(); };

  async function statLoad(){
    const kp=document.getElementById('statKpis'); kp.innerHTML='<div class="st-skel" style="grid-column:1/-1"></div>';
    try{
      const r=await fetch('/api/planner/stats'+qs(false),{credentials:'include'}).then(r=>r.json());
      S.rows=r.rows||[]; S.summary=r.summary||{};
      renderKpis(); renderDonut(); renderBars(); renderTable();
    }catch(e){ kp.innerHTML='<div class="st-empty" style="grid-column:1/-1">Не удалось загрузить статистику</div>'; }
  }

  function renderKpis(){
    const s=S.summary;
    const tiles=[
      {k:'Всего работ', v:nf(s.total), u:'заявок за период'},
      {k:'Завершено', v:nf(s.completed), u:'исполнено/закрыто', cls:'good'},
      {k:'В работе', v:nf(s.open), u:'не завершены'},
      {k:'С командировкой', v:nf(s.withTrip), u:`без командировки — ${nf(s.withoutTrip)}`, cls:'accent'},
      {k:'Человеко-дней', v:nf(s.totalDays), u:'суммарно по работам'},
    ];
    document.getElementById('statKpis').innerHTML = tiles.map(t=>`<div class="st-kpi ${t.cls||''}"><div class="k">${t.k}</div><div class="v">${t.v}</div><div class="u">${esc(t.u)}</div></div>`).join('');
  }

  function renderDonut(){
    const by=S.summary.byType||{};
    let arr=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    const total=arr.reduce((s,x)=>s+x[1],0);
    const top=arr.slice(0,3);
    const otherN=arr.slice(3).reduce((s,x)=>s+x[1],0);
    const segs=top.map((x,i)=>({label:x[0],n:x[1],c:PAL[i]}));
    if(otherN>0) segs.push({label:'Прочие',n:otherN,c:PAL[3]});
    const R=54,SW=20,C=2*Math.PI*R; let off=0;
    const circles=segs.map(sg=>{
      const len=total?C*sg.n/total:0; const el=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${sg.c}" stroke-width="${SW}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`; off+=len; return el;
    }).join('');
    document.getElementById('statDonut').innerHTML = total? `<svg width="140" height="140" viewBox="0 0 140 140">${circles}<text x="70" y="64" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)" style="font-variant-numeric:tabular-nums">${nf(total)}</text><text x="70" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text-3)" letter-spacing="1">РАБОТ</text></svg>` : '<div style="width:140px;height:140px"></div>';
    document.getElementById('statLegend').innerHTML = segs.length? segs.map(sg=>`<div class="lg"><i style="background:${sg.c}"></i><span class="t">${esc(sg.label)}</span><span class="n">${nf(sg.n)}</span></div>`).join('') : '<div style="color:var(--text-3);font-size:12.5px">Нет данных</div>';
  }

  function renderBars(){
    const byMon={};
    S.rows.forEach(r=>{ if(!r.start_date) return; const d=new Date(r.start_date); if(isNaN(d))return; const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; byMon[k]=(byMon[k]||0)+1; });
    let keys=Object.keys(byMon).sort();
    if(keys.length>12) keys=keys.slice(-12);
    const max=Math.max(1,...keys.map(k=>byMon[k]));
    const el=document.getElementById('statBars');
    if(!keys.length){ el.innerHTML='<div class="st-empty" style="width:100%">Нет данных за период</div>'; return; }
    el.innerHTML = keys.map(k=>{ const n=byMon[k]; const h=Math.max(4,Math.round(n/max*132)); const [y,m]=k.split('-'); return `<div class="st-bar" title="${MON[+m-1]} ${y}: ${n}"><div class="bv">${n}</div><div class="bb" style="height:${h}px"></div><div class="bl">${MON[+m-1]}${keys.length<=12&&m==='01'?' '+y.slice(2):''}</div></div>`; }).join('');
  }

  function renderTable(){
    const tbl=document.getElementById('statTbl');
    const rows=S.rows.slice(0,500);
    document.getElementById('statCount').textContent = `${nf(S.rows.length)}${S.rows.length>500?' · показаны первые 500':''}`;
    if(!S.rows.length){ tbl.innerHTML=''; document.querySelector('#statOverlay .st-tblwrap').insertAdjacentHTML('beforeend',''); tbl.innerHTML='<tbody><tr><td><div class="st-empty">За выбранный период работ нет</div></td></tr></tbody>'; return; }
    const head='<thead><tr><th>Сотрудник</th><th>Тип работ</th><th>Компания</th><th>Период</th><th class="r">Дней</th><th>Командиров.</th><th>Статус</th></tr></thead>';
    const fmtD=s=>{ if(!s)return'—'; const d=new Date(s); return isNaN(d)?'—':`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()).slice(2)}`; };
    const body=rows.map(r=>{
      let days=1; if(r.start_date&&r.end_date){ const a=new Date(r.start_date),b=new Date(r.end_date); if(!isNaN(a)&&!isNaN(b)) days=Math.max(1,Math.round((b-a)/86400000)+1); }
      const trip = r.has_trip ? `<span class="st-trip">🧳 ${r.trip_approved?'согл.':'на согл.'}</span>` : `<span class="st-trip no">—</span>`;
      const status = r.is_completed ? `<span class="st-pill st-done"><span class="d"></span>${r.completion==='F'?'Закрыта':'Завершена'}</span>` : `<span class="st-pill st-open"><span class="d"></span>В работе</span>`;
      return `<tr><td><div class="nm">${esc(r.engineer_name||'—')}</div></td><td><div class="sub2" title="${esc(r.service_type_labels||'')}">${esc(r.service_type_labels||'—')}</div></td><td><div class="sub2" title="${esc(r.company_name||'')}">${esc(r.company_name||'—')}</div></td><td class="mono">${fmtD(r.start_date)} – ${fmtD(r.end_date)}</td><td class="r mono">${days}</td><td>${trip}</td><td>${status}</td></tr>`;
    }).join('');
    tbl.innerHTML=head+'<tbody>'+body+'</tbody>';
  }

  window.statExport = function(){
    if(!S.rows.length){ return; }
    const H=['Сотрудник','Тип работ','Компания','Начало','Окончание','Дней','Командировка','Согласована','Статус','Город'];
    const line=a=>a.map(v=>{ v=String(v==null?'':v); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(';');
    const body=S.rows.map(r=>{
      let days=1; if(r.start_date&&r.end_date){ const a=new Date(r.start_date),b=new Date(r.end_date); if(!isNaN(a)&&!isNaN(b)) days=Math.max(1,Math.round((b-a)/86400000)+1); }
      return line([r.engineer_name||'', r.service_type_labels||'', r.company_name||'',
        (r.start_date||'').slice(0,10), (r.end_date||'').slice(0,10), days,
        r.has_trip?'да':'нет', r.has_trip?(r.trip_approved?'да':'нет'):'',
        r.is_completed?(r.completion==='F'?'закрыта':'завершена'):'в работе', r.city||'']);
    }).join('\n');
    const csv='﻿'+line(H)+'\n'+body;
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`statistika_${S.from||'all'}_${S.to||''}.csv`; a.click(); URL.revokeObjectURL(a.href);
  };

  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('statOverlay').classList.contains('open')) statClose(); });
})();
</script>
