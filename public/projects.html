<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП · Проекты КАМ</title>
<meta name="theme-color" content="#f6f7f9">
<script>(function(){try{var m=localStorage.getItem('pls-theme');document.documentElement.setAttribute('data-theme',m==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="/assets/cup-ui.css">
<link rel="icon" href="/favicon.svg">
<script src="/assets/theme.js"></script>
<style>
  :root{--panel:var(--surface);--panel2:var(--surface-2);--border:var(--line);--border2:var(--line-2);--dim:var(--text-3);--dim2:var(--text-faint);--brand:var(--accent);--signal:var(--good)}
  .top::before,.hdr::before,.header::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 35%,transparent));z-index:1}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;min-height:100vh;
    background-image:radial-gradient(1000px 500px at 15% -5%,rgba(255,45,85,.08),transparent 60%),radial-gradient(900px 600px at 100% 0%,rgba(91,140,255,.08),transparent 55%);}
  .wrap{max-width:1500px;margin:0 auto;padding:18px 22px 70px}
  a{color:inherit;text-decoration:none}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .back{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--border);font-size:16px}
  h1{font-size:20px;font-weight:800}h1 span{color:var(--brand)}
  .lead{font-size:11.5px;color:var(--dim);margin-top:2px}
  .sp{flex:1}
  .minibtn{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:3px;flex-wrap:wrap}
  .seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 16px}
  @media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .kpi .kl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .kpi .kv{font-size:22px;font-weight:800;margin-top:5px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px}
  .pad{padding:16px 18px}
  .spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{padding:34px;text-align:center;color:var(--dim)}
  .tabular{font-variant-numeric:tabular-nums}
  .hint{font-size:11.5px;color:var(--dim2)}
  .search{width:100%;max-width:340px;margin-bottom:12px}
  input,select{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font:inherit;font-size:13px;padding:7px 9px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .tw{color:var(--dim);width:14px;display:inline-block}
  .ext{color:var(--dim2)}
  .klegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .klegend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  /* компания */
  .co{border:1px solid var(--border);border-radius:12px;margin:0 0 10px;background:var(--panel)}
  .co-h{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-weight:800}
  .co-h .cnt{color:var(--dim);font-weight:700;font-size:12px}
  .co-h .sum{margin-left:auto;color:var(--signal);font-weight:800}
  .co-body{display:none;padding:2px 14px 12px}
  .co.open .co-body{display:block}
  /* проект */
  .proj{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:11px;margin:9px 0;background:var(--panel2)}
  .proj-h{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;flex-wrap:wrap}
  .proj-h .tag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;background:rgba(255,45,85,.16);color:#ffb3c1}
  html[data-theme="light"] .proj-h .tag{background:#fde8e8;color:#b91c1c}
  .proj-h .t{font-weight:800}
  .proj-h .co2{color:var(--dim2);font-size:12px}
  .proj-h .sum{margin-left:auto;font-weight:800;color:var(--signal)}
  .kam{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;background:rgba(193,91,66,.18);color:#e6a08c;white-space:nowrap}
  html[data-theme="light"] .kam{background:#f6e7e2;color:#b4532f}
  .kam.none{background:rgba(255,91,110,.16);color:#ffb3c1}
  html[data-theme="light"] .kam.none{background:#fde8e8;color:#b91c1c}
  .kam-sel{min-width:190px}
  .kids{display:none;padding:2px 12px 11px}
  .proj.open .kids{display:block}
  .kdir{margin-top:11px}
  .kdir .dh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .kdir .dn{font-weight:800;font-size:12.5px}
  .kdir .dc{font-size:11px;color:var(--dim)}
  .kchips{display:flex;flex-wrap:wrap;gap:7px}
  .kchip{border-radius:9px;padding:7px 10px;font-size:12px;line-height:1.25;border:1px solid var(--border);min-width:200px;background:var(--panel)}
  .kchip .st{font-weight:800;font-size:10.5px;display:flex;align-items:center;gap:6px}
  .kchip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .kchip .mid{margin:3px 0 1px}
  .kchip .mt{font-size:11px;color:var(--dim)}
  .kchip.pre{border-left:3px solid var(--warn)}
  .kchip.post{border-left:3px solid var(--accent)}
  .kchip.done{border-left:3px solid var(--good)}
  .kchip .dsum{font-weight:800}
  .psub{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin:4px 0 2px}
  .psub b{color:var(--text)}
  /* аудит */
  .aud h3{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .aud .badge{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:rgba(255,176,32,.18);color:#ffce7a}
  html[data-theme="light"] .aud .badge{background:#fef0d8;color:#a15c00}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px}
  .achip{font-size:12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 9px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/" class="back" title="В ЦУП">←</a>
    <div><h1>Проекты · <span>КАМ</span></h1><div class="lead">Компания → Проект → КАМ → сделки. Привязка по полю «В рамках проекта» (Bitrix)</div></div>
    <div class="sp"></div>
    <button class="minibtn" id="resyncBtn" title="Полная пересинхронизация (админ) — заполнит поле «В рамках проекта» у всех сделок">⟲ Полная</button>
    <div class="seg" id="tabs"><button data-t="company" class="on">По компаниям</button><button data-t="project">По проектам</button><button data-t="audit">Аудит</button></div>
  </header>

  <div class="card pad" id="syncPanel" style="display:none;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <b id="syncTitle">Синхронизация…</b>
      <span class="hint" id="syncInfo"></span>
      <div class="sp"></div>
      <span class="tabular" id="syncPct" style="font-weight:800">0%</span>
    </div>
    <div style="height:9px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-top:8px">
      <div id="syncFill" style="height:100%;width:0;background:var(--accent);transition:width .4s"></div>
    </div>
  </div>

  <div class="kpis" id="kpis" style="display:none">
    <div class="kpi"><div class="kl">Проекты</div><div class="kv tabular" id="kProjects">—</div></div>
    <div class="kpi"><div class="kl">Компании</div><div class="kv tabular" id="kCompanies">—</div></div>
    <div class="kpi"><div class="kl">Сделок в проектах</div><div class="kv tabular" id="kDeals">—</div></div>
    <div class="kpi"><div class="kl">⚠ Без КАМ</div><div class="kv tabular" id="kNoKam" style="color:var(--bad)">—</div></div>
  </div>

  <div class="card pad" id="toolbar" style="margin-bottom:12px;display:none;align-items:center;gap:12px;flex-wrap:wrap">
    <input class="search" id="search" placeholder="Поиск: проект, компания, менеджер…" style="margin:0" oninput="render()">
    <div class="sp"></div>
    <div class="seg" id="scope"><button data-s="all" class="on">Все стадии</button><button data-s="pre">В работе</button><button data-s="post">Контракт+</button></div>
    <div class="klegend">
      <span><i style="background:var(--warn)"></i>До контракта (P10–P80)</span>
      <span><i style="background:var(--accent)"></i>После контракта</span>
      <span><i style="background:var(--good)"></i>Завершена</span>
    </div>
  </div>

  <div id="view"><div class="card"><div class="pad"><div class="spin"></div></div></div></div>
</div>

<script>
let DATA=null, ROLE='viewer', CANEDIT=false, TAB='company', SCOPE='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=n=>Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,' ');
const fmtMln=v=>{const m=(v||0)/1e6; if(Math.abs(m)>=100)return fmt(m)+' млн'; return (Math.round(m*10)/10).toLocaleString('ru-RU')+' млн';};
const OPENC=new Set(), OPENP=new Set();
const PH={pre:{c:'var(--warn)',l:'До контракта'},post:{c:'var(--accent)',l:'После контракта'},done:{c:'var(--good)',l:'Завершена'}};

async function init(){
  try{const r=await fetch('/auth/me');if(r.ok){const {user}=await r.json();ROLE=user.role;CANEDIT=['admin','superadmin','coordinator'].includes(ROLE);}}catch(e){}
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render();});
  document.querySelectorAll('#scope button').forEach(b=>b.onclick=()=>{SCOPE=b.dataset.s;document.querySelectorAll('#scope button').forEach(x=>x.classList.toggle('on',x===b));render();});
  $('resyncBtn').onclick=doResync;
  await load();
}
async function load(){
  try{
    DATA=await (await fetch('/api/projects')).json();
    updateKpis();
    $('kpis').style.display=''; $('toolbar').style.display='flex';
    render();
  }catch(e){ $('view').innerHTML='<div class="card pad"><div class="empty">Не удалось загрузить: '+esc(e.message)+'</div></div>'; }
}
function updateKpis(){
  const P=DATA.projects||[];
  $('kProjects').textContent=P.length;
  $('kCompanies').textContent=(DATA.companies||[]).length;
  $('kDeals').textContent=P.reduce((s,p)=>s+(p.dealCount||0),0);
  $('kNoKam').textContent=P.filter(p=>!p.kamId).length;
}
function tog(set,k){ if(set.has(k))set.delete(k); else set.add(k); }
function scopeOk(ph){ return SCOPE==='all'||SCOPE===ph; }
function matchQ(p,q){ if(!q)return true; return ((p.project||'')+' '+(p.company||'')+' '+(p.kam||'')+' '+(p.managers||[]).join(' ')+' '+(p.products||[]).join(' ')).toLowerCase().includes(q); }

function kamOptions(sel){
  const emps=(DATA.meta&&DATA.meta.employees)||[];
  return '<option value="">— КАМ не назначен —</option>'+emps.map(e=>`<option value="${e.id}" ${String(sel)===String(e.id)?'selected':''}>${esc(e.name)} · ${esc(e.dept)}</option>`).join('');
}
function kamCell(p){
  if(CANEDIT) return `<select class="kam-sel" data-project="${esc(p.project)}" onclick="event.stopPropagation()" onchange="saveKam(this)">${kamOptions(p.kamId)}</select>`;
  return p.kamId?`<span class="kam">КАМ: ${esc(p.kam)}</span>`:`<span class="kam none">КАМ не назначен</span>`;
}
function kchip(d){
  const cls=d.done?'done':(d.phase||'pre'); const info=PH[cls]||PH.pre;
  const label=d.done?'Завершена':(d.step||d.stage||info.l);
  return `<div class="kchip ${cls}"><div class="st"><span class="dot" style="background:${info.c}"></span>${esc(label)}</div><div class="mid">${esc(d.title||d.product)} · <span class="dsum tabular">${fmt(d.sum)} ₸</span></div><div class="mt">👤 ${esc(d.owner||'—')}${d.url?` · <a class="ext" href="${esc(d.url)}" target="_blank">↗</a>`:''}</div></div>`;
}
function projectBlock(p,showCompany){
  const deals=[...(p.pre||[]),...(p.post||[])].filter(d=>scopeOk(d.phase));
  const sum=deals.reduce((s,d)=>s+d.sum,0);
  const pk='p:'+p.project, po=OPENP.has(pk);
  let body='';
  if(po){
    if(!deals.length) body='<div class="hint" style="padding:8px">Нет сделок в выбранной стадии.</div>';
    else{
      const dirmap=new Map();
      deals.forEach(d=>{const pr=d.product||'—';if(!dirmap.has(pr))dirmap.set(pr,[]);dirmap.get(pr).push(d);});
      for(const [prod,items] of [...dirmap.entries()].sort((a,b)=>b[1].reduce((s,d)=>s+d.sum,0)-a[1].reduce((s,d)=>s+d.sum,0))){
        items.sort((a,b)=>b.sum-a.sum);
        body+=`<div class="kdir"><div class="dh"><span class="dn">${esc(prod)}</span><span class="dc">${items.length} · ${fmtMln(items.reduce((s,d)=>s+d.sum,0))} ₸</span></div><div class="kchips">${items.map(kchip).join('')}</div></div>`;
      }
    }
  }
  const preN=(p.pre||[]).filter(d=>scopeOk(d.phase)).length, postN=(p.post||[]).filter(d=>scopeOk(d.phase)).length;
  return `<div class="proj ${po?'open':''}">
    <div class="proj-h" data-p="${esc(pk)}"><span class="tw">${po?'▾':'▶'}</span><span class="tag">Проект</span><span class="t">${esc(p.project)}</span>${showCompany?`<span class="co2">· ${esc(p.company)}</span>`:''}${kamCell(p)}<span class="sum tabular">${fmtMln(sum)} ₸</span></div>
    <div class="kids"><div class="psub"><span>До контракта (P10–P80): <b>${preN}</b> · ${fmtMln((p.pre||[]).filter(d=>scopeOk(d.phase)).reduce((s,d)=>s+d.sum,0))} ₸</span><span>После контракта: <b>${postN}</b> · ${fmtMln((p.post||[]).filter(d=>scopeOk(d.phase)).reduce((s,d)=>s+d.sum,0))} ₸</span></div>${body}</div>
  </div>`;
}

function render(){
  if(!DATA){return;}
  if(TAB==='audit') return renderAudit();
  const q=($('search').value||'').trim().toLowerCase();
  const box=$('view');
  if(TAB==='project'){
    const list=(DATA.projects||[]).filter(p=>matchQ(p,q));
    if(!list.length){box.innerHTML=emptyCard();return;}
    box.innerHTML='<div class="card pad">'+list.map(p=>projectBlock(p,true)).join('')+'</div>';
  } else { // company
    const comps=(DATA.companies||[]).map(c=>({...c,projects:c.projects.filter(p=>matchQ(p,q))})).filter(c=>c.projects.length);
    if(!comps.length){box.innerHTML=emptyCard();return;}
    let html='<div class="card pad">';
    for(const c of comps){
      const ck='c:'+(c.companyId||c.company), co=OPENC.has(ck);
      const sum=c.projects.reduce((s,p)=>s+[...(p.pre||[]),...(p.post||[])].filter(d=>scopeOk(d.phase)).reduce((a,d)=>a+d.sum,0),0);
      html+=`<div class="co ${co?'open':''}"><div class="co-h" data-c="${esc(ck)}"><span class="tw">${co?'▾':'▶'}</span><span>${esc(c.company)}</span><span class="cnt">${c.projects.length} проект.</span><span class="sum tabular">${fmtMln(sum)} ₸</span></div><div class="co-body">${c.projects.map(p=>projectBlock(p,false)).join('')}</div></div>`;
    }
    html+='</div>';
    box.innerHTML=html;
  }
  box.querySelectorAll('.co-h').forEach(e=>e.onclick=(ev)=>{if(ev.target.closest('a,select'))return;tog(OPENC,e.dataset.c);render();});
  box.querySelectorAll('.proj-h').forEach(e=>e.onclick=(ev)=>{if(ev.target.closest('a,select'))return;tog(OPENP,e.dataset.p);render();});
}
function emptyCard(){
  return '<div class="card pad"><div class="empty">Нет проектов по фильтру. Проект появляется, когда в сделке заполнено поле «В рамках проекта». Если поле недавно завели — запусти ⟲ Полная.</div></div>';
}

function renderAudit(){
  const noKam=(DATA.audit&&DATA.audit.noKam)||[];
  const box=$('view');
  let html='<div class="card pad aud">';
  html+=`<h3>🚫 Проекты без назначенного КАМ <span class="badge">${noKam.length}</span></h3><div class="hint" style="margin-bottom:6px">Есть сделки в проекте, но КАМ не назначен. Назначь во вкладках «По компаниям»/«По проектам» (выпадашка в строке проекта).</div><div class="chiprow">${noKam.length?noKam.map(p=>`<span class="achip"><b>${esc(p.project)}</b> · ${esc(p.company)} · ${fmtMln(p.totalSum)} ₸ · ${p.dealCount} сдел.</span>`).join(''):'<span class="hint">Нет — у всех проектов есть КАМ 👍</span>'}</div>`;
  html+='</div>';
  box.innerHTML=html;
}

async function saveKam(sel){
  const project=sel.dataset.project; const kamId=sel.value||null;
  sel.disabled=true;
  try{
    const r=await fetch('/api/projects/kam',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project,kamId})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error||'Ошибка');
    const emps=(DATA.meta&&DATA.meta.employees)||[];
    const nm=kamId?((emps.find(e=>String(e.id)===String(kamId))||{}).name||('#'+kamId)):null;
    (DATA.projects||[]).forEach(p=>{if(p.project===project){p.kamId=kamId?Number(kamId):null;p.kam=nm;}});
    updateKpis();
  }catch(e){ alert('Не удалось: '+e.message); }
  finally{ sel.disabled=false; }
}

let _pollTimer=null;
function fmtEta(s){ if(s==null)return''; if(s<60)return s+' сек'; const m=Math.floor(s/60),ss=s%60; return m+' мин'+(ss?' '+ss+' сек':''); }
async function doResync(){
  if(!confirm('Запустить полную пересинхронизацию? Идёт на сервере, страницу можно не закрывать — покажу живой прогресс.'))return;
  const b=$('resyncBtn'); b.disabled=true; b.textContent='⏳ Синхронизация…';
  try{
    const r=await fetch('/api/projects/resync',{method:'POST'});
    if(r.status===403){alert('Только для админа.');b.disabled=false;b.textContent='⟲ Полная';return;}
    await r.json();
    $('syncPanel').style.display=''; if(_pollTimer)clearTimeout(_pollTimer); pollSync();
  }catch(e){alert('Ошибка: '+e.message);b.disabled=false;b.textContent='⟲ Полная';}
}
async function pollSync(){
  try{
    const d=await (await fetch('/api/projects/resync-status')).json();
    const p=d.progress||{};
    const phase={count:'Подсчёт сделок в Bitrix…',sync:'Загрузка и обновление…',done:'Готово',idle:'Запуск…'}[p.phase]||'Синхронизация…';
    $('syncTitle').textContent=phase;
    $('syncPct').textContent=(p.pct||0)+'%';
    $('syncFill').style.width=(p.pct||0)+'%';
    $('syncInfo').textContent=p.total?`обработано ${p.done} из ${p.total}${p.errors?` · ошибок ${p.errors}`:''}${p.etaSec?` · осталось ~${fmtEta(p.etaSec)}`:''}`:(p.done?`обработано ${p.done}`:'…');
    if(d.busy||p.running){ _pollTimer=setTimeout(pollSync,1500); }
    else{
      $('syncTitle').textContent='Готово ✓'; $('syncFill').style.width='100%'; $('syncPct').textContent='100%';
      $('syncInfo').textContent=`обновлено ${p.done||0} сделок${p.errors?` · ошибок ${p.errors}`:''}`;
      const b=$('resyncBtn'); b.disabled=false; b.textContent='⟲ Полная';
      setTimeout(()=>{ $('syncPanel').style.display='none'; },6000);
      await load();
    }
  }catch(e){ $('syncInfo').textContent='Статус недоступен: '+e.message; const b=$('resyncBtn'); b.disabled=false; b.textContent='⟲ Полная'; }
}
init();
</script>
<script src="/assets/pls-ai.js?v=16" defer></script>
<script src="/assets/cup-theme.js" defer></script>
</body>
</html>
