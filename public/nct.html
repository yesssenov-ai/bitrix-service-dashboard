<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ЦУП · НКТ</title>
<style>
  :root{--bg:#0e1116;--card:#161b22;--card2:#1b222c;--line:#243040;--tx:#e6edf3;--dim:#8b98a9;--accent:#f0426e;--teal:#22c9a3;--amber:#e6a01e;--blue:#5b8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 80px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .top h1{font-size:20px;margin:0}.top .sub{color:var(--dim);font-size:12.5px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
  .btn.ok{background:var(--teal)}.btn.warn{background:var(--amber);color:#111}.btn.gray{background:#2a3340;color:var(--tx)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-size:15px}
  .muted{color:var(--dim);font-size:12.5px}
  input[type=text],textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:10px;font:inherit}
  textarea{min-height:64px;resize:vertical}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:12.5px;cursor:pointer}
  .chip.on{border-color:var(--accent);color:#fff}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
  .pill.g{background:rgba(34,201,163,.15);color:var(--teal)}.pill.a{background:rgba(230,160,30,.15);color:var(--amber)}.pill.r{background:rgba(240,66,110,.15);color:var(--accent)}.pill.b{background:rgba(91,140,255,.15);color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px}
  .kv .k{color:var(--dim)}
  .hide{display:none}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tree{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--card2)}
  .node{padding:5px 8px;border-radius:7px;cursor:pointer}
  .node:hover{background:rgba(255,255,255,.05)}
  .node .code{color:var(--dim);font-size:11.5px;margin-left:6px}
  .warnbox{background:rgba(240,66,110,.08);border:1px solid rgba(240,66,110,.35);border-radius:10px;padding:10px;margin-top:8px}
  .okbox{background:rgba(34,201,163,.08);border:1px solid rgba(34,201,163,.3);border-radius:10px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="btn ghost sm" href="/portal.html">← Портал</a>
    <div>
      <h1>ЦУП · НКТ</h1>
      <div class="sub">Регистрация товаров в Национальном каталоге — получение NTIN/KZTIN</div>
    </div>
    <div style="margin-left:auto" class="row">
      <span id="health" class="muted"></span>
      <button class="btn" id="btnNew">+ Новый товар</button>
    </div>
  </div>

  <!-- Реестр -->
  <div class="card" id="registry">
    <h3>Реестр</h3>
    <div class="muted" id="regEmpty">Загрузка…</div>
    <div style="overflow:auto"><table id="regTbl" class="hide"><thead><tr>
      <th>Наименование</th><th>Партномер</th><th>ОКТРУ</th><th>NTIN</th><th>Статус</th><th>НКТ</th><th></th>
    </tr></thead><tbody></tbody></table></div>
  </div>

  <!-- Мастер -->
  <div id="wizard" class="hide"></div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(method,path,body){const o={method,headers:{}};if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}const r=await fetch('/api/nct'+path,o);let d=null;try{d=await r.json();}catch(_){}if(!r.ok||(d&&d.ok===false&&d.error)){throw new Error((d&&d.error)||('HTTP '+r.status));}return d;}
let W=null; // состояние мастера

// ── Health ──
(async()=>{try{const h=await api('GET','/health');const parts=[];parts.push(h.ok?'API НКТ ✅':('API НКТ ⚠️'+(h.status?(' '+h.status):'')));parts.push(h.llm?'AI ✅':'AI ⚠️ нет ключа');$('#health').textContent=parts.join(' · ');}catch(e){$('#health').textContent='health: '+e.message;}})();

// ── Реестр ──
async function loadRegistry(){
  try{const d=await api('GET','/drafts');const rows=d.items||[];const tb=$('#regTbl tbody');
    if(!rows.length){$('#regEmpty').textContent='Пока пусто. Нажмите «+ Новый товар».';$('#regTbl').classList.add('hide');return;}
    $('#regEmpty').classList.add('hide');$('#regTbl').classList.remove('hide');
    tb.innerHTML=rows.map(r=>`<tr>
      <td>${E(r.short_name_ru||r.full_name_ru)}</td>
      <td>${E(r.part_number||'—')}</td>
      <td>${E(r.oktru||'—')}</td>
      <td>${r.ntin?('<b style="color:var(--teal)">'+E(r.ntin)+'</b>'):'—'}${r.kztin?('<br><span class="muted">KZ '+E(r.kztin)+'</span>'):''}</td>
      <td>${statusPill(r.internal_status)}</td>
      <td>${r.nct_status?E(r.nct_status):'—'}${r.request_id?('<br><span class="muted">#'+r.request_id+'</span>'):''}</td>
      <td class="row"><button class="btn gray sm" data-open="${r.id}">Открыть</button>${r.request_id?`<button class="btn ghost sm" data-refresh="${r.id}">Статус</button>`:''}</td>
    </tr>`).join('');
  }catch(e){$('#regEmpty').textContent='Ошибка: '+e.message;}
}
function statusPill(s){const m={started:['a','Начато'],dedup:['a','Проверка дублей'],possible:['a','Возможное совпадение'],clear:['g','Дублей нет'],oktru:['b','Подбор ОКТРУ'],ready:['b','Готово к отправке'],submitted:['b','Отправлено'],revision:['a','На доработке'],rejected:['r','Отклонено'],completed:['g','Завершено'],cancelled:['r','Отозвано']};const x=m[s]||['b',s||'—'];return `<span class="pill ${x[0]}">${E(x[1])}</span>`;}
$('#registry').addEventListener('click',async e=>{
  const o=e.target.closest('[data-open]');if(o){openDraft(o.getAttribute('data-open'));return;}
  const rf=e.target.closest('[data-refresh]');if(rf){rf.disabled=true;rf.textContent='…';try{const d=await api('POST','/drafts/'+rf.getAttribute('data-refresh')+'/refresh');alert('Статус НКТ: '+(d.nctStatus||'—')+(d.ntin?('\\nNTIN: '+d.ntin):''));loadRegistry();}catch(err){alert(err.message);}finally{rf.disabled=false;rf.textContent='Статус';}}
});
loadRegistry();

// ── Мастер: старт ──
$('#btnNew').onclick=()=>{W={step:1,draftId:null,data:{}};renderWizard();window.scrollTo({top:9999,behavior:'smooth'});};
async function openDraft(id){try{const d=await api('GET','/drafts/'+id);const it=d.item;W={step:6,draftId:it.id,data:{
  full_name_ru:it.full_name_ru,short_name_ru:it.short_name_ru,name_kk:it.name_kk,part_number:it.part_number,part_confirmed:it.part_confirmed,has_no_part:it.has_no_part,article_raw:it.article_raw,brand:it.brand,model:it.model,role:it.role,oktru:it.oktru,oktru_path:it.oktru_path,gtin:it.gtin,ai_parse:it.ai_parse,attributes:it.attributes||[],request_id:it.request_id}};renderWizard();window.scrollTo({top:9999,behavior:'smooth'});}catch(e){alert(e.message);}}

async function saveDraft(patch,hist,note){
  Object.assign(W.data,patch||{});
  if(!W.draftId){const d=await api('POST','/drafts',W.data);W.draftId=d.id;}
  else{const body=Object.assign({},patch||{});if(hist){body._hist=hist;body._histNote=note;}await api('PUT','/drafts/'+W.draftId,body);}
  loadRegistry();
}

function renderWizard(){
  const w=$('#wizard');w.classList.remove('hide');
  let h='<div class="card"><h3>Мастер регистрации товара</h3><div class="muted">Шаг '+W.step+' из 7. Данные сохраняются автоматически на каждом шаге.</div></div>';
  h+='<div id="steps"></div>';
  w.innerHTML=h;
  const s=$('#steps');
  step1(s); if(W.step>=2)step2(s); if(W.step>=3)step3(s); if(W.step>=4)step4(s); if(W.step>=5)step5(s); if(W.step>=6)step6(s); if(W.step>=7)step7(s);
}

// Шаг 1 — наименование
function step1(root){
  const c=div('card');c.innerHTML=`<h3>1. Полное наименование товара (рус)</h3>
    <div class="muted">Введите одну строку. Пример: Высокоэффективный жидкостный хроматограф Agilent 1260 Infinity II с автоматическим пробоотборником G7116A</div>
    <textarea id="s1name">${E(W.data.full_name_ru||'')}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="s1go">Проверить товар</button></div>`;
  root.appendChild(c);
  $('#s1go').onclick=async()=>{const v=$('#s1name').value.trim();if(!v)return;$('#s1go').disabled=true;$('#s1go').innerHTML='<span class="spin"></span>';
    try{await saveDraft({full_name_ru:v,internal_status:'started'});const d=await api('POST','/parse',{fullName:v});W.data.ai_parse=d.parse;await saveDraft({ai_parse:d.parse,brand:d.parse.brand||null,model:d.parse.model||null,role:d.parse.role||null});W.step=Math.max(W.step,2);renderWizard();}
    catch(e){alert(e.message);}finally{$('#s1go')&&($('#s1go').disabled=false);}}
}
// Шаг 2 — разбор + партномер
function step2(root){
  const p=W.data.ai_parse||{};const cands=p.partCandidates||[];
  const c=div('card');
  c.innerHTML=`<h3>2. Разбор наименования и партномер</h3>
    <div class="kv">
      <div class="k">Тип</div><div>${E(p.type||'—')}</div>
      <div class="k">Бренд</div><div>${E(p.brand||'—')}</div>
      <div class="k">Модель</div><div>${E(p.model||'—')}</div>
      <div class="k">Серия</div><div>${E(p.series||'—')}</div>
      <div class="k">Роль товара</div><div>${E(p.role||'—')}</div>
      <div class="k">Назначение</div><div>${E(p.purpose||'—')}</div>
    </div>
    <div class="muted" style="margin-top:6px">Предварительный разбор AI. Подтвердите партномер — по нему пойдёт проверка дублей.</div>
    <label>Кандидаты в партномер (выберите верный):</label>
    <div class="row" id="s2c">${cands.map((x,i)=>`<span class="chip" data-i="${i}">${E(x.value)} <span class="muted">${E(x.role||'')}</span></span>`).join('')||'<span class="muted">AI не нашёл явных идентификаторов</span>'}</div>
    <label>Или введите партномер вручную:</label>
    <input type="text" id="s2manual" placeholder="напр. G7116A" value="${E(W.data.part_number||'')}">
    <div class="row" style="margin-top:10px">
      <button class="btn" id="s2yes">Это партномер → проверить дубли</button>
      <button class="btn gray" id="s2none">У товара нет партномера</button>
    </div>`;
  root.appendChild(c);
  let chosen=W.data.part_number||'';
  $('#s2c').addEventListener('click',e=>{const ch=e.target.closest('.chip');if(!ch)return;$$('#s2c .chip').forEach(x=>x.classList.remove('on'));ch.classList.add('on');chosen=cands[+ch.getAttribute('data-i')].value;$('#s2manual').value=chosen;});
  $('#s2manual').addEventListener('input',e=>{chosen=e.target.value.trim();});
  $('#s2yes').onclick=async()=>{const pn=($('#s2manual').value||chosen).trim();if(!pn){alert('Укажите партномер или нажмите «нет партномера»');return;}
    await saveDraft({part_number:pn,part_confirmed:true,has_no_part:false,article_raw:pn,internal_status:'dedup'},'partnumber','подтверждён '+pn);
    W.step=Math.max(W.step,3);renderWizard();runDedup();};
  $('#s2none').onclick=async()=>{if(!confirm('Подтвердить, что у товара НЕТ партномера? (нежелательно)'))return;await saveDraft({has_no_part:true,part_confirmed:false,part_number:null,internal_status:'dedup'},'partnumber','нет партномера');W.step=Math.max(W.step,3);renderWizard();runDedup();};
}
// Шаг 3 — дубли
function step3(root){
  const c=div('card');c.id='step3card';
  c.innerHTML=`<h3>3. Проверка дублей</h3><div id="dedupBody"><span class="spin"></span> Проверяю…</div>`;
  root.appendChild(c);
}
async function runDedup(){
  const body=$('#dedupBody');if(!body)return;body.innerHTML='<span class="spin"></span> Проверяю…';
  try{
    let artHtml='';
    if(W.data.part_number){const a=await api('POST','/dedup/article',{article:W.data.part_number});
      W._artExact=a.exact||[];
      artHtml=`<div><b>По артикулу</b> (норм.: <span class="muted">${E(a.norm)}</span>)</div>`;
      if(a.exact.length){artHtml+=`<div class="warnbox"><b>Точное совпадение — создание заблокировано.</b>${a.exact.map(m=>dupRow(m)).join('')}</div>`;}
      else if(a.possible.length){artHtml+=`<div class="warnbox">Возможные совпадения (другая модификация/исполнение?):${a.possible.map(m=>dupRow(m)).join('')}</div>`;}
      else{artHtml+=`<div class="muted">По артикулу совпадений нет.</div>`;}
    }else{artHtml=`<div class="muted">Партномера нет — проверка по наименованию.</div>`;}
    const n=await api('POST','/dedup/name',{name:W.data.full_name_ru,brand:W.data.brand,model:W.data.model,partNumber:W.data.part_number});
    let nameHtml=`<div style="margin-top:10px"><b>По наименованию — в каталоге НКТ</b></div>`;
    nameHtml+= (n.catalog&&n.catalog.length)? `<table><thead><tr><th>Наименование</th><th>NTIN</th><th>Категория</th></tr></thead><tbody>${n.catalog.map(x=>`<tr><td>${x.url?`<a target="_blank" href="${x.url}">${E(x.nameRu)}</a>`:E(x.nameRu)}</td><td>${x.ntin?('<b style="color:var(--teal)">'+E(x.ntin)+'</b>'):'—'}</td><td class="muted">${E(x.category)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">В каталоге похожего не нашли.</div>';
    if(n.internal&&n.internal.length){nameHtml+=`<div style="margin-top:8px"><b>Во внутреннем реестре</b></div>${n.internal.map(m=>dupRow(m)).join('')}`;}
    const blocked=(W._artExact&&W._artExact.length)>0;
    let actions=`<div class="row" style="margin-top:12px">`;
    if(blocked){actions+=`<button class="btn warn" id="s3override">Всё равно создать (под мою ответственность)</button>`;}
    else{actions+=`<button class="btn" id="s3next">Это новый товар → продолжить</button>`;}
    actions+=`</div>`;
    body.innerHTML=artHtml+nameHtml+actions;
    const nx=$('#s3next');if(nx)nx.onclick=async()=>{await saveDraft({internal_status:'clear'},'dedup','дублей нет / новый товар');W.step=Math.max(W.step,4);renderWizard();genShort();};
    const ov=$('#s3override');if(ov)ov.onclick=async()=>{if(!confirm('Точное совпадение по артикулу. Создать новую карточку под вашу ответственность?'))return;await saveDraft({dup_override:true,internal_status:'clear'},'dedup_override','создание при точном совпадении');W.step=Math.max(W.step,4);renderWizard();genShort();};
  }catch(e){body.innerHTML='<div class="warnbox">Ошибка проверки: '+E(e.message)+'</div>';}
}
function dupRow(m){return `<div style="margin-top:6px;padding:6px;border-top:1px solid var(--line)"><b>${E(m.full_name_ru||m.short_name_ru||'—')}</b> ${statusPill(m.internal_status)}<div class="muted">арт.: ${E(m.article_raw||m.part_number||'—')}${m.ntin?(' · NTIN '+E(m.ntin)):''}${m.kztin?(' · KZTIN '+E(m.kztin)):''}</div></div>`;}

// Шаг 4 — краткое имя
function step4(root){
  const c=div('card');c.innerHTML=`<h3>4. Краткое наименование (рус)</h3><div id="s4body"><span class="spin"></span> AI формирует…</div>`;root.appendChild(c);
  if(W.data.short_name_ru)renderShort();
}
async function genShort(){try{const d=await api('POST','/shortname',{fullName:W.data.full_name_ru,elements:W.data.ai_parse||{}});W.data.short_name_ru=d.shortNameRu||'';renderShort();}catch(e){const b=$('#s4body');if(b)b.innerHTML='<div class="muted">AI недоступен, введите вручную.</div>'+shortInput();bindShort();}}
function shortInput(){return `<textarea id="s4v">${E(W.data.short_name_ru||'')}</textarea><div class="row" style="margin-top:8px"><button class="btn ok" id="s4ok">Подтвердить</button><button class="btn ghost" id="s4regen">Другой вариант</button></div>`;}
function renderShort(){const b=$('#s4body');if(!b)return;b.innerHTML=`<div class="muted">Проверьте и при необходимости отредактируйте.</div>`+shortInput();bindShort();}
function bindShort(){const ok=$('#s4ok');if(ok)ok.onclick=async()=>{const v=$('#s4v').value.trim();if(!v)return;await saveDraft({short_name_ru:v},'shortname');W.step=Math.max(W.step,5);renderWizard();genKk();};const rg=$('#s4regen');if(rg)rg.onclick=async()=>{$('#s4body').innerHTML='<span class="spin"></span>';await genShort();};}

// Шаг 5 — казахский
function step5(root){const c=div('card');c.innerHTML=`<h3>5. Наименование на казахском</h3><div id="s5body"><span class="spin"></span> AI переводит…</div>`;root.appendChild(c);if(W.data.name_kk)renderKk();}
async function genKk(){try{const d=await api('POST','/translate',{text:W.data.short_name_ru||W.data.full_name_ru});W.data.name_kk=d.nameKk||'';renderKk();}catch(e){const b=$('#s5body');if(b){b.innerHTML=kkInput();bindKk();}}}
function kkInput(){return `<div class="kv"><div class="k">Русский</div><div>${E(W.data.short_name_ru||W.data.full_name_ru)}</div></div><label>Казахский (проверьте/исправьте):</label><textarea id="s5v">${E(W.data.name_kk||'')}</textarea><div class="row" style="margin-top:8px"><button class="btn ok" id="s5ok">Подтвердить перевод</button><button class="btn ghost" id="s5regen">Перевести заново</button></div>`;}
function renderKk(){const b=$('#s5body');if(!b)return;b.innerHTML=kkInput();bindKk();}
function bindKk(){const ok=$('#s5ok');if(ok)ok.onclick=async()=>{const v=$('#s5v').value.trim();if(!v)return;await saveDraft({name_kk:v,internal_status:'oktru'},'translate');W.step=Math.max(W.step,6);renderWizard();initOktru();};const rg=$('#s5regen');if(rg)rg.onclick=async()=>{$('#s5body').innerHTML='<span class="spin"></span>';await genKk();};}

// Шаг 6 — ОКТРУ
function step6(root){const c=div('card');c.innerHTML=`<h3>6. Подбор ОКТРУ</h3>
  <div class="muted">AI предложит варианты; можно открыть дерево и выбрать вручную. Итог подтверждает исполнитель.</div>
  <div id="oktruSuggest"></div>
  <div style="margin-top:10px"><button class="btn ghost sm" id="oktruTreeBtn">Открыть дерево ОКТРУ</button></div>
  <div id="oktruTree" class="hide" style="margin-top:8px"></div>
  <div id="oktruChosen" style="margin-top:10px"></div>`;root.appendChild(c);
  $('#oktruTreeBtn').onclick=()=>{const t=$('#oktruTree');t.classList.toggle('hide');if(!t.dataset.loaded){loadRoots(t);t.dataset.loaded='1';}};
  if(W.data.oktru)showChosen();
  if(W._oktruSuggest)renderSuggest(W._oktruSuggest);
}
async function initOktru(){const box=$('#oktruSuggest');if(!box)return;box.innerHTML='<span class="spin"></span> AI подбирает…';
  try{const d=await api('POST','/oktru/suggest',{ctx:{full_name:W.data.full_name_ru,parse:W.data.ai_parse,brand:W.data.brand,model:W.data.model,role:W.data.role}});W._oktruSuggest=d.suggest;renderSuggest(d.suggest);}
  catch(e){box.innerHTML='<div class="muted">AI-подсказка недоступна ('+E(e.message)+'). Выберите ОКТРУ через дерево.</div>';}
}
function renderSuggest(s){const box=$('#oktruSuggest');if(!box)return;s=s||{};let h='';
  if(s.questions&&s.questions.length){h+=`<div class="okbox"><b>Уточните:</b>`+s.questions.map((q,qi)=>`<div style="margin-top:6px">${E(q.text)}<div class="row" style="margin-top:4px">${(q.options||[]).map(o=>`<span class="chip" data-q="${qi}" data-o="${E(o)}">${E(o)}</span>`).join('')}</div></div>`).join('')+`</div>`;}
  if(s.suggestions&&s.suggestions.length){h+=`<div style="margin-top:8px">${s.suggestions.map(x=>{const lab=x.label==='рекомендуемый'?'g':x.label==='альтернатива'?'b':'a';return `<div class="card" style="background:var(--card2);margin:8px 0;padding:10px"><div><span class="pill ${lab}">${E(x.label||'')}</span> <b>${E(x.name)}</b> <span class="muted">${E(x.rootCode||'')}</span> <span class="pill ${x.confidence==='высокая'?'g':x.confidence==='средняя'?'a':'r'}">${E(x.confidence||'')}</span></div><div class="muted" style="margin-top:4px">${E(x.why||'')}</div>${x.uncertain?`<div class="muted">Не ясно: ${E(x.uncertain)}</div>`:''}<div class="row" style="margin-top:6px"><button class="btn ghost sm" data-drill="${E(x.rootCode||'')}">Открыть эту ветку в дереве</button></div></div>`;}).join('')}</div>`;}
  if(!h)h='<div class="muted">AI считает наименование достаточным — выберите категорию в дереве ОКТРУ.</div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-drill]').forEach(b=>b.onclick=()=>{const t=$('#oktruTree');t.classList.remove('hide');if(!t.dataset.loaded){loadRoots(t);t.dataset.loaded='1';}t.scrollIntoView({behavior:'smooth'});});
  box.querySelectorAll('[data-q]').forEach(ch=>ch.onclick=()=>{ch.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));ch.classList.add('on');W.data.answers=W.data.answers||{};W.data.answers['q'+ch.getAttribute('data-q')]=ch.getAttribute('data-o');saveDraft({answers:W.data.answers});});
}
async function loadRoots(t){t.innerHTML='<span class="spin"></span>';try{const d=await api('GET','/oktru/roots');t.innerHTML='<div class="tree">'+(d.items||[]).map(n=>nodeHtml(n)).join('')+'</div>';bindTree(t);}catch(e){t.innerHTML='<div class="muted">Ошибка дерева: '+E(e.message)+'</div>';}}
function nodeHtml(n,depth=0){const code=(n.properties&&n.properties.code)||n.code||'';const name=(n.properties&&n.properties.nameRu)||n.nameRu||'';return `<div class="node" data-id="${n.id}" data-code="${E(code)}" data-name="${E(name)}" data-haschild="${n.hasChild?1:0}" style="padding-left:${8+depth*14}px">${n.hasChild?'▸':'•'} ${E(name)}<span class="code">${E(code)}</span></div>`;}
function bindTree(t){t.querySelector('.tree').addEventListener('click',async e=>{const nd=e.target.closest('.node');if(!nd)return;const hasChild=nd.getAttribute('data-haschild')==='1';const path=nd.getAttribute('data-name');const code=nd.getAttribute('data-code');
  if(hasChild){ if(nd.dataset.expanded){return;} nd.dataset.expanded='1';nd.insertAdjacentHTML('afterend','<div class="loading muted" style="padding-left:22px">…</div>');try{const d=await api('GET','/oktru/children/'+nd.getAttribute('data-id'));const depth=(nd.style.paddingLeft?parseInt(nd.style.paddingLeft):8);const html=(d.items||[]).map(n=>nodeHtml(n,(depth-8)/14+1)).join('');nd.nextElementSibling.outerHTML=html;}catch(err){nd.nextElementSibling.outerHTML='<div class="muted" style="padding-left:22px">ошибка</div>';}
  }else{ // лист — выбираем
    W.data.oktru=code;W.data.oktru_path=path;await saveDraft({oktru:code,oktru_path:path},'oktru','выбран '+code);showChosen();}
});}
function showChosen(){const box=$('#oktruChosen');if(!box)return;if(!W.data.oktru){box.innerHTML='';return;}
  box.innerHTML=`<div class="okbox"><b>Выбран ОКТРУ:</b> ${E(W.data.oktru)} — ${E(W.data.oktru_path||'')}<div class="row" style="margin-top:8px"><button class="btn ok" id="oktruConfirm">Подтвердить ОКТРУ и перейти к полям</button></div></div>`;
  $('#oktruConfirm').onclick=async()=>{await saveDraft({internal_status:'ready'},'oktru_confirmed',W.data.oktru);W.step=7;renderWizard();loadAttrs();};
}

// Шаг 7 — характеристики + отправка
function step7(root){const c=div('card');c.innerHTML=`<h3>7. Характеристики и отправка</h3>
  <div class="kv"><div class="k">ОКТРУ</div><div>${E(W.data.oktru||'—')} ${E(W.data.oktru_path||'')}</div>
  <div class="k">Полное (рус)</div><div>${E(W.data.full_name_ru||'')}</div>
  <div class="k">Краткое (рус)</div><div>${E(W.data.short_name_ru||'')}</div>
  <div class="k">Казахский</div><div>${E(W.data.name_kk||'')}</div></div>
  <div id="attrsBox" style="margin-top:10px"><span class="spin"></span> Загружаю поля…</div>`;root.appendChild(c);}
async function loadAttrs(){const box=$('#attrsBox');if(!box)return;
  try{const d=await api('GET','/attributes');const attrs=(d.attributes||[]);const saved=new Map((W.data.attributes||[]).map(a=>[a.code,a.value]));
    const req=attrs.filter(a=>a.isRequired);const opt=attrs.filter(a=>!a.isRequired);
    const fld=a=>{const v=saved.get(a.code)||'';const dt=a.dataType;let inp;
      if(dt==='boolean')inp=`<select data-code="${a.code}"><option value="">—</option><option ${v==='true'?'selected':''} value="true">Да</option><option ${v==='false'?'selected':''} value="false">Нет</option></select>`;
      else if(dt==='number')inp=`<input type="text" inputmode="decimal" data-code="${a.code}" value="${E(v)}">`;
      else if(dt==='dictionary'||dt==='multiDictionary')inp=`<input type="text" data-code="${a.code}" value="${E(v)}" placeholder="код справочника ${E(a.dictionaryCode||'')}${dt==='multiDictionary'?' (несколько через @)':''}">`;
      else inp=`<input type="text" data-code="${a.code}" value="${E(v)}"${a.pattern?` pattern="${E(a.pattern)}"`:''}${a.maxLength?` maxlength="${a.maxLength}"`:''}>`;
      return `<label>${E(a.nameRu)}${a.isRequired?' <span style="color:var(--accent)">*</span>':''} <span class="muted">${E(a.code)}</span></label>${inp}`;};
    box.innerHTML=`<div class="muted">Обязательные поля помечены *. name_ru/name_kk/gtin подставятся автоматически.</div>
      <div><b>Обязательные</b>${req.filter(a=>!['name_ru','name_kk'].includes(a.code)).map(fld).join('')||'<div class="muted">нет</div>'}</div>
      <details style="margin-top:10px"><summary class="muted">Дополнительные поля (${opt.length})</summary>${opt.map(fld).join('')}</details>
      <label>GTIN (если есть)</label><input type="text" id="s7gtin" value="${E(W.data.gtin||'')}">
      <div class="row" style="margin-top:12px">
        <button class="btn" id="s7save">Сохранить черновик</button>
        <button class="btn ok" id="s7submit">Отправить заявку в НКТ</button>
      </div>
      <div id="s7res" class="muted" style="margin-top:8px"></div>`;
    const collect=()=>{const arr=[];box.querySelectorAll('[data-code]').forEach(el=>{const v=el.value.trim();if(v)arr.push({code:el.getAttribute('data-code'),value:v});});return arr;};
    $('#s7save').onclick=async()=>{await saveDraft({attributes:collect(),gtin:$('#s7gtin').value.trim()||null},'attrs');$('#s7res').textContent='Сохранено.';};
    $('#s7submit').onclick=async()=>{const btn=$('#s7submit');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
      try{await saveDraft({attributes:collect(),gtin:$('#s7gtin').value.trim()||null});const d=await api('POST','/drafts/'+W.draftId+'/submit',{autoPublication:false});$('#s7res').innerHTML='<span class="okbox" style="display:block">Заявка отправлена. ID НКТ: <b>'+d.requestId+'</b>, статус: '+E(d.nctStatus||'')+'. Отслеживайте в реестре кнопкой «Статус».</span>';loadRegistry();}
      catch(e){$('#s7res').innerHTML='<div class="warnbox">Ошибка отправки: '+E(e.message)+'</div>';}
      finally{btn.disabled=false;btn.textContent='Отправить заявку в НКТ';}};
  }catch(e){box.innerHTML='<div class="warnbox">Не удалось загрузить поля: '+E(e.message)+'</div>';}
}

function div(cls){const d=document.createElement('div');d.className=cls;return d;}
</script>
</body>
</html>
