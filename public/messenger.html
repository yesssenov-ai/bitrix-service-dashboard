<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мессенджер — ЦУП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--surface:#fff;--surface-2:#f3f5f8;--line:#e5e8ee;--line-2:#d6dbe4;--text:#161c26;--text-2:#384254;--text-3:#8a94a6;--accent:#C53B2F;--accent-weak:#fbeceb;--accent-line:#edc9c6;--good:#1a7f54;--warn:#c47d12;--sans:'Onest',system-ui,Arial,sans-serif}
:root:not([data-theme="light"]) [data-theme="dark"],:root[data-theme="dark"]{--bg:#0f1319;--surface:#161b23;--surface-2:#1d2430;--line:#28303d;--line-2:#333d4d;--text:#e8edf4;--text-2:#b4becd;--text-3:#7d8899;--accent:#e4553f;--accent-weak:#2a1d1b;--accent-line:#4a2f2a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1319;--surface:#161b23;--surface-2:#1d2430;--line:#28303d;--line-2:#333d4d;--text:#e8edf4;--text-2:#b4becd;--text-3:#7d8899;--accent:#e4553f;--accent-weak:#2a1d1b;--accent-line:#4a2f2a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
@supports(height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;letter-spacing:-.1px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.top .brand{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.top .brand b{color:var(--accent)}
.top a.back{color:var(--text-3);text-decoration:none;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface)}
.top a.back:hover{color:var(--text);border-color:var(--text-3)}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{border-color:var(--text-3);color:var(--text)}
.wrap{flex:1;display:grid;grid-template-columns:272px minmax(0,1fr);min-height:0}
/* Сайдбар */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .sh{padding:9px 11px;display:flex;gap:7px;align-items:center}
.side .sh input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:12.5px;padding:7px 10px;outline:none}
.side .sh input:focus{border-color:var(--accent-line)}
.plus{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;width:32px;height:32px;font-size:19px;line-height:1;cursor:pointer;flex:none}
.tabs{display:flex;gap:4px;padding:0 11px 8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text-3);font:inherit;font-size:12px;font-weight:600;padding:6px;border-radius:8px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{flex:1;overflow-y:auto;padding:3px 7px 12px}
.row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--accent-weak)}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:12px;position:relative}
.dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface)}
.dot.online{background:var(--good)}.dot.away{background:var(--warn)}.dot.absent{background:#9aa4b2}.dot.offline{background:#c3cad4}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:600;font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.badge{background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px;min-width:17px;text-align:center}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row .meta .tm{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.pres-lbl{font-size:10.5px;color:var(--text-3)}
.aitag{display:inline-block;font-size:9px;font-weight:700;color:#7a4ecc;background:color-mix(in srgb,#7a4ecc 14%,transparent);border-radius:5px;padding:0 4px;vertical-align:middle;margin-left:4px;letter-spacing:.3px}
.row.ai .av{font-size:17px}
/* Чат */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.chat .ch{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.chat .ch .t{font-weight:600;font-size:13.5px}
.chat .ch .s{font-size:11.5px;color:var(--text-3)}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:1px;min-width:0}
.day{align-self:center;background:var(--surface);border:1px solid var(--line);color:var(--text-3);font-size:10.5px;font-weight:600;border-radius:999px;padding:3px 10px;margin:9px 0}
.m{display:flex;gap:8px;max-width:66%;margin-top:8px}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m.ai{max-width:88%}
.m .mav{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:11px}
.m.cont{margin-top:1px}
.m.cont .mav{visibility:hidden;height:0}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:6px 10px;min-width:0;max-width:100%;position:relative}
.m.me .bub{background:var(--accent-weak);border-color:var(--accent-line)}
.m.ment .bub{box-shadow:inset 3px 0 0 var(--accent)}
.typing .bub{display:flex;align-items:center;gap:4px;padding:10px 12px}
.typing .dot{width:7px;height:7px;border-radius:50%;background:#7a4ecc;opacity:.4;animation:typb 1.1s infinite}
.typing .dot:nth-child(2){animation-delay:.15s}.typing .dot:nth-child(3){animation-delay:.3s}
@keyframes typb{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.ment-tag{color:var(--accent);font-weight:600}
.m.ai .bub .ment-tag,.m.me .bub .ment-tag{color:var(--accent)}
.m.ai .bub{background:color-mix(in srgb,#7a4ecc 9%,var(--surface));border-color:color-mix(in srgb,#7a4ecc 24%,var(--line))}
.bub .who{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.m.ai .bub .who{color:#7a4ecc}
.bub .tx{white-space:pre-wrap;word-break:break-word;line-height:1.42;font-size:12.75px}
.bub .tm{font-size:10px;color:var(--text-3);margin-top:2px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.st{display:inline-flex;align-items:center;gap:1px;cursor:pointer;color:var(--text-3);line-height:0}
.st .tk{width:16px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st i{font-style:normal;font-size:9.5px;margin-left:1px}
.st.read{color:#2f9be0}
.st.delivered,.st.sent{color:var(--text-3)}
.rcp-list{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.rcp-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line)}
.rcp-row:last-child{border-bottom:none}
.rcp-nm{flex:1;font-size:12.75px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.lbl{gap:5px;cursor:default}
.st.lbl em{font-style:normal;font-size:11px;color:var(--text-2)}
.st.lbl.read em{color:#2f9be0}
.bub .reply{border-left:2px solid var(--accent-line);padding:2px 8px;margin-bottom:4px;font-size:11.5px;color:var(--text-3);background:var(--surface-2);border-radius:6px}
.filec{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--surface-2)}
.filec b{font-size:12.5px;font-weight:600}.filec span{font-size:11px;color:var(--text-3)}
.voicemsg{height:40px;max-width:260px;min-width:220px}
.imgmsg{max-width:260px;max-height:260px;border-radius:9px;display:block;object-fit:cover;cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(8,11,16,.9);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox .lb-dl{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.lightbox .lb-dl:hover{background:rgba(255,255,255,.2)}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.react{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;font-size:12px;padding:1px 7px;cursor:pointer;display:inline-flex;gap:3px;align-items:center}
.react.mine{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent)}
.rbar{position:absolute;top:-14px;right:8px;display:none;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 4px;box-shadow:0 2px 10px rgba(20,25,35,.1)}
.bub:hover .rbar{display:flex}
.rbar span{cursor:pointer;font-size:14px;padding:0 2px}
.aitable{margin-top:6px;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:240px;max-width:100%}
.aitable table{border-collapse:collapse;font-size:12px;width:100%}
.aitable th,.aitable td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
.aitable th{background:var(--surface-2);position:sticky;top:0;font-weight:700}
/* Композер */
.comp{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:8px 12px;display:flex;gap:7px;align-items:flex-end;position:relative}
.mpop{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 8px 28px rgba(15,20,30,.18);max-height:246px;overflow:auto;z-index:40;padding:4px}
.mpop .mi{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer}
.mpop .mi.sel,.mpop .mi:hover{background:var(--surface-2)}
.mpop .mi .av{width:28px;height:28px;font-size:11px;flex:none}
.mpop .mi .mnm{font-size:12.75px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpop .mi .msub{font-size:11px;color:var(--text-3);margin-left:auto;flex:none}
.mpop .mi.agent .av{background:#7a4ecc;color:#fff}
.inwrap{flex:1;position:relative;display:flex;align-items:flex-end}
.comp textarea{flex:1;resize:none;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:13px;line-height:1.4;padding:9px 40px 9px 12px;outline:none;max-height:130px;min-height:38px}
.comp textarea:focus{border-color:var(--accent-line)}
.dictbtn{position:absolute;right:5px;bottom:4px;width:30px;height:30px;border:none;background:transparent;color:var(--text-3);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.dictbtn:hover{color:var(--accent);background:var(--surface)}
.dictbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dictbtn.rec{color:#fff;background:var(--accent);animation:recpulse 1.1s infinite}
.recbar{flex:1;display:flex;align-items:center;gap:10px}
.recbar .rectime{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text)}
.recbar .recdot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:recpulse 1s infinite;flex:none}
.recbar .rechint{color:var(--text-3);font-weight:400;font-size:12px}
.recbar .reccancel{color:var(--text-3)}
.cbtn{flex:none;width:38px;height:38px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:border-color .12s,color .12s,background .12s}
.cbtn:hover{border-color:var(--text-3);color:var(--text)}
.cbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cbtn.rec{background:var(--accent);border-color:var(--accent);color:#fff;animation:recpulse 1.1s infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.comp .send{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}
.comp .send svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.comp .send:disabled{opacity:.5;cursor:default}
/* Верхние глобальные иконки (помощь · поиск · AI · связь · тема) собираются в один
   центрированный флекс-ряд — ровно и одинакового размера, сколько бы их ни было. */
#pls-toolbar{position:fixed;top:11px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;z-index:99999}
#pls-toolbar > *{position:static!important;left:auto!important;top:auto!important;right:auto!important;bottom:auto!important;width:30px!important;height:30px!important;min-width:0!important;margin:0!important;transform:none!important;box-shadow:none!important}
#pls-toolbar > * svg{width:16px;height:16px}
@media(max-width:640px){#pls-toolbar{display:none!important}}
.hint{font-size:10.5px;color:var(--text-3);padding:0 16px 8px}
.empty{color:var(--text-3);text-align:center;padding:40px 16px;font-size:12.75px;line-height:1.5}
.replying{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:11.5px;color:var(--text-3);background:var(--surface-2);border-top:1px solid var(--line)}
.replying b{color:var(--text-2)}.replying .x{margin-left:auto;cursor:pointer}
/* Модалка */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:420px;max-width:100%;max-height:85vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 12px;font-size:16px}
.modal input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:9px 11px;margin-bottom:10px;outline:none}
.pick{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer}
.pick:hover{background:var(--surface-2)}
.pick input{width:17px;height:17px}
.mbtn{border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:9px 15px;border-radius:11px;cursor:pointer}
.mbtn.ghost{background:var(--surface);color:var(--text-2);border-color:var(--line)}
.setrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow-act{display:flex;gap:10px;flex:none;align-items:center}
.lnk{background:none;border:none;color:var(--accent);font:inherit;font-size:11.5px;cursor:pointer;padding:0}
.lnk.danger{color:#c0392b}
.admbadge{display:inline-block;font-size:10px;font-weight:700;color:#7a4ecc;background:color-mix(in srgb,#7a4ecc 14%,transparent);border-radius:5px;padding:1px 6px}
.adtoggle{font-size:11px;color:var(--text-3);display:inline-flex;align-items:center;gap:3px;flex:none}
.comp.locked{opacity:.75}
.comp.locked textarea{cursor:not-allowed}
/* ─────────────── Мобильная версия (как в Telegram / WhatsApp) ─────────────── */
@media(max-width:760px){
  /* Список занимает весь экран; чат открывается поверх как отдельный экран. */
  /* minmax(0,1fr) + min-width:0 — чтобы грид-колонка ужималась до ширины экрана
     и длинный текст/бейджи не распирали список за край (горизонтальная прокрутка). */
  .wrap{grid-template-columns:minmax(0,1fr);position:relative}
  .side{display:flex;border-right:none;min-width:0;overflow:hidden}
  .list,.sh,.tabs{min-width:0;max-width:100%}
  .chat{position:fixed;inset:0;z-index:30;background:var(--bg)}
  .chat.hide{display:none}
  /* Безопасные зоны (чёлка/статус-бар сверху, домашняя полоса снизу). */
  .top{padding:calc(9px + env(safe-area-inset-top)) 14px 9px}
  .chat .ch{padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
  .comp{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  /* Крупнее и удобнее для пальцев. 16px у полей — чтобы iOS не зумил при фокусе. */
  .top .brand{font-size:16px}
  .side .sh{padding:10px 12px;gap:8px}
  .side .sh input{font-size:16px;padding:10px 12px;border-radius:11px}
  .plus{width:40px;height:40px;font-size:22px}
  .tabs{padding:0 12px 9px;gap:6px}
  .tab{font-size:13.5px;padding:10px}
  .list{padding:4px 8px 18px}
  .row{padding:10px 10px;gap:11px}
  .av{width:46px;height:46px;font-size:15px}
  .dot{width:12px;height:12px}
  .row .nm b{font-size:15.5px}
  .row .nm span{font-size:13px}
  .badge{font-size:11.5px;padding:2px 7px;min-width:20px}
  .chat .ch .t{font-size:16px}
  .chat .ch .s{font-size:12px}
  #backMob{width:38px;height:38px;font-size:20px}
  #exportBtn{width:38px;height:38px}
  .msgs{padding:10px 10px}
  .m{max-width:84%}
  .m .mav{width:28px;height:28px}
  .bub{padding:7px 11px}
  .bub .tx{font-size:15px;line-height:1.4}
  .bub .tm{font-size:11px}
  .st .tk{width:17px;height:12px}
  .comp{padding:8px 10px;gap:6px}
  .comp textarea{font-size:16px;min-height:42px;padding:10px 13px}
  .cbtn,.comp .send{width:44px;height:44px}
  .cbtn svg{width:20px;height:20px}
  .mpop{left:8px;right:8px}
  .mpop .mi{padding:9px}
  .mpop .mi .av{width:34px;height:34px;font-size:13px}
  .mpop .mi .mnm{font-size:14px}
  .modal{border-radius:16px 16px 0 0;width:100%;max-width:100%;max-height:80vh;position:fixed;left:0;right:0;bottom:0;padding:16px calc(16px + env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom))}
  .ov{align-items:flex-end;padding:0}
}
/* Голосовое: длительность + «прослушано» (синее). */
.voicewrap{display:flex;align-items:center;gap:8px}
.voicewrap .vdur{font-size:11px;color:var(--text-3);flex:none}
.voicewrap.played .voicemsg{outline:2px solid #2f9be0;outline-offset:1px;border-radius:999px}
.voicewrap.played .vdur{color:#2f9be0;font-weight:700}
/* Голосовое прослушано получателем — пузырь явно синеет (как «прочитано»). */
.m.vheard .bub{background:rgba(47,155,224,.12);border-color:rgba(47,155,224,.4)}
.played-mark{color:#2f9be0;font-weight:700;margin-left:4px;font-size:10px;display:inline-flex;align-items:center;gap:2px}
/* Меню сообщения (копировать/переслать/выбрать/удалить). */
.morebtn{cursor:pointer;opacity:.75}.morebtn:hover{opacity:1}
.ctxmenu{position:fixed;z-index:300;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(10,14,20,.28);padding:5px;min-width:168px}
.ctxmenu button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;color:var(--text);font:inherit;font-size:13px;padding:9px 11px;border-radius:7px;cursor:pointer;text-align:left}
.ctxmenu button:hover{background:var(--surface-2)}
.ctxmenu button.danger{color:#c0392b}
/* Режим выбора нескольких сообщений. */
.m.selectable{cursor:pointer}
.m.sel .bub{box-shadow:0 0 0 2px var(--accent)}
.selbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.selbar .cnt{font-weight:600;flex:1;font-size:13.5px}
.selbar button{background:none;border:1px solid var(--line);border-radius:9px;color:var(--text-2);font:inherit;font-size:13px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.selbar button:hover{border-color:var(--text-3);color:var(--text)}
.selbar button.prim{background:var(--accent);color:#fff;border-color:var(--accent)}
.selbar button.danger{color:#c0392b;border-color:#e4b8b4}
/* Карточка подтверждения действия агента (создать задачу/комментарий/напоминание). */
.actcard{margin-top:8px;border:1px solid var(--accent-line);background:var(--accent-weak);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:9px;max-width:420px}
.actcard .actsum{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.actcard .actsum b{display:block;font-size:11.5px;color:var(--accent);margin-bottom:2px}
.actcard .actsum span{color:var(--text-2)}
.actcard .actico{font-size:16px;flex:none;line-height:1.3}
.actcard .actbtns{display:flex;gap:8px}
.actbtn{border:none;border-radius:9px;font:inherit;font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer}
.actbtn.ok{background:var(--accent);color:#fff}
.actbtn.no{background:var(--surface);color:var(--text-2);border:1px solid var(--line)}
.actbtn:disabled{opacity:.6;cursor:default}
.actcard.done{background:color-mix(in srgb,var(--good) 10%,var(--surface));border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.actcard.done .actico{color:var(--good)}
.actcard.cancelled{background:var(--surface-2);border-color:var(--line);opacity:.8}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/portal.html">← ЦУП</a>
  <div class="brand"><b>Мессенджер</b></div>
  <div class="sp"></div>
</div>
<div class="wrap">
  <aside class="side" id="side">
    <div class="sh"><input id="q" placeholder="Поиск по людям и переписке…"><button class="plus" id="newBtn" title="Новый канал">+</button></div>
    <div class="tabs"><button class="tab on" data-tab="chats">Чаты</button><button class="tab" data-tab="people">Люди</button></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="chat hide" id="chat">
    <div class="ch"><button class="iconbtn" id="backMob" style="display:none">‹</button><div style="flex:1;cursor:pointer" id="chHead"><div class="t" id="chTitle">Выберите чат</div><div class="s" id="chSub"></div></div><button class="iconbtn" id="gearBtn" title="Настройки чата" style="display:none"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button class="iconbtn" id="exportBtn" title="Выгрузить историю чата" style="display:none"><svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg></button></div>
    <div class="msgs" id="msgs"><div class="empty">Выберите собеседника или канал слева, либо напишите «@аи вопрос» — агент ответит по данным ЦУП.</div></div>
    <div class="replying" id="replying" style="display:none"></div>
    <div class="comp">
      <div id="mentionPop" class="mpop" style="display:none"></div>
      <input type="file" id="fileInput" style="display:none">
      <button class="cbtn" id="attachBtn" title="Прикрепить файл"><svg viewBox="0 0 24 24"><path d="M21.4 11.1l-8.5 8.5a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg></button>
      <button class="cbtn" id="micBtn" title="Записать голосовое сообщение"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <div class="inwrap">
        <textarea id="input" placeholder="Сообщение…" rows="1"></textarea>
        <button class="dictbtn" id="dictBtn" title="Надиктовать текст голосом"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      </div>
      <button class="send" id="sendBtn" title="Отправить"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      <div class="recbar" id="recBar" style="display:none">
        <button class="cbtn reccancel" id="recCancel" title="Отменить"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <span class="rectime"><span class="recdot"></span><span id="recTime">0:00</span><span class="rechint">запись голосового…</span></span>
        <button class="send" id="recSend" title="Отправить голосовое"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
    </div>
  </main>
</div>
<script>
const api = async (m, p, b, isForm) => {
  const o = { method: m, credentials: 'same-origin' };
  if (b && !isForm) { o.headers = { 'Content-Type': 'application/json' }; o.body = JSON.stringify(b); }
  if (b && isForm) o.body = b;
  const r = await fetch('/api/msg' + p, o);
  if (r.status === 401) { location.href = '/login.html'; return null; }
  return r.json().catch(() => ({ ok: false }));
};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Текст сообщения: экранируем и подсвечиваем @упоминания.
const fmtBody = s => esc(s).replace(/(^|\s)@([\wа-яёА-ЯЁ-]+)/g, '$1<span class="ment-tag">@$2</span>');
const COLORS = ['#C53B2F','#2763d6','#1a7f54','#7a4ecc','#c47d12','#0e8f9e','#b5377e','#4a63b0'];
const colorOf = id => COLORS[Math.abs(Number(id)||0) % COLORS.length];
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
const fmtTime = d => { const x=new Date(d); return x.getHours().toString().padStart(2,'0')+':'+x.getMinutes().toString().padStart(2,'0'); };
const fmtBytes = b => { b=+b||0; return b<1024?b+' Б':b<1048576?(b/1024).toFixed(0)+' КБ':(b/1048576).toFixed(1)+' МБ'; };
const dayKey = d => new Date(d).toDateString();
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const dayLabel = d => { const x=new Date(d), t=new Date(), y=new Date(Date.now()-864e5);
  if(x.toDateString()===t.toDateString())return'Сегодня'; if(x.toDateString()===y.toDateString())return'Вчера';
  return x.getDate()+' '+MON[x.getMonth()]+' '+x.getFullYear(); };

let ME=null, PEOPLE=[], PEOPLE_BY_ID={}, CHANNELS=[], CUR=null, TAB='chats', MAXID=0, REPLY=null;
let PLAYED={}, SEL=new Set(), SELMODE=false;
function applyPlayed(p){ if(!p) return; for(const k in p){ PLAYED[k]=p[k]; } }
const fmtDur = s => { s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
let TEAMS=[], APP_ADMIN=false, PENDING_MENTIONS=new Set();
const PRES_LBL={online:'в сети',away:'отошёл',absent:'отсутствует',offline:'не в сети'};
// Указатели прочтения/доставки: RCPT[channelId][userId] = {r:lastReadId, d:lastDeliveredId}
let RCPT={};
function applyReceipts(rows){ if(!rows) return; for(const x of rows){ (RCPT[x.c]=RCPT[x.c]||{})[x.u]={r:x.r,d:x.d}; } }
function chMembers(cid){ const c=CHANNELS.find(x=>x.id===cid); return (c&&c.members)||[]; }
function curChannel(){ return CHANNELS.find(x=>x.id===CUR); }

async function boot(){
  const d = await api('GET','/bootstrap'); if(!d||!d.ok) return;
  ME=d.me; PEOPLE=d.people; CHANNELS=d.channels; indexPeople(); applyReceipts(d.receipts);
  TEAMS=d.teams||[]; APP_ADMIN=!!d.appAdmin;
  MAXID=d.maxId||0; // стартуем поллинг с последнего id — иначе первый /poll примет всю историю за «новое»
  renderList();
  startPoll();
  // тема
  try{ const th=localStorage.getItem('cup-theme'); if(th) document.documentElement.setAttribute('data-theme',th);}catch(e){}
}
function indexPeople(){ PEOPLE_BY_ID={}; PEOPLE.forEach(p=>PEOPLE_BY_ID[p.id]=p); }
// Пересинхронизация списка с сервером: счётчики непрочитанных обновляются только
// локально, поэтому периодически (и при возврате на вкладку) сверяем их с БД —
// чтобы старые «новые» сами гасли без перезагрузки страницы.
async function resyncChannels(){
  try{
    const b=await api('GET','/bootstrap'); if(!b||!b.ok) return;
    const byId={}; (b.channels||[]).forEach(c=>byId[c.id]=c);
    CHANNELS.forEach(c=>{ const s=byId[c.id]; if(s){ c.unread=(c.id===CUR)?0:(s.unread||0); c.lastBody=s.lastBody; c.lastAt=s.lastAt; c.locked=!!s.locked; if(s.members&&s.members.length) c.members=s.members; } });
    (b.channels||[]).forEach(c=>{ if(!CHANNELS.find(x=>x.id===c.id)) CHANNELS.push(c); });
    if(b.receipts){ applyReceipts(b.receipts); }
    PEOPLE=b.people||PEOPLE; indexPeople();
    renderList(); if(CUR) updateStatuses();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') resyncChannels(); });
setInterval(()=>{ if(document.visibilityState!=='hidden') resyncChannels(); }, 15000);

function renderList(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const list=document.getElementById('list'); let html='';
  if(TAB==='people'){
    const PRES_ORD={online:0,away:1,absent:2,offline:3};
    const ppl=PEOPLE.filter(p=>p.id!==ME.id && (!q||p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q)))
      .sort((a,b)=> (PRES_ORD[a.status]??9)-(PRES_ORD[b.status]??9) || a.name.localeCompare(b.name,'ru'));
    html = ppl.map(p=>`<div class="row" onclick="openDM(${p.id})">
      <div class="av" style="background:${colorOf(p.id)}">${esc(initials(p.name))}<span class="dot ${p.status}"></span></div>
      <div class="nm"><b>${esc(p.name)}</b><span>${esc(p.title||PRES_LBL[p.status])}</span></div>
      <span class="pres-lbl">${PRES_LBL[p.status]}</span></div>`).join('') || '<div class="empty">Нет сотрудников</div>';
  } else {
    // Чат с агентом всегда закреплён вверху, затем по непрочитанным и свежести.
    let chans = CHANNELS.slice().sort((a,b)=> ((b.kind==='ai'?1:0)-(a.kind==='ai'?1:0)) || (b.unread-a.unread) || (new Date(b.lastAt)-new Date(a.lastAt)) );
    if(q) chans = chans.filter(c=> (c.title||'').toLowerCase().includes(q));
    html = chans.map(c=>{
      const ai = c.kind==='ai';
      const peer = c.kind==='dm' ? PEOPLE_BY_ID[c.peerId] : null;
      const dot = peer? `<span class="dot ${peer.status}"></span>`:'';
      const avbg = ai? '#7a4ecc' : (peer? colorOf(c.peerId) : 'var(--accent)');
      const ic = ai? '🤖' : (peer? esc(initials(c.title)) : '#');
      return `<div class="row ${CUR===c.id?'on':''} ${ai?'ai':''}" onclick="openChannel(${c.id})">
        <div class="av" style="background:${avbg}">${ic}${dot}</div>
        <div class="nm"><b>${esc(c.title)}</b><span>${esc((c.lastBody||'').slice(0,42))||'Спросите о данных ЦУП'}</span></div>
        <div class="meta"><span class="tm">${c.lastAt?fmtTime(c.lastAt):''}</span>${c.unread>0?`<span class="badge">${c.unread}</span>`:''}</div></div>`;
    }).join('') || '<div class="empty">Чатов пока нет. Откройте вкладку «Люди» и напишите коллеге.</div>';
  }
  list.innerHTML=html;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on'); TAB=t.dataset.tab; renderList(); });
document.getElementById('q').addEventListener('input',()=>{ const q=document.getElementById('q').value.trim();
  if(q.length>=2 && TAB==='chats') searchMsgs(q); else renderList(); });

async function openDM(userId){
  const d = await api('POST','/dm',{userId}); if(!d||!d.ok) return;
  if(!CHANNELS.find(c=>c.id===d.channelId)){ const p=PEOPLE_BY_ID[userId]; CHANNELS.push({id:d.channelId,kind:'dm',title:p?p.name:'Диалог',peerId:userId,unread:0,lastBody:'',lastAt:new Date().toISOString(),members:[ME.id,userId]}); }
  TAB='chats'; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab==='chats'));
  openChannel(d.channelId);
}
let MSGS=[], REACTS={};
async function openChannel(id){
  if(CUR!==id) clearAgentTyping();
  CUR=id; REPLY=null; renderReply();
  const c=CHANNELS.find(x=>x.id===id);
  document.getElementById('chat').classList.remove('hide');
  document.getElementById('chTitle').textContent = c? c.title : 'Чат';
  const sub = c && c.kind==='ai' ? 'ИИ-ассистент · отвечает по данным ЦУП'
    : (c && c.kind==='dm' && PEOPLE_BY_ID[c.peerId] ? PRES_LBL[PEOPLE_BY_ID[c.peerId].status]
    : (c? ((c.members||[]).length+' участников'):'' ));
  document.getElementById('chSub').textContent = sub;
  if(c && c.kind==='ai') loadAgentBadge();
  document.getElementById('exportBtn').style.display='inline-flex';
  document.getElementById('gearBtn').style.display = (c && c.kind==='group') ? 'inline-flex' : 'none';
  input.placeholder = (c && c.kind==='ai') ? 'Спросите агента…' : 'Сообщение…';
  if(window.innerWidth<=760){ document.getElementById('side').classList.remove('show'); document.getElementById('chat').classList.remove('hide'); }
  renderList();
  const d = await api('GET','/channels/'+id+'/messages?limit=60'); if(!d||!d.ok) return;
  MSGS=d.messages; REACTS=d.reactions||{}; applyReceipts(d.receipts); applyPlayed(d.played);
  OLDEST = MSGS.length? MSGS[0].id : 0; NO_MORE_OLDER = MSGS.length<60; LOADING_OLDER=false;
  if(d.members && d.members.length){ const ch=CHANNELS.find(x=>x.id===id); if(ch) ch.members=d.members; }
  if(c){ c.locked=!!d.locked; c.iAmAdmin=!!d.iAmAdmin; }
  updateComposerLock();
  renderMsgs(true);
  const last = MSGS.length? MSGS[MSGS.length-1].id : 0;
  if(last){ api('POST','/read',{channelId:id,lastId:last}); const ch=CHANNELS.find(x=>x.id===id); if(ch) ch.unread=0; renderList(); }
}
// Подгрузка старых сообщений при прокрутке вверх (бесконечная история).
let OLDEST=0, LOADING_OLDER=false, NO_MORE_OLDER=false;
async function loadOlder(){
  if(LOADING_OLDER||NO_MORE_OLDER||!CUR||!OLDEST) return;
  LOADING_OLDER=true;
  const box=document.getElementById('msgs'); const prevH=box.scrollHeight, prevT=box.scrollTop;
  const r=await api('GET','/channels/'+CUR+'/messages?limit=40&before='+OLDEST);
  LOADING_OLDER=false;
  if(!r||!r.ok||!r.messages||!r.messages.length){ NO_MORE_OLDER=true; return; }
  const older=r.messages.filter(m=>!MSGS.find(x=>x.id===m.id));
  if(!older.length){ NO_MORE_OLDER=true; return; }
  MSGS=older.concat(MSGS); OLDEST=MSGS[0].id;
  if(r.reactions) REACTS=Object.assign(r.reactions, REACTS);
  if(r.messages.length<40) NO_MORE_OLDER=true;
  renderMsgs(false);
  // сохранить положение прокрутки (чтобы не «прыгало»)
  box.scrollTop = box.scrollHeight - prevH + prevT;
}
(function(){ const box=document.getElementById('msgs');
  box.addEventListener('scroll',()=>{ if(box.scrollTop<=48) loadOlder(); }); })();
function renderMsgs(scroll){
  const box=document.getElementById('msgs');
  if(!MSGS.length){ box.innerHTML='<div class="empty">Сообщений пока нет. Напишите первым — или спросите «@аи …».</div>'; return; }
  let html='', lastDay='', lastAuthor=null;
  if(NO_MORE_OLDER && MSGS.length>20) html+='<div class="day" style="opacity:.55">Начало переписки</div>';
  for(const m of MSGS){
    const dk=dayKey(m.created_at);
    if(dk!==lastDay){ html+=`<div class="day">${dayLabel(m.created_at)}</div>`; lastDay=dk; lastAuthor=null; }
    const mine = m.author_id===ME.id;
    const ai = m.kind==='ai';
    if(m.kind==='system'){ html+=`<div class="day">${esc(m.body||'')}</div>`; lastAuthor=null; continue; }
    const author = ai? 'Агент' : (m.author_name || (PEOPLE_BY_ID[m.author_id]&&PEOPLE_BY_ID[m.author_id].name) || 'Сотрудник');
    const cont = lastAuthor === (ai?'ai':m.author_id);
    lastAuthor = ai?'ai':m.author_id;
    const av = ai? '🤖' : esc(initials(author));
    const avbg = ai? '#7a4ecc' : colorOf(m.author_id);
    let inner='', voiceHeard=false;
    if(m.reply_to){ const rm=MSGS.find(x=>x.id===m.reply_to); if(rm) inner+=`<div class="reply">${esc((rm.author_name||'')+': '+(rm.body||'').slice(0,60))}</div>`; }
    if(!mine && !ai && !cont) inner+=`<div class="who">${esc(author)}</div>`;
    if(ai && !cont) inner+=`<div class="who">🤖 Агент ЦУП</div>`;
    if(m.kind==='file'){
      const isAudio=/^audio\//.test(m.att_type||'')||/\.(webm|ogg|m4a|mp3|wav)$/i.test(m.att_name||'');
      const isImg=/^image\//.test(m.att_type||'')||/\.(png|jpe?g|gif|webp)$/i.test(m.att_name||'');
      if(isAudio){
        const dur=m.att_duration?fmtDur(m.att_duration):'';
        voiceHeard=mine&&(PLAYED[m.id]||[]).some(u=>u!==ME.id);
        inner+=`<div class="voicewrap ${voiceHeard?'played':''}"><audio class="voicemsg" controls preload="metadata" src="/api/msg/file/${m.id}" onplay="onVoicePlay(${m.id})"></audio>${dur?`<span class="vdur">${dur}</span>`:''}</div>`;
      } else if(isImg){
        inner+=`<img class="imgmsg" src="/api/msg/file/${m.id}" alt="${esc(m.att_name||'изображение')}" loading="lazy" onclick="openImg('/api/msg/file/${m.id}')">`;
      } else {
        inner+=`<a class="filec" href="/api/msg/file/${m.id}" target="_blank" rel="noopener"><span style="font-size:20px">📄</span><div><b>${esc(m.att_name||'файл')}</b><span>${fmtBytes(m.att_size)}</span></div></a>`;
      }
      if(m.body) inner+=`<div class="tx" style="margin-top:5px">${fmtBody(m.body)}</div>`;
    } else {
      inner+=`<div class="tx">${fmtBody(m.body||'')}</div>`;
      if(ai && m.payload) inner+=aiExtra(m.payload);
    }
    inner+=reactsHtml(m.id);
    inner+=`<div class="tm">${fmtTime(m.created_at)}${(mine&&(m.kind==='text'||m.kind==='file')&&(curChannel()||{}).kind!=='ai')?statusHtml(m):''}${voiceHeard?'<span class="played-mark" title="Прослушано">🎧 прослушано</span>':''}</div>`;

const TICK1='<svg viewBox="0 0 16 11" class="tk"><path d="M1.5 6l3.2 3.4L10.8 2"/></svg>';
const TICK2='<svg viewBox="0 0 19 11" class="tk"><path d="M1.5 6l3.2 3.4L10.8 2"/><path d="M7 6l3.2 3.4L16.5 2"/></svg>';
function msgStatus(m){
  const others=chMembers(m.channel_id).filter(u=>u!==ME.id && u>0);
  const ptr=RCPT[m.channel_id]||{}; let delivered=0, read=0;
  for(const u of others){ const p=ptr[u]; if(p){ if((p.d||0)>=m.id) delivered++; if((p.r||0)>=m.id) read++; } }
  const total=others.length;
  let state='sent'; if(total>0&&read>=total) state='read'; else if(delivered>0) state='delivered';
  return {total,delivered,read,state};
}

  const icon=(s.state==='sent')?TICK1:TICK2;

  const title=s.state==='read'?'Прочитано':(s.state==='delivered'?'Доставлено':'Отправлено');
  return `<span class="st ${s.state}" id="st-${m.id}" title="${title}" onclick="showReceipts(${m.id});event.stopPropagation()">${icon}${cnt}</span>`;

function rcpTime(v){ if(!v) return ''; const x=new Date(v); const p=n=>String(n).padStart(2,'0');
  const sameDay=x.toDateString()===new Date().toDateString();
  return sameDay? `${p(x.getHours())}:${p(x.getMinutes())}` : `${p(x.getDate())}.${p(x.getMonth()+1)} ${p(x.getHours())}:${p(x.getMinutes())}`; }

// ── Автодополнение @упоминаний (агент + участники чата), как в WhatsApp ───────
let MENT={open:false,items:[],sel:0,start:-1};
const AGENT_KEYS=['аи','ии','ai','агент','agent','ассистент','assistant','бот'];
function mentionClose(){ MENT.open=false; MENT.start=-1; document.getElementById('mentionPop').style.display='none'; }
function mentionScan(){
  const pos=input.selectionStart||0, val=input.value;
  let i=pos-1;
  while(i>=0 && !/\s/.test(val[i]) && val[i]!=='@') i--;
  if(i<0 || val[i]!=='@'){ mentionClose(); return; }
  if(i>0 && !/\s/.test(val[i-1])){ mentionClose(); return; } // @ должен быть в начале слова
  const token=val.slice(i+1,pos).toLowerCase();
  if(/\s/.test(token)){ mentionClose(); return; }
  const items=[];
  const chUids=chMembers(CUR).filter(u=>u!==ME.id&&u>0);
  const chSet=new Set(chUids);
  // Агент ЦУП
  if(!token || AGENT_KEYS.some(k=>k.startsWith(token))) items.push({type:'agent',insert:'аи',name:'Агент ЦУП',sub:'ИИ-ассистент'});
  // @все — все участники чата (кроме себя), если их больше одного
  if(chUids.length>1 && (!token || 'все'.startsWith(token) || 'all'.startsWith(token)))
    items.push({type:'all',insert:'все',name:'Все участники',sub:chUids.length+' чел.',uids:chUids});
  // Отделы (теги), которые заданы админом — упоминаем тех, кто есть в этом чате
  for(const t of TEAMS){ const nm=t.name||''; const words=nm.toLowerCase().split(/\s+/);
    if(!token || nm.toLowerCase().includes(token) || words.some(w=>w.startsWith(token))){
      const inCh=(t.members||[]).filter(u=>chSet.has(u));
      items.push({type:'team',insert:nm,name:nm,sub:'отдел · '+(inCh.length||(t.members||[]).length)+' чел.',uids:inCh.length?inCh:(t.members||[])}); } }
  // Участники текущего чата (кроме себя)
  for(const u of chUids){ const p=PEOPLE_BY_ID[u]; if(!p) continue;
    const nm=p.name||''; const words=nm.toLowerCase().split(/\s+/);
    if(!token || nm.toLowerCase().includes(token) || words.some(w=>w.startsWith(token)))
      items.push({type:'user',insert:nm,name:nm,sub:p.title||'',uid:u}); }
  if(!items.length){ mentionClose(); return; }
  MENT={open:true,items:items.slice(0,8),sel:0,start:i};
  mentionRender();
}
function mentionRender(){
  const pop=document.getElementById('mentionPop');
  pop.innerHTML=MENT.items.map((it,idx)=>{
    const av=it.type==='agent'?'🤖':(it.type==='all'?'👥':(it.type==='team'?'🏢':esc(initials(it.name))));
    const bg=(it.type==='user')?`background:${colorOf(it.uid)}`:(it.type==='agent'?'background:#7a4ecc':'background:var(--surface-2);color:var(--text-2)');
    return `<div class="mi ${it.type==='agent'?'agent':''} ${idx===MENT.sel?'sel':''}" data-i="${idx}">
      <div class="av" style="${bg}">${av}</div>
      <div class="mnm">${esc(it.name)}</div>${it.sub?`<div class="msub">${esc(it.sub)}</div>`:''}</div>`;
  }).join('');
  pop.style.display='block';
  pop.querySelectorAll('.mi').forEach(el=>{ el.onmousedown=e=>{ e.preventDefault(); mentionPick(+el.dataset.i); }; });
}
function mentionPick(idx){
  const it=MENT.items[idx]; if(!it){ mentionClose(); return; }
  const pos=input.selectionStart||0, val=input.value;
  const before=val.slice(0,MENT.start), after=val.slice(pos);
  const insert='@'+it.insert+' ';
  input.value=before+insert+after;
  const caret=(before+insert).length;
  // Копим реальных получателей упоминания (для подсветки и уведомления)
  if(it.type==='user' && it.uid) PENDING_MENTIONS.add(it.uid);
  if((it.type==='all'||it.type==='team') && it.uids) it.uids.forEach(u=>PENDING_MENTIONS.add(u));
  mentionClose();
  input.focus(); input.setSelectionRange(caret,caret);
  input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,140)+'px';
}
async function send(){
  const body=input.value.trim(); if(!body||!CUR) return;
  // упоминания собираем при выборе из автодополнения; backend отфильтрует до участников чата
  const mentions = /@/.test(body) ? [...PENDING_MENTIONS] : [];

function onPaste(e){
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(const it of items){
    if(it.type&&it.type.indexOf('image')===0){
      const blob=it.getAsFile(); if(!blob) continue;
      e.preventDefault();
      const ext=((blob.type.split('/')[1])||'png').replace('jpeg','jpg');

      return;
    }
  }
}

let POLL=null;
function startPoll(){ if(POLL) clearInterval(POLL); pollOnce(); POLL=setInterval(pollOnce,3500); setInterval(()=>api('POST','/ping'),25000); }
async function pollOnce(){
  const d=await api('GET','/poll?since='+MAXID+(CUR?'&cur='+CUR:'')); if(!d||!d.ok) return;
  if(d.people){ PEOPLE=d.people; indexPeople(); if(TAB==='people') renderList(); refreshSub(); }
  if(d.receipts){ applyReceipts(d.receipts); updateStatuses(); }
  // «Прослушано» по голосовым текущего чата — перерисуем, если статус изменился.
  if(d.played && CUR && !SELMODE){ const before=JSON.stringify(PLAYED); applyPlayed(d.played); if(JSON.stringify(PLAYED)!==before) renderMsgs(false); }
  if(d.messages&&d.messages.length){
    let touched=false, curNew=false;
    for(const m of d.messages){
      MAXID=Math.max(MAXID,m.id);
      const ch=CHANNELS.find(c=>c.id===m.channel_id);
      if(ch){ ch.lastBody=m.body||(m.kind==='file'?'📄 файл':''); ch.lastAt=m.created_at; }
      else { touched=true; } // новый канал — перезагрузим bootstrap
      if(m.kind==='ai' && m.channel_id===AGENT_TYPING) clearAgentTyping();
      if(m.channel_id===CUR){ if(!MSGS.find(x=>x.id===m.id)){ MSGS.push(m); curNew=true; } }
      else if(ch && m.author_id!==ME.id){ ch.unread=(ch.unread||0)+1; }
    }
    if(touched){ const b=await api('GET','/bootstrap'); if(b&&b.ok){CHANNELS=b.channels;PEOPLE=b.people;indexPeople();} }
    if(curNew){ const r=await api('GET','/channels/'+CUR+'/messages?limit=60'); if(r&&r.ok){
        // merge: сохраняем уже подгруженную старую историю, обновляем свежие + реакции
        const byId={}; MSGS.forEach(m=>byId[m.id]=m); r.messages.forEach(m=>byId[m.id]=m);
        MSGS=Object.values(byId).sort((a,b)=>a.id-b.id); if(MSGS.length) OLDEST=MSGS[0].id;
        REACTS=Object.assign({}, REACTS, r.reactions||{}); applyReceipts(r.receipts); renderMsgs(true);
      } const last=MSGS.length?MSGS[MSGS.length-1].id:0; if(last) api('POST','/read',{channelId:CUR,lastId:last}); const cc=CHANNELS.find(x=>x.id===CUR); if(cc)cc.unread=0; }
    renderList();
  }
}

  ov.querySelector('#teamNew').onclick=()=>{ ov.remove(); teamEditModal(null); };
  ov.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ ov.remove(); teamEditModal(TEAMS.find(t=>t.id==b.dataset.edit)); });
  ov.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('Удалить отдел?')) return; const r=await api('POST','/teams/'+b.dataset.del+'/delete',{}); if(r&&r.ok){ ov.remove(); await reloadBootstrap(); teamsModal(); } else toast((r&&r.error)||'Ошибка'); });
}
function teamEditModal(team){
  const sel=new Set((team&&team.members)||[]);
  const opts=PEOPLE.map(p=>`<label class="pick"><input type="checkbox" value="${p.id}" ${sel.has(p.id)?'checked':''}><div class="av" style="width:30px;height:30px;font-size:12px;background:${colorOf(p.id)}">${esc(initials(p.name))}</div> <span>${esc(p.name)}</span></label>`).join('');
  const ov=makeOv(`<h3>${team?'Изменить отдел':'Новый отдел'}</h3><input type="text" id="tName" placeholder="Название отдела (например, Техотдел)" value="${team?esc(team.name):''}">
    <div style="font-size:11.5px;color:var(--text-3);margin:4px 2px">Кто входит в отдел:</div>
    <div style="max-height:44vh;overflow:auto;margin-bottom:12px">${opts}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="mbtn ghost" data-x>Отмена</button><button class="mbtn" id="tSave">Сохранить</button></div>`);
  ov.querySelector('#tSave').onclick=async()=>{ const name=ov.querySelector('#tName').value.trim(); if(!name){ov.querySelector('#tName').focus();return;} const memberIds=[...ov.querySelectorAll('input[type=checkbox]:checked')].map(x=>+x.value); const r=await api('POST','/teams',{id:team?team.id:0,name,memberIds}); if(r&&r.ok){ ov.remove(); await reloadBootstrap(); teamsModal(); } else toast((r&&r.error)||'Ошибка'); };
}
// Тост-уведомление
let TOAST_T=null;
function toast(msg){ let t=document.getElementById('msgToast'); if(!t){ t=document.createElement('div'); t.id='msgToast'; t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .18s'; document.body.appendChild(t); } t.textContent=msg; requestAnimationFrame(()=>t.style.opacity='1'); clearTimeout(TOAST_T); TOAST_T=setTimeout(()=>{t.style.opacity='0';},2200); }

// Диктовка текста голосом (Web Speech API, ru-RU) — микрофон СПРАВА в строке.
(function(){
  const dictBtn=document.getElementById('dictBtn'); const input=document.getElementById('input');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ dictBtn.style.display='none'; return; }
  let rec=null, active=false, baseText='';
  dictBtn.onclick=()=>{
    if(active){ try{rec.stop();}catch(e){} return; }
    rec=new SR(); rec.lang='ru-RU'; rec.interimResults=true; rec.continuous=false;
    baseText=input.value; if(baseText && !/\s$/.test(baseText)) baseText+=' ';
    rec.onstart=()=>{ active=true; dictBtn.classList.add('rec'); dictBtn.title='Остановить диктовку'; };
    rec.onend=()=>{ active=false; dictBtn.classList.remove('rec'); dictBtn.title='Надиктовать текст голосом'; input.focus(); input.dispatchEvent(new Event('input')); };
    rec.onerror=ev=>{ active=false; dictBtn.classList.remove('rec'); if(ev.error==='not-allowed'||ev.error==='service-not-allowed') toast('Нет доступа к микрофону'); };
    rec.onresult=ev=>{ let txt=''; for(let i=0;i<ev.results.length;i++) txt+=ev.results[i][0].transcript; input.value=baseText+txt; input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,140)+'px'; };
    try{ rec.start(); }catch(e){ toast('Не удалось запустить диктовку'); }
  };
})();

// Голосовые сообщения (запись аудио, opus/webm — компактно). Левый микрофон.
(function(){
  const micBtn=document.getElementById('micBtn'), recBar=document.getElementById('recBar');
  const recTime=document.getElementById('recTime'), recSend=document.getElementById('recSend'), recCancel=document.getElementById('recCancel');
  const comp=document.querySelector('.comp');
  if(!navigator.mediaDevices||!window.MediaRecorder){ micBtn.style.display='none'; return; }
  let mr=null, stream=null, chunks=[], t0=0, timer=null, cancelled=false;
  function pickMime(){ const c=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']; for(const m of c){ if(MediaRecorder.isTypeSupported(m)) return m; } return ''; }
  function fmt(s){ const m=Math.floor(s/60), ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
  function showRec(on){ recBar.style.display=on?'flex':'none'; document.getElementById('attachBtn').style.display=on?'none':''; micBtn.style.display=on?'none':''; document.querySelector('.inwrap').style.display=on?'none':''; document.getElementById('sendBtn').style.display=on?'none':''; }
  function stopTracks(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } clearInterval(timer); }
  async function start(){
    if(!CUR){ toast('Сначала откройте чат'); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ toast('Нет доступа к микрофону'); return; }
    const mime=pickMime(); chunks=[]; cancelled=false;
    try{ mr=new MediaRecorder(stream, Object.assign({audioBitsPerSecond:24000}, mime?{mimeType:mime}:{})); }
    catch(e){ try{ mr=new MediaRecorder(stream); }catch(e2){ toast('Запись не поддерживается'); stopTracks(); return; } }
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    mr.onstop=async()=>{
      stopTracks(); showRec(false);
      if(cancelled||!chunks.length) return;
      const type=(mr&&mr.mimeType)||mime||'audio/webm';
      const blob=new Blob(chunks,{type});
      if(blob.size<900){ toast('Слишком короткое сообщение'); return; }
      const ext=type.includes('ogg')?'ogg':(type.includes('mp4')?'m4a':'webm');
      const secs=Math.max(1,Math.round((Date.now()-t0)/1000));
      const fd=new FormData(); fd.append('file', blob, 'voice_'+Date.now()+'.'+ext); fd.append('duration', String(secs));
      const sendCh=CUR;
      const d=await api('POST','/channels/'+sendCh+'/file',fd,true);
      if(d&&d.ok){ const r=await api('GET','/channels/'+sendCh+'/messages?limit=60'); if(r&&r.ok&&sendCh===CUR){MSGS=r.messages;REACTS=r.reactions||{};applyReceipts(r.receipts);applyPlayed(r.played);renderMsgs(true);}
        // В чате с агентом — показать «Агент думает», пока идёт распознавание + ответ.
        if((CHANNELS.find(x=>x.id===sendCh)||{}).kind==='ai') setAgentTyping(sendCh);
      }
      else toast((d&&d.error)||'Не удалось отправить голосовое');
    };
    mr.start(); t0=Date.now(); showRec(true); recTime.textContent='0:00';
    timer=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); recTime.textContent=fmt(s); if(s>=300){ stop(); } },250);
  }
  function stop(){ if(mr&&mr.state!=='inactive'){ try{mr.stop();}catch(e){} } }
  function cancel(){ cancelled=true; stop(); }
  micBtn.onclick=start;
  recSend.onclick=stop;
  recCancel.onclick=cancel;
})();

if(window.innerWidth<=760) document.getElementById('backMob').style.display='inline-flex';

// Верхний ряд иконок — ЕДИНЫЙ порядок во всех модулях ЦУП + выравнивание по центру
// шапки. Порядок: Мессенджер · База знаний · Агент · Поиск · Помощь · Связь · Тема.
// Текущий модуль подсвечен. (см. такой же блок в knowledge.html и cup-mobile.js)
(function(){
  const TBST='border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer';
  const SVG={
    msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.8-4.9A7.5 7.5 0 1 1 20 11.5z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg>',
    kb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/></svg>'
  };
  const HERE=location.pathname||'';
  const ORDER=['pls-tb-msg','pls-tb-kb','pai-fab','pls-sr-btn','pls-help-btn','pls-fb-btn','themeToggle'];
  let isAdmin=false;
  fetch('/auth/me',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{const role=(d&&d.user&&d.user.role)||'';isAdmin=(role==='admin'||role==='superadmin');build();}).catch(()=>{});
  function mk(id,href,title,svg,cur){ let a=document.getElementById(id); if(a) return a; a=document.createElement('a'); a.id=id; a.href=href; a.title=title; a.style.cssText=TBST; if(cur){a.style.color='var(--accent)';a.style.borderColor='var(--accent)';} a.innerHTML=svg; return a; }
  function align(bar){ const h=document.querySelector('.top')||document.querySelector('.topbar')||document.querySelector('header'); if(!h) return; const r=h.getBoundingClientRect(); const bh=bar.offsetHeight||30; bar.style.top=Math.max(4,Math.round(r.top+(r.height-bh)/2))+'px'; }
  function build(){
    let bar=document.getElementById('pls-toolbar');
    if(!bar){ bar=document.createElement('div'); bar.id='pls-toolbar'; document.body.appendChild(bar); }
    const m=mk('pls-tb-msg','/messenger.html','Мессенджер',SVG.msg,/messenger\.html/.test(HERE)); if(m.parentNode!==bar) bar.appendChild(m);
    if(isAdmin){ const k=mk('pls-tb-kb','/knowledge.html','База знаний',SVG.kb,/knowledge\.html/.test(HERE)); if(k.parentNode!==bar) bar.appendChild(k); }
    ['pai-fab','pls-sr-btn','pls-help-btn','pls-fb-btn','themeToggle'].forEach(id=>{ const el=document.getElementById(id); if(el && el.parentNode!==bar) bar.appendChild(el); });
    ORDER.forEach(id=>{ const el=document.getElementById(id); if(el && el.parentNode===bar) bar.appendChild(el); });
    align(bar);
  }
  [150,500,1200,2500,4000].forEach(t=>setTimeout(build,t));
  window.addEventListener('resize',()=>{ const b=document.getElementById('pls-toolbar'); if(b) align(b); });
})();

boot();
