<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП — Статистика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  color-scheme: dark;
  --bg:#14171d; --panel:#1b1f27; --panel-h:#20242e; --line:#2a2f3a; --line-2:#363c49;
  --text:#eef0f3; --text-dim:#a7afbd; --text-faint:#7a8291;
  --brand:#C53B2F; --brand-h:#d94737; --signal:#35d0c0; --signal-dim:rgba(53,208,192,.35);
  --warn:#e0a940; --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;}
.brand{display:flex;align-items:center;gap:16px;}
.brand a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.brand img{height:22px;width:auto;}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;}
.brand-name b{color:var(--brand);}
.backlink{font-size:12px;color:var(--text-dim);text-decoration:none;border:1px solid var(--line-2);padding:6px 12px;border-radius:7px;}
.backlink:hover{border-color:var(--signal);color:var(--text);}
.user-chip{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-dim);}
.logout-btn{border:1px solid var(--line-2);background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;}
.logout-btn:hover{border-color:var(--brand);color:var(--text);}

main{max-width:1200px;margin:0 auto;padding:28px;}
h1{font-family:var(--font-display);font-size:24px;font-weight:600;margin-bottom:4px;}
.sub{color:var(--text-dim);font-size:13.5px;margin-bottom:22px;}

.tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;}
.tab.on{color:var(--text);border-bottom-color:var(--brand);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.btn{font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;}
.btn-brand{background:var(--brand);color:#fff;}
.btn-brand:hover{background:var(--brand-h);}
.btn-ghost{background:transparent;border:1px solid var(--line-2);color:var(--text-dim);}
.btn-ghost:hover{border-color:var(--signal);color:var(--text);}
.fselect{padding:9px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:13.5px;}

table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:13px;}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);}
th:first-child,td:first-child{text-align:left;font-family:var(--font-body);}
th{color:var(--text-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
tr.pct-row td{color:var(--text-faint);font-size:12px;}
tr.total-row td{border-top:2px solid var(--line-2);font-weight:600;color:var(--signal);}
td.hi{color:var(--signal);font-weight:600;}

.list-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
.list-row:last-child{border-bottom:none;}
.list-name{font-weight:600;}
.list-meta{color:var(--text-dim);font-size:11.5px;}
.list-val{font-family:var(--font-mono);color:var(--signal);font-weight:600;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <a href="/"><img src="/assets/logo-icon.png" alt=""><span class="brand-name"><b>ЦУП</b> · ProLabSupport</span></a>
    <a href="/" class="backlink">← Все модули</a>
  </div>
  <div class="user-chip">
    <span id="userName"></span>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>
</div>

<main>
  <h1>Статистика продаж</h1>
  <p class="sub">Сводная статистика по всем воронкам продаж — производители, менеджеры, приборы, отделы.</p>

  <div class="card">
    <div class="row">
      <select class="fselect" id="fYear"></select>
      <button class="btn btn-brand" onclick="loadCurrent()">Обновить</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" data-tab="summary" onclick="switchTab('summary')">По производителям</div>
    <div class="tab" data-tab="managers" onclick="switchTab('managers')">По менеджерам</div>
    <div class="tab" data-tab="instruments" onclick="switchTab('instruments')">По приборам</div>
  </div>

  <div id="content"></div>
</main>

<script>
let currentTab = 'summary';
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(n){ return (n||0).toLocaleString('ru-RU', {maximumFractionDigits:0}); }
async function logout(){ await fetch('/auth/logout',{method:'POST'}); window.location.href='/login.html'; }

async function init(){
  const r = await fetch('/auth/me');
  if (!r.ok) { window.location.href='/login.html'; return; }
  const d = await r.json();
  document.getElementById('userName').innerHTML = `<b>${esc(d.user.displayName)}</b>`;

  const yearSel = document.getElementById('fYear');
  const nowYear = new Date().getFullYear();
  for (let y = nowYear; y >= nowYear - 3; y--) yearSel.innerHTML += `<option value="${y}">${y}</option>`;

  document.getElementById('content').innerHTML = '<div class="card" style="text-align:center;color:var(--text-dim)">Выберите год и нажмите «Обновить»</div>';
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab===tab));
  loadCurrent();
}

async function loadCurrent(){
  const year = document.getElementById('fYear').value;
  const wrap = document.getElementById('content');
  wrap.innerHTML = '<div class="card" style="text-align:center;color:var(--text-dim)">Считаю по данным Bitrix, это может занять минуту…</div>';
  try {
    const r = await fetch(`/api/stats/${currentTab}?year=${year}`);
    const d = await r.json();
    if (!r.ok) { wrap.innerHTML = `<div class="card" style="color:var(--brand-h)">${esc(d.error||'Ошибка')}</div>`; return; }
    if (currentTab==='summary') renderSummary(d);
    else if (currentTab==='managers') renderManagers(d);
    else if (currentTab==='instruments') renderInstruments(d);
  } catch(e) {
    wrap.innerHTML = '<div class="card" style="color:var(--brand-h)">Ошибка соединения</div>';
  }
}

function renderSummary(d){
  const wrap = document.getElementById('content');
  const cols = ['Common', ...d.manufacturers];
  const typeLabels = { Inst:'Инструменты', Spares:'Расходники', Training:'Обучение', Service:'Сервис' };

  let sumRows = '', pctRows = '';
  d.types.forEach(type => {
    const row = d.table[type];
    sumRows += `<tr><td>${typeLabels[type]}, тыс.тг</td>${cols.map(c => `<td>${money((row[c]||0)/1000)}</td>`).join('')}</tr>`;
    const common = row.Common || 1;
    pctRows += `<tr class="pct-row"><td>${typeLabels[type]}, %</td>${cols.map(c => `<td>${common ? Math.round((row[c]||0)/common*100) : 0}</td>`).join('')}</tr>`;
  });

  wrap.innerHTML = `
    <div class="card">
      <div style="margin-bottom:10px;font-size:12.5px;color:var(--text-dim)">${d.year} год · сделок учтено: ${d.dealCount}</div>
      <table>
        <thead><tr><th>${d.year}</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${sumRows}<tr><td style="padding-top:14px"></td></tr>${pctRows}</tbody>
      </table>
    </div>`;
}

function renderManagers(d){
  const wrap = document.getElementById('content');
  wrap.innerHTML = `<div class="card">` + d.managers.map(m => `
    <div class="list-row">
      <div>
        <div class="list-name">${esc(m.managerName)}</div>
        <div class="list-meta">${m.dealCount} сделок · средний чек ${money(m.avgCheckKzt)} ₸</div>
      </div>
      <div class="list-val">${money(m.totalKzt)} ₸</div>
    </div>`).join('') + `</div>`;
}

function renderInstruments(d){
  const wrap = document.getElementById('content');
  wrap.innerHTML = `<div class="card">` + d.instruments.map(i => `
    <div class="list-row">
      <div>
        <div class="list-name">${esc(i.instrumentName)}</div>
        <div class="list-meta">${esc(i.manufacturer)} · ${i.count} продаж · средний чек ${money(i.avgCheckKzt)} ₸</div>
      </div>
      <div class="list-val">${money(i.totalKzt)} ₸</div>
    </div>`).join('') + `</div>`;
}

init();
</script>
</body>
</html>
