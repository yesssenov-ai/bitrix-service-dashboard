<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП — Статистика продаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0e14;--panel:#141924;--panel-h:#1a2130;--line:#232c3d;--line-2:#2f3a4f;
  --text:#eef2f8;--dim:#8794ab;--dim2:#5b6884;--faint:#4a5468;
  --brand:#C53B2F;--brand-h:#e0553f;--signal:#35d0c0;--good:#3ddc84;--warn:#ffb020;--bad:#ff5b6e;
  --p10:#5b8cff;--p30:#7c6bff;--p60:#c06bff;--p80:#ff6bd6;--contract:#ffb020;--exec:#ff8c42;--won:#3ddc84;
  --fd:'Space Grotesk',sans-serif;--fb:'Inter',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;
  --radius:16px;
}
html,body{height:100%}
body{font-family:var(--fb);background:
  radial-gradient(1200px 600px at 12% -8%,rgba(197,59,47,.10),transparent 60%),
  radial-gradient(900px 600px at 100% 0,rgba(53,208,192,.08),transparent 55%),var(--bg);
  color:var(--text);min-height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:16px 26px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:22px}
.bn{font-family:var(--fd);font-weight:600;font-size:15px}.bn b{color:var(--brand)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);text-decoration:none;font-size:12.5px;border:1px solid var(--line);padding:7px 12px;border-radius:9px;white-space:nowrap}
.back:hover{color:var(--text);border-color:var(--line-2)}
.top .sp{margin-left:auto}
.who{font-size:13px;color:var(--dim)}.who b{color:var(--text)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{background:var(--panel-h);border-color:var(--line-2)}
.btn-p{background:linear-gradient(135deg,var(--brand),var(--brand-h));border-color:transparent}
.wrap{max-width:1320px;margin:0 auto;padding:6px 22px 70px}
.h1{font-family:var(--fd);font-size:27px;font-weight:700}
.sub{color:var(--dim);font-size:14px;margin:3px 0 18px}
select{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:9px 12px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:linear-gradient(160deg,var(--panel),rgba(20,25,36,.5));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--kc,var(--signal))}
.kpi .kv{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--kc,var(--text));letter-spacing:-.5px}
.kpi .kl{font-size:12px;color:var(--dim);margin-top:3px}
.kpi .ks{font-size:11px;color:var(--faint);margin-top:2px;font-family:var(--fm)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.card h3{font-family:var(--fd);font-size:14px;font-weight:600;margin-bottom:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.ffilters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ffilters select{font-size:13px;padding:8px 11px;max-width:230px}
.funnel{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:160px 1fr auto;align-items:center;gap:12px}
.frow .fl{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar{height:26px;border-radius:7px;background:var(--fc);display:flex;align-items:center;padding:0 10px;color:#0b0e14;font-weight:700;font-size:12px;min-width:34px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.frow .fv{font-family:var(--fm);font-size:12.5px;color:var(--dim);white-space:nowrap;text-align:right}
.frow .fv b{color:var(--text)}
.tabs{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:inherit;font-size:14px;font-weight:600;padding:10px 15px;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--brand)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--dim);cursor:pointer;transition:.15s}
.chip.on{background:rgba(53,208,192,.14);border-color:var(--signal);color:var(--signal)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand-h));color:#fff}
.search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:9px 13px;color:var(--text);font:inherit;font-size:13.5px}
.tscroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;z-index:3;background:var(--panel-h);color:var(--dim);font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:11px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
thead th.l{text-align:left;position:sticky;left:0;z-index:4}
thead th[onclick]{cursor:pointer}
tbody td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td.l{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;font-weight:500}
tbody tr:hover td{background:var(--panel-h)}
tbody tr:hover td.l{background:var(--panel-h)}
.pct{color:var(--faint);font-size:11px;margin-left:5px}
.z{color:var(--faint)}
.list{display:flex;flex-direction:column;gap:9px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:.15s}
.row:hover{border-color:var(--line-2)}
.rhead{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
.rname{font-weight:600;font-size:14.5px}
.rmeta{font-size:12px;color:var(--dim);margin-top:2px}
.rspacer{margin-left:auto}
.rsum{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--good);text-align:right;white-space:nowrap}
.rsub{font-size:11px;color:var(--faint);text-align:right;font-family:var(--fm)}
.rcaret{color:var(--dim);transition:transform .2s;font-size:12px}
.row.open .rcaret{transform:rotate(90deg)}
.rbody{display:none;padding:0 18px 16px;border-top:1px solid var(--line)}
.row.open .rbody{display:block}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.mcell{background:var(--panel-h);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.mcell .mv{font-family:var(--fd);font-weight:700;font-size:17px}
.mcell .ml{font-size:11px;color:var(--dim);margin-top:2px}
.breaks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:6px}
.brk h5{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-bottom:8px}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:12.5px}
.bar .bl{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.bar .bt{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--good));border-radius:4px}
.bar .bv{width:70px;text-align:right;font-family:var(--fm);font-size:11.5px;color:var(--text)}
.deals{margin-top:12px}
.deal{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:12.5px}
.deal .di{flex:1;min-width:0}
.deal .dt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal .dc{color:var(--dim);font-size:11px}
.deal .ds{font-family:var(--fm);color:var(--good);white-space:nowrap}
.cbadge{display:inline-block;padding:1px 9px;border-radius:20px;font-size:10.5px;font-weight:600;border:1px solid var(--line-2);margin-right:5px;background:rgba(255,255,255,.03)}
.cx{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10.5px;font-weight:700;background:rgba(255,176,32,.15);color:var(--warn);vertical-align:middle;margin-left:6px}
.cxbox{background:rgba(53,208,192,.08);border:1px solid rgba(53,208,192,.25);border-radius:10px;padding:10px 14px;margin:14px 0 4px;font-size:13px;color:var(--dim)}
.cxbox b{color:var(--text)}
.empty{color:var(--faint);text-align:center;padding:40px;font-size:14px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--signal);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{color:var(--faint);font-size:12px;margin:8px 2px}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="/assets/logo-icon.png" alt="" onerror="this.style.display='none'"><span class="bn"><b>ЦУП</b> · ProLabSupport</span></div>
  <a class="back" href="/portal.html">← Все модули</a>
  <span class="sp"></span>
  <span class="who" id="who">—</span>
  <button class="btn" onclick="logout()">Выйти</button>
</div>
<div class="wrap">
  <div class="h1">Статистика продаж</div>
  <div class="sub">Продажи, воронка, менеджеры, приборы, компании и сферы — по всем воронкам ProLabSupport.</div>
  <div class="toolbar">
    <select id="year" onchange="load()"></select>
    <button class="btn btn-p" onclick="load(true)">↻ Обновить</button>
    <button class="btn" id="resyncBtn" style="display:none" onclick="resync()">⟳ Пересинк из Битрикс</button>
    <span class="hint" style="margin:0">Продано = Контракт…Завершена · КП = стадии P60/P80</span>
  </div>
  <div id="content"><div class="spin"></div></div>
</div>
<script>
const F=n=>Math.round(n||0).toLocaleString('ru-RU').replace(/,/g,' ');
const M=n=>{n=n||0;if(Math.abs(n)>=1e9)return (n/1e9).toFixed(2)+' млрд';if(Math.abs(n)>=1e6)return (n/1e6).toFixed(1)+' млн';if(Math.abs(n)>=1e3)return (n/1e3).toFixed(0)+' тыс';return String(Math.round(n));};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct=(v,t)=>t?Math.round(v/t*100):0;
let BOARD=null, TAB='producers', DEPT='', INSTR='sold', CSEARCH='', EXPANDM={}, CX='all';
let FDEPT='', FMGR='', FMONTH='', FMANUF='', FINSTR='', IS_ADMIN=false, CONV=null, CONV_POLL=null;
let CO_YEAR=null, CO_DEPT='', CO_MGR='';
const MONTHS_RU=['','января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM=['','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

async function load(force){
  const y=(document.getElementById('year').value)||new Date().getFullYear();
  document.getElementById('content').innerHTML='<div class="spin"></div>';
  try{
    const me=await fetch('/auth/me');if(!me.ok){location.href='/login.html';return;}
    const u=await me.json();document.getElementById('who').innerHTML='<b>'+esc(u.user.displayName)+'</b>';
    if(u.user.role==='admin'){IS_ADMIN=true;document.getElementById('resyncBtn').style.display='';}
    const r=await fetch('/api/stats/board?year='+y+(force?'&force=1':''));
    if(!r.ok){document.getElementById('content').innerHTML='<div class="empty">Не удалось загрузить статистику.</div>';return;}
    BOARD=await r.json();
    fillYears();
    render();
  }catch(e){document.getElementById('content').innerHTML='<div class="empty">Ошибка: '+esc(e.message)+'</div>';}
}
function fillYears(){
  const sel=document.getElementById('year');if(sel.options.length)return;
  const years=(BOARD.years&&BOARD.years.length)?BOARD.years.slice():[BOARD.year];
  if(!years.includes(BOARD.year))years.unshift(BOARD.year);
  sel.innerHTML=years.map(y=>`<option value="${y}" ${y===BOARD.year?'selected':''}>${y}</option>`).join('');
}
function render(){
  const k=BOARD.kpi;
  const kpis=`<div class="kpis">
    <div class="kpi" style="--kc:var(--good)"><div class="kv">${M(k.soldSum)} ₸</div><div class="kl">Продано за ${BOARD.year}</div><div class="ks">${F(k.soldCount)} сделок</div></div>
    <div class="kpi" style="--kc:var(--good)"><div class="kv">${M(k.soldAvg)} ₸</div><div class="kl">Средний чек продажи</div></div>
    <div class="kpi" style="--kc:var(--p60)"><div class="kv">${M(k.kpSum)} ₸</div><div class="kl">Выдано КП (P60/P80)</div><div class="ks">${F(k.kpCount)} сделок</div></div>
    <div class="kpi" style="--kc:var(--signal)"><div class="kv">${F(k.companies)}</div><div class="kl">Компаний-покупателей</div></div>
    <div class="kpi" style="--kc:var(--warn)"><div class="kv">${F(k.managers)}</div><div class="kl">Менеджеров с продажами</div></div>
  </div>`;
  const tabs=`<div class="tabs">${tabBtn('producers','Производители')}${tabBtn('managers','Менеджеры')}${tabBtn('instruments','Приборы')}${tabBtn('companies','Компании')}${tabBtn('spheres','Сферы')}${tabBtn('conversions','Конверсии')}</div><div id="tab"></div>`;
  document.getElementById('content').innerHTML=kpis+'<div id="funnelWrap"></div>'+tabs;
  renderFunnel();
  renderTab();
}
const FLABELS={P10:'P10 · Новый лид',P30:'P30 · Задача принята',P60:'P60 · КП выставлено',P80:'P80 · Покупка ≤3 мес',CONTRACT:'Контракт',EXEC:'Исполнение',WON:'Завершена'};
const FSTEPS=['P10','P30','P60','P80','CONTRACT','EXEC','WON'];
function funnelFiltered(){
  let d=BOARD.funnelDeals||[];
  if(FDEPT)d=d.filter(x=>x.dept===FDEPT);
  if(FMGR)d=d.filter(x=>String(x.managerId)===FMGR);
  if(FMONTH)d=d.filter(x=>String(x.month)===FMONTH);
  if(FMANUF)d=d.filter(x=>x.manufacturer===FMANUF);
  if(FINSTR)d=d.filter(x=>x.instrument===FINSTR);
  return d;
}
function uniqSorted(arr){return [...new Set(arr)].filter(v=>v!=null&&v!=='').sort((a,b)=>String(a).localeCompare(String(b),'ru'));}
function renderFunnel(){
  const wrap=document.getElementById('funnelWrap');if(!wrap)return;
  const all=BOARD.funnelDeals||[];
  const depts=uniqSorted(all.map(d=>d.dept));
  const mgrMap={};all.forEach(d=>{if(d.managerId!=null)mgrMap[d.managerId]=d.manager;});
  const mgrs=Object.entries(mgrMap).sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'ru'));
  const months=[...new Set(all.map(d=>d.month).filter(Boolean))].sort((a,b)=>a-b);
  const manufs=uniqSorted(all.map(d=>d.manufacturer).filter(m=>m&&m!=='Не определено'));
  const instrs=uniqSorted(all.map(d=>d.instrument));
  const opt=(v,label,sel)=>`<option value="${esc(v)}" ${String(sel)===String(v)?'selected':''}>${esc(label)}</option>`;
  const filters=`<div class="ffilters">
    <select onchange="FDEPT=this.value;renderFunnel()"><option value="">Все отделы</option>${depts.map(d=>opt(d,d,FDEPT)).join('')}</select>
    <select onchange="FMGR=this.value;renderFunnel()"><option value="">Все менеджеры</option>${mgrs.map(([id,nm])=>opt(id,nm,FMGR)).join('')}</select>
    <select onchange="FMONTH=this.value;renderFunnel()"><option value="">Все месяцы</option>${months.map(m=>opt(m,MONTHS_NOM[m],FMONTH)).join('')}</select>
    <select onchange="FMANUF=this.value;renderFunnel()"><option value="">Все производители</option>${manufs.map(m=>opt(m,m,FMANUF)).join('')}</select>
    <select onchange="FINSTR=this.value;renderFunnel()"><option value="">Все приборы</option>${instrs.map(m=>opt(m,m,FINSTR)).join('')}</select>
    ${(FDEPT||FMGR||FMONTH||FMANUF||FINSTR)?'<button class="btn" onclick="FDEPT=FMGR=FMONTH=FMANUF=FINSTR=\'\';renderFunnel()">Сбросить</button>':''}
  </div>`;
  const deals=funnelFiltered();
  const rows=FSTEPS.map(s=>{const g=deals.filter(d=>d.step===s);return{step:s,label:FLABELS[s],count:g.length,sum:g.reduce((a,d)=>a+d.sum,0)};});
  const fmax=Math.max(1,...rows.map(f=>f.count));
  const fcol={P10:'var(--p10)',P30:'var(--p30)',P60:'var(--p60)',P80:'var(--p80)',CONTRACT:'var(--contract)',EXEC:'var(--exec)',WON:'var(--won)'};
  const active=FDEPT||FMGR||FMONTH||FMANUF||FINSTR;
  const asOf=fmtDate(new Date());
  wrap.innerHTML=`${filters}<div class="card"><h3>Воронка (данные на ${asOf})</h3><div class="funnel">${
    rows.map(f=>`<div class="frow"><div class="fl">${esc(f.label)}</div>
      <div class="fbar" style="width:${Math.max(4,f.count/fmax*100)}%;--fc:${fcol[f.step]}">${f.count}</div>
      <div class="fv"><b>${M(f.sum)} ₸</b></div></div>`).join('')
  }</div><div class="hint">${active?'Отфильтровано · '+deals.length+' сделок. ':''}Распределение сделок по текущим стадиям. Настоящие конверсии и время на стадиях — в Фазе 2 (сбор истории стадий).</div></div>`;
}
function fmtDate(d){return d.getDate()+' '+MONTHS_RU[d.getMonth()+1]+' '+d.getFullYear();}
const tabBtn=(k,l)=>`<button class="${TAB===k?'on':''}" onclick="setTab('${k}')">${l}</button>`;
function setTab(t){TAB=t;render();}

function renderTab(){
  const el=document.getElementById('tab');if(!el)return;
  if(TAB==='producers')el.innerHTML=renderProducers();
  else if(TAB==='managers')el.innerHTML=renderManagers();
  else if(TAB==='instruments')el.innerHTML=renderInstruments();
  else if(TAB==='companies')el.innerHTML=renderCompanies();
  else if(TAB==='spheres')el.innerHTML=renderSpheres();
  else if(TAB==='conversions')el.innerHTML=renderConversions();
}

function renderProducers(){
  const p=BOARD.producers;
  if(!p.types.length)return '<div class="empty">Нет продаж за этот год.</div>';
  const cols=[];
  p.parents.forEach(par=>{cols.push({key:par,parent:true});if(EXPANDM[par]&&p.groups[par].length>1)p.groups[par].forEach(sb=>cols.push({key:sb,parent:false}));});
  const colSum=c=>{if(c.parent)return p.types.reduce((s,t)=>s+p.groups[c.key].reduce((ss,sb)=>ss+(p.table[t][sb]||0),0),0);return p.types.reduce((s,t)=>s+(p.table[t][c.key]||0),0);};
  const cellVal=(t,c)=>c.parent?p.groups[c.key].reduce((s,sb)=>s+(p.table[t][sb]||0),0):(p.table[t][c.key]||0);
  const head=`<tr><th class="l">Направление</th><th>ВСЕ</th>${cols.map(c=>{
    const canExp=c.parent&&p.groups[c.key].length>1;
    return `<th ${canExp?`onclick="toggleM('${esc(c.key).replace(/'/g,"\\'")}')"`:''}>${canExp?(EXPANDM[c.key]?'▾ ':'▸ '):''}${esc(c.key)}</th>`;}).join('')}</tr>`;
  const body=p.types.map(t=>{
    const total=p.table[t].Common||0;
    return `<tr><td class="l">${esc(t)}</td><td><b>${M(total)}</b></td>${cols.map(c=>{
      const v=cellVal(t,c);return `<td>${v?M(v):'<span class="z">0</span>'}${v?`<span class="pct">${pct(v,total)}%</span>`:''}</td>`;}).join('')}</tr>`;
  }).join('');
  const totalAll=p.types.reduce((s,t)=>s+(p.table[t].Common||0),0);
  const foot=`<tr style="font-weight:700"><td class="l">Итого</td><td><b>${M(totalAll)}</b></td>${cols.map(c=>{const v=colSum(c);return `<td>${v?M(v):'<span class="z">0</span>'}<span class="pct">${pct(v,totalAll)}%</span></td>`;}).join('')}</tr>`;
  return `<div class="hint">Значения в ₸, в скобках — доля бренда в строке (от «ВСЕ»). Клик по бренду с ▸ — раскроются под-марки. Шапка закреплена.</div>
    <div class="tscroll"><table><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>`;
}

          <div class="mcell"><div class="mv">${m.count}</div><div class="ml">Сделок</div></div>
          <div class="mcell"><div class="mv">${M(m.avg)} ₸</div><div class="ml">Средний чек</div></div>
          <div class="mcell"><div class="mv">${m.depts.length}</div><div class="ml">Направлений</div></div>
        </div>
        <div class="breaks">${brk('По категориям',m.byCat,m.sum)}${brk('По отделам',m.byDept,m.sum)}${brk('По брендам',m.byManuf.slice(0,6),m.sum)}</div>

          ${dealsF.slice(0,40).map(d=>`<div class="deal"><div class="di"><div class="dt">${esc(d.instrument||d.title||'—')}</div><div class="dc">${esc(d.company)} · ${esc(d.dept)}${d.manufacturer&&d.manufacturer!=='Не определено'?' · '+esc(d.manufacturer):''}${d.date?' · '+d.date:''}</div></div><div class="ds">${M(d.sum)} ₸</div></div>`).join('')}

  return chips+'<div class="list" style="margin-top:14px">'+(rows||'<div class="empty">Нет менеджеров.</div>')+'</div>';

function renderInstruments(){

  </div>`).join('');

function setInstr(v){INSTR=v;renderTab();}

function aggCompanies(deals){
  const CAT_ORDER=['Приборы','Расходники','Услуги','Обучение'];
  const by={};
  for(const d of deals){
    const k=d.cId||d.co;
    if(!by[k])by[k]={companyId:d.cId,name:d.co,industry:d.ind,sum:0,count:0,byCat:{},byManuf:{},instruments:{}};
    const c=by[k];c.sum+=d.sum;c.count++;
    c.byCat[d.cat]=(c.byCat[d.cat]||0)+d.sum;
    c.byManuf[d.manuf]=(c.byManuf[d.manuf]||0)+d.sum;
    if(d.instr)c.instruments[d.instr]=(c.instruments[d.instr]||0)+d.sum;
    if(d.ind&&d.ind!=='Не указана')c.industry=d.ind;
  }
  const top=o=>Object.entries(o).map(([key,sum])=>({key,sum})).sort((a,b)=>b.sum-a.sum);
  return Object.values(by).map(c=>{
    const cats=CAT_ORDER.filter(k=>c.byCat[k]);
    return {companyId:c.companyId,name:c.name,industry:c.industry,sum:c.sum,count:c.count,
      avg:c.count?c.sum/c.count:0,byCat:top(c.byCat),byManuf:top(c.byManuf),
      topInstruments:top(c.instruments).slice(0,6),cats,complexity:cats.length};
  }).sort((a,b)=>b.sum-a.sum);
}
function renderCompanies(){
  if(CO_YEAR===null)CO_YEAR=String(BOARD.year);
  const src=BOARD.companyDeals||[];
  const cdepts=[...new Set(src.map(d=>d.dept))].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),'ru'));
  const cmgrMap={};src.forEach(d=>{if(d.mId!=null)cmgrMap[d.mId]=d.mgr;});
  const cmgrs=Object.entries(cmgrMap).sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'ru'));
  const years=(BOARD.years&&BOARD.years.length)?BOARD.years:[BOARD.year];
  const optc=(v,label,sel)=>`<option value="${esc(v)}" ${String(sel)===String(v)?'selected':''}>${esc(label)}</option>`;
  const filters=`<div class="ffilters">
    <select onchange="CO_YEAR=this.value;renderTab()"><option value="">Все годы</option>${years.map(y=>optc(y,y,CO_YEAR)).join('')}</select>
    <select onchange="CO_DEPT=this.value;renderTab()"><option value="">Все отделы</option>${cdepts.map(d=>optc(d,d,CO_DEPT)).join('')}</select>
    <select onchange="CO_MGR=this.value;renderTab()"><option value="">Все менеджеры</option>${cmgrs.map(([id,nm])=>optc(id,nm,CO_MGR)).join('')}</select>
    ${(CO_YEAR||CO_DEPT||CO_MGR)?'<button class="btn" onclick="CO_YEAR=\'\';CO_DEPT=CO_MGR=\'\';renderTab()">Сбросить</button>':''}
  </div>`;
  let deals=src;
  if(CO_YEAR)deals=deals.filter(d=>String(d.y)===CO_YEAR);
  if(CO_DEPT)deals=deals.filter(d=>d.dept===CO_DEPT);
  if(CO_MGR)deals=deals.filter(d=>String(d.mId)===CO_MGR);
  const base=aggCompanies(deals);
  const q=CSEARCH.toLowerCase();
  let list=base;
  if(q)list=list.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.industry||'').toLowerCase().includes(q));
  if(CX==='complex')list=list.filter(c=>c.complexity>=2);
  const complexCount=base.filter(c=>c.complexity>=2).length;
  const bar=filters+`<div class="toolbar">
    <input class="search" id="csearch" placeholder="Поиск компании или сферы…" value="${esc(CSEARCH)}" oninput="CSEARCH=this.value;renderTab();refocus()">
    <div class="seg"><button class="${CX==='all'?'on':''}" onclick="CX='all';renderTab()">Все компании</button><button class="${CX==='complex'?'on':''}" onclick="CX='complex';renderTab()">В комплексе · ${complexCount}</button></div>
  </div>`;
  if(!list.length)return bar+'<div class="empty">Ничего не найдено.</div>';
  const catColor={'Приборы':'var(--p10)','Расходники':'var(--good)','Услуги':'var(--warn)','Обучение':'var(--p60)'};
  const mixBadges=c=>c.cats.map(k=>`<span class="cbadge" style="border-color:${catColor[k]};color:${catColor[k]}">${k}</span>`).join('');
  const rows=list.slice(0,200).map((c,i)=>`<div class="row" id="co${i}">
    <div class="rhead" onclick="document.getElementById('co${i}').classList.toggle('open')">
      <div><div class="rname">${esc(c.name)}${c.complexity>=2?` <span class="cx">комплекс ×${c.complexity}</span>`:''}</div>
        <div class="rmeta">${esc(c.industry||'Сфера не указана')} · ${c.count} сделок · чек ${M(c.avg)} ₸</div>
        <div style="margin-top:6px">${mixBadges(c)}</div></div>
      <div class="rspacer"></div><div><div class="rsum">${M(c.sum)} ₸</div></div><span class="rcaret">▶</span>
    </div>
    <div class="rbody">
      ${c.complexity>=2?`<div class="cxbox">📦 Купили в комплексе: <b>${c.cats.join(' + ')}</b> — ${c.cats.length} категории на ${M(c.sum)} ₸</div>`:''}
      <div class="mini">${['Приборы','Расходники','Услуги','Обучение'].map(cat=>{const e=c.byCat.find(x=>x.key===cat);return `<div class="mcell"><div class="mv" style="color:${e?'var(--good)':'var(--faint)'}">${e?M(e.sum)+' ₸':'—'}</div><div class="ml">${cat}</div></div>`;}).join('')}</div>
      <div class="breaks">${brk('Топ приборы',c.topInstruments,c.sum)}${brk('Бренды',c.byManuf.slice(0,6),c.sum)}</div>
    </div>
  </div>`).join('');
  return bar+`<div class="hint">${list.length} компаний${list.length>200?' (показаны первые 200)':''}. «В комплексе» — компании, бравшие 2+ категории (прибор + расходка + сервис/обучение). Раскрой — разбивка по категориям, топ-приборы, бренды.</div><div class="list">`+rows+'</div>';
}
function refocus(){const s=document.getElementById('csearch');if(s){const v=s.value;s.focus();s.setSelectionRange(v.length,v.length);}}

function renderSpheres(){
  const list=BOARD.spheres;
  if(!list.length)return '<div class="empty">Нет данных по сферам.</div>';
  const rows=list.map((s,i)=>`<div class="row" id="sp${i}">
    <div class="rhead" onclick="document.getElementById('sp${i}').classList.toggle('open')">
      <div><div class="rname">${esc(s.industry)}</div><div class="rmeta">${s.companies} компаний · ${s.count} сделок · чек ${M(s.avg)} ₸</div></div>
      <div class="rspacer"></div><div><div class="rsum">${M(s.sum)} ₸</div><div class="rsub">${pct(s.sum,BOARD.kpi.soldSum)}% от продаж</div></div><span class="rcaret">▶</span>
    </div>
    <div class="rbody"><div class="mini" style="margin-top:14px">${['Приборы','Расходники','Услуги','Обучение'].map(cat=>{const e=s.byCat.find(x=>x.key===cat);return `<div class="mcell"><div class="mv" style="color:${e?'var(--good)':'var(--faint)'}">${e?M(e.sum)+' ₸':'—'}</div><div class="ml">${cat}</div></div>`;}).join('')}</div></div>
  </div>`).join('');

// ── Фаза 2: Конверсии и тайминги ──────────────────────────────────────────
const DN=v=>v==null?'—':(Math.round(v*10)/10)+' дн';
const fcolC={P10:'var(--p10)',P30:'var(--p30)',P60:'var(--p60)',P80:'var(--p80)',CONTRACT:'var(--contract)',WON:'var(--won)'};
function renderConversions(){
  if(!CONV||CONV.year!==BOARD.year){loadConversions();return '<div class="spin"></div>';}
  const backfill=IS_ADMIN?`<div class="toolbar"><button class="btn" id="bfBtn" onclick="backfillHistory()">⟳ Собрать историю стадий</button><span class="hint" id="bfStatus" style="margin:0"></span></div>`:'';
  if(CONV.error)return backfill+`<div class="empty">Ошибка: ${esc(CONV.error)}</div>`;
  if(!CONV.hasData)return backfill+`<div class="empty">История стадий ещё не собрана.<br>${IS_ADMIN?'Нажмите «Собрать историю стадий» — займёт несколько минут.':'Обратитесь к администратору, чтобы запустить сбор истории стадий.'}</div>`;
  if(!CONV.cohort)return backfill+`<div class="empty">Нет сделок, начавших воронку в ${BOARD.year}.</div>`;
  const h=CONV.headline,t=CONV.timings;
  const kpis=`<div class="kpis">
    <div class="kpi" style="--kc:var(--won)"><div class="kv">${h.leadToContract.rate}%</div><div class="kl">Лид → Контракт</div><div class="ks">${h.leadToContract.a} из ${h.leadToContract.b}</div></div>
    <div class="kpi" style="--kc:var(--p60)"><div class="kv">${h.leadToKp.rate}%</div><div class="kl">Лид → КП (P60)</div><div class="ks">${h.leadToKp.a} из ${h.leadToKp.b}</div></div>
    <div class="kpi" style="--kc:var(--contract)"><div class="kv">${h.kpToContract.rate}%</div><div class="kl">КП → Контракт</div><div class="ks">${h.kpToContract.a} из ${h.kpToContract.b}</div></div>
    <div class="kpi" style="--kc:var(--good)"><div class="kv">${DN(t.leadToContract.avg)}</div><div class="kl">Средний цикл (Лид→Контракт)</div><div class="ks">${t.leadToContract.n} сделок</div></div>
  </div>`;
  const fmax=Math.max(1,...CONV.funnel.map(f=>f.count));
  const funnel=`<div class="card"><h3>Конверсия воронки · когорта ${BOARD.year} (${CONV.cohort} сделок)</h3><div class="funnel">${
    CONV.funnel.map((f,i)=>`<div class="frow"><div class="fl">${esc(f.label)}</div>
      <div class="fbar" style="width:${Math.max(4,f.count/fmax*100)}%;--fc:${fcolC[f.step]}">${f.count}</div>
      <div class="fv"><b>${f.fromStart}%</b>${i>0?` <span class="pct">шаг ${f.fromPrev}%</span>`:''}</div></div>`).join('')
  }</div><div class="hint">Когорта = сделки, впервые вошедшие в воронку в ${BOARD.year}. «%» — доля от старта (P10), «шаг» — конверсия с предыдущей стадии.</div></div>`;
  const timings=`<div class="card"><h3>Среднее время на стадиях</h3><div class="mini">
    <div class="mcell"><div class="mv">${DN(t.p10p30.avg)}</div><div class="ml">P10 → P30</div></div>
    <div class="mcell"><div class="mv">${DN(t.p30p60.avg)}</div><div class="ml">P30 → P60 (до КП)</div></div>
    <div class="mcell"><div class="mv">${DN(t.p60p80.avg)}</div><div class="ml">P60 → P80</div></div>
    <div class="mcell"><div class="mv">${DN(t.p80contract.avg)}</div><div class="ml">P80 → Контракт</div></div>
    <div class="mcell"><div class="mv">${DN(t.kpToContract.avg)}</div><div class="ml">КП → Контракт</div></div>
    <div class="mcell"><div class="mv">${DN(t.contractToWon.avg)}</div><div class="ml">Контракт → Завершение</div></div>
  </div></div>`;
  return backfill+kpis+funnel+timings
    +convTable('Менеджеры',CONV.byManager)
    +convTable('Отделы',CONV.byDept)
    +convTable('Приборы (топ-40 по когорте)',CONV.byInstrument);
}
function convTable(title,rows){
  if(!rows||!rows.length)return '';
  const body=rows.map(r=>`<tr><td class="l">${esc(r.key)}</td>
    <td>${r.cohort}</td><td>${r.kp}</td><td>${r.contract}</td>
    <td><b>${r.convRate}%</b></td><td>${DN(r.avgToKp)}</td><td>${DN(r.avgCycle)}</td></tr>`).join('');
  return `<div class="card" style="padding-bottom:6px"><h3>${esc(title)} · конверсия и цикл</h3>
    <div class="tscroll"><table><thead><tr>
      <th class="l">${esc(title)}</th><th>Когорта</th><th>КП</th><th>Контракт</th><th>Конв.</th><th>Ср. до КП</th><th>Ср. цикл</th>
    </tr></thead><tbody>${body}</tbody></table></div></div>`;
}
async function loadConversions(){
  try{const r=await fetch('/api/stats/conversions?year='+BOARD.year);CONV=await r.json();if(!CONV.year)CONV.year=BOARD.year;}
  catch(e){CONV={year:BOARD.year,hasData:true,cohort:0,error:e.message};}
  if(TAB==='conversions'){const el=document.getElementById('tab');if(el)el.innerHTML=renderConversions();}
}
async function backfillHistory(){
  if(!confirm('Собрать историю стадий из Битрикс?\n\nПройдёт по всем сделкам и соберёт моменты входа в каждую стадию — нужно для реальных конверсий и таймингов. Идёт в фоне несколько минут. Повторный запуск безопасен (только новые записи).'))return;
  const b=document.getElementById('bfBtn');if(b){b.disabled=true;b.textContent='Запуск…';}
  try{await fetch('/api/stats/backfill-history',{method:'POST'});}catch(e){}
  pollBackfill();
}
function pollBackfill(){
  if(CONV_POLL)clearInterval(CONV_POLL);
  const tick=async()=>{
    let s;try{s=await (await fetch('/api/stats/backfill-status')).json();}catch(e){return;}
    const el=document.getElementById('bfStatus');
    if(el)el.textContent=s.running?`Собрано ${s.fetched||0} записей…`:(s.done?`Готово: ${s.fetched||0} записей. Обновляю…`:'');
    if(!s.running){clearInterval(CONV_POLL);CONV_POLL=null;const b=document.getElementById('bfBtn');if(b){b.disabled=false;b.textContent='⟳ Собрать историю стадий';}
      if(s.done){CONV=null;fetch('/api/stats/conversions?year='+BOARD.year+'&force=1').then(r=>r.json()).then(d=>{CONV=d;if(!CONV.year)CONV.year=BOARD.year;if(TAB==='conversions')renderTab();});}}
  };
  tick();CONV_POLL=setInterval(tick,3000);
}

function brk(title,entries,total){
  if(!entries||!entries.length)return '';
  const max=Math.max(1,...entries.map(e=>e.sum));
  return `<div class="brk"><h5>${title}</h5>${entries.map(e=>`<div class="bar"><div class="bl">${esc(e.key)}</div><div class="bt"><i style="width:${Math.max(3,e.sum/max*100)}%"></i></div><div class="bv">${M(e.sum)}</div></div>`).join('')}</div>`;
}

async function resync(){
  if(!confirm('Запустить полную пересинхронизацию сделок из Битрикс?\n\nЗаполнит новые поля (название компании, дата создания) и обновит все данные. Идёт в фоне ~несколько минут, прогресс — в логах Railway. После завершения нажмите «Обновить».'))return;
  const b=document.getElementById('resyncBtn');b.disabled=true;const old=b.textContent;b.textContent='Пересинк запущен…';
  try{const r=await fetch('/api/stats/resync',{method:'POST'});const d=await r.json();alert(d.note||'Запущено. Прогресс в логах Railway. Через несколько минут нажмите «Обновить».');}
  catch(e){alert('Ошибка запуска пересинка');}
  b.disabled=false;b.textContent=old;
}
async function logout(){await fetch('/auth/logout',{method:'POST'});location.href='/login.html';}
load();
</script>
