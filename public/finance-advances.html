<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП · Авансы</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#14171d;--bg2:#20242e;--card:#1b1f27;--border:#2a2f3a;--border2:#363c49;--text:#eef0f3;--text-2:#c3c9d3;--text-3:#8b93a3;--text-4:#616a78;--accent:#e5544a;--brand:#4098e6;--good:#3ddc84;--bad:#ef5a6a;--radius:12px;--font:'Inter',system-ui,sans-serif}
html[data-theme="light"]{--bg:#f5f6fa;--bg2:#eef0f7;--card:#fff;--border:#e3e6ef;--border2:#d0d4e4;--text:#111827;--text-2:#374151;--text-3:#6b7280;--text-4:#9ca3af;--accent:#C53B2F;--brand:#2563eb;--good:#059669;--bad:#dc2626}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
.header{background:var(--card);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;text-decoration:none;color:inherit}.logo img{height:24px}
.hbtn{font-size:12.5px;color:var(--text-3);text-decoration:none;border:1px solid var(--border2);padding:6px 12px;border-radius:8px;background:transparent;cursor:pointer;font-family:var(--font)}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hsub{font-size:13.5px;color:var(--text-3);font-weight:600}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
.asof{font-size:12px;color:var(--text-3)}
.mockbadge{font-size:11px;font-weight:700;color:var(--warn,#e0a940);border:1px solid var(--warn,#e0a940);border-radius:6px;padding:2px 8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:16px 16px 0;align-items:flex-end}
.fl{display:block;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
select,input[type=text]{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--text);font-family:var(--font);outline:none;min-width:140px}
select:focus,input:focus{border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:16px;overflow:hidden}
.thead,.trow{display:grid;grid-template-columns:1fr 150px 150px 150px 150px;align-items:center}
.thead{padding:8px 14px;border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);font-weight:700;position:sticky;top:0;background:var(--bg2);z-index:1}
.thead .num,.trow .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:calc(100vh - 220px)}
.trow{padding:4px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:default}
.trow.lv0{background:var(--bg2);font-weight:700}
.trow.lv1{font-weight:600}
.trow.lv3{color:var(--text-2)}
.trow:hover{background:var(--bg2)}
.lbl{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:14px;display:inline-block;color:var(--text-3);cursor:pointer;user-select:none;flex:0 0 14px}
.foot{display:grid;grid-template-columns:1fr 150px 150px 150px 150px;padding:9px 14px;border-top:2px solid var(--border2);font-weight:700;font-size:12.5px;background:var(--card);position:sticky;bottom:0}
.foot .num{text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--text-3);padding:20px}
.neg{color:var(--bad)}
</style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><img src="/assets/logo-icon.png" alt="">ProLabSupport</a>
  <a href="/" class="hbtn">← Все модули</a>
  <span class="hsub">Авансы</span>
  <div class="hr">
    <span class="asof" id="asof"></span>
    <span class="mockbadge" id="mockBadge" style="display:none">демо-данные</span>
    <button class="hbtn" onclick="expandAll(true)">Развернуть</button>
    <button class="hbtn" onclick="expandAll(false)">Свернуть</button>
    <button class="hbtn" id="refreshBtn" onclick="refresh()">↻ Обновить</button>
    <button class="hbtn" onclick="logout()">Выйти</button>
  </div>
</header>

<div class="filters">
  <div><label class="fl">Год</label><select id="fYear" onchange="render()"><option value="">Все</option></select></div>
  <div><label class="fl">Отдел</label><select id="fDept" onchange="render()"><option value="">Все</option></select></div>
  <div><label class="fl">Контрагент</label><select id="fContractor" onchange="render()"><option value="">Все</option></select></div>
  <div style="flex:1;min-width:200px"><label class="fl">Поиск по договору</label><input type="text" id="fSearch" placeholder="Поиск…" oninput="render()" style="width:100%"></div>
</div>

<div class="card">
  <div class="thead"><span>Год · Отдел · Контрагент · Договор</span><span class="num">Сумма договора</span><span class="num">Авансы</span><span class="num">Оплаты</span><span class="num">Остаток</span></div>
  <div class="scroll" id="tree"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
let DATA={rows:[]}, EXP=new Set();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=n=>{n=Math.round(Number(n)||0);const s=Math.abs(n).toLocaleString('ru-RU').replace(/,/g,' ');return n<0?'<span class="neg">-'+s+'</span>':s;};
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/login.html';return{ok:false,d:{}}}let d={};try{d=await r.json()}catch(e){}return{ok:r.ok,d}}
async function boot(){const r=await fetch('/auth/me');if(!r.ok){location.href='/login.html';return;}await load();}
async function load(){
  const {ok,d}=await api('/api/finance/advances');
  if(!ok){document.getElementById('tree').innerHTML='<div class="hint">Ошибка загрузки</div>';return;}
  DATA=d;
  document.getElementById('asof').textContent=d.asOf?('По состоянию на '+new Date(d.asOf).toLocaleString('ru-RU')):'';
  document.getElementById('mockBadge').style.display=d.mock?'inline-block':'none';
  const opt=a=>'<option value="">Все</option>'+(a||[]).map(x=>`<option>${esc(x)}</option>`).join('');
  document.getElementById('fYear').innerHTML=opt(d.filters.years);
  document.getElementById('fDept').innerHTML=opt(d.filters.departments);
  document.getElementById('fContractor').innerHTML=opt(d.filters.contractors);
  (d.filters.years||[]).forEach(y=>EXP.add('y:'+y)); // годы раскрыты по умолчанию
  render();
}
function filtered(){
  const y=document.getElementById('fYear').value,dep=document.getElementById('fDept').value,con=document.getElementById('fContractor').value;
  const q=(document.getElementById('fSearch').value||'').toLowerCase();
  return (DATA.rows||[]).filter(r=>(!y||String(r.year)===y)&&(!dep||r.department===dep)&&(!con||r.contractor===con)&&(!q||(r.contract||'').toLowerCase().includes(q)));
}
function agg(list){const a={contract_sum:0,advances:0,payments:0,balance:0};list.forEach(r=>{a.contract_sum+=r.contract_sum;a.advances+=r.advances;a.payments+=r.payments;a.balance+=r.balance;});return a;}
function nums(a){return `<span class="num">${fmt(a.contract_sum)}</span><span class="num">${fmt(a.advances)}</span><span class="num">${fmt(a.payments)}</span><span class="num">${fmt(a.balance)}</span>`;}
function toggle(k){if(EXP.has(k))EXP.delete(k);else EXP.add(k);render();}
function expandAll(on){EXP=new Set();if(on){const rows=filtered();rows.forEach(r=>{EXP.add('y:'+r.year);EXP.add('y:'+r.year+'|d:'+r.department);EXP.add('y:'+r.year+'|d:'+r.department+'|c:'+r.contractor);});}else{(DATA.filters.years||[]).forEach(y=>EXP.add('y:'+y));}render();}
function render(){
  const rows=filtered();
  const box=document.getElementById('tree');
  if(!rows.length){box.innerHTML='<div class="hint">Нет данных по фильтру.</div>';document.getElementById('foot').innerHTML='';return;}
  // группировка
  const byYear={};rows.forEach(r=>{(byYear[r.year]=byYear[r.year]||[]).push(r);});
  const years=Object.keys(byYear).sort((a,b)=>b-a);
  let html='';
  const chev=(k)=>`<span class="chev" onclick="toggle('${k.replace(/'/g,"\\'")}')">${EXP.has(k)?'▾':'▸'}</span>`;
  years.forEach(y=>{
    const yk='y:'+y, yl=byYear[y];
    html+=`<div class="trow lv0"><span class="lbl">${chev(yk)}${esc(y)}</span>${nums(agg(yl))}</div>`;
    if(!EXP.has(yk))return;
    const byDept={};yl.forEach(r=>{(byDept[r.department||'—']=byDept[r.department||'—']||[]).push(r);});
    Object.keys(byDept).sort().forEach(dep=>{
      const dk=yk+'|d:'+dep, dl=byDept[dep];
      html+=`<div class="trow lv1"><span class="lbl" style="padding-left:16px">${chev(dk)}${esc(dep)}</span>${nums(agg(dl))}</div>`;
      if(!EXP.has(dk))return;
      const byCon={};dl.forEach(r=>{(byCon[r.contractor||'—']=byCon[r.contractor||'—']||[]).push(r);});
      Object.keys(byCon).sort().forEach(con=>{
        const ck=dk+'|c:'+con, cl=byCon[con];
        html+=`<div class="trow lv2"><span class="lbl" style="padding-left:32px">${chev(ck)}${esc(con)}</span>${nums(agg(cl))}</div>`;
        if(!EXP.has(ck))return;
        cl.forEach(r=>{
          const deal=r.bitrix_deal_id?` <a href="https://crm.prolabsupport.kz/crm/deal/details/${esc(r.bitrix_deal_id)}/" target="_blank" style="color:var(--brand);text-decoration:none;font-size:11px">🔗</a>`:'';
          html+=`<div class="trow lv3"><span class="lbl" style="padding-left:52px" title="${esc(r.contract)}">${esc(r.contract)}${deal}</span>${nums(r)}</div>`;
        });
      });
    });
  });
  box.innerHTML=html;
  document.getElementById('foot').innerHTML=`<span>Итого</span>${nums(agg(rows))}`;
}
async function refresh(){const b=document.getElementById('refreshBtn');b.disabled=true;b.textContent='Обновляю…';await api('/api/finance/advances/refresh',{method:'POST'});await load();b.disabled=false;b.textContent='↻ Обновить';}
async function logout(){await fetch('/auth/logout',{method:'POST'});location.href='/login.html';}
boot();
</script>
</body>
</html>
