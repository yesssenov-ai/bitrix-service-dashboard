<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЦУП · Авансы</title>
<meta name="theme-color" content="#f6f7f9">
<script>(function(){try{var m=localStorage.getItem('pls-theme');document.documentElement.setAttribute('data-theme',m==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="/assets/cup-ui.css">
<script src="/assets/pls-flags.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Переведено на общую дизайн-систему cup-ui.css: карта токенов страницы → общие токены. */
:root{
  --bg2:var(--surface-2); --card:var(--surface);
  --border:var(--line); --border2:var(--line-2);
  --text-4:var(--text-faint);
  --brand:var(--accent); --brand-l:var(--accent-weak);
  --good-l:color-mix(in srgb, var(--good) 12%, var(--surface));
  --warn-l:color-mix(in srgb, var(--warn) 12%, var(--surface));
  --bad-l:color-mix(in srgb, var(--bad) 12%, var(--surface));
  --radius:var(--r); --font:var(--f-ui);
}
.header::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 35%,transparent))}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
.header{background:var(--card);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;text-decoration:none;color:inherit}.logo img{height:24px}
.hbtn{font-size:12.5px;color:var(--text-3);text-decoration:none;border:1px solid var(--border2);padding:6px 12px;border-radius:8px;background:transparent;cursor:pointer;font-family:var(--font)}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hsub{font-size:13.5px;color:var(--text-3);font-weight:600}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
.asof{font-size:12px;color:var(--text-3)}
.mockbadge{font-size:11px;font-weight:700;color:var(--warn,#e0a940);border:1px solid var(--warn,#e0a940);border-radius:6px;padding:2px 8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:16px 16px 0;align-items:flex-end}
.fl{display:block;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
select,input[type=text]{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--text);font-family:var(--font);outline:none;min-width:140px}
select:focus,input:focus{border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:16px;overflow:hidden}
.thead,.trow{display:grid;align-items:center}
.thead{padding:8px 14px;border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);font-weight:700;position:sticky;top:0;background:var(--bg2);z-index:1}
.thead .num,.trow .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:calc(100vh - 250px)}
.trow{padding:4px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:default}
.trow.lv0{background:var(--bg2);font-weight:700}
.trow.lv1{font-weight:600}
.trow.lv3{color:var(--text-2)}
.trow:hover{background:var(--bg2)}
.lbl{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:14px;display:inline-block;color:var(--text-3);cursor:pointer;user-select:none;flex:0 0 14px}
.foot{display:grid;padding:9px 14px;border-top:2px solid var(--border2);font-weight:700;font-size:12.5px;background:var(--card);position:sticky;bottom:0}
.foot .num{text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--text-3);padding:20px}
.neg{color:var(--bad)}
/* две панели: 1С + Excel */
.panes{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
@media(max-width:1050px){.panes{grid-template-columns:1fr}}
.pane{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.pane-h{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.pane-h .src{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px}
.src.c1{color:var(--info);background:color-mix(in srgb,var(--info) 12%,var(--surface))}
.src.cx{color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.p4 .thead,.p4 .trow,.p4 .foot{grid-template-columns:1fr 108px 88px 88px 102px}
.p3 .thead,.p3 .trow,.p3 .foot{grid-template-columns:1fr 128px 110px 118px}
.xplace{padding:44px 24px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.7}
.xplace b{color:var(--text-2)}
.reconbar{margin:16px 16px 0;padding:9px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:8px}
.reconbar .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:0 0 7px}
.reconbar .dot.ok{background:var(--good)}
.reconbar b{color:var(--text);font-variant-numeric:tabular-nums}
.reconbar .sep{color:var(--text-4)}
.pane-h .xmeta{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xup{font-size:11.5px;font-weight:600;color:var(--text-3);border:1px solid var(--border2);border-radius:7px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.xup:hover{border-color:var(--accent);color:var(--accent)}
.xerr{padding:7px 14px;font-size:12px;color:var(--bad);border-bottom:1px solid var(--border);background:var(--bad-l)}
.trow .sub{color:var(--text-4);font-size:11px;margin-left:6px}
.dl{color:var(--brand);text-decoration:none;font-size:11px;margin-left:4px}
</style>
</head>
<body>
<header class="header">
  <a href="/" class="logo"><img src="/assets/logo-icon.png" alt="">ProLabSupport</a>
  <a href="/" class="hbtn">← Все модули</a>
  <span class="hsub">Авансы</span>
  <div class="hr">
    <span class="asof" id="asof"></span>
    <span class="mockbadge" id="mockBadge" style="display:none">демо-данные</span>
    <button class="hbtn" onclick="expandAll(true)">Развернуть</button>
    <button class="hbtn" onclick="expandAll(false)">Свернуть</button>
    <button class="hbtn" id="refreshBtn" onclick="refresh()">↻ Обновить</button>
    <button class="hbtn" onclick="logout()">Выйти</button>
  </div>
</header>

<div class="filters">
  <div><label class="fl">Год</label><select id="fYear" onchange="render()"><option value="">Все</option></select></div>
  <div><label class="fl">Отдел</label><select id="fDept" onchange="render()"><option value="">Все</option></select></div>
  <div><label class="fl">Контрагент</label><select id="fContractor" onchange="render()"><option value="">Все</option></select></div>
  <div style="flex:1;min-width:200px"><label class="fl">Поиск по договору</label><input type="text" id="fSearch" placeholder="Поиск…" oninput="render()" style="width:100%"></div>
</div>

<div class="reconbar" id="reconbar"><span class="dot"></span>Сверка 1С ↔ Excel появится после загрузки файла бухгалтера.</div>

<div class="panes">
  <div class="pane p4">
    <div class="pane-h"><span class="src c1">1С</span>Данные 1С</div>
    <div class="thead"><span>Год · Отдел · Контрагент · Договор</span><span class="num">Сумма дог.</span><span class="num">Авансы</span><span class="num">Оплаты</span><span class="num">Остаток</span></div>
    <div class="scroll" id="tree"></div>
    <div class="foot" id="foot"></div>
  </div>
  <div class="pane p3">
    <div class="pane-h"><span class="src cx">Excel</span>Данные Excel · файл бухгалтера из Битрикса<span class="xmeta" id="xmeta"></span><label class="xup" id="xupBtn" style="display:none" title="Загрузить файл вручную (.xls/.xlsx), если автозабор с Диска не работает">Загрузить файл<input type="file" accept=".xls,.xlsx" style="display:none" onchange="uploadExcel(this)"></label></div>
    <div class="xerr" id="xerr" style="display:none"></div>
    <div class="thead"><span>Год · Отдел · Компания · Договор</span><span class="num">Сумма дог.</span><span class="num">Оплаты</span><span class="num">Остаток</span></div>
    <div class="scroll" id="treeX"></div>
    <div class="foot" id="footX"></div>
  </div>
</div>

<script>
let DATA={rows:[]}, EXP=new Set();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=n=>{n=Math.round(Number(n)||0);const s=Math.abs(n).toLocaleString('ru-RU').replace(/,/g,' ');return n<0?'<span class="neg">-'+s+'</span>':s;};
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location.href='/login.html';return{ok:false,d:{}}}let d={};try{d=await r.json()}catch(e){}return{ok:r.ok,d}}
let ME_ROLE='';
async function boot(){const r=await fetch('/auth/me');if(!r.ok){location.href='/login.html';return;}try{ME_ROLE=((await r.json()).user||{}).role||'';}catch(e){}
  if(ME_ROLE==='admin'||ME_ROLE==='superadmin')document.getElementById('xupBtn').style.display='';
  await load();}
async function load(){
  try{await PLSFlags.loadCountryMap();}catch(e){}
  loadExcel(); // правая панель грузится независимо от 1С
  await load1C();
}
async function load1C(){
  const {ok,d}=await api('/api/finance/advances');
  if(!ok){document.getElementById('tree').innerHTML='<div class="hint">Ошибка загрузки</div>';return;}
  d.excel=DATA.excel; DATA=d; LOADED1C=true;
  var _a=document.getElementById('asof');
  if(d.error){_a.innerHTML='Данные от '+(d.asOf?new Date(d.asOf).toLocaleString('ru-RU'):'—')+' · <span style="color:var(--bad)">⚠ обновить не удалось</span>';_a.title=String(d.error);}
  else{_a.textContent=d.asOf?('По состоянию на '+new Date(d.asOf).toLocaleString('ru-RU')):'';_a.title='';}
  document.getElementById('mockBadge').style.display=d.mock?'inline-block':'none';
  const opt=a=>'<option value="">Все</option>'+(a||[]).map(x=>`<option>${esc(x)}</option>`).join('');
  BASE1C={years:d.filters.years||[],departments:d.filters.departments||[],contractors:d.filters.contractors||[]};
  fillFilters();
  render();
}
let LOADED1C=false, BASE1C={years:[],departments:[],contractors:[]}, XLOADING=false;
// Фильтры = объединение значений 1С и файла; выбранное значение сохраняем.
function fillFilters(){
  const xr=(DATA.excel&&DATA.excel.configured&&DATA.excel.rows)||[];
  const un=(a,b)=>[...new Set([...(a||[]),...b].filter(v=>v!==null&&v!==''))];
  const opt=a=>'<option value="">Все</option>'+(a||[]).map(x=>`<option>${esc(x)}</option>`).join('');
  const set=(id,list)=>{const el=document.getElementById(id),v=el.value;el.innerHTML=opt(list);if(v&&list.map(String).includes(v))el.value=v;};
  const years=un(BASE1C.years,xr.map(r=>r.year)).sort((a,b)=>b-a);
  DATA.filters=DATA.filters||{}; DATA.filters.years=years;
  set('fYear',years);
  set('fDept',un(BASE1C.departments,xr.map(r=>r.department)).sort());
  set('fContractor',BASE1C.contractors);
  years.forEach(y=>{EXP.add('y:'+y);EXP.add('x|y:'+y);}); // годы раскрыты по умолчанию
}
async function loadExcel(){
  const {ok,d}=await api('/api/finance/advances/excel');
  DATA.excel=ok?d:{configured:false,error:(d&&d.error)||'не удалось загрузить'};
  fillFilters();
  if(LOADED1C)render(); else {renderExcel();renderRecon();}
}
// ── Правая панель: файл бухгалтера (год = лист файла, т.е. год исполнения) ──
const normCo=x=>String(x||'').toLowerCase().replace(/[«»"'`“”„]/g,' ').replace(/\b(тоо|ао|пао|ооо|ип|гу|ргп|ркп|на пхв|кгп|филиал|llp|ltd|too|jsc|llc|inc|чк|limited)\b/gi,' ').replace(/[^a-zа-яё0-9әғқңөұүһі]+/gi,' ').replace(/\s+/g,' ').trim();
function filteredX(){
  const ex=DATA.excel; if(!ex||!ex.configured)return [];
  const y=document.getElementById('fYear').value,dep=document.getElementById('fDept').value,con=document.getElementById('fContractor').value;
  const q=(document.getElementById('fSearch').value||'').toLowerCase(), nc=con?normCo(con):'';
  return (ex.rows||[]).filter(r=>(!y||String(r.year)===y)&&(!dep||r.department===dep)&&(!nc||normCo(r.company)===nc)&&(!q||(r.contract||'').toLowerCase().includes(q)||(r.company||'').toLowerCase().includes(q)));
}
function aggX(list){const a={contract_sum:0,payments:0,balance:0};list.forEach(r=>{a.contract_sum+=r.contract_sum;a.payments+=r.payments;a.balance+=r.balance;});return a;}
function numsX(a){return `<span class="num">${fmt(a.contract_sum)}</span><span class="num">${fmt(a.payments)}</span><span class="num">${fmt(a.balance)}</span>`;}
function renderExcel(){
  const ex=DATA.excel, box=document.getElementById('treeX'), foot=document.getElementById('footX');
  const meta=document.getElementById('xmeta'), err=document.getElementById('xerr');
  if(!ex||!ex.configured){
    meta.textContent='';
    err.style.display=ex&&ex.error?'':'none'; if(ex&&ex.error)err.textContent='Не удалось загрузить файл: '+ex.error;
    box.innerHTML='<div class="xplace">Файл бухгалтера ещё не загружен.<br>Нажмите <b>«Обновить»</b> — ЦУП заберёт «Анализ по Контрактам» с Диска Битрикса.<br>Если у вебхука нет права «Диск», администратор может загрузить файл кнопкой «Загрузить файл».</div>';
    foot.innerHTML='';return;
  }
  const when=ex.fileUpdated||ex.asOf;
  meta.textContent=(ex.fileName||'')+(when?' · изм. '+new Date(when).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'')+(ex.source==='upload'?' · загружен вручную':'');
  meta.title=meta.textContent;
  err.style.display=ex.error?'':'none'; if(ex.error)err.textContent='Последнее обновление не удалось ('+ex.error+') — показаны данные прошлой загрузки.';
  const rows=filteredX();
  if(!rows.length){box.innerHTML='<div class="hint">Нет данных по фильтру.</div>';foot.innerHTML='';return;}
  const by=(list,f)=>{const m={};list.forEach(r=>{const k=f(r);(m[k]=m[k]||[]).push(r);});return m;};
  const chev=k=>`<span class="chev" onclick="toggle('${k.replace(/'/g,"\\'")}')">${EXP.has(k)?'▾':'▸'}</span>`;
  let html='';
  const byYear=by(rows,r=>r.year);
  Object.keys(byYear).sort((a,b)=>b-a).forEach(y=>{
    const yk='x|y:'+y, yl=byYear[y];
    html+=`<div class="trow lv0"><span class="lbl">${chev(yk)}${esc(y)}</span>${numsX(aggX(yl))}</div>`;
    if(!EXP.has(yk))return;
    const byDept=by(yl,r=>r.department||'—');
    Object.keys(byDept).sort().forEach(dep=>{
      const dk=yk+'|d:'+dep, dl=byDept[dep];
      html+=`<div class="trow lv1"><span class="lbl" style="padding-left:16px">${chev(dk)}${esc(dep)}</span>${numsX(aggX(dl))}</div>`;
      if(!EXP.has(dk))return;
      const byCo=by(dl,r=>r.company||'—');
      Object.keys(byCo).sort().forEach(co=>{
        const ck=dk+'|c:'+co, cl=byCo[co];
        html+=`<div class="trow lv2"><span class="lbl" style="padding-left:32px">${chev(ck)}${flagByCompany(co)}${esc(co)}${cl.length>1?`<span class="sub">${cl.length}</span>`:''}</span>${numsX(aggX(cl))}</div>`;
        if(!EXP.has(ck))return;
        cl.forEach(r=>{
          const deal=r.bitrix_deal_id?`<a class="dl" href="https://crm.prolabsupport.kz/crm/deal/details/${esc(r.bitrix_deal_id)}/" target="_blank" title="Сделка в Битриксе">↗</a>`:'';
          const tip=[r.contract,r.date?('от '+fmtD(r.date)):'',r.kind,r.execution?('исполнение: '+r.execution):'',r.endUser?('конечный пользователь: '+r.endUser):''].filter(Boolean).join(' · ');
          html+=`<div class="trow lv3"><span class="lbl" style="padding-left:52px" title="${esc(tip)}">${esc(r.contract||'без номера')}${r.date?`<span class="sub">${fmtD(r.date)}</span>`:''}${deal}</span>${numsX(r)}</div>`;
        });
      });
    });
  });
  box.innerHTML=html;
  foot.innerHTML=`<span>Итого</span>${numsX(aggX(rows))}`;
}
const fmtD=iso=>{try{const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});}catch(e){return'';}};
// Сверка по текущему фильтру: суммы договоров, оплаты и остатки 1С ↔ Excel.
function renderRecon(){
  const bar=document.getElementById('reconbar'), ex=DATA.excel;
  if(!ex||!ex.configured){bar.innerHTML='<span class="dot"></span>Сверка 1С ↔ Excel появится после загрузки файла бухгалтера.';return;}
  const a=agg(filtered()), b=aggX(filteredX());
  const d=(x,y)=>{const v=Math.round(x-y);return v===0?'<span style="color:var(--good)">совпадает</span>':`расхождение <b>${fmt(v)}</b>`;};
  const same=Math.round(a.contract_sum-b.contract_sum)===0&&Math.round(a.balance-b.balance)===0;
  bar.innerHTML=`<span class="dot${same?' ok':''}"></span>Сверка по фильтру · Сумма дог.: 1С <b>${fmt(a.contract_sum)}</b> / Excel <b>${fmt(b.contract_sum)}</b> — ${d(a.contract_sum,b.contract_sum)} <span class="sep">|</span> Остаток: 1С <b>${fmt(a.balance)}</b> / Excel <b>${fmt(b.balance)}</b> — ${d(a.balance,b.balance)}`;
  bar.title='Год в 1С — по дате договора; год в файле бухгалтера — лист файла (год исполнения). Многолетние договоры в файле разнесены по годам.';
}
async function uploadExcel(inp){
  const f=inp.files&&inp.files[0]; inp.value=''; if(!f)return;
  const lab=document.getElementById('xupBtn'); const keep=lab.firstChild.textContent; lab.firstChild.textContent='Загружаю…';
  try{
    const base64=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]||'');fr.onerror=()=>no(fr.error);fr.readAsDataURL(f);});
    const {ok,d}=await api('/api/finance/advances/excel-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,base64})});
    if(!ok||!d.ok){alert('Не удалось загрузить: '+(d.error||'сервер не принял файл'));}
    else{await loadExcel();}
  }catch(e){alert('Ошибка: '+e.message);}
  finally{lab.firstChild.textContent=keep;}
}
function filtered(){
  const y=document.getElementById('fYear').value,dep=document.getElementById('fDept').value,con=document.getElementById('fContractor').value;
  const q=(document.getElementById('fSearch').value||'').toLowerCase();
  return (DATA.rows||[]).filter(r=>(!y||String(r.year)===y)&&(!dep||r.department===dep)&&(!con||r.contractor===con)&&(!q||(r.contract||'').toLowerCase().includes(q)));
}
function agg(list){const a={contract_sum:0,advances:0,payments:0,balance:0};list.forEach(r=>{a.contract_sum+=r.contract_sum;a.advances+=r.advances;a.payments+=r.payments;a.balance+=r.balance;});return a;}
function nums(a){return `<span class="num">${fmt(a.contract_sum)}</span><span class="num">${fmt(a.advances)}</span><span class="num">${fmt(a.payments)}</span><span class="num">${fmt(a.balance)}</span>`;}
function toggle(k){if(EXP.has(k))EXP.delete(k);else EXP.add(k);render();}
function expandAll(on){EXP=new Set();if(on){const rows=filtered();rows.forEach(r=>{EXP.add('y:'+r.year);EXP.add('y:'+r.year+'|d:'+r.department);EXP.add('y:'+r.year+'|d:'+r.department+'|c:'+r.contractor);});filteredX().forEach(r=>{const y='x|y:'+r.year,d=y+'|d:'+(r.department||'—');EXP.add(y);EXP.add(d);EXP.add(d+'|c:'+(r.company||'—'));});}else{(DATA.filters.years||[]).forEach(y=>{EXP.add('y:'+y);EXP.add('x|y:'+y);});}render();}
function render(){
  const rows=filtered();
  const box=document.getElementById('tree');
  renderExcel(); renderRecon();
  if(!rows.length){box.innerHTML='<div class="hint">Нет данных по фильтру.</div>';document.getElementById('foot').innerHTML='';return;}
  // группировка
  const byYear={};rows.forEach(r=>{(byYear[r.year]=byYear[r.year]||[]).push(r);});
  const years=Object.keys(byYear).sort((a,b)=>b-a);
  let html='';
  const chev=(k)=>`<span class="chev" onclick="toggle('${k.replace(/'/g,"\\'")}')">${EXP.has(k)?'▾':'▸'}</span>`;
  years.forEach(y=>{
    const yk='y:'+y, yl=byYear[y];
    html+=`<div class="trow lv0"><span class="lbl">${chev(yk)}${esc(y)}</span>${nums(agg(yl))}</div>`;
    if(!EXP.has(yk))return;
    const byDept={};yl.forEach(r=>{(byDept[r.department||'—']=byDept[r.department||'—']||[]).push(r);});
    Object.keys(byDept).sort().forEach(dep=>{
      const dk=yk+'|d:'+dep, dl=byDept[dep];
      html+=`<div class="trow lv1"><span class="lbl" style="padding-left:16px">${chev(dk)}${esc(dep)}</span>${nums(agg(dl))}</div>`;
      if(!EXP.has(dk))return;
      const byCon={};dl.forEach(r=>{(byCon[r.contractor||'—']=byCon[r.contractor||'—']||[]).push(r);});
      Object.keys(byCon).sort().forEach(con=>{
        const ck=dk+'|c:'+con, cl=byCon[con];
        html+=`<div class="trow lv2"><span class="lbl" style="padding-left:32px">${chev(ck)}${flagByCompany(con)}${esc(con)}</span>${nums(agg(cl))}</div>`;
        if(!EXP.has(ck))return;
        cl.forEach(r=>{
          const deal=r.bitrix_deal_id?` <a href="https://crm.prolabsupport.kz/crm/deal/details/${esc(r.bitrix_deal_id)}/" target="_blank" style="color:var(--brand);text-decoration:none;font-size:11px">🔗</a>`:'';
          html+=`<div class="trow lv3"><span class="lbl" style="padding-left:52px" title="${esc(r.contract)}">${esc(r.contract)}${deal}</span>${nums(r)}</div>`;
        });
      });
    });
  });
  box.innerHTML=html;
  document.getElementById('foot').innerHTML=`<span>Итого</span>${nums(agg(rows))}`;
}
// «Обновить» запускает ДВА независимых обновления: файл бухгалтера (Диск Битрикса) и 1С.
// Каждое обновляет свою панель, как только закончит; сбой одного не мешает другому.
async function refresh(){ refreshExcel(); refresh1C(); }
async function refreshExcel(){
  if(XLOADING)return; XLOADING=true;
  const meta=document.getElementById('xmeta'); const was=meta.textContent; meta.textContent='Обновляю файл…';
  let r; try{r=await api('/api/finance/advances/excel-refresh',{method:'POST'});}catch(e){r={ok:false,d:{error:String(e&&e.message||e)}};}
  XLOADING=false;
  await loadExcel();
  if(!r.ok||!r.d||r.d.ok===false){const err=document.getElementById('xerr');err.style.display='';err.textContent='Файл не обновился: '+((r.d&&r.d.error)||'ошибка')+(DATA.excel&&DATA.excel.configured?' — показаны данные прошлой загрузки.':'');}
  else if(!meta.textContent)meta.textContent=was;
}
async function refresh1C(){
  const b=document.getElementById('refreshBtn');b.disabled=true;b.textContent='Обновляю…';b.style.color='';b.title='';
  let r;try{r=await api('/api/finance/advances/refresh',{method:'POST'});}catch(e){r={ok:false,d:{error:String(e&&e.message||e)}};}
  await load1C();b.disabled=false;
  if(r&&r.d&&r.d.busy){b.textContent='⏳ Идёт обновление';b.style.color='';b.title=String(r.d.error||'Обновление уже идёт');setTimeout(()=>{if(b.textContent!=='Обновляю…'){b.textContent='↻ Обновить';b.style.color='';b.title='';}},5000);return;}
  let err=null;
  if(!r||r.ok===false)err=(r&&r.d&&r.d.error)||'сервер недоступен';
  else if(r.d&&r.d.error)err=r.d.error;
  else if(r.d&&r.d.ok===false)err='ошибка синхронизации';
  if(err){b.textContent='⚠ Не удалось';b.style.color='var(--bad)';b.title=String(err);}
  else if(r.d&&r.d.mock){b.textContent='↻ Обновить';b.title='демо-данные: 1С не подключена';}
  else{b.textContent='✓ Обновлено';b.style.color='var(--good)';}
  setTimeout(()=>{if(b.textContent!=='Обновляю…'){b.textContent='↻ Обновить';b.style.color='';b.title='';}},4000);
}
async function logout(){await fetch('/auth/logout',{method:'POST'});location.href='/login.html';}
boot();
</script>
