<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7f9">
<title>Тренинг-центр — ЦУП</title>
<script>(function(){try{var m=localStorage.getItem('pls-theme');document.documentElement.setAttribute('data-theme',m==='dark'?'dark':'light');}catch(e){}})();</script>
<link rel="stylesheet" href="/assets/cup-ui.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);min-height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:11px 16px;max-width:1500px;margin:0 auto}
.top a.back{color:var(--text-3);text-decoration:none;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;background:var(--surface)}
.top a.back:hover{color:var(--text);border-color:var(--text-3)}
.top h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .sp{flex:1}
.hint{color:var(--text-3);font-size:12px}
.wrap{max-width:1500px;margin:0 auto;padding:2px 16px 40px}
.secs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px}
.sec{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text-3);font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sec:hover{color:var(--text);border-color:var(--text-3)}
.sec.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sec .soon{font-size:9.5px;font-weight:700;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:2px 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.stat .n{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:11px;color:var(--text-3);margin-top:2px;font-weight:600}
.stat .n.accent{color:var(--accent)}
/* аналитика */
.an-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.panel .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.panel .ph .pt{font-size:13px;font-weight:800;letter-spacing:-.01em}
.panel .ph .pn{font-size:11.5px;color:var(--text-3);font-weight:700}
.bar-row{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:12px}
.bar-row .bl{width:42%;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bt{flex:1;background:var(--surface-2);border-radius:6px;height:8px;overflow:hidden}
.bar-row .bf{height:100%;border-radius:6px;background:var(--accent);min-width:2px}
.bar-row .bv{width:42px;text-align:right;font-weight:800;color:var(--text)}
.an-empty{color:var(--text-3);font-size:12px;padding:5px 2px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:13px;padding:7px 11px 7px 32px;outline:none}
.search input:focus{border-color:var(--accent-line)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-3)}
.fchips{display:flex;gap:5px}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--text-3);font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer}
.fchip:hover{color:var(--text);border-color:var(--text-3)}
.fchip.on{background:var(--accent-weak);color:var(--accent);border-color:var(--accent-line)}
.btn-primary{border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary:hover{filter:brightness(1.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:10px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;transition:border-color .12s,box-shadow .12s;cursor:pointer}
.cc:hover{border-color:var(--line-2);box-shadow:0 2px 10px rgba(20,25,35,.06)}
.cc .ct{font-size:13.5px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.cc .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cc .client{font-size:12.5px;color:var(--text);font-weight:700}
.cc .sub{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cc .sub .dot{width:3px;height:3px;border-radius:50%;background:var(--text-faint)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.pill.held{background:color-mix(in srgb,#1a7f54 13%,var(--surface));color:#1a7f54;border:1px solid color-mix(in srgb,#1a7f54 28%,var(--line))}
.pill.plan{background:color-mix(in srgb,#2763d6 12%,var(--surface));color:#2763d6;border:1px solid color-mix(in srgb,#2763d6 28%,var(--line))}
.pill.lead{background:var(--surface-2);color:var(--text-3);border:1px solid var(--line)}
.pill.m{background:var(--surface-2);color:var(--text-3);border:1px solid var(--line)}
.pill.cert{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);border:1px solid var(--accent-line)}
.cc .foot{display:flex;align-items:center;gap:8px;margin-top:1px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3)}
.cc .foot b{color:var(--text);font-weight:800}
.empty{color:var(--text-3);font-size:12.5px;text-align:center;padding:34px 10px;border:1.5px dashed var(--line);border-radius:12px}
.soon-box{color:var(--text-3);font-size:13px;text-align:center;padding:44px 16px;border:1.5px dashed var(--line-2);border-radius:14px;background:var(--surface)}
.soon-box b{color:var(--text);font-weight:800;display:block;font-size:14px;margin-bottom:6px}
.ov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px}
.modal{width:100%;max-width:540px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.3);max-height:86vh;overflow:auto}
.modal .mh{display:flex;gap:8px;padding:14px 15px 4px;align-items:flex-start}
.modal .mh h2{font-size:15px;font-weight:800;margin:0;flex:1;letter-spacing:-.01em}
.modal .x{background:none;border:0;color:var(--text-3);font-size:21px;cursor:pointer;line-height:1;height:26px}
.modal .body{padding:6px 15px 14px;display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fld .l{font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.in{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:13px;padding:7px 9px;outline:none;width:100%}
.in:focus{border-color:var(--accent-line)}
textarea.in{resize:vertical;min-height:48px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:16px;height:16px}
.parts{display:flex;flex-direction:column;gap:5px}
.p-item{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px}
.p-item .pf{flex:1;min-width:0}
.p-item .pf b{font-weight:700}
.p-item .pf small{color:var(--text-3)}
.p-item button{background:none;border:0;color:var(--text-faint);cursor:pointer;font-size:16px;line-height:1}
.p-add{display:grid;grid-template-columns:1.4fr 1.2fr 1fr auto;gap:6px}
.p-add .in{font-size:12.5px;padding:7px 9px}
.p-add button{border:1px dashed var(--line-2);background:none;color:var(--text-3);border-radius:9px;cursor:pointer;font-size:18px;width:38px}
.p-add button:hover{color:var(--accent);border-color:var(--accent-line)}
.mfoot{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding:10px 15px;position:sticky;bottom:0;background:var(--surface)}
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:inherit;font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--text-3)}
.btn.danger{color:#C53B2F;border-color:color-mix(in srgb,#C53B2F 30%,var(--line))}
.note{background:var(--accent-weak);border:1px solid var(--accent-line);color:var(--text);border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.note b{color:var(--accent)}
/* строчный вид */
.tc-tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px}
.tc-tbl thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-3);font-weight:700;padding:8px 11px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tc-tbl tbody td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
.tc-tbl tbody td:first-child{font-weight:700;max-width:420px}
.tc-tbl tbody tr:last-child td{border-bottom:0}
.tc-tbl tbody tr{cursor:pointer}
.tc-tbl tbody tr:hover{background:var(--surface-2)}
.vw-seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.vw-seg button{border:0;background:none;color:var(--text-3);font:inherit;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:6px;cursor:pointer}
.vw-seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(20,25,35,.08)}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.wrap{padding:4px 12px 48px}.grid{grid-template-columns:1fr}.fld.two{grid-template-columns:1fr}.p-add{grid-template-columns:1fr 1fr}.tc-tbl{font-size:12px}}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/portal.html">&larr; ЦУП</a>
  <h1>🎓 Тренинг-центр</h1>
  <span class="sp"></span>
  <span class="vw-seg" id="vwSeg"><button data-vw="cards">Карточки</button><button data-vw="rows">Строки</button></span>
  <span class="hint" style="margin-left:10px">Лаборатория и обучение ProLabTraining</span>
</div>
<div class="wrap">
  <div class="secs" id="secs">
    <button class="sec on" data-sec="training">Курсы</button>
    <button class="sec" data-sec="works">Работы</button>
    <button class="sec" data-sec="equipment">Приборы</button>
    <button class="sec" data-sec="stock">Склад</button>
    <button class="sec" data-sec="qms">СМК</button>
    <button class="sec" data-sec="analytics">Аналитика</button>
    <span style="width:1px;align-self:stretch;background:var(--line);margin:4px 4px"></span>
    <button class="sec" data-sec="team">Команда</button>
    <button class="sec" data-sec="cal">Календарь</button>
    <button class="sec" data-sec="needs">Потребности</button>
    <button class="sec" data-sec="lab">Лаборатория</button>
    <button class="sec" data-sec="ops">Операции</button>
    <button class="sec" data-sec="edu">Обучение</button>
  </div>

  <div id="view-training">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" placeholder="Поиск по курсу, заказчику, методу…" autocomplete="off">
      </div>
      <div class="fchips" id="fchips">
        <button class="fchip on" data-f="all">Все</button>
        <button class="fchip" data-f="held">Проведённые</button>
        <button class="fchip" data-f="plan">Запланированные</button>
        <button class="fchip" data-f="lead">Заявки</button>
      </div>
      <button class="btn-primary" id="addBtn" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>Курс</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="view-works" hidden>
    <div class="stats" id="wkStats"></div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="wkQ" placeholder="Поиск по работе, клиенту, методу, аналиту…" autocomplete="off">
      </div>
      <div class="fchips" id="wkFchips">
        <button class="fchip on" data-f="all">Все</button>
        <button class="fchip" data-f="active">В работе</button>
        <button class="fchip" data-f="done">Завершённые</button>
      </div>
      <button class="btn-primary" id="wkAddBtn" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>Работа</button>
    </div>
    <div class="grid" id="wkGrid"></div>
  </div>

  <div id="view-equipment" hidden>
    <div class="stats" id="eqStats"></div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="eqQ" placeholder="Поиск по прибору, модели, производителю, методу…" autocomplete="off">
      </div>
      <div class="fchips" id="eqFchips">
        <button class="fchip on" data-f="all">Все</button>
        <button class="fchip" data-f="spec">Спектрометрия</button>
        <button class="fchip" data-f="chrom">Хроматография</button>
        <button class="fchip" data-f="xray">Рентген</button>
        <button class="fchip" data-f="prep">Пробоподготовка</button>
      </div>
      <button class="btn-primary" id="eqAddBtn" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>Прибор</button>
    </div>
    <div class="grid" id="eqGrid"></div>
  </div>

  <div id="view-stock" hidden>
    <div class="stats" id="stStats"></div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="stQ" placeholder="Поиск по наименованию, группе, партномеру…" autocomplete="off">
      </div>
      <div class="fchips" id="stFchips">
        <button class="fchip on" data-f="all">Все</button>
        <button class="fchip" data-f="chem">Химия</button>
        <button class="fchip" data-f="std">Стандарты</button>
        <button class="fchip" data-f="glass">Посуда</button>
        <button class="fchip" data-f="cons">Расходники</button>
        <button class="fchip" data-f="low">Заканчивается</button>
      </div>
      <button class="btn-primary" id="stAddBtn" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>Позиция</button>
    </div>
    <div class="grid" id="stGrid"></div>
  </div>

  <div id="view-qms" hidden>
    <div class="stats" id="qStats"></div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="qQ" placeholder="Поиск по документу, пункту ISO, коду…" autocomplete="off">
      </div>
      <div class="fchips" id="qFchips">
        <button class="fchip on" data-f="all">Все</button>
        <button class="fchip" data-f="proc">Процедуры</button>
        <button class="fchip" data-f="rk">Руководства</button>
        <button class="fchip" data-f="form">Формы</button>
        <button class="fchip" data-f="draft">Черновики</button>
      </div>
      <button class="btn-primary" id="qAddBtn" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>Документ</button>
    </div>
    <div class="grid" id="qGrid"></div>
  </div>

  <div id="view-analytics" hidden>
    <div class="stats" id="anTiles"></div>
    <div class="an-grid" id="anBody"></div>
  </div>

  <div id="view-soon" hidden></div>
  <div id="view-team" hidden></div>
  <div id="view-cal" hidden></div>
  <div id="view-needs" hidden></div>
  <div id="view-lab" hidden></div>
  <div id="view-ops" hidden></div>
  <div id="view-edu" hidden></div>
</div>

<script>
const LEVEL = {basic:'Базовый',complex:'Комплексный'};
const ST = {held:{c:'held',t:'Проведён'},plan:{c:'plan',t:'План'},lead:{c:'lead',t:'Заявка'}};
const SOON = {
  qms:['СМК','Записи по ISO/IEC 17025: методы, формы, акты.'],
  analytics:['Аналитика','Объёмы, загрузка, суммы по курсам и работам.']
};
const esc = s => String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
/* ── Вид: карточки / строки (таблица) ── */
let VIEW=(()=>{try{return localStorage.getItem('tc-view')||'cards'}catch(e){return 'cards'}})();
function tcTable(list, cols, keyFn){
  return `<table class="tc-tbl"><thead><tr>${cols.map(c=>`<th>${c.h}</th>`).join('')}</tr></thead><tbody>${
    list.map(it=>`<tr data-id="${keyFn?keyFn(it):it.id}">${cols.map(c=>`<td>${c.c(it)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function tcRender(g, list, cardFn, cols, keyFn){
  if(!list.length){ g.style.display=''; g.innerHTML='<div class="empty">Ничего не найдено</div>'; return; }
  if(VIEW==='rows' && cols){ g.style.display='block'; g.innerHTML=tcTable(list, cols, keyFn); }
  else { g.style.display=''; g.innerHTML=list.map(cardFn).join(''); }
}
function rerenderAll(){
  try{renderGrid()}catch(e){} try{if(typeof wkLoaded!=='undefined'&&wkLoaded)renderWkGrid()}catch(e){}
  try{if(typeof eqLoaded!=='undefined'&&eqLoaded)renderEqGrid()}catch(e){} try{if(typeof stLoaded!=='undefined'&&stLoaded)renderStGrid()}catch(e){}
  try{if(typeof qLoaded!=='undefined'&&qLoaded)renderQGrid()}catch(e){}
}
function setView(v){ VIEW=v; try{localStorage.setItem('tc-view',v)}catch(e){}
  document.querySelectorAll('#vwSeg button').forEach(b=>b.classList.toggle('on',b.dataset.vw===v)); rerenderAll(); }
let TR=[], canEdit=false, filter='all', query='', editParts=[];

async function api(method, path, body){
  const r = await fetch('/api/tc'+path, {method, credentials:'same-origin',
    headers: body?{'Content-Type':'application/json'}:undefined, body: body?JSON.stringify(body):undefined});
  if (r.status===401){ location.href='/login.html'; return null; }
  return r.json().catch(()=>({ok:false}));
}
function methodsOf(t){ const m = (t.methods!=null?t.methods:t.method); return Array.isArray(m)?m:(m?[m]:[]); }

async function load(){
  const d = await api('GET','/trainings');
  if(!d||!d.ok){ document.getElementById('grid').innerHTML='<div class="empty">Не удалось загрузить курсы</div>'; return; }
  TR = d.items||[]; canEdit = !!d.canEdit;
  document.getElementById('addBtn').hidden = !canEdit;
  renderStats(); renderGrid();
}
function renderStats(){
  const total=TR.length;
  const parts=TR.reduce((a,x)=>a+((x.participants||[]).length||0),0);
  const hours=TR.filter(x=>x.status==='held').reduce((a,x)=>a+(+x.hours||0),0);
  const cert=TR.filter(x=>x.issued).length;
  document.getElementById('stats').innerHTML=[
    ['n',total,'Курсов всего'],['n',parts,'Участников'],
    ['n',hours,'Часов проведено'],['n accent',cert,'Сертификатов выдано']
  ].map(([c,n,l])=>`<div class="stat"><div class="${c}">${n}</div><div class="l">${l}</div></div>`).join('');
}
function card(t){
  const st=ST[t.status]||{c:'lead',t:t.status||'—'};
  const methods=methodsOf(t).map(m=>`<span class="pill m">${esc(m)}</span>`).join('');
  const lvl=LEVEL[t.level]||t.level||'';
  const sub=[t.dates_text,lvl,t.place].filter(Boolean).map(esc);
  const pn=(t.participants||[]).length;
  return `<div class="cc" data-id="${t.id}">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div class="ct">${esc(t.title)}</div><span class="pill ${st.c}">${st.t}</span>
    </div>
    <div class="row"><span class="client">${esc(t.client||'—')}</span>${t.issued?'<span class="pill cert">🏅 Сертификат</span>':''}</div>
    <div class="sub">${sub.join(' <span class="dot"></span> ')}</div>
    <div class="row">${methods}</div>
    <div class="foot"><span>👥 <b>${pn}</b> участн.</span><span>⏱ <b>${t.hours||'—'}</b> ч.</span></div>
  </div>`;
}
const TR_COLS=[
  {h:'Курс',c:t=>esc(t.title)},
  {h:'Заказчик',c:t=>esc(t.client||'—')},
  {h:'Даты',c:t=>esc(t.dates_text||'')},
  {h:'Статус',c:t=>{const s=ST[t.status]||{c:'lead',t:t.status};return `<span class="pill ${s.c}">${s.t}</span>`}},
  {h:'Участн.',c:t=>(t.participants||[]).length},
  {h:'Часы',c:t=>t.hours||'—'}
];
function renderGrid(){
  let list=TR.slice();
  if(filter!=='all') list=list.filter(t=>t.status===filter);
  if(query){const q=query.toLowerCase();list=list.filter(t=>(t.title+' '+t.client+' '+methodsOf(t).join(' ')+' '+(t.place||'')).toLowerCase().includes(q));}
  const order={held:0,plan:1,lead:2};
  list.sort((a,b)=>(order[a.status]??9)-(order[b.status]??9));
  const g=document.getElementById('grid');
  tcRender(g, list, card, TR_COLS);
}
function hideViews(){ ['view-training','view-works','view-equipment','view-stock','view-qms','view-analytics','view-soon'].forEach(id=>{const el=document.getElementById(id); if(el) el.hidden=true;}); }
function showSoon(key){
  hideViews();
  const v=document.getElementById('view-soon'); v.hidden=false;
  const s=SOON[key]||['Раздел','Скоро'];
  v.innerHTML=`<div class="soon-box"><b>${esc(s[0])}</b>${esc(s[1])}<br><br>Переносим следующими шагами — сначала бэкенд, затем раздел.</div>`;
}
function showTraining(){ hideViews(); document.getElementById('view-training').hidden=false; }
function showWorks(){ hideViews(); document.getElementById('view-works').hidden=false; if(!wkLoaded) loadWorks(); }
function showEquipment(){ hideViews(); document.getElementById('view-equipment').hidden=false; if(!eqLoaded) loadEquip(); }
function showStock(){ hideViews(); document.getElementById('view-stock').hidden=false; if(!stLoaded) loadStock(); }
function showQms(){ hideViews(); document.getElementById('view-qms').hidden=false; if(!qLoaded) loadQms(); }
async function showAnalytics(){
  hideViews(); document.getElementById('view-analytics').hidden=false;
  if(anLoaded){ return; }
  document.getElementById('anBody').innerHTML='<div class="empty">Загрузка сводки…</div>';
  await Promise.all([
    TR.length?Promise.resolve():load(),
    wkLoaded?Promise.resolve():loadWorks(),
    eqLoaded?Promise.resolve():loadEquip(),
    stLoaded?Promise.resolve():loadStock(),
    qLoaded?Promise.resolve():loadQms()
  ]);
  anLoaded=true; renderAnalytics();
}

function partRow(p,i){
  const sub=[p.org,p.pos].filter(Boolean).map(esc).join(' · ');
  const badges=[p.pay==='paid'?'оплачено':'',p.cert?('№'+esc(p.cert)):''].filter(Boolean).join(' · ');
  return `<div class="p-item"><div class="pf"><b>${esc(p.fio||'—')}</b>${sub?` <small>${sub}</small>`:''}${badges?`<br><small>${badges}</small>`:''}</div>${canEdit?`<button data-rm="${i}" title="Убрать">✕</button>`:''}</div>`;
}
function renderParts(){
  const box=document.getElementById('mParts');
  box.innerHTML = editParts.length?editParts.map(partRow).join(''):'<div style="color:var(--text-3);font-size:12.5px;padding:4px 2px">Пока нет участников</div>';
}
function openModal(t){
  t = t || {status:'plan',method:[],participants:[],hours:0};
  editParts = JSON.parse(JSON.stringify(t.participants||[]));
  const ro = !canEdit;
  const sel=(v,opts)=>opts.map(([k,l])=>`<option value="${k}"${v===k?' selected':''}>${l}</option>`).join('');
  const ov=document.createElement('div'); ov.className='ov'; ov.id='ov';
  ov.innerHTML=`<div class="modal"><div class="mh"><h2>${t.id?'Курс':'Новый курс'}</h2><button class="x" data-x>×</button></div>
    <div class="body">
      <div class="fld"><span class="l">Название</span><input class="in" id="f_title" value="${esc(t.title||'')}" ${ro?'disabled':''}></div>
      <div class="fld two">
        <div class="fld"><span class="l">Заказчик</span><input class="in" id="f_client" value="${esc(t.client||'')}" ${ro?'disabled':''}></div>
        <div class="fld"><span class="l">Даты</span><input class="in" id="f_dates" value="${esc(t.dates_text||'')}" ${ro?'disabled':''}></div>
      </div>
      <div class="fld two">
        <div class="fld"><span class="l">Статус</span><select class="in" id="f_status" ${ro?'disabled':''}>${sel(t.status,[['held','Проведён'],['plan','План'],['lead','Заявка']])}</select></div>
        <div class="fld"><span class="l">Уровень</span><select class="in" id="f_level" ${ro?'disabled':''}>${sel(t.level,[['','—'],['basic','Базовый'],['complex','Комплексный']])}</select></div>
      </div>
      <div class="fld two">
        <div class="fld"><span class="l">Часов</span><input class="in" id="f_hours" type="number" min="0" value="${t.hours||0}" ${ro?'disabled':''}></div>
        <div class="fld"><span class="l">Методы (через запятую)</span><input class="in" id="f_method" value="${esc(methodsOf(t).join(', '))}" ${ro?'disabled':''}></div>
      </div>
      <div class="fld"><span class="l">Место</span><input class="in" id="f_place" value="${esc(t.place||'')}" ${ro?'disabled':''}></div>
      <label class="chk"><input type="checkbox" id="f_issued" ${t.issued?'checked':''} ${ro?'disabled':''}> Сертификаты выданы</label>
      <div class="fld"><span class="l">Участники (<span id="pCount">${editParts.length}</span>)</span>
        <div class="parts" id="mParts"></div>
        ${ro?'':`<div class="p-add"><input class="in" id="pf_fio" placeholder="ФИО"><input class="in" id="pf_org" placeholder="Организация"><input class="in" id="pf_pos" placeholder="Должность"><button type="button" id="pAdd" title="Добавить">+</button></div>`}
      </div>
      <div class="fld"><span class="l">Заметки</span><textarea class="in" id="f_note" ${ro?'disabled':''}>${esc(t.note||'')}</textarea></div>
    </div>
    ${ro?'':`<div class="mfoot"><button class="btn btn-primary" id="mSave">Сохранить</button>${t.id?'<button class="btn danger" id="mDel">Удалить</button>':''}<span style="flex:1"></span><button class="btn" data-x>Отмена</button></div>`}
  </div>`;
  document.body.appendChild(ov);
  attachFiles(ov,'training',t.id,!ro);
  renderParts();
  ov.addEventListener('click',e=>{
    if(e.target===ov||e.target.hasAttribute('data-x')){ ov.remove(); return; }
    const rm=e.target.getAttribute && e.target.getAttribute('data-rm');
    if(rm!=null){ editParts.splice(+rm,1); renderParts(); document.getElementById('pCount').textContent=editParts.length; }
  });
  if(!ro){
    document.getElementById('pAdd').onclick=()=>{
      const fio=document.getElementById('pf_fio').value.trim();
      if(!fio) return;
      editParts.push({fio, org:document.getElementById('pf_org').value.trim(), pos:document.getElementById('pf_pos').value.trim(), pay:'', cert:''});
      document.getElementById('pf_fio').value=document.getElementById('pf_org').value=document.getElementById('pf_pos').value='';
      renderParts(); document.getElementById('pCount').textContent=editParts.length;
    };
    document.getElementById('mSave').onclick=()=>save(t.id, ov);
    if(t.id) document.getElementById('mDel').onclick=()=>del(t.id, ov);
  }
}
async function save(id, ov){
  const g=id=>document.getElementById(id);
  const body={
    title:g('f_title').value.trim(), client:g('f_client').value.trim(), dates_text:g('f_dates').value.trim(),
    status:g('f_status').value, level:g('f_level').value, hours:+g('f_hours').value||0,
    method:g('f_method').value.split(',').map(s=>s.trim()).filter(Boolean),
    place:g('f_place').value.trim(), issued:g('f_issued').checked, note:g('f_note').value.trim(),
    participants:editParts
  };
  if(!body.title){ alert('Укажите название курса'); return; }
  const btn=g('mSave'); btn.disabled=true; btn.textContent='Сохранение…';
  const d = id ? await api('PUT','/trainings/'+id, body) : await api('POST','/trainings', body);
  if(!d||!d.ok){ alert((d&&d.error)||'Не удалось сохранить'); btn.disabled=false; btn.textContent='Сохранить'; return; }
  ov.remove(); await load();
}
async function del(id, ov){
  if(!confirm('Удалить курс безвозвратно?')) return;
  const d = await api('DELETE','/trainings/'+id);
  if(!d||!d.ok){ alert((d&&d.error)||'Не удалось удалить (нужны права администратора)'); return; }
  ov.remove(); await load();
}

document.getElementById('secs').addEventListener('click',e=>{
  const b=e.target.closest('.sec'); if(!b)return;
  document.querySelectorAll('.sec').forEach(x=>x.classList.toggle('on',x===b));
  const sec=b.dataset.sec; if(sec==='training') showTraining(); else if(sec==='works') showWorks(); else if(sec==='equipment') showEquipment(); else if(sec==='stock') showStock(); else if(sec==='qms') showQms(); else if(sec==='analytics') showAnalytics(); else showSoon(sec);
  try{ history.replaceState(null,'','#'+sec); }catch(_){}
});

const WTYPE={demo:{t:'Демо',c:'m'},paid:{t:'Платная',c:'held'},train:{t:'Обучение',c:'plan'},rnd:{t:'НИОКР',c:'lead'},acc:{t:'17025',c:'cert'}};
const TYPE_STAGES={
  demo:['Приём проб','Пробоподготовка','Анализ','Отчёт клиенту','Передано в продажи'],
  paid:['Приём проб','Пробоподготовка','Анализ','Отчёт','Оплата и закрытие'],
  train:['Пробы получены','Анализ на курсе','Отчёт'],
  rnd:['Постановка задачи','План работ','Эксперименты','Отчёт','Решение по контракту'],
  acc:['Анализ заявки и приём проб','Пробоподготовка','Испытания','Протокол испытаний','Выдача и оплата']
};
let WK=[], wkCanEdit=false, wkLoaded=false, wkFilter='all', wkQuery='', wkEditId=null;
function stageInfo(w){
  const st=TYPE_STAGES[w.wtype]||[]; const done=st.length>0 && w.stage>=st.length;
  return {done, label: done?'Завершена':(st[w.stage]||('Этап '+w.stage)), cls: done?'held':'plan'};
}
function money(w){ return w.price>0?(Number(w.price).toLocaleString('ru-RU')+' '+(w.currency||'KZT')):''; }
async function loadWorks(){
  wkLoaded=true;
  const d=await api('GET','/works');
  if(!d||!d.ok){ document.getElementById('wkGrid').innerHTML='<div class="empty">Не удалось загрузить работы</div>'; return; }
  WK=d.items||[]; wkCanEdit=!!d.canEdit; document.getElementById('wkAddBtn').hidden=!wkCanEdit;
  renderWkStats(); renderWkGrid();
}
function renderWkStats(){
  const total=WK.length;
  const active=WK.filter(w=>!stageInfo(w).done).length;
  const samples=WK.reduce((a,w)=>a+(+w.samples||0),0);
  const paidSum=WK.reduce((a,w)=>a+(+w.price||0),0);
  document.getElementById('wkStats').innerHTML=[
    ['n',total,'Работ всего'],['n',active,'В работе'],
    ['n',samples,'Проб'],['n accent',paidSum?Number(paidSum).toLocaleString('ru-RU')+' ₸':'0','Сумма платных']
  ].map(([c,n,l])=>`<div class="stat"><div class="${c}" style="font-size:${String(n).length>8?'19px':'26px'}">${n}</div><div class="l">${l}</div></div>`).join('');
}
function workCard(w){
  const wt=WTYPE[w.wtype]||{t:w.wtype,c:'m'}; const si=stageInfo(w);
  const methods=methodsOf(w).map(m=>`<span class="pill m">${esc(m)}</span>`).join('');
  const sub=[w.matrix, w.analytes].filter(Boolean).map(esc);
  const foot=[`🧪 <b>${w.samples||0}</b> проб`]; if(money(w))foot.push(`<b>${esc(money(w))}</b>`); if(w.report_at)foot.push(`📄 ${esc(w.report_at)}`);
  return `<div class="cc" data-id="${w.id}">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div class="ct">${w.code?`<span style="color:var(--text-3);font-weight:700">${esc(w.code)}</span> · `:''}${esc(w.title||'—')}</div>
      <span class="pill ${si.cls}">${esc(si.label)}</span>
    </div>
    <div class="row"><span class="client">${esc(w.client||'—')}</span><span class="pill ${wt.c}">${esc(wt.t)}</span></div>
    ${sub.length?`<div class="sub">${sub.join(' <span class="dot"></span> ')}</div>`:''}
    <div class="row">${methods}</div>
    <div class="foot">${foot.map(x=>`<span>${x}</span>`).join('')}</div>
  </div>`;
}
const WK_COLS=[
  {h:'Код',c:w=>esc(w.code||'')},
  {h:'Название',c:w=>esc(w.title||'—')},
  {h:'Клиент',c:w=>esc(w.client||'')},
  {h:'Вид',c:w=>{const x=WTYPE[w.wtype]||{t:w.wtype,c:'m'};return `<span class="pill ${x.c}">${x.t}</span>`}},
  {h:'Этап',c:w=>{const si=stageInfo(w);return `<span class="pill ${si.cls}">${esc(si.label)}</span>`}},
  {h:'Проб',c:w=>w.samples||0},
  {h:'Отчёт',c:w=>esc(w.report_at||'')}
];
function renderWkGrid(){
  let list=WK.slice();
  if(wkFilter==='active') list=list.filter(w=>!stageInfo(w).done);
  else if(wkFilter==='done') list=list.filter(w=>stageInfo(w).done);
  if(wkQuery){const q=wkQuery.toLowerCase();list=list.filter(w=>((w.code||'')+' '+(w.title||'')+' '+(w.client||'')+' '+methodsOf(w).join(' ')+' '+(w.analytes||'')).toLowerCase().includes(q));}
  const g=document.getElementById('wkGrid');
  tcRender(g, list, workCard, WK_COLS);
}
function stageOptions(wtype,cur){
  const st=TYPE_STAGES[wtype]||[];
  let o=st.map((s,i)=>`<option value="${i}"${cur===i?' selected':''}>${esc(s)}</option>`).join('');
  o+=`<option value="${st.length}"${cur>=st.length?' selected':''}>Завершена</option>`;
  return o;
}

let EQ=[], eqCanEdit=false, eqLoaded=false, eqFilter='all', eqQuery='';
async function loadEquip(){
  eqLoaded=true;

function anPanel(title, sub, inner){ return `<div class="panel"><div class="ph"><span class="pt">${esc(title)}</span>${sub?`<span class="pn">${esc(sub)}</span>`:''}</div>${inner}</div>`; }
function anCountBy(arr, fn){ const m={}; arr.forEach(x=>{const k=fn(x); if(k==null||k==='')return; m[k]=(m[k]||0)+1;}); return m; }

let _fEntity=null,_fId=null,_fCanEdit=false;
function fmtBytes(n){ n=+n||0; if(n<1024)return n+' Б'; if(n<1048576)return (n/1024).toFixed(0)+' КБ'; return (n/1048576).toFixed(1)+' МБ'; }
function attachFiles(ov, entity, id, canEdit){
  if(!id) return;
  const body=ov.querySelector('.body'); if(!body) return;
  const fb=document.createElement('div'); fb.className='fld';
  fb.innerHTML='<span class="l">Файлы</span><div id="tcFilesBox" class="parts"></div>';
  body.appendChild(fb);
  _fEntity=entity; _fId=id; _fCanEdit=canEdit; loadFilesList();
}
async function loadFilesList(){
  const box=document.getElementById('tcFilesBox'); if(!box) return;
  box.innerHTML='<div class="an-empty">Загрузка…</div>';
  const d=await api('GET',`/${_fEntity}/${_fId}/files`);
  if(!d||!d.ok){ box.innerHTML='<div class="an-empty">Не удалось загрузить файлы</div>'; return; }
  const list=(d.items||[]).map(f=>`<div class="p-item"><div class="pf"><a href="/api/tc/files/${f.id}/download" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;text-decoration:none">${esc(f.filename)}</a> <small>${fmtBytes(f.size_bytes)}</small></div>${_fCanEdit?`<button data-fdel="${f.id}" title="Удалить">✕</button>`:''}</div>`).join('');
  let html=list||'<div class="an-empty">Файлов пока нет</div>';
  if(_fCanEdit){
    if(d.storageReady===false) html+='<div class="an-empty" style="color:#C53B2F">Хранилище не настроено — загрузка недоступна (нужны SUPABASE_URL и SUPABASE_SERVICE_ROLE_KEY)</div>';
    else html+=`<div class="p-add" style="grid-template-columns:1fr auto;margin-top:6px"><input type="file" id="tcFileInput" class="in" style="padding:5px"><button type="button" id="tcFileUp" title="Загрузить">⬆</button></div>`;
  }
  box.innerHTML=html;
  box.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>deleteFile(+b.getAttribute('data-fdel')));
  const up=document.getElementById('tcFileUp'); if(up) up.onclick=uploadFile;
}
async function uploadFile(){
  const inp=document.getElementById('tcFileInput'); if(!inp||!inp.files||!inp.files[0]) return;
  if(inp.files[0].size>25*1024*1024){ alert('Файл больше 25 МБ'); return; }
  const up=document.getElementById('tcFileUp'); up.disabled=true; up.textContent='…';
  const fd=new FormData(); fd.append('file', inp.files[0]);
  try{
    const r=await fetch(`/api/tc/${_fEntity}/${_fId}/files`,{method:'POST',credentials:'same-origin',body:fd});
    const d=await r.json().catch(()=>({ok:false}));
    if(!d.ok) alert(d.error||'Не удалось загрузить файл');
  }catch(e){ alert('Ошибка загрузки'); }
  await loadFilesList();
}
async function deleteFile(fid){
  if(!confirm('Удалить файл безвозвратно?')) return;
  const d=await api('DELETE','/files/'+fid);
  if(!d||!d.ok){ alert((d&&d.error)||'Не удалось удалить'); return; }
  await loadFilesList();
}

/* ══════════════════════════════════════════════════════════════════════════
   ТЦ Фазы 1–7 — универсальный движок разделов (лёгкий CRUD поверх /api/tc).
   Один код на все новые разделы: Команда, Календарь, Потребности,
   Лаборатория (пробы/методики/регламенты), Операции (колонки/логгеры),
   Обучение (заявки/сертификаты).
   ══════════════════════════════════════════════════════════════════════════ */
const PILL = { // статус → класс пилюли
  free:'held', busy:'cert', leave:'lead', remote:'plan', sick:'lead', off:'lead',
  received:'plan', in_work:'cert', done:'held', returned:'lead', disposed:'lead',
  'new':'plan', approved:'held', ordered:'cert', rejected:'lead', pending:'plan',
  active:'held', paused:'lead', urgent:'cert', normal:'m', checked:'held', closed:'lead',
};
const LBL = {
  free:'Свободен', busy:'Занят', leave:'Отпуск', remote:'Удалёнка', sick:'Больничный', off:'Нет на месте',
  vacation:'Отпуск', unpaid:'Без содержания',
  received:'Принята', in_work:'В работе', done:'Готова', returned:'Возвращена', disposed:'Утилизирована',
  'new':'Новая', approved:'Согласовано', ordered:'Заказано', rejected:'Отклонено', pending:'На согласовании',
  active:'Активен', paused:'Пауза', urgent:'Срочно', normal:'Обычно', checked:'Проверено', closed:'Закрыто',
  daily:'Ежедневно', weekly:'Еженедельно', monthly:'Ежемесячно',
  apply:'Заявка', test_pre:'Тест до', test_post:'Тест после', survey:'Анкета', reg:'Регистрация',
  work:'Работа', course:'Курс', equipment:'Прибор', office:'Офис',
};
const lbl = v => LBL[v] || v || '—';
const pill = (v) => `<span class="pill ${PILL[v]||'m'}">${esc(lbl(v))}</span>`;
const ESCV = s => esc(s==null?'':s);

/* Универсальный контроллер раздела. cfg:
   { key, ep, one, mount(elId), search:[keys], cols:[{h,c}], card(it),
     fields:[{k,l,t,opts,optsFn,ph}], required, stats(list), pillKey,
     rowActions(it), onAction(act,it) } */
function mkEntity(cfg){
  const S = { list:[], canEdit:false, q:'', loaded:false, rel:{} };
  const gid = cfg.key+'Grid', qid = cfg.key+'Q', aid = cfg.key+'Add';
  function toolbar(){
    return `<div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="${qid}" placeholder="Поиск…" autocomplete="off"></div>
      <span style="flex:1"></span>
      ${cfg.noAdd?'':`<button class="btn-primary" id="${aid}" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>${esc(cfg.one)}</button>`}
    </div>`;
  }
  function filtered(){
    const q = S.q.toLowerCase();
    if(!q) return S.list;
    const keys = cfg.search||[];
    return S.list.filter(it => keys.some(k => String(it[k]==null?'':it[k]).toLowerCase().includes(q)));
  }
  function render(){
    const g = document.getElementById(gid); if(!g) return;
    const list = filtered();
    if(cfg.stats){ const st=document.getElementById(cfg.key+'Stats'); if(st) st.innerHTML = cfg.stats(S.list)||''; }
    tcRender(g, list, cfg.card, cfg.cols, it=>it[cfg.rowKey||'id']);
  }
  async function load(){
    const d = await api('GET', cfg.ep);
    const g = document.getElementById(gid);
    if(!d||!d.ok){ if(g) g.innerHTML='<div class="empty">Не удалось загрузить</div>'; return; }
    S.list = d.items||[]; S.canEdit = !!d.canEdit; S.loaded = true;
    const ab=document.getElementById(aid); if(ab) ab.hidden = !S.canEdit;
    if(cfg.afterLoad) await cfg.afterLoad(S);
    render();
  }
  function build(host){
    host.innerHTML = (cfg.stats?`<div class="stats" id="${cfg.key}Stats"></div>`:'')
      + (cfg.head?cfg.head():'') + toolbar() + `<div class="grid" id="${gid}"></div>`;
    const qel=document.getElementById(qid); if(qel) qel.addEventListener('input',e=>{S.q=e.target.value.trim();render();});
    const ab=document.getElementById(aid); if(ab) ab.addEventListener('click',()=>openForm(null));
    const g=document.getElementById(gid);
    g.addEventListener('click',e=>{
      const act=e.target.closest('[data-act]');
      if(act){ e.stopPropagation(); cfg.onAction && cfg.onAction(act.getAttribute('data-act'), itemOf(act), reload); return; }
      const row=e.target.closest('[data-id]'); if(row) openForm(itemOf(row));
    });
  }
  function itemOf(el){ const k=el.getAttribute('data-id'); const rk=cfg.rowKey||'id'; return S.list.find(x=>String(x[rk])===k); }
  async function reload(){ await load(); }
  function fieldHtml(f, it){
    const v = f.get ? f.get(it) : it[f.k];
    const ro = (f.ro || !S.canEdit) ? 'disabled' : '';
    const val = v==null?'':v;
    if(f.t==='select'){ const opts=(f.optsFn?f.optsFn(S):f.opts)||[]; return `<select class="in" id="ef_${f.k}" ${ro}>${opts.map(([k,l])=>`<option value="${esc(k)}"${String(val)===String(k)?' selected':''}>${esc(l)}</option>`).join('')}</select>`; }
    if(f.t==='textarea') return `<textarea class="in" id="ef_${f.k}" ${ro}>${ESCV(val)}</textarea>`;
    if(f.t==='check') return `<label class="chk"><input type="checkbox" id="ef_${f.k}" ${v?'checked':''} ${ro}> ${esc(f.l)}</label>`;
    const tp = f.t==='number'?'number':f.t==='date'?'text':'text';
    return `<input class="in" id="ef_${f.k}" type="${tp}" value="${ESCV(val)}" placeholder="${esc(f.ph||'')}" ${ro}>`;
  }
  function openForm(it){
    const isNew = !it; it = it || {};
    const idKey = cfg.idKey || 'id'; const idv = it[idKey];
    const body = cfg.fields.map(f => f.t==='check'
      ? `<div class="fld">${fieldHtml(f, it)}</div>`
      : `<div class="fld"><span class="l">${esc(f.l)}${f.ro?' <small style="color:var(--text-3)">(из Bitrix)</small>':''}</span>${fieldHtml(f, it)}</div>`).join('');
    const ov=document.createElement('div'); ov.className='ov';
    const ro = !S.canEdit;
    const canDel = idv && !cfg.noDelete;
    ov.innerHTML=`<div class="modal"><div class="mh"><h2>${isNew?'Новая запись — '+esc(cfg.one):esc(it.name||cfg.one)}</h2><button class="x" data-x>×</button></div>
      <div class="body">${body}</div>
      ${ro?'':`<div class="mfoot"><button class="btn btn-primary" id="efSave">Сохранить</button>${canDel?'<button class="btn danger" id="efDel">Удалить</button>':''}<span style="flex:1"></span><button class="btn" data-x>Отмена</button></div>`}
    </div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click',e=>{ if(e.target===ov||e.target.hasAttribute('data-x')) ov.remove(); });
    if(!ro){
      document.getElementById('efSave').onclick=async()=>{
        const b={};
        for(const f of cfg.fields){ const el=document.getElementById('ef_'+f.k); if(!el) continue;
          b[f.k] = f.t==='check'?el.checked : f.t==='number'?(+el.value||0) : el.value.trim(); }
        if(cfg.required && !b[cfg.required]){ alert('Заполните обязательное поле'); return; }
        const btn=document.getElementById('efSave'); btn.disabled=true; btn.textContent='Сохранение…';
        const d = idv ? await api('PUT', cfg.ep+'/'+idv, b) : await api('POST', cfg.ep, b);
        if(!d||!d.ok){ alert((d&&d.error)||'Не удалось сохранить'); btn.disabled=false; btn.textContent='Сохранить'; return; }
        ov.remove(); await load();
      };
      if(canDel){ const del=document.getElementById('efDel'); if(del) del.onclick=async()=>{
        if(!confirm('Удалить запись безвозвратно?')) return;
        const d=await api('DELETE', cfg.ep+'/'+idv);
        if(!d||!d.ok){ alert((d&&d.error)||'Не удалось удалить (нужны права администратора)'); return; }
        ov.remove(); await load();
      }; }
    }
  }
  return { S, load, render, build, reload, openForm };
}

const STATUS_WORK = [['free','Свободен'],['busy','Занят'],['leave','Отпуск'],['remote','Удалёнка'],['sick','Больничный'],['off','Нет на месте']];

// Прогресс-бар загрузки: зелёный <70, янтарь 70–90, красный >90.
function loadBar(pct){
  pct = Math.max(0, Math.min(100, +pct||0));
  const col = pct>90 ? '#C53B2F' : pct>=70 ? '#d08700' : '#1a7f54';
  return `<div style="display:flex;align-items:center;gap:7px;min-width:120px">
    <div style="flex:1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${col};border-radius:4px"></div></div>
    <b style="font-size:12px;color:${col};min-width:34px;text-align:right">${pct}%</b></div>`;
}
const admitsText = it => (it.admits||[]).map(a=>a.method||a).filter(Boolean).join(', ');

const entAbs = mkEntity({
  key:'abs', ep:'/absences', one:'Заявка на отсутствие',
  search:['reason','kind'],
  afterLoad: async (S)=>{ const d=await api('GET','/staff'); S.rel.staff = (d&&d.items)||[]; },
  stats:(l)=>{ const p=l.filter(x=>x.status==='pending').length;
    return [['n',l.length,'Заявок'],['n accent',p,'На согласовании'],['n',l.filter(x=>x.status==='approved').length,'Согласовано']]
      .map(([c,n,t])=>`<div class="stat"><div class="${c}">${n}</div><div class="l">${t}</div></div>`).join(''); },
  cols:[
    {h:'Сотрудник',c:it=>ESCV(nameStaff(entAbs.S,it.staff_id))},{h:'Тип',c:it=>lbl(it.kind)},
    {h:'С',c:it=>ESCV(it.from_date)},{h:'По',c:it=>ESCV(it.to_date)},{h:'Статус',c:it=>pill(it.status)},
    {h:'Замена',c:it=>ESCV(nameStaff(entAbs.S,it.substitute_id))},
  ],
  card:it=>`<div class="cc" data-id="${it.id}">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="ct">${ESCV(nameStaff(entAbs.S,it.staff_id))} — ${lbl(it.kind)}</div>${pill(it.status)}</div>
    <div class="sub">${ESCV(it.from_date)} — ${ESCV(it.to_date)}${it.reason?' <span class="dot"></span> '+ESCV(it.reason):''}</div>
    ${it.substitute_id?`<div class="row"><span class="pill m">Замена: ${ESCV(nameStaff(entAbs.S,it.substitute_id))}</span></div>`:''}
    ${(it.status==='pending'&&entAbs.S.canEdit)?`<div class="foot"><button class="btn btn-primary" data-act="approve" style="padding:3px 10px;font-size:12px">Согласовать</button><button class="btn danger" data-act="reject" style="padding:3px 10px;font-size:12px">Отклонить</button></div>`:(it.decided_by?`<div class="foot"><span>Решил: ${ESCV(it.decided_by)}</span><span></span></div>`:'')}
  </div>`,
  onAction: async (act, it, reload)=>{
    if(act==='approve'||act==='reject'){
      let sub=null;
      if(act==='approve' && confirm('Назначить замену исполнителя? (ОК — выбрать, Отмена — без замены)')){
        const names=(entAbs.S.rel.staff||[]).map(s=>`${s.bitrix_id}: ${s.name}`).join('\n');
        const v=prompt('ID сотрудника-замены:\n'+names); if(v) sub=+v;
      }
      const d=await api('PUT','/absences/'+it.id+'/decide',{decision:act==='approve'?'approved':'rejected',substitute_id:sub});
      if(!d||!d.ok){ alert((d&&d.error)||'Нет прав на согласование'); return; }
      await reload();
    }
  },
  fields:[
    {k:'staff_id',l:'Сотрудник',t:'select',optsFn:(S)=>[['','—']].concat((S.rel.staff||[]).map(s=>[s.bitrix_id,s.name]))},
    {k:'kind',l:'Тип',t:'select',opts:[['vacation','Отпуск'],['remote','Удалёнка'],['sick','Больничный'],['unpaid','Без содержания']]},
    {k:'from_date',l:'С даты',t:'date',ph:'ГГГГ-ММ-ДД'},{k:'to_date',l:'По дату',t:'date',ph:'ГГГГ-ММ-ДД'},
    {k:'reason',l:'Причина / комментарий',t:'textarea'},
  ],
  required:null,
});
function nameStaff(S, id){ if(!id) return ''; const s=(S.rel.staff||[]).find(x=>+x.bitrix_id===+id||+x.id===+id); return s?s.name:('#'+id); }

    {h:'Курс',c:it=>ESCV(it.training_title)},{h:'Часов',c:it=>ESCV(it.hours)},{h:'Выдан',c:it=>ESCV(it.issued_at)},
    {h:'Печать',c:it=>`<button class="btn" data-act="print" style="padding:2px 8px;font-size:11px">🖨</button>`},
  ],
  card:it=>`<div class="cc" data-id="${it.id}">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="ct">${ESCV(it.person)}</div>${it.cert_no?`<span class="pill cert">№ ${ESCV(it.cert_no)}</span>`:''}</div>
    <div class="row"><span class="client">${ESCV(it.company||'—')}</span>${it.bin?`<span class="pill m">БИН ${ESCV(it.bin)}</span>`:''}</div>
    ${it.training_title?`<div class="sub">${ESCV(it.training_title)}${it.hours?' · '+ESCV(it.hours)+' ч':''}</div>`:''}
    <div class="foot"><span>Выдан ${ESCV(it.issued_at||'—')}</span><button class="btn" data-act="print" style="padding:2px 10px;font-size:11px">🖨 Печать</button></div>
  </div>`,
  onAction:(act,it)=>{ if(act==='print') printCertificate(it); },

    {k:'cert_no',l:'Номер сертификата',t:'text'},{k:'person',l:'ФИО',t:'text'},{k:'company',l:'Компания',t:'text'},
    {k:'bin',l:'БИН',t:'text'},{k:'training_title',l:'Курс',t:'text'},{k:'hours',l:'Часов',t:'number'},
    {k:'issued_at',l:'Дата выдачи',t:'date',ph:'ГГГГ-ММ-ДД'},{k:'issued_by',l:'Выдал',t:'text'},{k:'note',l:'Заметки',t:'textarea'},
  ],
});

/* ── Фаза 4: печать документов (сертификат) — печать → PDF из браузера ──────── */
function printCertificate(it){
  it = it||{};
  const w = window.open('', '_blank'); if(!w){ alert('Разрешите всплывающие окна для печати'); return; }
  const today = new Date().toISOString().slice(0,10);
  w.document.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Сертификат ${esc(it.cert_no||'')}</title>
    <style>
      @page{size:A4 landscape;margin:0}
      body{font-family:'Times New Roman',Georgia,serif;margin:0;color:#1a2330}
      .cert{width:277mm;height:190mm;margin:0 auto;padding:18mm 22mm;box-sizing:border-box;border:3px double #1a7f54;position:relative}
      .cert:after{content:'';position:absolute;inset:6mm;border:1px solid #c9d6cf;pointer-events:none}
      h1{font-size:40px;letter-spacing:2px;color:#1a7f54;text-align:center;margin:6mm 0 2mm}
      .sub{text-align:center;color:#55636e;font-size:15px;margin-bottom:12mm}
      .who{text-align:center;font-size:30px;font-weight:bold;margin:4mm 0}
      .for{text-align:center;font-size:16px;margin:2mm 0}
      .course{text-align:center;font-size:22px;color:#13452f;margin:3mm 0 2mm;font-style:italic}
      .meta{display:flex;justify-content:space-between;margin-top:16mm;font-size:13px;color:#33414c}
      .sig{border-top:1px solid #33414c;padding-top:3px;width:60mm;text-align:center}
      .no{position:absolute;top:10mm;right:14mm;font-size:12px;color:#8a97a0}
    </style></head><body onload="window.print()">
    <div class="cert">
      <div class="no">№ ${esc(it.cert_no||'—')}</div>
      <h1>СЕРТИФИКАТ</h1>
      <div class="sub">Учебный центр ProLabTraining · настоящим подтверждает, что</div>
      <div class="who">${esc(it.person||'____________________')}</div>
      <div class="for">${it.company?('представитель: '+esc(it.company)+(it.bin?' (БИН '+esc(it.bin)+')':'')):''}</div>
      <div class="for">прошёл(а) обучение по программе:</div>
      <div class="course">«${esc(it.training_title||'____________________')}»</div>
      <div class="for">${it.hours?('в объёме '+esc(it.hours)+' академических часов'):''}</div>
      <div class="meta">
        <div class="sig">Дата выдачи: ${esc(it.issued_at||today)}</div>
        <div class="sig">${esc(it.issued_by||'Руководитель ТЦ')}<br><small>подпись</small></div>
      </div>
    </div></body></html>`);
  w.document.close();
}

/* ── Хосты разделов с под-вкладками ────────────────────────────────────────── */
const SUBVIEWS = {
  'view-team':   { subs:[['Сотрудники',entStaff],['Отсутствия',entAbs]] },
  'view-needs':  { subs:[['Потребности',entNeeds]] },
  'view-lab':    { subs:[['Пробы',entSamples],['Методики',entMethods],['Регламенты',entRoutines]] },
  'view-ops':    { subs:[['История колонок',entColumns],['Логгеры T/φ',entLoggers]] },
  'view-edu':    { subs:[['Заявки и анкеты',entForms],['Сертификаты',entCerts]] },
};
const _hostBuilt = {};
function mountHost(viewId){
  const host = document.getElementById(viewId); if(!host) return;
  const cfg = SUBVIEWS[viewId]; if(!cfg) return;
  if(!_hostBuilt[viewId]){
    _hostBuilt[viewId] = true;
    if(viewId==='view-team') host.innerHTML = '<div id="teamNow" class="an-grid" style="margin-bottom:12px"></div>';
    else host.innerHTML='';
    // панель под-вкладок
    const bar=document.createElement('div'); bar.className='secs'; bar.style.marginTop='0';
    const bodies=[];
    cfg.subs.forEach(([label,ent],i)=>{
      const b=document.createElement('button'); b.className='sec'+(i===0?' on':''); b.textContent=label; bar.appendChild(b);
      const body=document.createElement('div'); if(i!==0) body.hidden=true; bodies.push(body);
      b.addEventListener('click',()=>{
        bar.querySelectorAll('.sec').forEach((x,j)=>x.classList.toggle('on',j===i));
        bodies.forEach((bd,j)=>bd.hidden=j!==i);
        if(!ent.S.loaded) ent.load();
      });
    });
    host.appendChild(bar);
    cfg.subs.forEach(([label,ent],i)=>{ host.appendChild(bodies[i]); ent.build(bodies[i]); });
    // первая под-вкладка грузится сразу
    cfg.subs[0][1].load();
    if(viewId==='view-team') loadTeamNow();
  }
}
async function loadTeamNow(){
  const box=document.getElementById('teamNow'); if(!box) return;
  const d=await api('GET','/team-now'); if(!d||!d.ok){ box.innerHTML=''; return; }
  const by=d.by||{};
  const cell=(n,l,c)=>`<div class="stat"><div class="n${c?' '+c:''}">${n||0}</div><div class="l">${l}</div></div>`;
  box.innerHTML=`<div class="stats" style="margin:0">
    ${cell(d.total,'Команда ТЦ')}
    ${cell(by.free,'Свободны')}
    ${cell(by.busy,'Заняты','accent')}
    ${cell((by.leave||0)+(by.sick||0)+(by.remote||0),'Отпуск/удал./больн.')}
    ${cell(d.pending,'Заявок на согласование','accent')}
  </div>`;
}

/* ── Календарь ТЦ ──────────────────────────────────────────────────────────── */
const CAL_KIND = { work:['Срок работы','cert'], report:['Отчёт','plan'], verify:['Поверка','held'], to:['ТО','plan'], routine:['Регламент','m'], absence:['Отсутствие','lead'] };
let _calBuilt=false;
async function mountCalendar(){
  const host=document.getElementById('view-cal'); if(!host) return;
  if(!_calBuilt){ _calBuilt=true; host.innerHTML='<div id="calBody"><div class="empty">Загрузка…</div></div>'; }
  const d=await api('GET','/calendar');
  const body=document.getElementById('calBody'); if(!body) return;
  if(!d||!d.ok){ body.innerHTML='<div class="empty">Не удалось загрузить календарь</div>'; return; }
  const items=d.items||[];
  if(!items.length){ body.innerHTML='<div class="empty">Событий нет. Заполните сроки работ, поверки, регламенты.</div>'; return; }
  const groups={}; const order=[];
  for(const e of items){ const g=e.date?e.date.slice(0,7):'Без даты'; if(!groups[g]){groups[g]=[];order.push(g);} groups[g].push(e); }
  const MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const title=g=>{ const m=/^(\d{4})-(\d{2})$/.exec(g); return m?`${MON[+m[2]-1]} ${m[1]}`:g; };
  body.innerHTML = order.map(g=>`<div class="panel" style="margin-bottom:12px"><div class="ph"><span class="pt">${esc(title(g))}</span><span class="pn">${groups[g].length}</span></div>
    <table class="tc-tbl"><tbody>${groups[g].map(e=>{ const k=CAL_KIND[e.kind]||['Событие','m'];
      return `<tr><td style="width:92px;color:var(--text-3)">${esc(e.raw||'')}</td><td style="width:120px"><span class="pill ${k[1]}">${esc(k[0])}</span></td><td>${esc(e.title)}</td><td style="color:var(--text-3)">${esc(e.sub||'')}</td></tr>`;
    }).join('')}</tbody></table></div>`).join('');
}

/* ── Регистрация новых разделов в переключателе вкладок ─────────────────────── */
(function registerTcPhases(){
  const extra=['team','cal','needs','lab','ops','edu'];
  // расширяем hideViews: добавляем новые view-* в список скрываемых
  const origHide = hideViews;
  window.hideViews = function(){ origHide();
    extra.forEach(k=>{ const el=document.getElementById('view-'+k); if(el) el.hidden=true; }); };
  // маршрутизация кликов по новым вкладкам
  document.getElementById('secs').addEventListener('click',e=>{
    const b=e.target.closest('.sec'); if(!b) return; const sec=b.dataset.sec;
    if(!extra.includes(sec)) return;
    window.hideViews(); const v=document.getElementById('view-'+sec); if(v) v.hidden=false;
    if(sec==='cal') mountCalendar(); else mountHost('view-'+sec);
    try{ history.replaceState(null,'','#'+sec); }catch(_){}
  });
  // дип-линк из плиток портала
  const h=(location.hash||'').replace('#','').toLowerCase();
  if(extra.includes(h)){ const btn=document.querySelector(`.sec[data-sec="${h}"]`); if(btn) btn.click(); }
})();
</script>
